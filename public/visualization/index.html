<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ビジュアライズ | Have I Been Morasareta 日本版</title>
  <meta name="description" content="日本国内で公表された情報漏洩を、月ごとの推移などで可視化します。">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../charts.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1><a class="home" href="../">Have I Been <span class="accent">Morasareta</span></a> <span class="edition">日本版</span></h1>
      <p class="lead">日本国内で情報漏洩を公表した企業・サービスの一覧</p>
      <nav class="site-nav" aria-label="ページ">
        <a href="../">一覧</a>
        <a href="./" aria-current="page">ビジュアライズ</a>
        <a href="../ranking/">ランキング</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="viz-card" aria-labelledby="monthly-title">
      <div class="viz-head">
        <div>
          <h2 id="monthly-title">月ごとの情報漏洩</h2>
          <p class="muted viz-sub" id="monthly-sub"></p>
        </div>
        <div class="viz-controls">
          <div class="seg" role="radiogroup" aria-label="指標">
            <button type="button" role="radio" data-metric="incidents">公表件数</button>
            <button type="button" role="radio" data-metric="affected">漏洩件数の合計</button>
          </div>
          <div class="seg" role="radiogroup" aria-label="期間">
            <button type="button" role="radio" data-range="12">直近12か月</button>
            <button type="button" role="radio" data-range="all">すべて</button>
          </div>
        </div>
      </div>

      <div class="chart" id="chart">
        <div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>
      </div>
      <p class="muted viz-note">公表日（初報）の月で集計しています。漏洩件数が不明な事案は合計に含みません。</p>

      <details class="viz-table">
        <summary>表で見る</summary>
        <table>
          <thead><tr><th scope="col">月</th><th scope="col" class="num">公表件数</th><th scope="col" class="num">漏洩件数の合計</th><th scope="col">事案</th></tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </details>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        掲載内容は各社の公式発表・報道に基づきます。追加・修正は
        <a href="https://github.com/n0bisuke/haveibeenmorasareta">GitHub</a>
        へのプルリクエストでお願いします（<a href="https://github.com/n0bisuke/haveibeenmorasareta/blob/main/CONTRIBUTING.md">書き方</a>）。
      </p>
    </div>
  </footer>

  <script src="monthly.js" type="module"></script>
</body>
</html>
