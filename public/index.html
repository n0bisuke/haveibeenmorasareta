<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Have I Been Morasareta 日本版</title>
  <meta name="description" content="日本国内で情報漏洩を公表した企業・サービスの一覧。GitHub のプルリクエストで誰でも更新できます。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>Have I Been <span class="accent">Morasareta</span> <span class="edition">日本版</span></h1>
      <p class="lead">日本国内で情報漏洩を公表した企業・サービスの一覧</p>
      <p class="disclaimer">※ 掲載内容は公式発表や報道をもとにしていますが、誤りや古い情報を含む場合があります。利用する際は各自で出典を確認してください。</p>
      <p class="updated" id="updated" hidden></p>
      <dl class="stats" id="stats" aria-live="polite"></dl>
      <nav class="site-nav" aria-label="ページ">
        <a href="./" aria-current="page">一覧</a>
        <a href="visualization/">ビジュアライズ</a>
        <a href="ranking/">ランキング</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="controls" aria-label="絞り込み">
      <input type="search" id="q" placeholder="企業名・サービス名・漏洩した情報で検索" aria-label="検索">
      <select id="year" aria-label="公表年"><option value="">すべての年</option></select>
      <select id="cause" aria-label="原因"><option value="">すべての原因</option></select>
      <select id="sev" aria-label="重要度"><option value="">すべての重要度</option></select>
      <select id="sort" aria-label="並び順">
        <option value="date">公表日が新しい順</option>
        <option value="count">件数が多い順</option>
      </select>
    </section>

    <ul class="legend" id="legend" aria-label="漏洩した情報の重要度"></ul>
    <p class="result-count" id="result-count"></p>
    <ol class="list" id="list"></ol>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        掲載内容は各社の公式発表・報道に基づきます。追加・修正は
        <a href="https://github.com/n0bisuke/haveibeenmorasareta">GitHub</a>
        へのプルリクエストでお願いします（<a href="https://github.com/n0bisuke/haveibeenmorasareta/blob/main/CONTRIBUTING.md">書き方</a>）。
      </p>
      <p class="muted" id="generated"></p>
    </div>
  </footer>

  <template id="item-tpl">
    <li class="item">
      <div class="item-head">
        <h2 class="org"></h2>
        <span class="status-badge" hidden>調査中</span>
        <span class="count"></span>
      </div>
      <p class="services"></p>
      <div class="meta"></div>
      <p class="root-cause"><span class="root-cause-label">原因の詳細</span><span class="root-cause-text"></span></p>
      <p class="investigating" hidden>件数・漏えいの有無などを調査中です。続報や公式発表の情報を <a class="investigating-link" target="_blank" rel="noopener noreferrer">Issue</a> で募集しています。</p>
      <p class="summary"></p>
      <ul class="tags"></ul>
      <p class="count-note muted"></p>
      <ul class="sources"></ul>
      <a class="contributor" hidden><img alt="" width="22" height="22" loading="lazy"></a>
    </li>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
