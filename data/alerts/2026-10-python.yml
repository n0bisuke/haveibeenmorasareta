title: Python が前倒しで更新版を公開（eMudhra 証明書の問題に対応）
date: 2026-10-21
severity: medium
category: 証明書
audience:
  - 個人・アプリ利用者
  - サーバー管理者
affected:
  - Python
fixed: Python 3.15.1 / 3.14.9 / 3.13.17
summary: >-
  Python の開発チームが、認証局 eMudhra の中間CA証明書の秘密鍵が復元可能だった問題に
  対応するため、3.15.1 / 3.14.9 / 3.13.17 を予定を前倒しして公開した。9月30日には
  深刻度「Critical」を含む脆弱性を修正した 3.14.8 / 3.13.16 / 3.12.15 も公開されている。
risk: >-
  古い Python のままだと、偽の証明書を使った通信の盗み見・改ざんを見抜けないおそれがある。
  Python で動く社内ツールやサーバーが、知らないうちに偽のサイトとやり取りする可能性がある。
action_admin: サーバーや CI で使う Python を 3.15.1 / 3.14.9 / 3.13.17 以降へ更新する。
action_user: Homebrew や公式インストーラーで入れた Python を最新版へ更新する。
checklist:
  - python3 --version で使っている版を確認する
  - 3.15.1 / 3.14.9 / 3.13.17 より古ければ更新する（brew upgrade python など）
  - Homebrew 利用者は brew upgrade ca-certificates も実行する
sources:
  - title: 窓の杜（Python 3.15.1 などが前倒しで公開）
    url: https://forest.watch.impress.co.jp/docs/news/2150177.html
  - title: 窓の杜（9月30日のセキュリティアップデート）
    url: https://forest.watch.impress.co.jp/docs/news/2144739.html
