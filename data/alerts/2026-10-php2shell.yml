title: PHP 本体に認証不要の重大なリモートコード実行の脆弱性（php2shell）
date: 2026-10-21
severity: critical
category: 脆弱性
audience:
  - サーバー管理者
affected:
  - PHP
  - WordPress
cve:
  - CVE-2026-109618
  - CVE-2026-109619
fixed: PHP 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35
summary: >-
  PHP 本体の session.upload_progress の処理に、認証なしのリクエストだけで
  リモートコード実行ができる脆弱性が2件見つかった。mod_php・PHP-FPM・php-cgi など
  Web リクエストを処理する構成が広く対象になる。CVSS は 9.2（緊急）。
risk: >-
  自分のサイトを動かすサーバーで、攻撃者が自由にプログラムを実行できる状態になる。
  パスワードもログインもなしに、サイトを偽ページや不正サイトに書き換えられたり、
  保存した会員情報やデータベースを丸ごと盗まれたりするおそれがある。公開前に手口が
  漏れ、すでに攻撃の下見が観測されている。
action_admin: PHP を修正版へ更新して再起動する。更新できない古い版は公開を止める。
action_user: 自分で WordPress などを立てている場合のみ対象。レンタルサーバー任せなら事業者の対応を確認する。
sources:
  - title: The Hacker News
    url: https://thehackernews.com/2026/10/php2shell-two-unpatched-critical-php.html
  - title: Qualys ブログ（PHP の緊急セキュリティリリース）
    url: https://blog.qualys.com/vulnerabilities-threat-research/2026/10/20/php-announces-critical-security-release-for-two-vulnerabilities
