title: PSN でファミリー管理に子どもアカウントを勝手に追加される乗っ取り被害（公式発表なし）
date: 2026-10-26
severity: high
category: その他
audience:
  - 個人・アプリ利用者
affected:
  - PlayStation Network
  - PS5
  - PS4
summary: >-
  PlayStation Network（PSN）で、管理者の許可なく見知らぬ「子ども」アカウントが
  ファミリーメンバーに追加される被害が10月6日ごろから相次いでいると報じられた。
  パスワードや二段階認証を回避されたとの報告があり、追加されたメンバーを通じて個人情報が
  盗まれる可能性が指摘されている。管理者が追加されたアカウントを削除できない、
  ファミリーから退出できないという報告もある。ソニー・インタラクティブエンタテインメントは
  正式な発表をしておらず、手口や規模は確認されていない。
risk: >-
  アカウントに登録したクレジットカードで勝手に買い物をされたり、購入したゲームや
  セーブデータ、登録した個人情報を見られたりするおそれがある。子どもアカウントを使って
  気づかないうちにアカウントを操作され続ける可能性もある。
action_user: >-
  PS5 の「設定→ユーザーとアカウント→ファミリー→ファミリー管理」で、知らない子ども
  アカウントが追加されていないか確認する。見つけたら PlayStation のサポートに連絡し、
  登録しているクレジットカードを外す。パスワードを変更し、パスキーを設定する。
checklist:
  - PS5 の「設定→ユーザーとアカウント→ファミリー→ファミリー管理」を開く
  - 知らない子どもアカウントが追加されていないか確認する
  - 見つけたら PlayStation のサポートに連絡する
  - アカウントに登録しているクレジットカードを外す（ウォレットの残高も確認）
  - パスワードを変更し、ほかのサービスと使い回していないか見直す
  - パスキーを設定し、二段階認証のバックアップコードを控えておく
sources:
  - title: GAME Watch
    url: https://game.watch.impress.co.jp/docs/news/2151226.html
  - title: TweakTown
    url: https://www.tweaktown.com/news/111739/playstation-players-warn-of-new-account-takeover-method-targeting-psn/index.html
