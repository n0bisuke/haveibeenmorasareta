title: Node.js が22.x・24.x・26.xの修正版を公開、HTTP/2やTLSなど16件の脆弱性を修正（v22.23.5 / v24.22.3 / v26.13.1）
date: 2026-11-04
severity: high
category: 脆弱性
audience:
  - 個人・アプリ利用者
  - サーバー管理者
affected:
  - Node.js 22.x
  - Node.js 24.x
  - Node.js 26.x
  - サポートが終了した Node.js
cve:
  - CVE-2026-123863
  - CVE-2026-123864
  - CVE-2026-123865
  - CVE-2026-123866
  - CVE-2026-123867
  - CVE-2026-123872
fixed: v22.23.5 / v24.22.3 / v26.13.1（2026年11月11日公開）
summary: >-
  Node.js プロジェクトが11月4日に予告していたセキュリティリリースを11月11日（協定世界時）に公開し、
  22.x・24.x・26.x の修正版 v22.23.5・v24.22.3・v26.13.1 で16件の脆弱性を修正した。深刻度は High 7件、
  Medium 6件、Low 3件。HTTP/2 関連が多く、認証なしでサーバーを停止させられる問題（CVE-2026-123863）、
  HTTPS で他の接続のメモリ（TLS の秘密鍵や他の利用者のリクエストを含みうる）が漏れる問題（CVE-2026-123864）、
  TLS 1.2 の再ネゴシエーションで接続先のサーバー名を変えてクライアント証明書の認証（mTLS）をすり抜けられる
  問題（CVE-2026-123872）などがある。サポートが終了した20.x 以前には修正版が出ない。
risk: >-
  HTTP/2 や HTTPS を受け付ける Node.js のサーバーは、認証なしの通信だけで停止させられたり、
  他の利用者の通信内容や TLS の秘密鍵が漏れたりするおそれがある。mTLS で接続先ごとに認可している
  サーバーは、認可をすり抜けられるおそれがある。修正版の公開後は攻撃方法が調べられやすく、
  更新していないサーバーが狙われやすくなる。
action_admin: >-
  v22.23.5 / v24.22.3 / v26.13.1 以降に更新し、プロセスを再起動する。サーバーだけでなく、
  Docker のベースイメージ、CI/CD、サーバーレス（Lambda など）のランタイムの版も確認して作り直す。
  HTTP/2・HTTPS・mTLS を使うサーバーを優先する。20.x 以前のサポートが終了した系列は修正版が出ないため、
  22.x 以降へ移行する。
action_user: >-
  Homebrew や公式インストーラーで入れた Node.js は最新版に更新する。VS Code・Slack などの Electron 製
  アプリは自動更新を有効にし、更新が来たら再起動する。
checklist:
  - node -v で使っている Node.js の版を確認する
  - 22.x は v22.23.5、24.x は v24.22.3、26.x は v26.13.1 以降に更新する（brew upgrade node など）
  - 更新後に Node.js のプロセス（サーバー・常駐ツール）を再起動する
  - Docker のベースイメージ（node:22 など）を取り直してコンテナを作り直す
  - CI/CD とサーバーレス（Lambda など）のランタイムの版も確認する
  - HTTP/2・HTTPS・mTLS（クライアント証明書）を使うサーバーを優先して更新する
  - 20.x 以前などサポートが終了した系列なら、22.x 以降へ移行する
  - nvm・Volta などで複数の版を入れている場合は、それぞれ更新する
  - VS Code・Slack などのアプリの自動更新をオンにし、更新後に再起動する
