title: Node.js が10月のセキュリティリリース（RCE を含む計10件を修正）
date: 2026-10-21
severity: high
category: 脆弱性
audience:
  - 個人・アプリ利用者
  - サーバー管理者
affected:
  - Node.js
  - Node-RED
  - Electron 製アプリ
cve:
  - CVE-2026-111497
  - CVE-2026-105483
  - CVE-2026-106069
  - CVE-2026-105482
fixed: v26.12.1 / v24.22.1 / v22.23.4
summary: >-
  Node.js が計10件の脆弱性を修正するセキュリティリリースを公開した。Brotli 展開の
  範囲外書き込み（リモートコード実行につながる）や、TLS 証明書のホスト名確認を
  すり抜ける問題などを含む。VS Code・Slack・Notion などの Electron 製アプリや
  デスクトップアプリも、内部に Node.js を含むため関係する。
risk: >-
  VS Code や Slack などのアプリ、Node-RED を古いまま使っていると、攻撃者が送った
  不正なファイルやリンクを開くだけで、保存したパスワードやファイルを盗まれたり、
  パソコンを勝手に操作されたりするおそれがある。更新が来たのに「あとで」で
  放置するのが一番あぶない。
action_admin: 本番の Node.js を修正版へ更新して再起動する。常時公開している Node-RED は優先して更新する。
action_user: Electron 製アプリは自動更新を有効にし、更新が来たら必ず再起動する。Homebrew などで入れた Node.js も最新版へ更新する。
checklist:
  - VS Code・Slack・Notion などのアプリの自動更新をオンにする
  - 更新が来ているアプリを入れて再起動する
  - Homebrew で入れた Node.js を更新する（brew upgrade node）
  - 更新後に node -v が v22.23.4 / v24.22.1 / v26.12.1 以降か確認する
sources:
  - title: Node.js 公式ブログ（October 2026 Security Releases）
    url: https://nodejs.org/en/blog/vulnerability/october-2026-security-releases
