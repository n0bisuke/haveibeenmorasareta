title: Google Chrome に多数の脆弱性、重大6件を含む353件を修正（最新版へ更新を）
date: 2026-10-20
severity: high
category: 脆弱性
audience:
  - 個人・アプリ利用者
affected:
  - Google Chrome
  - Chromium
  - Microsoft Edge
  - Brave
  - Electron 製アプリ
cve:
  - CVE-2026-113341
  - CVE-2026-113279
  - CVE-2026-113101
  - CVE-2026-113097
fixed: Windows・macOS 156.0.8078.47（.48）/ Linux・Android 156.0.8078.47
summary: >-
  Google が Chrome の更新を公開し、深刻度「重大」6件を含む計353件の脆弱性を修正した
  （内訳は重大6・高61・中197・低89）。Skia や Accessibility のメモリ破損などを含む。
  Chrome だけでなく、Chromium をもとにした Microsoft Edge・Brave などのブラウザや、
  Chromium を内蔵する Electron 製アプリにも、同種の修正が順次反映される。
risk: >-
  古いブラウザのまま使っていると、細工された Web ページを開くだけで、パソコンを
  乗っ取られたり情報を盗まれたりするおそれがある。更新は数日〜数週間かけて順次
  配られるため、設定画面から手動で確認・再起動すると早い。
action_user: >-
  Chrome は「設定→Chromeについて」で更新を確認して再起動する。Edge・Brave なども
  それぞれ最新へ更新する（Chrome を更新しただけでは直らない）。Electron 製アプリも
  更新が来たら入れる。
sources:
  - title: Chrome Releases（Google 公式ブログ）
    url: https://chromereleases.googleblog.com/
