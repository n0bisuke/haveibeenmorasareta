title: Google Chrome に多数の脆弱性、重大6件を含む353件を修正（最新版へ更新を）
date: 2026-10-20
severity: high
category: 脆弱性
audience:
  - 個人・アプリ利用者
affected:
  - Google Chrome
  - Chromium
  - Microsoft Edge
  - Brave
  - Electron 製アプリ
cve:
  - CVE-2026-113341
  - CVE-2026-113279
  - CVE-2026-113101
  - CVE-2026-113097
fixed: Windows・macOS 156.0.8078.47（.48）/ Linux・Android 156.0.8078.47
summary: >-
  Google が Chrome の更新を公開し、深刻度「重大」6件を含む計353件の脆弱性を修正した
  （内訳は重大6・高61・中197・低89）。Skia や Accessibility のメモリ破損などを含む。
  Chrome だけでなく、同じ Chromium をもとにした Microsoft Edge（Windows 標準ブラウザ）や
  Brave などのブラウザ、Chromium を内蔵する Electron 製アプリにも、同種の修正が順次
  反映される。Edge・Brave も同じ土台のため、同様に影響すると考えてよい。
risk: >-
  古いブラウザのまま使っていると、細工された Web ページを開くだけで、パソコンを
  乗っ取られたり情報を盗まれたりするおそれがある。更新は数日〜数週間かけて順次
  配られるため、設定画面から手動で確認・再起動すると早い。
action_user: >-
  Chrome は「設定→Chromeについて」、Microsoft Edge は「設定→Microsoft Edge について」、
  Brave は「設定→Braveについて」で更新を確認して再起動する。Edge・Brave は Chrome を
  更新しても直らないので、それぞれ別に最新へ更新する。Electron 製アプリも更新が来たら入れる。
checklist:
  - Chrome を「設定→Chromeについて」で更新して再起動する
  - Microsoft Edge を「設定→Microsoft Edge について」で更新する
  - Brave など他の Chromium 系ブラウザも最新にする
  - VS Code・Slack などの Electron 製アプリも更新が来たら入れる
sources:
  - title: Chrome Releases（Google 公式ブログ）
    url: https://chromereleases.googleblog.com/
