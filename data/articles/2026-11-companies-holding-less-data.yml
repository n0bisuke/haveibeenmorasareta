title: 個人情報を「持たない」企業が増えている
date: 2026-11-09
kind: 解説
tags:
  - 企業の対応
  - 飲食
summary: ゆで太郎は会員制度を終了して会員情報を消去し、焼肉きんぐは個人情報を入力しなくてよい予約の仕組みを入れる。不正アクセスによる漏えいが相次ぐなかで、「守る」より先に「持たない」を選ぶ企業の動きをまとめた。
body: |
  ## 何が起きているか

  2026年の秋は、不正アクセスによる情報漏えいの公表が続いている。このサイトに収録した事案だけでも、10月以降はメール配信サービス「アララメッセージ」のような委託先経由の事案が数十件にのぼる。システムをいくら強化しても、委託先や取引先のどこか一か所が破られれば情報は漏れる。

  そこで、そもそも個人情報を集めない・残さないという方向に舵を切る企業が出てきた。日本経済新聞は11月5日、この動きを「個人情報『持たない』選択」として報じている。

  ## ゆで太郎：会員制度を終えて、会員情報を消す

  そばチェーンの「ゆで太郎」を運営するゆで太郎システムは10月28日、誕生月に特典を届ける会員制度「バースデークラブ」を終了すると発表した。新規の募集をやめ、12月生まれの会員に最後のクーポンを送ったあと、会員情報を消去する。報道によると、消去するのは約4,000人分。

  特徴は、自社で漏えいが起きたからではなく、**起きる前に**やめたことだ。会員が少なく、集めた情報が売り上げに大きく効いていないのであれば、守るためのコストと漏れたときの賠償リスクの方が大きい、という判断とみられる。

  ## 焼肉きんぐ：個人情報なしで予約できる仕組みへ

  「焼肉きんぐ」を運営する物語コーポレーションは、個人情報を入力しなくても予約できる仕組みを導入すると報じられた。同社は10月、公式アプリの会員管理システムへの不正アクセスで、会員約1,079万件の氏名・メールアドレス・電話番号などが漏えいしたと公表している。漏えいを経験した企業が、集める情報そのものを減らす方向に動いた例だ。

  ## 利用する側にとっての意味

  - **登録する情報は最小限に。** 会員登録やアンケートで「任意」の項目は空けておく。IPA（情報処理推進機構）も、日頃の対策として登録は必要最小限にすることを挙げている。
  - **使っていない会員登録は退会する。** 退会しても情報がしばらく残るサービスもあるが、残しておくよりは漏れたときの範囲が狭くなる。
  - **「持たない」は万能ではない。** 予約や配送に必要な情報は、どこかに預けることになる。漏えいのお知らせが届いたときの対応は、Tips の[漏えいのお知らせメールが届いたら最初にやること](../2026-11-leak-notice-first-steps/)にまとめた。

  ## 企業にとっての意味

  個人情報は集めれば集めるほど、守る費用と、漏れたときの見舞金・賠償・信頼の損失が大きくなる。今回の動きは、必要な情報だけを、必要な期間だけ持つという「データの最小化」を、飲食チェーンのような身近な企業が実際に選び始めた例といえる。
