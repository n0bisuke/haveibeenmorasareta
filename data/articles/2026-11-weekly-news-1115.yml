title: 情報漏洩ニュースまとめ（2026年11月9日〜15日）
date: 2026-11-15
kind: まとめ
tags:
  - 週間まとめ
  - 不正アクセス
  - 委託先
summary: 上場企業の漏えいは1〜10月で過去最悪に。京成スカイライナー（最大337万件）、ヤマダデンキ（最大350万件）、マネックス証券（113万件）などの大型事案と、アララ・オープンロジ・Notion など委託先から広がった漏えいが続いた1週間をまとめます。
body: |
  ## 数字で見る：上場企業の漏えいは過去最悪

  東京商工リサーチの調べ（11月9日発表の速報値）では、2026年1〜10月に上場企業とその子会社が公表した個人情報の漏えい・紛失事故は215件で、2012年の集計開始以来最多だった2024年1年分（189件）をすでに上回りました。

  - 10月だけで109件と、累計の半分以上が10月に集中した
  - 漏えいした個人情報は累計約3億5,000万件で、前年1年分の10倍以上
  - 1,000万件以上の事故は10件で、うち6件が10月
  - 非上場企業や官公庁の事故は含まない

  ## 今週公表された主な大型事案

  - **ヤマダデンキ**：リフォーム管理システムに不正アクセス。氏名・住所・電話番号と施工履歴・見積もりなど最大約350万件
  - **京成電鉄**：スカイライナー座席予約システムに不正アクセス。ID・暗号化されたパスワード・カナ氏名・電話番号・メールアドレスが最大約337万件。座席予約は停止中
  - **Yeny**（TISインテックグループ）：API接続の設定不備で、電話番号と会員ID 約133万件が漏えい
  - **マネックス証券**：委託先の口座開設システムに不正アクセス。メールアドレス最大113万件と、運転免許証・マイナンバーカードなど本人確認書類の画像1,592件
  - **読売巨人軍**：ファンクラブ「CLUB GIANTS」のメールアドレス約81万件
  - **大阪公立大学**：NECが削除せずに保管していたデータから、学生・教職員ら約17万人分の漏えいを確定。口座番号やパスポート画像を含む人もいる

  ## 委託先から広がる漏えい

  1社の委託先が攻撃を受け、そのサービスを使う多くの企業・自治体が相次いで公表する形が続いています。

  - **アララ（メール配信）**：今週もキユーピー（約12.6万件）、東京ガス（約8.6万件）、MS&ADグループの損保3社、九州電力、テレビ新広島などが公表した
  - **オープンロジ（物流）**：配送先の氏名・住所などが持ち出され、HUMAN MADE、ちいかわくじのグレイ・パーカー・サービス、VTuberグッズのBrave groupなどが公表した
  - **ソニックムーブ「COMSBI」（LINE連携）**：京阪ホールディングス（LINE情報 延べ約22万件）やヒューマンアジャスト（約11.7万人）が公表した
  - **Notion AI（委託先 Fireworks AI）**：AIチャットの内容が流出し、弥生、日建設計、ワンキャリアなど国内の利用企業が相次いで公表した

  委託先ごとの影響先は、[委託先ごとの影響先まとめ](../../vendor/)で一覧にしています。

  ## GMOの不正アクセス問題

  GMOインターネットグループは、8月に「お名前.com デスクトップクラウド」に侵入され、盗まれたアカウント情報でFX口座に損失が出る取引をされたと公表しています。2024年4月に子会社の専門家がセキュリティ上の課題を指摘していたものの経営陣まで上がっていなかったことを認め、10月に施行された能動的サイバー防御の適用を政府に要請しました。

  ## 個人でできること

  - 漏えいの公表があったサービスと同じパスワードを、ほかで使っていないか確認する
  - 漏えいを装った「お詫び」「返金」のメールやSMS・電話に注意し、リンクは開かず公式サイトから確かめる
  - 初動は[漏えいのお知らせメールが届いたら最初にやること](../2026-11-leak-notice-first-steps/)にまとめています
