summary: KARTE（プレイド）への不正アクセスで70社超が公表し、DHC約1,911万件・ジンズ約1,829万件など。楽天証券で最大約1,125万口座。EC受注管理システム「GoQSystem」で約437万人分、アクサ損保「MyAXA」で約59.7万件、リンツで約315万件。LINE連携サービス「COMSBI」経由の公表も続いています。今週の情報漏洩ニュースを、日々追記しながらまとめます。
body: |
  この記事は今週（11月16日〜22日）のニュースを、日々追記していきます。

  ## 11月19日〜20日

  - **湘南美容クリニック（SBC メディカルグループ）**：不正アクセスで約162万人分の個人情報が流出。パスワードを暗号化せずに保存していた
  - **六花亭**：通販サイトでクレジットカード情報 約8,000件（セキュリティコードを含む）が流出したおそれ
  - **KARTE 経由の公表が続く**：シャープ（約326万件）、サントリーウエルネス（約95万件）、タイミー（約22.6万人）、毎日新聞（約14万人）、S.RIDE、GO など
  - **北海道の留萌市・新得町・岩見沢市**：委託先の協力会社の端末がマルウェアに感染し、住民基本台帳データ（留萌市は最大約7.1万件）などが漏えいしたおそれ

  ## 11月19日まで：KARTE（プレイド）から広がった漏えい

  Web サイトやアプリの顧客体験（CX）プラットフォーム「KARTE」が11月13日に不正アクセスを受けました。プレイドによると、サーバーの脆弱性を突かれて接続用の認証情報を盗まれ、利用企業が会員情報などを取り込んでいたデータの一部が読み出されました。利用企業の公表は70社を超え、件数を公表した会社だけでも合計は数千万件規模です（同じ人が複数のサービスに含まれるため、人数ではありません）。

  - **件数の多い会社**：DHC（約1,911万件）、ジンズ（約1,829万件）、アインHD（アインズ&トルペ・アユーラ・Francfranc で約858万件）、しまむら（約700万件）、ゴルフダイジェスト・オンライン（約697万件）、三菱UFJ銀行（約650万件）、CAMPFIRE（約582万件）、RIZAP（最大約432万件）、クラブツーリズム（約406万件）、ミツモア（約346万件）、Ｊリーグ（約238万件）
  - **漏れた情報は会社ごとに違う**：氏名・メールアドレスまで含む会社もあれば、性別・年代・都道府県や内部IDだけの会社もある。パスワードやクレジットカード情報は、多くの会社が「KARTE に連携していない」としている
  - **契約を終えた後もデータが残っていた例**：overflow、カイテク、ストライプインターナショナル（STRIPE CLUB）などは、KARTE の利用をやめた後もプレイド側にデータが残っていた

  影響先の一覧は[プレイド（KARTE）経由の影響先まとめ](../../vendor/plaid-karte/)にまとめています。漏えいを装った「お詫び」や「返金」のメール・SMS が増えるおそれがあるので、メールのリンクは開かず公式サイトから確かめてください。

  ## 11月16日〜19日：そのほかの事案

  - **理化学研究所**：スパコン「富岳」の運用システムに不正アクセスがあり、利用者最大4,597人の氏名・メールアドレスなどが漏えいしたおそれ
  - **日清食品**：LINE 連携サービス「COMSBI」経由で LINE 友だち約137万件。平和堂（約33万人）など COMSBI 経由の公表も続いた
  - **バンダイナムコ（一番くじ）**：物流子会社への不正アクセスで、対象が約41万件と判明
  - **自治体**：仙台市のメール配信サービスでメールアドレス約3万件。アララ経由で氷見市・能美市なども公表した


  - **nginx の脆弱性**：Web サーバーの nginx が修正版 1.31.9 / 1.30.7 を公開し、10件の脆弱性を修正した。HTTP/2 の脆弱性（CVE-2026-123007）は、条件がそろうと認証なしでコードを実行される恐れがあり、報告者には日本の Ikotas Labs も挙がっている。詳しくは[注意喚起](../../alerts/2026-11-nginx-security-release/)にまとめています

  ## 11月17日

  - **楽天証券**：テスト環境のシステムに不正アクセスがあり、ログインIDなどが最大約1,125万口座、うち最大約447万口座は氏名・住所・出金先口座・年収・金融資産なども漏えいしたおそれ。パスワードや暗証番号の漏えい、不正取引は確認されていない。同社はパスキー認証の設定と、取引・出金の一時停止機能の利用を呼びかけている

  ## 11月16日まで（週末の公表分）

  ### 大型の事案

  - **GoQSystem**：EC事業者向け受注管理システムが問い合わせフォームの脆弱性を突かれ、利用店舗1,694社の注文約498万件・約437万人分（注文者と届け先の氏名・住所・電話番号・メールアドレス・注文内容）が持ち出された。タオル美術館の一広や竹徳かまぼこなど、利用店舗の公表も続いている
  - **リンツ**：オンラインショップの委託先フューチャーショップのサーバーがソフトウェアの脆弱性を突かれ、会員情報3,147,377件（ハッシュ化パスワードを含む）が取得された（10月23日公表）
  - **アクサ損害保険**：マイページ「MyAXA」で権限のない顧客情報にアクセスされ、約59.7万件が漏洩した可能性
  - **サトフードサービス（和食さと）**：アララ経由で「さとキッズくらぶ」のメールアドレス318,513件
  - **GFS Education**：会員サイトの画像アップロード機能の脆弱性を突かれ、約11万人分。84人はマイナンバーカード裏面の画像も含む
  - **海外**：フランス郵政公社傘下の Maileva で約2,200万人分の氏名・住所が流出

  ### 委託先から広がる漏えい

  - **COMSBI（ソニックムーブ）**：提供元の運用アカウントの認証情報が盗まれ、Xリーグ、MTG「Style」、近鉄不動産（パラディ学園前）などが公表した
  - **アララ（メール配信）**：ホンダの株主1,741件、堺市の電子申請システムと「さかいプレミアム商品券」など
  - **NTTデータ（住友生命 Vitality）**：群馬県渋川市・富岡市など、連携した自治体の公表が続いている
  - **両毛システムズ**：広島ガスの電気契約情報約3,200件

  委託先ごとの影響先は、[委託先ごとの影響先まとめ](../../vendor/)で一覧にしています。

  ## 個人でできること

  - 通販サイトの漏えいでは「注文内容」まで知られている前提で、注文確認や配送を装うメール・SMSに注意する
  - パスワードの漏えいが公表されたサービスと同じパスワードを、ほかで使っていないか確認する
  - 初動は[漏えいのお知らせメールが届いたら最初にやること](../2026-11-leak-notice-first-steps/)にまとめています

  前の週のまとめは[情報漏洩ニュースまとめ（11月9日〜15日）](../2026-11-weekly-news-1115/)です。
