title: パスキー対応サイトの実装を検証、103サイトすべてに不備（独大学の調査）
date: 2026-11-16
kind: 解説
tags:
  - パスキー
  - 認証
  - 研究
summary: パスワードより安全とされるパスキーでも、サイト側の実装に不備があると不正ログインや乗っ取りの危険が残る。ドイツのルール大学ボーフムなどの研究者が、パスキー対応サイトの安全性を調べた結果をまとめた。
body: |
  ドイツのルール大学ボーフムなどの研究者らが、Web サイトでのパスキーの普及状況と安全性を調べた論文「The State of Passkeys: Studying the Adoption and Security of Passkeys on the Web」を、セキュリティの国際会議 USENIX Security 26 で発表しました。ITmedia NEWS（2026年11月16日）がその内容を紹介しています。

  ## 調べたこと

  パスキーは、パスワードの代わりに公開鍵暗号と、スマートフォンなどの生体認証や PIN を使ってログインする仕組みです。サイト側には秘密の情報（パスワード）が保存されないため、パスワードの漏えいや使い回しによる不正ログインを防げるとされています。

  研究チームは、パスキー対応サイトを見つけるシステム「PASSKEYS-RADAR」で 872 サイトを特定し、実際にパスキーを登録できた 208 サイトの設定を調べました。さらに、認証の仕組み「WebAuthn」のやりとりを改ざんして実装を試すツール「PASSKEYS-ATTACKER」を作り、15 種類の攻撃で 103 サイトを検証しています。

  ## 見つかった主な問題

  **登録・管理の設定（208サイト）**

  - パスキーを追加するときにパスワードの再入力などの本人確認を求めたのは 34%（71サイト）だけで、66% は確認なしで登録できた
  - パスキーを削除する機能がないサイトや、予備のパスキーを複数登録できないサイト（25サイト）があった
  - ほぼすべてのサイトが、非推奨の暗号アルゴリズムを要求していた
  - 38%（80サイト）はパスキーの有効範囲を親ドメイン全体に広げていて、サブドメインを乗っ取られたときに悪用される危険があった

  **攻撃による検証（103サイト）**

  - WebAuthn が義務付けるセキュリティ基準をすべて満たしたサイトは 1 つもなかった
  - 緊急レベルの脆弱性が 18 サイト、重要レベルが 53 サイトで見つかった
  - 5 サイトは暗号署名を検証しておらず、改ざんしたデータで他人のアカウントにログインできる状態だった
  - 14 サイトは鍵の識別子（クレデンシャル ID）の重複を悪用する攻撃に弱く、被害者をログインできなくする（5サイト）、被害者のパスキーを勝手に削除する（3サイト）などが可能だった
  - 複数ドメインでパスキーを共有する機能の許可リストに、年間 10 ユーロで誰でも取得できるドメインが含まれていた例があり、取得されると関連する 72 サイトでアカウントを乗っ取られるおそれがあった

  ## どう受け止めるか

  問題が見つかったのは、パスキーという仕組みそのものではなく、**サイト側（サーバー側）の実装**です。パスキーを正しく実装すれば、パスワードの漏えいや使い回しによる不正ログインを防ぎやすいことは変わりません。一方で「パスキーに対応している」だけでは安全とは言い切れず、サイトの作りによっては危険が残ることを示した調査です。

  このサイトに載っている事案でも、パスワードの漏えいが多く公表されています。利用者としては、パスキーをやめるのではなく、次の点を押さえておくとよいでしょう。

  - 予備として、複数の端末やパスワード管理アプリにパスキーを登録しておく（サイトが複数登録に対応している場合）
  - アカウントの設定画面で、心当たりのないパスキーが登録されていないかときどき確認する
  - ログインや設定変更の通知メールを受け取るようにし、身に覚えのない通知が来たら公式サイトから確認する

  漏えいのお知らせが届いたときの初動は[漏えいのお知らせメールが届いたら最初にやること](../2026-11-leak-notice-first-steps/)にまとめています。

  ## サイトを運営する人へ

  論文では、パスキーの追加時の本人確認、署名の検証、クレデンシャル ID の重複チェック、有効範囲（ドメイン）の設定など、WebAuthn の仕様が求める確認を実装で守れていない例が多く挙げられています。パスキーを導入している、または導入を予定しているサイトは、仕様どおりの確認ができているか見直すきっかけになります。
