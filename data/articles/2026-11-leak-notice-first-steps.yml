title: 漏えいのお知らせメールが届いたら最初にやること
date: 2026-11-09
kind: Tips
tags:
  - 個人の対策
summary: 「お客様の情報が漏えいした可能性があります」というお知らせが届いたときに、慌てずにやることを順番にまとめた。IPA（情報処理推進機構）が公開した対処法をもとにしている。
steps:
  - お知らせが本物か、公式サイトを自分で開いて確かめる
  - 漏れた情報の種類を確認する
  - 同じパスワードを使っているサービスを変更する
  - カードの利用明細を確認し、必要なら再発行する
  - 不審なメール・SMS・電話には応じない
body: |
  ## 1. お知らせが本物か確かめる

  漏えいが話題になると、「お詫び」や「返金のご案内」を装った偽メールも出回る。メールやSMSのリンクは開かず、ブックマークや検索から**公式サイトを自分で開いて**、同じお知らせが出ているか確認する。このサイトの事案ページからも、各社の公式発表へのリンクをたどれる。

  ## 2. 漏れた情報の種類を確認する

  やることは、漏れた情報によって変わる。お知らせや公式発表で、何が対象になったかを確かめる。

  - **メールアドレス**：フィッシングメールが増える。リンクを開かない
  - **パスワード**：すぐ変更する。同じパスワードを使っている他のサービスも変更する
  - **クレジットカード情報**：利用明細を確認し、番号の全桁やセキュリティコードが対象ならカード会社に再発行を相談する
  - **運転免許証などの本人確認書類**：信用情報機関に本人申告をしておくと、なりすましの契約を防ぐ助けになる
  - **電話番号・住所**：不審な電話や郵便物に注意する

  ## 3. パスワードを変え、パスキーを設定する

  パスワードの使い回しをやめる。対応しているサービスでは、パスワードの代わりにパスキーを設定すると、パスワードが漏れても不正ログインされにくくなる。

  ## 4. 不審な連絡には応じない

  漏えいした情報を使って、本物らしく見せた電話やメールが来ることがある。「返金するので口座番号を」「確認のためパスワードを」といった連絡には応じない。

  ## 困ったときの相談先

  対処のしかたが分からないときは、IPAの「情報セキュリティ安心相談窓口」に相談できる。
