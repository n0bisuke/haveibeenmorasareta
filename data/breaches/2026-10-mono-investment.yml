summary: 「投資のコンシェルジュ」が10月27日に不正アクセスを受け、登録している顧客の情報の一部が流出したことを同日確認したと公表した。対象の範囲・人数と流出した項目は精査中で、対象者には個別に連絡する。証券会社・金融機関のログインID・パスワードや口座番号は含まれず、資金や有価証券の流出は確認されていない。連携先のみんかぶアセットプランナーは資産データリンク機能を停止した。
