summary: 時計修理を委託する会社のサーバーがランサムウェア攻撃を受けて暗号化され、2025年9月以降にグループ店舗で時計修理を依頼した顧客の氏名・一部の住所・電話番号が漏えいした可能性があると公表した。委託先は9月15日に攻撃の可能性を検知し、9月25日に報告した。報道ではUDリテールを含む4社が対象とされる。漏えいの事実は確認されていない。
