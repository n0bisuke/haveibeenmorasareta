summary: 湘南美容クリニックなどを展開するSBCメディカルグループは、グループの医療機関から委託を受けて保有するデータベースが11月16日未明に不正アクセスを受け、顧客約162.4万人分の氏名、メールアドレス、電話番号、住所、生年月日、パスワード、会員IDなどが不正に取得されたと公表した。パスワードは当時暗号化せずに保存していた。Web予約フォームの申込内容約25.5万人分、問い合わせフォームの記載内容約21.8万人分、職員のアカウント情報も取得された。電子カルテや予約サイト「mySBC」の情報の取得は確認されていない。
