count_note: 顧客の個人情報約162.4万人（2010〜2023年の登録分）。ほかにWeb予約フォーム経由の申込内容約25.5万人、問い合わせフォームの記載内容約21.8万人、グループ職員のアカウント情報。対象者ごとに情報の組み合わせは異なる
cause: unauthorized_access
root_cause: グループ医療機関から受託して保有する管理システムのデータベースが、海外からの77万回にわたる攻撃で不正ログインされた
