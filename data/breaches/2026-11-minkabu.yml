root_cause: 「みんかぶ」と「みんかぶアセットプランナー」のシステムが第三者の不正アクセスを受けた。認証基盤の問題も調査中
data_types:
  - メールアドレス
  - 資産・取引情報
summary: 「みんかぶ」と資産管理サービス「みんかぶアセットプランナー（アセプラ）」のシステムが第三者の不正アクセスを受け、メールアドレス約15万3,000件と、アセプラの金融機関等の口座連携先と金額とみられる情報約1万9,000件が漏えいした可能性があると公表した。11月25日に「みんかぶ」での不正な利用を確認して調査を始め、11月26日からアセプラの該当機能を停止した。認証基盤のセキュリティ上の問題も調査している。資産状況に応じた不正な投資勧誘や、金融機関を装った詐欺に悪用されるおそれがあるとして注意を呼びかけた。
