summary: 株式会社プレイドの「KARTE」への不正アクセスで、連携していた利用者の情報が流出したと11月17日に公表し、18日の詳報で範囲が確定したと公表した。流出したのは社内で利用者を識別する番号と、アンケートで回答された性別・年代、一部の利用者の都道府県、個別番組と広告の聴取有無で、対象は602,382人（退会者を含む）。メールアドレス、氏名、パスワード、クレジットカード情報などの支払い情報は含まれないことを確認したとした。radikoのシステムへの不正アクセスは確認されていない。
