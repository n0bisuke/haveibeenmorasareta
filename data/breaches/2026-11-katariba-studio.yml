summary: Webサイトの申し込み・問い合わせフォームに使っていた「Studio」がクラウド環境への不正アクセスを受け、フォームに保存されていた計1,230件の情報が流出した可能性があると公表した。不登校支援フォーラム2025、全国高校生マイプロジェクトアワード2023全国Summit、ルールメイキング・サミット2023の観覧申し込みと、Rootsプロジェクトの問い合わせが対象で、氏名、メールアドレス、電話番号、所属（学校名・学年を含む）、年代、アンケート回答などが含まれる。対象者には10月26日の週に個別に連絡した。
sources:
