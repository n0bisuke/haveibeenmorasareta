root_cause: ウェブサイト管理システムに不正ログインされ、サイト内に不正なプログラムが設置された
summary: サービス用ネットワークへの第三者の不正アクセスで個人情報が流出した可能性があると6月19日に公表した。10月28日の最終報で、ウェブサイト管理システムへの不正ログインとサイト内への不正なプログラムの設置を確認したと公表した。対象サーバーで情報窃取の明確な痕跡は見つからなかったが、メールサーバーにアクセスできる状態だったため漏えいの可能性を否定できないとしている。クレジットカード情報と親会社はせがわの顧客情報は含まれない。
