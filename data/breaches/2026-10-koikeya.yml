summary: ファンコミュニティ「湖池屋GOGO！ランド」の運営を委託するコミューン株式会社のシステムが不正アクセスを受け、最大1,800人分の会員情報が漏えいしたと公表した。外部の第三者がシステムの不備を突き、管理者になりすまして会員情報を閲覧・取得した。パスワードそのものの漏えいは確認されていない。全会員をログアウトさせ、データを10月6日18時時点の状態に戻したうえで再開するとした。
