root_cause: 導入業務に使うクラウドストレージサービスのアカウントの一つが第三者に不正利用された
summary: 株式会社WHI Holdingsは、子会社サイダスが「COMPANY Talent Management 2.0」の導入業務で利用するクラウドストレージサービスで、第三者にアカウントの一つが不正利用され、導入業務に関する情報の一部が外部に漏えいしたと公表した。当該アカウントは直ちに無効化し、外部専門機関と連携して調査している。影響があると思われる顧客には個別に連絡するとしている。
