summary: オンラインゲームポータル「ハンゲ」のサーバーが11月3日に外部から不正アクセスを受けたと公表した。11月13日の第4報で、ハッシュ化されたパスワード6万1,962件、メールアドレス5万1,025件、生年月日2万8,251件、氏名・住所・電話番号2,994件、マスク処理済みのクレジットカード番号の一部2,961件、セキュリティコード6件などの漏えいを確認した。11月4日の第2報ではIDとパスワードの流出痕跡は確認されていないとしていた。全サービスを停止している。
sources:
