count_note: 最大項目（ハッシュ化パスワード）の件数。メールアドレス51,025件、生年月日28,251件、氏名・住所・電話番号2,994件、外部サービスIDのメールアドレス36,545件、マスク済みカード番号の一部2,961件、セキュリティコード6件など
cause: unauthorized_access
root_cause: ハンゲのサーバーが第三者から不正アクセスを受けた。侵入経路は調査中
