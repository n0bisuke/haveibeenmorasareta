summary: ホームページとスマートフォンアプリでのお知らせの表示・配信に利用するプレイドの「KARTE」が第三者の不正アクセスを受け、顧客の生年月日、年齢帯・性別・電話番号の登録有無（区分値のみ）、お知らせの要否を判定するフラグが最大約1,400万件漏えいしたと公表した。氏名等と紐づいておらず個人は特定できないとしている。氏名、住所、電話番号、メールアドレス、口座番号、暗証番号、ネットバンキングのID・パスワードは含まれない。資産や取引への影響は確認されていない。
