summary: 所有する宿泊施設「Grand Inn Canalside」の宿泊者の個人情報が漏えいした可能性があると公表した。宿泊管理を委託するホテリエのシステムに、旧運営会社から引き継がれず把握されていなかったアカウント経由で第三者が不正にアクセスした。ホテリエは同施設を含む受託8施設で、2026年4月8日〜9月14日にWebサイトから予約した7,919人の氏名・電話番号・メールアドレス・国籍・宿泊日・宿泊料金などの流出を確認した。該当アカウントは停止し、アクセス元を遮断した。
