summary: 株式会社プレイドの「KARTE」が第三者による不正アクセスを受け、同サービス上で管理していた「エイチエ」「エイチエ 転職」「ナース専科 就職」の顧客情報の一部が外部に漏えいした可能性があると公表した。エイチエは氏名、メールアドレス、電話番号、住所、生年月日、性別、会員ID、KARTE IDなど191,039件、エイチエ 転職は電話番号、生年月日、会員IDなど197,985件、ナース専科 就職は都道府県、生年月日、性別、会員ID 95,480件で、重複を含む。パスワードとクレジットカード情報は含まれていない。
