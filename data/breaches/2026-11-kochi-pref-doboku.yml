summary: 高知土木事務所が、県道の無許可工事について通報した人の名字と電話番号を書いたメモを、占用許可証などと一緒に工事業者に誤って渡し、通報者の個人情報を流出させたと公表した。9月下旬に通報者からの問い合わせで発覚し、県は通報者に謝罪した。
