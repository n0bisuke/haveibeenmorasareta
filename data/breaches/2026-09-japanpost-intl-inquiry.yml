cause: unauthorized_access
summary: 国際郵便物の調査請求Web受付サービスで使用しているサーバーに対し、外部から不正アクセスの可能性があることが9月25日15時ごろに発覚し、同サービスの受付を一時停止した。原因と影響範囲は調査中で、公表時点で個人情報の漏えいの有無や件数は示されていない。同サービスは神奈川県と山梨県の郵便局で差し出された国際郵便物を対象に試行実施しているもので、メールアドレスや郵便物のお問い合わせ番号、差出人の電話番号などを入力して調査を申し込む。受付の再開は改めてWebサイトで知らせるとしている。
