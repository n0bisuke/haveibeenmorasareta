summary: 運営するECサイト「タワーレコード オンライン」が外部から不正アクセスを受け、タワーレコードメンバーズ登録者の個人情報約1,100万件が流出したと公表した。11月19日17時10分ごろに不正アクセスを確認してサービスを停止し、その後の調査で流出を確認した。流出したのは、メールアドレス・会員ID・パスワードのハッシュ値のログイン情報10,214,652件、氏名・フリガナ・ニックネーム・生年月日・性別・郵便番号の会員情報2,784,514件、住所・宛名・電話番号の配送先情報776,953件で、退会後3年以内の会員も含む。クレジットカード情報は含まれず、11月21日時点で二次被害は確認されていない。サービス停止は続いており、注文済み商品の出荷は11月23日から順次再開するとしている。
