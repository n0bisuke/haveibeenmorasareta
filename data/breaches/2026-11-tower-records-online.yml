affected_count: 11000000
count_note: 約1,100万件（タワーレコードメンバーズ登録者。退会後3年以内を含む）。内訳はログイン情報（メールアドレス・会員ID・パスワードのハッシュ値）10,214,652件、会員情報（氏名・生年月日など）2,784,514件、配送先情報（住所・宛名・電話番号）776,953件
cause: unauthorized_access
root_cause: ECサイト「タワーレコード オンライン」が外部から不正アクセスを受けた（侵入経路は未公表）
