summary: ルノーとアルピーヌのニュースレター配信に利用するアララのメール配信サービス「repica」が10月28日以降に第三者の不正アクセスを受け、10月8日から29日までにニュースレターを送った顧客のメールアドレス96,027件が持ち出されたと公表した。原因はアララのシステムの脆弱性が悪用されたことと報告を受けている。メールの件名・本文、氏名、住所、電話番号、車両情報、自社システムの顧客情報は含まれないとしている。配信は停止している。
