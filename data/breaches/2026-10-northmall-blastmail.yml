summary: 通販サイト「Northmall」のメールマガジンなどの配信を委託していたブラストメールが不正アクセスを受け、顧客の個人情報が外部に漏えいしたと10月23日に公表した。27日の続報で、対象は169,585名で、メールアドレス（全員）と、一部の人の氏名・生年月日・最終購入日・顧客区分が含まれると公表した。クレジットカード情報、ログインパスワード、決済に関する情報は含まれない。二次被害は確認されていない。対象者には個別にメールで連絡する予定だが、ブラストメールの停止で再開後の配信か代案を検討している。
