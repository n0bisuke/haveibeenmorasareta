summary: 仙台市の百貨店の藤崎は、サービス改善のため利用している株式会社プレイドのサーバーへの不正アクセスが11月13日に検知され、オンラインショップ「FUJISAKI online」のオンライン会員の情報の一部が漏えいした可能性があると公表した。対象は最大約7万5,000件で、氏名、住所の一部、性別、年齢、メールアドレス、オンライン会員番号。クレジットカード情報、パスワード、生年月日、電話番号はプレイドに提供しておらず含まれないとしている。外部サービスとの連携を停止し、対象の会員には登録メールアドレス宛てに順次連絡する。
sources:
