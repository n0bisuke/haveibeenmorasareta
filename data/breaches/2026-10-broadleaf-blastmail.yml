summary: 「ものづくりドットコム」で使っていたメール配信サービス「ブラストメール」が第三者の不正アクセスを受け、メール送付先リストの情報が漏えいしたと公表した。10月23日に第1報、29日に続報を出した。対象はメールアドレス・氏名と、登録・提供した人のみの会社名・職種・役職・都道府県・生まれ年・業種・従業員数・購読メルマガの種類。クレジットカード情報やログインパスワードなどは含まれない。
