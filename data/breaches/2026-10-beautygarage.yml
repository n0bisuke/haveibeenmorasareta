summary: ECサイト「ビューティガレージ」「アイラッシュガレージ」のサーバーが10月10日から12日にかけて不正アクセスを受け、顧客情報77万5,725件が流出したと公表した。13日に検知し、侵入経路を遮断した。対象は会社名・サロン名、顧客名、電話番号、メールアドレス、パスワードのハッシュ値などで、住所、購入履歴、クレジットカードを含む決済情報の流出は確認されていない。
