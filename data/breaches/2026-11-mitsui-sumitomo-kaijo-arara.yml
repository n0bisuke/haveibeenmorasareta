summary: メール配信に関わる委託先アララへの不正アクセスにより、顧客のメールアドレス約1.5万件が漏えいしたと公表した。同じ日にグループのあいおいニッセイ同和損保（約1.6万件）と三井ダイレクト損保（1,200件）もアララ経由の漏えいを公表した。11月4日に公表した契約者専用ページの件とは別件。
