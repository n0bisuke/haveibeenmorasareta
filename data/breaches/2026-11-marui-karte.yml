summary: グループ会社のエポスカードと丸井が利用するプレイドのマーケティング支援ツール「KARTE」への不正アクセスにより、顧客の個人情報の一部が漏えいしたと公表した。マルイウェブチャネルの利用者とメール配信希望者の氏名・性別・生年月日・メールアドレス・顧客管理番号が約883万件、エポスカード利用者（退会者含む）の顧客管理番号・性別が約850万件で、延べ約1,733万件。うち約6万件は氏名・年齢・年収・キャッシング限度額も漏れた可能性がある。カード番号・暗証番号・セキュリティコードの漏えいは確認されていない。
