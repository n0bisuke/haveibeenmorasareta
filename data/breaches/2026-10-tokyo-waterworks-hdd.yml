summary: 10月2日に施錠されたキャビネットを開けたところ、個人情報を含む外付けHDD4台が収納箱だけを残して見当たらなくなっていたと公表した。報道によると対象は1,932人分で、大部分は氏名のみ、一部に住所・電話番号・生年月日を含む。HDDは見つかっておらず、二次被害は確認されていない。
