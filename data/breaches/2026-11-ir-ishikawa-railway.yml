summary: ファンクラブアプリ「いしてつ愛あーるクラブ」の機能を提供するサーバーが不正アクセスを受け、会員の個人情報が漏れた可能性があると公表した。11月20日朝に利用者から「アプリを閲覧できない」と連絡があり、システム管理を委託する会社に確認して判明した。同日中にサーバーを停止して外部からのアクセスを遮断し、サービスを一時停止した。会員数は有料・無料計8,060人で、氏名、メールアドレス、電話番号、住所、ログインID、パスワードなどが漏れた可能性がある。復旧時期は未定。11月26日、漏えいした可能性があるのは会員・退会者・登録未完了者の計9,418件で、勤務先も含まれると公表した。決済は外部サービスを使っているためカード情報の漏えいはないとしている。
