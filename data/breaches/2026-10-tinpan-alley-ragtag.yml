summary: ワールドの連結子会社で、ブランド古着店「RAGTAG」を運営する同社の業務サーバーが10月17日に不正アクセスを受け、会員情報延べ約120万件の氏名・住所・電話番号・生年月日・性別・メールアドレスが流出した可能性があると公表した。28日に検知した。決済情報の流出は確認されていない。
