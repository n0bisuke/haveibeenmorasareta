date_occurred: 2026-11-13
date_announced: 2026-11-13
affected_count: 79249
count_note: KARTEのアカウントとして登録されたメールアドレス79,249件。外部サービス連携用の認証情報と、利用企業が取り込んでいた顧客データの件数は調査中。利用企業ごとの件数は各社が公表している
cause: vulnerability
root_cause: サーバーの脆弱性を突かれて接続用の認証情報を盗まれ、データベースのデータを読み出された
attack_methods:
  - stolen_credentials
data_types:
  - メールアドレス
summary: 提供するCXプラットフォーム「KARTE」が11月13日未明に不正アクセスを受け、KARTEの全サービスを停止したと公表した。11月16日の第2報では、第三者がサーバーの脆弱性を悪用してシステムやデータベースの接続用認証情報を窃取し、データを外部に読み出したほか、同社アカウントを乗っ取って管理画面にも不正アクセスしたと説明した。漏えいを確認したのは、KARTEのアカウント用メールアドレス79,249件、外部サービスとの連携に使う認証情報（シークレットキー、アクセストークン等）、利用企業が会員情報などを取り込んでいたデータの一部で、後の2つの件数は調査中。利用企業には連携用認証情報の無効化を求めている。漏えいの対象となった利用企業には個別に連絡し、ジンズやRIZAPなど多くの利用企業が自社の顧客情報の漏えいを公表している。サービス再開の時期は未定。
