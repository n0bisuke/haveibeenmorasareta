date_occurred: 2026-11-13
date_announced: 2026-11-13
affected_count: 79249
count_note: KARTEのアカウントとして登録されたメールアドレス79,249件（このほか営業・サポート窓口の連絡先45,816件）。外部サービス連携用の認証情報と、利用企業が取り込んでいた顧客データの件数は調査中。11月20日には、漏えいの対象となった利用企業が延べ2,200社に上ると公表した。利用企業ごとの件数は各社が公表している
cause: vulnerability
root_cause: サーバーの脆弱性を突かれて接続用の認証情報を盗まれ、データベースのデータを読み出された
attack_methods:
  - stolen_credentials
data_types:
  - メールアドレス
summary: 提供するCXプラットフォーム「KARTE」が11月13日未明に不正アクセスを受け、KARTEの全サービスを停止したと公表した。11月16日の第2報では、第三者がサーバーの脆弱性を悪用してシステムやデータベースの接続用認証情報を窃取し、データを外部に読み出したほか、同社アカウントを乗っ取って管理画面にも不正アクセスしたと説明した。漏えいを確認したのは、KARTEのアカウント用メールアドレス79,249件、外部サービスとの連携に使う認証情報（シークレットキー、アクセストークン等）、利用企業が会員情報などを取り込んでいたデータの一部で、後の2つの件数は調査中。利用企業には連携用認証情報の無効化を求めている。漏えいの対象となった利用企業には個別に連絡し、ジンズやRIZAPなど多くの利用企業が自社の顧客情報の漏えいを公表している。11月20日には、漏えいの対象となった利用企業が延べ2,200社に上ると公表し、サービス停止の影響で2026年12月期は20億円の最終赤字に転落する見通しを示した。サービスは2027年1月中旬の再開を目指している。同日の調査結果では、漏えいの対象は利用企業の取り込みデータ570社・分析データ487社・キャッシュデータ最大推計409社・連携用認証情報754社で、契約を終えた企業の削除されるべきデータも含まれていた。
