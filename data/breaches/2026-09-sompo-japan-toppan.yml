summary: TOPPANが損保ジャパンから受託した「保険料控除証明書発行サービス」の運用業務で、担当者のドラッグ＆ドロップ操作の誤りにより、契約者177,426名分のカナ氏名や証券番号を含むデータを別の損害保険会社1社へ誤送付した。住所・連絡先・口座情報は含まれない。送付先は当該データを削除した。
