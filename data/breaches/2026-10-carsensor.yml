summary: 中古車情報サイト「カーセンサーnet」で10月17日に関連システムへの不審なアクセスを検知し、同日17時ごろからサイト・アプリと販売店向けサービス「C-MATCH」を含む関連サービスをすべて停止した。10月21日、販売店に問い合わせた利用者などの氏名、住所、電話番号、問い合わせ内容など最大370万9,551件が漏えいした可能性があると公表した。決済情報とログインパスワードは対象外。原因は調査中。リクルートのシステムを使う日産・三菱自動車の中古車検索サイトも一時停止した。
