summary: マイナンバーカード交付予約・管理システムの委託先のメール配信サービスが不正アクセスを受け、予約者のメールアドレス最大約4,700件が漏えいした可能性があると公表した。マイナンバーと氏名はこのシステムに紐づいておらず、予約システム本体への不正アクセスも確認されていない。
