summary: WEBサイトや公式アプリ「ワコールカルネ」の利用状況の分析や情報表示に使っていた株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、KARTEに連携していた顧客に関する情報の一部が漏えいした可能性があると公表した。11月18日時点で確認しているのは、システム間のデータ連携に使う内部管理用の番号、年齢、生年月日、性別。対象件数とその他の情報への影響は調査中。これらの情報だけでワコールカルネやワコールウェブストアにアクセスすることはできず、同社のシステムへの不正アクセスや二次被害は確認されていない。
sources:
  - title: ワコール 外部委託先システムへの不正アクセスによるお客様情報の漏えいについて
    url: https://www.wacoal.jp/notice/202611/20261118.html
checklist:
  - text: 調査結果を踏まえ、必要な顧客対応を行い、新たな事実が判明すれば公表するとしている
  - text: ワコールを装った不審なメールやSMSのURLを開かず、個人情報を入力しない
