summary: コミュニティサイト「ミツカン365」が10月30日に不正アクセスを受け、会員情報の変更機能と画面表示の不備を悪用されて487人分の会員情報が改ざんされ、うち29人分の顧客IDとメールアドレスの漏えいを確認したと公表した。11月2日に「ニックネームが勝手に変わった」との問い合わせで発覚した。氏名・住所・パスワード・カード情報は含まれない。佐川急便経由の件とは別の事案。
