summary: 袋井北小学校で、1988年度までの卒業生6,631人分の卒業証書授与台帳を紛失した。台帳には氏名・生年月日・保護者名・住所などが記載されていた。卒業証明書の申請をきっかけに所在不明が分かり、保存年限を過ぎた書類と一緒に誤って廃棄した可能性が高いとしている。
