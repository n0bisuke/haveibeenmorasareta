summary: カードローン等の一部商品で保証業務を提携するSMBCコンシューマーファイナンスのシステムが第三者の不正アクセスを受け、顧客情報が漏えいしたと11月5日に公表した。11月17日の第二報で、ポケットフリーローン・ポケットカードローン・アスジョイを申し込み・契約した顧客の情報3,983件が対象と公表した。項目は氏名、性別、生年月日、住所、電話番号、メールアドレス、運転免許証番号、勤務先情報（年収等）、契約情報など。二次被害は確認されていない。
