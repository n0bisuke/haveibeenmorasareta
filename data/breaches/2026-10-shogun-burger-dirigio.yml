summary: 「SHOGUN BURGER公式アプリ」で利用しているシステムが第三者の不正アクセスを受け、一部顧客の氏名、メールアドレス、電話番号、生年月日、性別、注文内容などが漏えいしたと公表した。システムは株式会社DIRIGIOが運営しており、対象の顧客にはDIRIGIOが個別に連絡する。クレジットカード情報は含まれず、ログインパスワードの漏えいや金銭被害は確認されていない。モバイルオーダーは一時停止した。
