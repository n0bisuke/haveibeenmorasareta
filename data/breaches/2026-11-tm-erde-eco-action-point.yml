  - 電話番号
summary: 環境配慮行動にポイントを付与するアプリ「エコ・アクション・ポイント」を運営する同社が第三者による不正アクセスを受け、会員の個人情報の一部が漏えいした可能性があると、参加自治体を通じて公表された。漏えいの可能性がある情報は登録された氏名、メールアドレス、生年月日、住所、電話番号。鳥取県は11月24日、県内利用者787人分が漏えいした可能性があると発表した。サービスは停止中で、運営元が原因と影響範囲を調査しており、対策と安全性の確認後に再開する予定。不審なメールへの注意を呼びかけている。
