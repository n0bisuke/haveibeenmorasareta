count_note: 全体の対象人数は未確認（最大9万8,000人との情報は出典で確認できなかった）。鳥取県は県内利用者787人分、宇都宮市の登録者6,257人も対象とされるが市の発表は未確認
cause: unauthorized_access
root_cause: アプリ「エコ・アクション・ポイント」の運営会社が第三者の不正アクセス（サイバー攻撃）を受けた
data_types:
  - 氏名
  - メールアドレス
  - 生年月日
