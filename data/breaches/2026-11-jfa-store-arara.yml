summary: 公式ストア「JFA STORE」の後払い決済を提供するGMOペイメントサービスから、同社の委託先が使うメール配信サービス提供元アララへの不正アクセスにより、利用者11人のメールアドレスが漏えいしたと報告を受けたと公表した。10月28日から30日にこのアドレスにカード会社を装った不審なメールが送られた。JFAやストアのシステムへの不正アクセスはない。
