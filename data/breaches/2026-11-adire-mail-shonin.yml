summary: ウェブサイトのお問い合わせフォームで利用していた株式会社イー・エム・ズィーのメール配信サービス「メール商人」が第三者による不正アクセスを受け、2023年1月1日から2026年11月11日までにフォームから連絡した人の個人情報約1,828件が漏えいしたと公表した。対象は法律相談、取材・出演の問い合わせ、法教育教材の申込みなどで、氏名、メールアドレス、電話番号、都道府県、性別、生年月日、法人名・担当者名、学校名・自治体名、問い合わせ内容などが含まれる。11月12日に委託先サーバーから情報の一部が持ち出された。クレジットカード・銀行口座の情報は含まれず、事務所のシステムへの不正アクセスは確認されていない。
