summary: 外国籍の口座保有者が在留カードを提出するサイトと口座解約サイトで、11月9日に不正アクセスの痕跡を確認し、提出サイトで保管していた在留カード情報最大約150件が漏えいした可能性があると公表したと報じられた。痕跡の確認後にシステムを停止し、両サイトを停止している。公式発表は未確認。
