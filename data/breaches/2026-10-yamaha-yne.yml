summary: ヤマハネットワークエンジニア会（YNE）の基盤システムを提供するコミューン株式会社のサーバーが不正アクセスを受け、YNE登録者の情報が流出したと公表した。不正アクセスは10月6日11時59分頃から20時36分頃にかけて行われ、約1,600名分のメールアドレス、表示名、アカウント名、自己紹介、アイコン、所属グループが漏えいした。同社システムへの不正アクセスや情報の不正利用は確認されていない。
