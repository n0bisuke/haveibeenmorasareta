summary: 2019年11月から2021年12月にコールセンターの契約社員に応募した4,682名の氏名、メールアドレス、電話番号、生年月日、性別が流出したと公表した。委託先の株式会社ApplyNowが提供する動画面接のサービスで、データ分析ツールの脆弱性を悪用した不正アクセスがあった。9月16日に判明した。画像や面接の動画は流出していない。
