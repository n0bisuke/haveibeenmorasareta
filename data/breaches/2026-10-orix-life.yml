summary: 公式ウェブサイトで受け付けた問い合わせ内容の管理などに利用していた委託先スカラコミュニケーションズが不正アクセスを受け、顧客情報約26,500件（同一の顧客による複数回の問い合わせを含む）が漏えいした可能性があると発表した。対象は氏名、生年月日、住所、電話番号、メールアドレス、証券番号、問い合わせ内容（顧客が申告した医療情報等を含む）。オリックス生命のシステムへの不正アクセスは確認されておらず、マイナンバーやクレジットカード番号は含まれない。発表時点で二次被害は確認されていない。原因と影響範囲は委託先が調査中としている。発表が案内する委託先の公表によると、2026年10月2日夜から3日朝にかけて同社のFAQシステム「i-ask」の管理サイトに不正ログインされ、不正なプログラムを設置された。大和証券・シチズン時計・損害保険ジャパンなども同じ委託先の件で漏えいの可能性を公表している。
sources:
