count_note: 令和4〜8年度（2022〜2026年度）にプレゼンテーション動画試験へ申し込んだ人の申込時の情報。第1報（9/11）では約800件の流出の可能性としていた
cause: third_party
root_cause: 委託先の採用管理プラットフォームでデータ分析ツールの脆弱性を悪用された
vendor:
  name: 株式会社ApplyNow
data_types:
  - 氏名
  - メールアドレス
  - 電話番号
summary: 富士市が職員採用試験のプレゼンテーション動画試験で利用しているApplyNowの採用管理プラットフォームが第三者による不正アクセスを受け、2022〜2026年度に同試験へ申し込んだ815件の氏名（漢字・カナ）、メールアドレス、電話番号、受験番号が外部へ漏えいした。市は9月11日に約800件の流出の可能性を公表し、10月7日の続報で同社から漏えいの報告を受けたと公表した。第1報では、企業情報（担当者ユーザー名、メールアドレス、権限）も持ち出された可能性があるとしていた。動画データは別の保存領域にあり対象外とされる。同社への不正アクセスはデータ分析ツールの脆弱性を悪用したもので、他の自治体や企業にも影響した。
