summary: 保育関連サービス「ルクミー」の案内配信や利用状況分析に使っていた株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、ルクミーを利用したことのある施設と保護者の情報の一部が外部に漏えいしたと公表した。漏えいが判明したのは、施設のメールアドレスとログインに使う識別番号（園ID）、保護者のメールアドレスと氏名、子どもの生年月日。11月15日にプレイドの調査で判明した。件数は調査中。子どもの写真・保育記録・連絡帳の内容、ログインパスワード、クレジットカード情報・口座情報はKARTEに連携しておらず漏えいしていない。
sources:
  - title: ユニファ 当社が利用する外部メール配信サービス 株式会社プレイドの「KARTE」における、不正アクセスによる個人情報漏えいに関するお詫びとお知らせ（第一報）
    url: https://unifa-e.com/news/info/20261117-info_news1117
checklist:
  - text: 対象の施設・保護者には noreply@unifa-e.com から順次メールで連絡するとしている
  - text: 本件に便乗した不審なメールやSMSのURL・添付ファイルを開かず、パスワードやカード情報を入力しない
