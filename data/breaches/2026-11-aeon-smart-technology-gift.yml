organization: イオンスマートテクノロジー株式会社
group: イオングループ
services:
  - ギフト承りシステム（2024年度「イオンの夏ギフト」）
industry: 小売・EC
country: JP
date_occurred: 2026-10-20
date_announced: 2026-11-10
affected_count: 414
count_note: イオンスタイル津田沼North、イオン東札幌店、マックスバリュ篠原橋東店、ダイエー浦安駅前店の4店舗の承り情報
cause: unauthorized_access
root_cause: グループ各社が使うウェブサイト基盤に第三者が不正アクセスし、ギフト承りシステムの情報が流出した
data_types:
  - 氏名
  - 住所
  - 電話番号
summary: 10月に検知した第三者による不正アクセスにより、ギフト承りシステムに登録されていた2024年度「イオンの夏ギフト」の承り情報414件が流出したと公表した。対象はイオンスタイル津田沼North、イオン東札幌店、マックスバリュ篠原橋東店、ダイエー浦安駅前店の4店舗で、氏名、住所、電話番号が含まれる。クレジットカード情報やメールアドレスは含まれず、二次被害は確認されていない。
