summary: Morisawa Fontsの利用状況の分析やコンテンツ配信などに使っていたプレイドのサービス「KARTE」が不正アクセスを受け、顧客の個人情報23,957件が外部に漏えいしたと公表した。11月15日のプレイドの報告で判明した。漏えいしたのは氏名、メールアドレス、ユーザーIDで、2023年5月以降にMorisawa Fontsのサービスサイトで購入した顧客の一部が対象。同サービスではクレジットカード情報とログインパスワードを扱っておらず、漏えいの対象に含まれていないとしている。不正利用は確認されていない。
