summary: 「ぷらら」「ひかりTV」の販売支援業務の委託先で、元派遣社員が顧客情報を不正に持ち出した。クレジットカードや口座などの決済情報は含まれない。2024年2月に個人情報保護委員会がドコモとNTTネクシアを行政指導した。
