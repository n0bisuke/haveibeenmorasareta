summary: 商品の保管・配送を委託するオープンロジで11月8日〜9日に不正アクセスが発生し、公式オンラインショップ「SORASHOP」の購入者情報の一部が外部に漏えいした可能性があると公表した。対象は2026年4月8日〜11月8日の購入分で、氏名、住所、電話番号、メールアドレス、注文・配送商品の情報。件数は調査中で、クレジットカード情報は含まない。安全性が確認されるまでオープンロジの利用を停止し、代替の配送体制に切り替えた。
