summary: 旧コーポレートサイトの制作・運用に使っていた「Studio」のクラウド環境が第三者の不正アクセスを受け、2024年3月13日〜2026年10月5日に問い合わせフォームから送信された約1,600件（約1,200人、いずれも概算）の会社名、氏名、メールアドレス、電話番号、問い合わせの種別と内容が漏えいした可能性があると公表した。クラウド受付システム「RECEPTIONIST」などのサービスの利用者情報はStudioで管理しておらず、影響はない。二次被害は確認されていない。
