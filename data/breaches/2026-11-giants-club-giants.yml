industry: エンタメ・スポーツ
country: JP
date_occurred: 2026-11-12
date_announced: 2026-11-13
affected_count: 807030
count_note: メールアドレス807,030件。続報で、氏名16,998件・住所12,831件・電話番号15,434件・性別1,664件・生年月日1,665件・ハッシュ化パスワード274件の流出も確認
cause: unauthorized_access
root_cause: 会員情報管理システムが外部から繰り返し不正アクセスを受けた。手法は公表されていない
data_types:
  - メールアドレス
  - 氏名
  - 住所
  - 電話番号
  - 性別
  - 生年月日
  - パスワード（ハッシュ化・暗号化済み）
summary: 公式ファンクラブ「CLUB GIANTS」の会員情報を管理するシステムが11月12日未明から外部のサイバー攻撃を繰り返し受け、会員のメールアドレス80万7,030件が流出したと公表した。サーバー容量の逼迫でシステムにアクセスできなくなり発覚した。クレジットカード情報は同システムに保持しておらず対象外で、ほかの会員情報への影響は調査中。攻撃は遮断し、個人情報保護委員会に報告した。続報で、氏名約1.7万件、住所約1.3万件、電話番号約1.5万件、生年月日・性別、ハッシュ化パスワード274件の流出も確認したと公表した。
