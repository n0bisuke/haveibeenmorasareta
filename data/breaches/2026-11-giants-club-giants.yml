  - メールアドレス
summary: 公式ファンクラブ「CLUB GIANTS」の会員情報を管理するシステムが11月12日未明から外部のサイバー攻撃を繰り返し受け、会員のメールアドレス80万7,030件が流出したと公表した。サーバー容量の逼迫でシステムにアクセスできなくなり発覚した。クレジットカード情報は同システムに保持しておらず対象外で、ほかの会員情報への影響は調査中。攻撃は遮断し、個人情報保護委員会に報告した。
