summary: 「名鉄観光サービス メディア予約センター」のメールマガジン配信に使っていたブラストメールが不正アクセスを受け、10月21日にラクスライトクラウドから報告を受けたとして、22日に約13万人の氏名・電話番号・メールアドレス・生年月日・性別・都道府県名が漏えいした可能性があると公表した。自社システムへの侵入の痕跡は検出されていない。11月12日の結果報告で、調査の結果、漏えいはなかったと公表した。
