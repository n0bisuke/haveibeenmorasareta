count_note: 件数は公表されていない。漏洩が確認された利用者にはメールで個別に連絡している
cause: third_party
root_cause: アプリ内のバナー・ポップアップ表示などに使う委託先プレイドの「KARTE」が不正アクセスを受けた
vendor:
  name: 株式会社プレイド
data_types:
  - 生年月日
  - 性別
  - 取引先情報
summary: タクシーアプリ「S.RIDE」のミニバナーやポップアップ表示、一部のプッシュ通知・アンケートに利用していたプレイドの「KARTE」が不正アクセスを受け、利用者の生年月日・年齢・性別・よく乗降するエリア（都道府県単位）・内部識別子と、法人向け「S.RIDE Biz」の利用企業名の一部（過去の利用企業を含む）が漏洩したと公表した。登録名・電話番号・メールアドレス・乗降地の詳細・決済情報・パスワードの漏洩は確認されていない。件数は公表していない。KARTE との連携用の認証情報は当日に無効化し、KARTE の利用を停止した。
