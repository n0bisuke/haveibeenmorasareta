organization: 株式会社トレジャー・ファクトリー
services:
  - 出張買取・トレファク引越の案件管理システム
industry: 小売・EC
country: JP
date_announced: 2026-10-23
affected_count: 746277
count_note: 746,277件（大半はメールアドレスのみで、氏名・住所を含むのは11件）。ほかに取引先・従業員などの情報1,750件
cause: vulnerability
root_cause: 出張買取などの案件管理システムのデータベースへのアクセスに関する脆弱性を悪用されたとみられる
vuln_target: business_tool
data_types:
  - メールアドレス
  - 氏名
  - 住所
  - 従業員情報
summary: 「出張買取」「トレファク引越」の案件管理システムが外部から不正アクセスを受け、74万6,277件の個人情報が漏えいしたと公表した。大半はメールアドレスで、氏名・住所を含むものは11件。このほか取引先業者や従業員などの氏名・メールアドレスや端末の識別情報も取得された。10月20日に攻撃を把握した。決済情報や、店舗・アプリで管理する顧客情報は別システムのため対象外としている。PHPの脆弱性によるものではないと説明している。
sources:
