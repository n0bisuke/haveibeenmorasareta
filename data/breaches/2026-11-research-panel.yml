cause: vulnerability
root_cause: アンケートサイトのサイト内検索機能の脆弱性を突いた不正アクセスを受けた
data_types:
  - メールアドレス
  - パスワード（平文）
  - パスワード（ハッシュ化・暗号化済み）
  - 氏名
  - 性別
  - 郵便番号
  - 会員ID
  - 連携サービスID
summary: アンケートサイト「リサーチパネル」のサーバーがサイト内検索機能の脆弱性を突いた不正アクセスを受け、会員のログインメールアドレス、ログインパスワード、氏名、性別、郵便番号、リサーチパネル会員ID、ECナビ会員IDが漏えいした可能性があると公表した。11月20日夜に不審な処理を検知し、サービスを停止した。多くの会員のパスワードは元の文字列に戻すことが困難な形式で保存していたが、一部の会員のパスワードはその形式に変換されない状態で保存されていたとして、該当するパスワードを無効にした。
sources:
