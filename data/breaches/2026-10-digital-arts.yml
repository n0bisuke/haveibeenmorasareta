industry: IT・通信
country: JP
date_announced: 2026-10-21
count_note: 件数は未公表（一部の顧客情報が閲覧された可能性）
cause: unauthorized_access
attack_methods:
  - stolen_credentials
root_cause: クラウドサービスの運用に使う認証情報を不正に入手され、運用環境に侵入された
summary: i-FILTER@Cloud などクラウドの6サービスの運用環境に第三者が侵入し、一部の顧客情報が閲覧された可能性があると公表した。10月9日にシステムの総点検で痕跡を確認し、痕跡は2025年7月ごろまでさかのぼる。運用に使う認証情報が不正に入手されていた。外部への持ち出しは確認されておらず、全利用顧客にパスワードの変更を依頼した。
