summary: 産業経済新聞社と産経デジタルは、産経デジタルが過去に契約していた株式会社プレイドのサービス「KARTE」が不正アクセスを受け、同サービスを使っていた競馬情報サイト「ZBAT！」とオンラインショップ「産経ネットショップ」の個人情報が外部に漏洩したと公表した。漏洩したのは氏名とメールアドレスで、クレジットカード情報などは含まれていない。プレイドとの契約はZBAT！が2019年、ネットショップが2024年に終了していた。件数は公表されておらず、悪用などの被害の報告は受けていないとしている。
