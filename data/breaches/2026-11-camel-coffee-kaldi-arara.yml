summary: カルディコーヒーファームを運営する株式会社キャメル珈琲は、公式オンラインストアのメールマガジン配信に使っていたアララ株式会社のサービスが第三者の不正アクセスを受け、メールマガジン会員のメールアドレス820,420件（過去に配信された会員を含む）が漏えいしたと公表した。11月2日に連絡を受けた。クレジットカード情報、氏名、住所、電話番号などメールアドレス以外の情報は含まれず、現時点で悪用や二次被害は確認されていない。
