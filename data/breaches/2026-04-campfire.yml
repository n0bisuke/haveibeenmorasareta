organization: 株式会社CAMPFIRE
services:
  - CAMPFIRE
industry: IT・通信
country: JP
date_occurred: 2026-03-18
date_announced: 2026-04-03
affected_count: 225846
count_note: 最大22万5,846件（重複を除く。漏えいの可能性）。うち口座情報を含むもの8万2,465件。このほか開発従事者413名分などがGitHub上で閲覧可能な状態だった
cause: unauthorized_access
root_cause: 従業員が発行したGitHubの認証情報が個人開発用サーバに誤ってアップロードされ、第三者に不正利用された
data_types:
  - 氏名
  - 住所
  - 電話番号
  - メールアドレス
  - 口座番号
  - 従業員情報
summary: システム管理用のGitHubアカウントが第三者に不正アクセスされ、一部のソースコードが閲覧された可能性があると4月3日に公表した。その後の調査で、攻撃者がGitHub上の情報からクラウド環境の認証情報を取得し、社内業務用クラウドの一部の管理領域と顧客情報管理システムへ不正アクセスしていたことが分かった。クラウドファンディングサイト「CAMPFIRE」のプロジェクトオーナーや支援者など最大22万5,846件の氏名・住所・電話番号・メールアドレスと、一部の口座情報が漏えいした可能性がある。クレジットカード情報は含まれない。6月2日の調査結果では、データの外部転送の痕跡は確認されなかったが、ログの欠落により閲覧の可能性は否定できないとした。
