summary: 新規事業関連のサービスサイトに使っていたStudioが不正アクセスを受け、「Innovator’s101」「NAGOYA TRY CATAPULT」など20以上のサービスサイトに設置した問い合わせ・資料請求・イベント申し込みなどのフォームの情報が流出した可能性があると公表した。第一報の約8,538件を11月13日の続報で6,693件に精査した。対象は氏名、メールアドレス、電話番号、所属、役職、SNSのアカウント名、性別、問い合わせ内容、アンケート内容。二次被害は確認されていない。
