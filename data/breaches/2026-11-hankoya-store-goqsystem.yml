summary: 楽天市場の店舗で注文の確認や出荷手配に使う受注管理システム「GoQSystem」が11月10〜11日に問い合わせフォームの脆弱性を悪用した不正アクセスを受け、同店が楽天市場で預かっていた顧客情報の一部が外部に漏えいしたと公表した。対象は注文56,031件、注文者と届け先を合わせて約56,000名で、氏名、住所、電話番号、メールアドレス（楽天市場の転送用アドレスを含む）、注文内容が含まれる。個人情報保護委員会に報告し、対象者にはメールで個別に連絡するとしている。
