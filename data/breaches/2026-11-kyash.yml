organization: 株式会社Kyash
services:
  - Kyash
industry: 金融・保険
country: JP
date_occurred: 2026-10-28
date_announced: 2026-11-19
affected_count: 11996
count_note: 最大11,996人（退会者を含む）。うち11,786人はアカウント状態や一部の支払いの加盟店・日付・金額など、310人はログイン・チャージ・送金履歴や端末識別番号、IPアドレスなど
cause: unauthorized_access
root_cause: 顧客向けとは別環境の社内向けウェブツールのアクセス管理に不備があり、外部から不正アクセスされた
attack_methods:
  - broken_access_control
data_types:
  - 会員ID
  - 資産・取引情報
  - 利用履歴
summary: 社内向けウェブツールが10月28日に外部から不正アクセスを受け、最大11,996人（退会者を含む）の利用者情報を含む社内資料が第三者に取得された可能性があると公表した。内部識別用ID、アカウントの状態、一部の支払いの加盟店・日付・金額、返金・精算の状況のほか、一部の利用者はログイン・チャージ・送金の履歴、端末識別番号、IPアドレスなどが含まれる。原因はツールのアクセス管理の不備。氏名、住所、電話番号、メールアドレス、カード情報、パスワードは含まれない。
