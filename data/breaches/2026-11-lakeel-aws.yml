affected_count: 140
count_note: 顧客1社の環境で従業員等140名分の漏えいを確認。ほかの顧客環境も調査中
cause: unauthorized_access
root_cause: ソースコード管理サーバーのアクセス制御設定の不足を突かれ、AWSアクセスキーを窃取された
