summary: 利用するAWS環境が不正アクセスを受けたと公表した。ソースコード管理システムのサーバーでアクセス制御の設定不足を突かれ、AWS環境で使うアクセスキーを窃取されたことが発端と特定した。顧客1社の環境で従業員等140名分の氏名・メールアドレスが漏えいし、別の顧客1社の環境ではサーバーへの侵入や不正なユーザーの作成が行われていた。アクセスキーは無効化・更新した。
