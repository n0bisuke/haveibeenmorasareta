organization: 株式会社みずほ銀行
services:
  - スマートフォンアプリ等のメール配信
industry: 金融・保険
country: JP
date_announced: 2026-11-26
affected_count: 33224
count_note: 行内システムで使う顧客管理番号 最大3万3,224件。氏名・住所・電話番号・口座の暗証番号・ネットバンキングのパスワードは含まれない
cause: third_party
root_cause: メール配信等の委託先プレイドの「KARTE」が不正アクセスを受け、顧客管理番号が漏えいした
vendor:
  name: 株式会社プレイド
data_types:
  - 会員ID
summary: スマートフォンアプリサービスなどでメール配信を委託している株式会社プレイドのサービス「KARTE」が第三者による不正アクセスを受け、行内で管理する顧客管理番号最大3万3,224件が外部に漏えいしたと公表した。11月13日にプレイドから連絡を受け、当初は顧客情報が含まれないと確認していたが、新たに提供された情報をもとに調べ、25日に漏えいが判明した。氏名、住所、電話番号、口座の暗証番号、ネットバンキングのパスワードなどは含まれない。漏えいした管理番号は無効化済みで、資産や取引への影響は確認されていないとしている。
