summary: 同社が管理するシステムで11月6日に第三者の不正アクセスを確認し、ニトリネットの個人会員・購入者やECモールのニトリ公式ショップで注文した人、法人会員の会員番号・氏名・住所・電話番号・メールアドレス・生年月日・性別、法人の会社名・部署名など最大3,762万件が流出した可能性があると公表した。10月中旬から下旬にも不正アクセスがあった可能性がある。ログインパスワードとクレジットカード情報は含まれない。
