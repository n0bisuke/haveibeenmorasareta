summary: ふるさと納税ポータル「ふるさとチョイス」で、10月19日に通常と異なるアクセスの傾向を把握し、同日午後からサービスを一時停止した。10月20日、10月17日に第三者による不正アクセスがあり、寄附者の氏名、住所、電話番号、メールアドレス、ハッシュ化されたパスワード、寄附控除の試算額など445万4,097件が外部に流出したと発表した。侵入経路は調査中。データ連携している他社のふるさと納税サイトでも、一部自治体への寄付ができなくなった。
