summary: LINE公式アカウントと連携するマーケティング基盤「TONARIWA」で、システム基盤の管理アカウントの認証情報が漏えいし、第三者による不正アクセスと権限昇格が行われていたことを11月10日に確認したと公表した。導入企業のエンドユーザーの氏名・生年月日・連絡先などと、LINE公式アカウント連携用のアクセストークンが漏えいした可能性がある。サービスを一時停止した。悪用は確認されていないが、不正なメッセージ配信のリスクは排除できないとした。
