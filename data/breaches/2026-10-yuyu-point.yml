summary: 「ゆうゆうポイント」の公式サイトで、外部で流出したとみられるIDとパスワードを使った「ゆうID」へのなりすましログインがあり、249アカウントの会員情報（氏名、住所、生年月日、電話番号、性別、メールアドレスなど）が閲覧された可能性があると公表した。10月15日に検知し、16日からサイトを停止した。20日から「ゆうID」のログインに2段階認証を必須にした。
