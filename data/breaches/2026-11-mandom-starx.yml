industry: 美容・健康
country: JP
date_announced: 2026-11-20
affected_count: 36671
count_note: 2013年11月〜2025年10月にオンラインショップで注文した顧客36,671名（漏えいの可能性が高い）
cause: third_party
root_cause: 物流委託先スタークスが「クラウドロジ」関連で使うデータ分析ツールMetabaseの脆弱性を悪用された
attack_methods:
  - known_vulnerability
vendor:
  name: スタークス株式会社
data_types:
  - 氏名
  - 住所
  - 電話番号
  - メールアドレス
  - 生年月日
  - 性別
  - 購入履歴
summary: 「マンダムオンラインショップ」の物流業務を委託するスタークスが物流システム「クラウドロジ」に関連して使っていたデータ分析ツール「Metabase」がソフトウェアの脆弱性を悪用した不正アクセスを受け、顧客の個人情報が漏えいした可能性が高いと公表した。対象は2013年11月〜2025年10月に注文した36,671名で、氏名、住所、電話番号、メールアドレス、生年月日、性別、注文情報（届け先を含む）。カード番号とパスワードは含まれない。マンダムのシステムへの不正アクセスではなく、ショップは通常どおり営業している。スタークスは同ツールの利用を終了した。
sources:
  - title: マンダム 業務委託先への不正アクセスによるお客さま情報漏えいの可能性に関するお詫びとお知らせ
    url: https://www.mandom.co.jp/release/2026112001.html
  - title: スタークス お知らせ
    url: https://starx.co.jp/news/1048.html
