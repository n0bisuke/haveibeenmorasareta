cause: unauthorized_access
root_cause: アプリ関連システムで利用者本人に情報を表示するための仕組みが第三者に悪用された
data_types:
  - 氏名
  - メールアドレス
  - 性別
  - 電話番号
  - 住所
  - クレジットカード情報（番号の一部・有効期限等）
summary: アカウントサービス「ローソンID」と「ローソンアプリ予約」が第三者による不正アクセスを受け、個人情報が漏えいしたと公表した。ローソンIDは9月12日から14日、アプリ予約は9月17日に不正アクセスを受けていた。ローソンIDでは215万5,345件のメールアドレス・氏名など（入力していた人は性別・電話番号・住所も）、アプリ予約では26件の氏名・電話番号・クレジットカード番号の一部が漏えいした。不審なアクセス元を遮断し、予約機能を停止した。
