summary: 公式通販サイト「COCORO STORE」でマーケティングに利用する株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、連携していた顧客情報最大3,264,445件が流出したおそれがあると公表した。対象は年齢、生年月日、性別、KARTE上の顧客識別ID。氏名、住所、メールアドレスの流出は確認されておらず、パスワードとクレジットカード情報はKARTEに連携していない。KARTEとの連携は停止・無効化した。
