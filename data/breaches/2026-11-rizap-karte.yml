    url: https://www.rizapgroup.com/news/detail?topics_id=1573
checklist:
  - text: RIZAPやchocoZAPをかたる不審なメール・電話のリンクにアクセスしたり返信したりしない
  - text: RIZAP・chocoZAPがメールやLINEでパスワードやクレジットカード情報を尋ねることはないとしている
