summary: 子会社のRIZAP株式会社が一部のWebサービスで利用する株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、ZAP ID登録者（chocoZAP、RIZAPの通販サイトなどの利用者）の情報が漏えいした可能性があるとRIZAPグループ株式会社が公表した。対象はメールアドレス最大約432万件（重複を含む）で、うち氏名を含むものは最大約6万件。ほかに会員ID、性別、年代、都道府県、LINE公式アカウント連携用の識別番号が含まれる。決済情報、ログインパスワード、LINEのログイン情報、住所、電話番号、生年月日は含まれない。11月13日から一部のWebサービスを停止した。
sources:
