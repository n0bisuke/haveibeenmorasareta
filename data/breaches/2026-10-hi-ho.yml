affected_count: 38509
count_note: 38,509件（契約単位）。閲覧された、または閲覧された可能性がある件数
cause: phishing
root_cause: 他社への切り替えを勧める電話勧誘で本人からログイン情報を聞き出され、マイページになりすましログインされた
data_types:
  - 氏名
  - 住所
  - 電話番号
  - メールアドレス
  - 契約情報
summary: 会員用マイページに第三者が顧客になりすましてログインし、38,509件（契約単位）の顧客情報が閲覧された、または閲覧された可能性があると発表した。他社への切り替えを勧める電話勧誘で本人からログイン情報を聞き出す手口とみられる。対象は氏名、住所、電話番号、メールアドレス、契約・請求情報で、クレジットカードと口座情報は含まれない。不正な通信元を遮断し、電話番号などでログインする方式を廃止した。
