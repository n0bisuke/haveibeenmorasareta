summary: アプリやWebサイトでの案内表示に利用している株式会社プレイドの「KARTE」への第三者による不正アクセスにより、連携していた情報の一部が外部に漏えいしたと公表した。約91万人の顧客の識別コード（システムで生成した約40桁の文字列）、生年・月、住んでいる都道府県の漏えいを確認した。氏名、住所、メールアドレス、電話番号、本人確認書類の画像、マイナンバー、クレジットカード情報、ログインID・パスワードは連携しておらず、資産や取引への影響はないとしている。同社のシステムへの不正アクセスではない。
