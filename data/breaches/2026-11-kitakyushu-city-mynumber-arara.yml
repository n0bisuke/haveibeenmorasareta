summary: 北九州市は、マイナンバーカード交付予約・管理システムの受付完了メールと前日のリマインドメールの送信に使われているアララ株式会社のメール配信サービス「アララメッセージ」が不正アクセスを受け、予約システム利用者のメールアドレスが漏えいした可能性があると公表した。予約システムは株式会社TKCが運営している。件数は調査中で、TKCやアララをかたる不審なメールに注意するよう呼びかけている。
