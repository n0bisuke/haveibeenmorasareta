summary: 9月9日〜10月7日（米国時間）に不正に取得された認証情報で社内システムに侵入され、日本国内で最大約5万件の顧客担当者の氏名・メールアドレス・企業名・電話番号、TiDB Cloudのアカウント情報、契約条件などが漏えいしたと公表した。秘密鍵やカード情報、TiDB Cloud本体への侵入は確認されていない。
