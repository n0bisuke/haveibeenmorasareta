summary: bellSalesAIの顧客向けサポートサイトで使っていた株式会社プレイドの「KARTE」「KARTE Datahub」などが第三者の不正アクセスを受け、KARTE Datahub上で管理していた情報の一部が外部に漏えいした可能性があると公表した。対象はbellSalesAIを利用する顧客の氏名、メールアドレスと、サービス上でのボタンクリックなどのイベント情報で、件数は調査中。問い合わせ内容は対象に含まれず、bellSalesAIで記録・管理するデータとSalesforce連携データの漏えいは確認されていない。KARTEと連携するデータベースの認証情報は無効化した。
