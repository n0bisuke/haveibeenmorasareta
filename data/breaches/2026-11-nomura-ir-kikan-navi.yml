summary: 機関投資家・アナリスト向けの決算説明会支援サービス「機関Navi」が11月2日に不正アクセスを受け、11月3日に情報漏えいを確認したと公表した。氏名・メールアドレスなどが含まれる可能性があり、範囲は調査中。同じサーバーの個人投資家向け「MIR@I」も停止した。11月6日の第2報で、機関投資家・アナリストなど約2,000件の漏えいを確認したと公表した。
