summary: キャンペーンで利用していたソニックムーブの「COMSBI（SaaS版）」が第三者の不正アクセスを受け、LINE公式アカウント「日清食品キャンペーン」の友だち1,374,157件のLINEユーザーID・表示名・プロフィール画像のURLなどと、「カプポはじまる! キャンペーン」当選者543件の氏名・住所・電話番号などが漏えいしたと公表した。対象は9月9日から11月5日までに友だち追加していた人で、キャンペーンに応募していない人も含まれる。11月11日夜にキャンペーン業務の委託先TOPPANから連絡を受け、12日に漏えいを確認した。自社のキャンペーン基盤への不正アクセスの形跡はないとしている。
sources:
