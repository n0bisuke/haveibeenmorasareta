count_note: 令和4年度（2022年度）の職員採用試験（一般事務／大学卒）一次試験の申込者等の情報の件数。第1報（9/15）では約130人分の漏えいの可能性としていた。市役所側のユーザー情報（ユーザー名・パスワード等）も漏えいした内容に挙げられているが、113件に含まれるかは公表されていない
