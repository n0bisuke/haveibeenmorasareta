  - パスワード（保管形式不明）
summary: 島田市は、2022年度の職員採用試験（Web動画による選考）で利用したApplyNowの採用管理システムが第三者による不正アクセスを受け、申込者の個人情報が漏えいした可能性があると9月15日に発表した。市が同システムを利用したのは2022年度のみで、9月14日に事業者から連絡を受けた。10月7日の続報で、事業者から外部への漏えいが報告されたとして、一般事務（大学卒）一次試験の申込者等113件の氏名（漢字・カナ）、電話番号、メールアドレス、生年月日、電子申請の受付番号と、市役所側のユーザー名、パスワード、メールアドレス、権限が漏えいしたと公表した。同社への不正アクセスはデータ分析ツールの脆弱性を悪用したもので、面接動画データは別の保管領域にあり対象外とされる。
