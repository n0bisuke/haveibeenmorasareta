organization: 全国都道府県及び全指定都市（宝くじ公式サイト）
services:
  - 宝くじ公式サイト
  - 宝くじ公式アプリ
industry: 行政
country: JP
date_occurred: 2026-11-04
date_announced: 2026-11-05
affected_count: 4436
count_note: 不正ログイン4,436名（うち4,133名はパスワードを変更された）。サーバーやデータベースへの侵入の形跡はないとしている
cause: unauthorized_access
root_cause: 外部で入手されたメールアドレスとパスワードを使ったリスト型攻撃とみられる不正ログイン
attack_methods:
  - credential_stuffing
data_types:
  - 氏名
  - 生年月日
  - 性別
  - 住所
  - 電話番号
  - メールアドレス
  - クレジットカード情報（番号の一部・有効期限等）
  - 購入履歴
  - 保存データ（写真・文書等）
summary: 宝くじ公式サイトで利用者のパスワードが意図せず変更される事象を確認し、11月5日にサイトと公式アプリを停止したと公表した。11月13日の発表で、11月4日〜5日にリスト型攻撃とみられる手法で4,436名の会員アカウントに不正ログインされ、うち4,133名のパスワードが変更されたと明らかにした。氏名、生年月日、性別、住所、電話番号、メールアドレス、当せん金受取口座の情報（金融機関名、口座番号の上4桁、口座名義）、クレジットカード番号の下4桁、購入履歴、プロフィール画像が閲覧された可能性がある。サーバーへの侵入や不正な購入・当せん金の受取は確認されていない。全会員のパスワードをリセットし、13日に再開した。
sources:
  - title: 宝くじ公式サイト・公式アプリへの不正ログインについて（全国都道府県及び全指定都市）
    url: https://www.takarakuji-preliminary.jp/newsrelease_20261113.pdf
  - title: ITmedia NEWS 宝くじ公式サイトが一時停止、利用者のパスワードが「意図せず変更」
    url: https://www.itmedia.co.jp/news/article/2611/06/2000002943/
  - title: Impress Watch 宝くじ公式サイトに不正アクセス 4436アカウントに被害
    url: https://www.watch.impress.co.jp/docs/news/2156159.html
checklist:
  - text: 宝くじ公式サイトのパスワードを再設定し、登録情報が正しいか確認する
  - text: 同じメールアドレスとパスワードを使っている他のサービスのパスワードも変更する
