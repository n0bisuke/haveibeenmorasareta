root_cause: CLOMO MDMなどを運用するシステムが第三者の不正アクセスを受けた
summary: MDMサービス「CLOMO MDM」などを運用するシステムが第三者の不正アクセスを受け、顧客がCLOMO MDMに登録した情報の一部が外部に流出したと公表し、同日適時開示した。11月2日に不審なアクセスを検知し、確認したアクセス経路を遮断した。対象顧客には個別に連絡している。流出した情報の種類、件数、原因は調査中で、サービスは停止していない。
