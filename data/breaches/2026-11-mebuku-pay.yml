summary: 前橋市のデジタル地域通貨「めぶくPay」の決済処理を担う外部事業者のシステムが不正アクセスを受けたと11月14日に報告を受け、全サービスを停止したと公表した。11月17日の調査結果の報告で、加盟店7社の店舗情報（郵便番号・住所・電話番号）、振込先口座情報（銀行名・口座番号・口座名義人等）、担当者氏名に第三者による閲覧の記録が確認されたとした。利用者の電話番号・メールアドレスの漏えいや残高・取引記録の改ざんは確認されていない。
