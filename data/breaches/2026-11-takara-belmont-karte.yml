summary: 会員制オンラインストア「BEAUTY CITY」と理美容サロン向け発注サイト「TB WEB ORDER」のメール配信などに使っていた株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、利用者の情報の一部が外部に漏えいした可能性があると公表した。11月15日にプレイドからの連絡で把握した。漏えいの可能性があるのは、BEAUTY CITYの氏名、メールアドレス、生年月日、性別、年齢と、TB WEB ORDERのサロン名、メールアドレス。対象の範囲と件数は確認中。クレジットカード情報とログインパスワードはKARTEに連携しておらず、漏えいはないとしている。
