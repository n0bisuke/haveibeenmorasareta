industry: 人材・教育
country: JP
date_announced: 2026-11-18
affected_count: 60000
count_note: 会員60,000件（会員番号・年齢層など）。ほかにSchoo for Business管理ツールの管理者のメールアドレス27,088件と従業員情報の一部
cause: third_party
root_cause: 委託先プレイドの「KARTE」が不正アクセスを受け、連携していた会員・管理者の情報の一部が外部に漏えいした
vendor:
  name: 株式会社プレイド
data_types:
  - 会員ID
  - メールアドレス
  - 従業員情報
summary: 株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、同社がプレイドに預けていた顧客情報の一部が外部に漏えいしたと公表した。Schoo for Business管理ツールの管理者はメールアドレス27,088件、Schoo会員は会員番号、年齢層、メール受信設定の有無、キャンペーン管理用の番号の60,000件。ほかに従業員の氏名（姓）とメールアドレスの一部も含まれる。会員の情報は照合で個人を特定できる可能性があるため、個人情報の漏えいのおそれとして扱う。パスワードとクレジットカード情報は含まれない。
sources:
  - title: Schoo 当社が利用する外部サービスへの不正アクセスによるお客様情報漏えいに関するお詫びとお知らせ（PR TIMES）
    url: https://prtimes.jp/main/html/rd/p/000000385.000006391.html
checklist:
  - text: 管理者には11月18日から、対象の会員には特定でき次第、登録メールアドレスあてに連絡するとしている
  - text: 本件に便乗した不審なメールやSMSのURL・添付ファイルを開かず、パスワードやカード情報を入力しない
