summary: 「岩国市リモートワーク推進プログラム（リモっちょる？）」のWebサイト運営に使うクラウドサービス「Studio」の提供元から、クラウド環境への不正アクセスで情報が流出した可能性があると受託者を通じて報告を受け、申し込み・問い合わせフォームの利用者の情報が流出した可能性があると公表した。氏名、フリガナ、年代、住所、メールアドレス、電話番号、事業を知ったきっかけ、自由記入欄の内容が対象。第三者に取得された事実は確認されていない。
