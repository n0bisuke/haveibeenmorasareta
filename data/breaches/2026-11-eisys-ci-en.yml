cause: unauthorized_access
root_cause: システムの不備を突いた第三者の不正アクセスで、クリエイターの取引に関する個人情報が流出した可能性が高い
summary: 「DLsite」を運営するエイシスは、クリエイター支援サービス「Ci-en」で、利用するクリエイターの取引に関する個人情報が第三者による不正アクセスで外部に流出した可能性が高いと公表した。11月24日から緊急メンテナンスを行い、原因となったシステムの不備は修正したとしている。影響範囲は調査中で、個人情報保護委員会への報告を準備している。対象のクリエイターには関係する情報と注意事項を順次個別に連絡する。
