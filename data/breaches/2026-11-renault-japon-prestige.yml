summary: ルノーとアルピーヌのロードサービス業務を委託するプレステージ・コアソリューション（PCS）の業務システムが10月29日に不正アクセスを受け、ロードサービスに登録された顧客102,000名分の個人データが外部に持ち出されたと公表した。対象は氏名、住所、電話番号、メールアドレス、登録番号・車台番号などの車両情報、事故・故障の受付情報、一部の金融機関口座情報で、顧客により含まれる項目は異なる。11月2日にPCSから報告を受けた。原因と影響範囲はPCSが調査中。
