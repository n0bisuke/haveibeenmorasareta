summary: 全日本空輸経由で利用するアマデウスの旅客サービスシステムへの不正アクセス（2023年8月10日〜2026年9月23日）により、顧客約2,520人の予約情報が参照された形跡があると公表した。約2,480人は氏名・予約番号・搭乗日・区間・クラス、約40人はこれに加えて生年月日・性別・メールアドレス・電話番号・航空券番号・座席番号なども対象。クレジットカード情報とパスワードは含まれず、二次被害は確認されていない。11月4日に公表したメール配信システムの事案とは別。
