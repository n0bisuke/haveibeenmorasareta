industry: 小売・EC
country: JP
date_occurred: 2026-10-19
date_announced: 2026-10-23
affected_count: 402466
count_note: 過去に登録されたカード情報（下4桁・有効期限）約402,466件（名寄せ後）。うち約2,800名は決済ページの改ざんでカード番号全桁・セキュリティコードも対象。10月22日の一定期間の注文者7,673名は氏名・住所なども対象。いずれも可能性
cause: vulnerability
root_cause: 公式ショップのシステムの脆弱性を突かれ、管理情報を複数回不正に閲覧された
vuln_target: web_app
data_types:
  - 氏名
  - 住所
  - 電話番号
  - メールアドレス
  - 購入履歴
  - クレジットカード情報（番号の一部・有効期限等）
  - クレジットカード番号
  - クレジットカードのセキュリティコード
summary: フィギュアメーカーの公式オンラインショップのシステムの脆弱性を突かれ、10月19日〜22日に管理情報が複数回不正に閲覧されたと公表した。会員の氏名・住所・電話番号・メールアドレス、注文日・商品名・金額・配送先・決済方法、クレジットカードのブランド・番号の下4桁・有効期限が閲覧された可能性がある。カード名義、下4桁以外の番号、セキュリティコードは含まれない。公式ショップは閉鎖し、再開は未定。10月29日の第3報で、管理者権限を取得されて決済ページに不正なプログラムが置かれ、10月21日〜23日にカード情報を入力した約2,800名のカード番号全桁・有効期限・セキュリティコードが漏えいした可能性があると公表した。過去に登録されたカード約402,466件の下4桁と有効期限、10月22日の注文者7,673名の氏名・住所・電話番号・メールアドレス・注文内容も漏えいした可能性がある。
