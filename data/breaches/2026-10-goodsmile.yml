checklist:
  - text: 10月21日13時55分〜23日7時に公式ショップでカード情報を入力したか、カード利用明細の購入日で確認する
  - text: 該当する場合はカード会社に連絡し、カードの利用停止と再発行を依頼する（番号全桁とセキュリティコードが対象）
  - text: 過去に公式ショップでカードを登録していた人も、カードの利用明細に身に覚えのない請求がないか確認する
  - text: グッドスマイルカンパニーからの個別のメールを確認する（メール内のリンクではなく公式サイトを直接開く）
  - text: グッドスマイルや公的機関・カード会社を名乗るメール・SMS・電話には応じず、リンクを開かない
  - text: 同じメールアドレスとパスワードを他のサービスで使い回していれば変更する
  - text: 注文情報の対象（5,356名）の場合は、住所あての不審な郵便物や荷物にも注意する
