summary: メール配信サービスを手がけるアララへの不正アクセスにより、町のスマート申請システム利用者のメールアドレス166件が漏えいしたと公表した。対象は7月1日から10月31日に同システムからメールを受信した人のアドレスで、名前や住所、パスワードなどその他の情報の漏えいは確認されていない。安全性を確認したうえで、11月18日からログイン通知や利用者登録時の認証など一部の機能に限って再開した。
