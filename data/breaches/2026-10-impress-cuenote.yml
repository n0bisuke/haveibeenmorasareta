summary: メール配信に使っていたユミルリンクの「Cuenote」が不正アクセスを受け、メールマガジン「DIGITAL X News」の会員情報約58,000件が漏えいしたと公表した。10月27日に第一報、28日に第二報を出した。全会員の会員ID（ランダムな文字列）・メールアドレス・登録日と、一部の会員の氏名・会社名・都道府県・業種・職種・役職区分が対象。生年月日、勤務先住所の市区町村以下、電話番号、パスワード、決済情報は含まれない。
