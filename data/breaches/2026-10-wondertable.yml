summary: アルバイト採用の面接や契約締結などを委託する株式会社ApplyNowの採用管理サービスが第三者の不正アクセスを受け、同サービスで管理していた応募者の個人情報の一部が外部に流出したと公表した。ApplyNowは9月7日に不正アクセスを検知し、利用するデータ分析ツールの脆弱性が悪用されたことを確認した。流出した可能性がある情報は氏名、メールアドレス、電話番号、生年月日、性別、住所、職業などで、対象者によって異なる。ApplyNowが10月2日に対象者へメールで個別に通知した。
