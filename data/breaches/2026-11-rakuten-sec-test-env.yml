checklist:
  - text: 楽天証券からの個別の連絡が届いていないか確認する（楽天証券のメールには URL は書かれていない）
  - text: 楽天証券や関係会社を名乗るメール・SMS・電話・郵送物で URL を開いたり個人情報やログイン情報を答えたりしない
  - text: パスキー認証を設定し、必要ならログイン後のセキュリティ設定で取引や出金の一時停止を設定する
