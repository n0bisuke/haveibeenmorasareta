organization: 楽天証券株式会社
group: 楽天グループ
industry: 金融・保険
country: JP
date_occurred: 2026-11-11
date_announced: 2026-11-17
affected_count: 11980000
count_note: 11月24日の第2報で、ログインIDなどの漏えいは約1,198万口座に増加。このうち個人情報の漏えいは約441万件（口座あり約322万、口座未開設約119万）。預かり資産の残高情報は約168万件、申告された年収（選択番号）約1.4万件・金融資産（同）約271万件。退会した顧客を含む
cause: unauthorized_access
root_cause: テスト環境のシステム内で管理していた情報が不正アクセスで外部に漏えいしたおそれ。原因は調査中
data_types:
  - 会員ID
  - 氏名
  - 生年月日
  - 住所
  - 電話番号
  - メールアドレス
  - 口座番号
  - 資産・取引情報
  - 性別
summary: 11月16日に一部システムへの不正アクセスの可能性を検知して遮断し、調査の結果、11月11日にテスト環境のシステム内で管理していた情報が外部に漏えいしたおそれがあると公表した。部店・お客様コードとログインID（楽天IDとは別）が最大約1,125万口座、このうち最大約447万口座は氏名・カナ氏名・生年月日・住所・電話番号・メールアドレス・勤務先・出金先口座（金融機関・口座番号・名義人）・申告された年収と金融資産・商品別資産情報・最終ログイン日も対象。ログインに必要なパスワードや暗証番号の漏えい、本件による不正アクセス・不正取引は確認されていない。11月24日の第2報で、ログインIDなどの漏えいは約1,198万口座、個人情報の漏えいは約441万件とし、預かり資産の残高情報約168万件や性別・国籍・入金先口座なども含まれていたと公表した。
