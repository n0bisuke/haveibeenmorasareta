root_cause: 従業員のメールアカウントが第三者に不正アクセスされ、フィッシングサイトへ誘導するメールの送信に使われた。侵入経路は公表されていない
summary: 2026年9月24日、東洋紡せんいの従業員が利用するメールアカウントが第三者の不正アクセスを受け、同アカウントからグループ内外の関係者に約1,500件の不審なメールが送信されたことが確認された。メールには外部サイトへ誘導するPDFファイルが添付され、メールアドレス・ID・パスワードなどの認証情報の入力を求める内容だった。親会社の東洋紡が9月25日に公表し、東洋紡せんいも自社サイトに同趣旨のお詫びを掲載した。当該アカウントのパスワード変更や認証セッションの失効などを行い、保存されていたメールや連絡先情報へのアクセスログをもとに調べており、個人情報等の漏えいの有無も調査している。公表時点で基幹システムや業務システムへの不正アクセスは確認されていない。9月30日には東洋紡エムシーが、この不審メールを受信した同社従業員2名もフィッシング被害に遭い、メールアカウントに不正アクセスを受けていたと公表した。
