summary: 10月16日に不正アクセスを認識し、外部からのアクセスを制限した結果、一部のサービスが停止したと公表した。情報流出の有無は外部の専門機関と確認中で、個人情報保護委員会に第一報を提出した。10月26日の第2報で、会員情報データベースの最大約600万件（氏名・住所・電話番号・会員番号）、「ジョーシンのサブスク」の最大約23万件（会員番号・電話番号・手書きサイン・ログインIDと初期パスワード・請求履歴など）、リフォーム写真アップロードシステムの最大約800件（運転免許証画像2件、マイナンバーカード1件、口座番号5件を含む）の計最大約623万件が漏えいした可能性があると公表した。クレジットカード情報は保持していない。
