summary: ミツカングループのアジア事業（Mizkan Asia Pacific）のホームページで使う外部サービス「Studio」が9月30日〜10月1日に不正アクセスを受け、問い合わせフォームから連絡した顧客の氏名・メールアドレス・電話番号・会社名など最大355件が漏えいしたおそれがあると公表した。二次被害は確認されていない。10月9日公表のZENB会員の事案（委託先コミューン）とは別の事案。
