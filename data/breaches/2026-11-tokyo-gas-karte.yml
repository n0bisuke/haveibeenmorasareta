count_note: myTOKYOGASのハッシュ化された会員ID最大約30万件。ほかにmyTOKYOGASビジネス約820件、ウォーターサーバー申込者最大約4.9万件（氏名・連絡先など）。その他顧客の一部（年齢・性別・郵便番号等）の件数は調査中
cause: third_party
root_cause: 委託先プレイドの「KARTE」が不正アクセスを受け、連携していた顧客情報が流出した
