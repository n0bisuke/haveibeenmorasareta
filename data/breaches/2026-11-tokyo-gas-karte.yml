summary: 外部サービスを提供するプレイドの「KARTE」への不正アクセスにより、顧客情報の一部が流出したと公表した。myTOKYOGAS会員の一部のハッシュ化された会員ID最大約30万件とmyTOKYOGASビジネス会員の約820件、ウォーターサーバー申込者の氏名・メールアドレス・電話番号・性別・生年月日・居住都道府県・顧客管理番号の最大約4.9万件が対象。その他の顧客の一部の年齢・性別・郵便番号などは件数を調査中。二次被害は確認されていない。11月12日公表のアララ経由の流出とは別の事案。
