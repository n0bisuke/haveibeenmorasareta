summary: ポイント交換サービス「Gポイント」のシステムが外部から不正アクセスを受け、会員識別子最大約7万件が流出した可能性がある。氏名・住所・電話番号・メールアドレスは含まれないとしている。9月25日に異常を検知してシステムを停止し、原因と影響範囲を調査している。
