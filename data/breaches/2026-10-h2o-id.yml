summary: 阪急阪神百貨店と親会社のエイチ・ツー・オー リテイリングは、予約サイトや公式通販サイトなど3サイトが不正アクセスを受け、共通ID「H2O ID」の会員約126万件のID、氏名、性別、生年月日、メールアドレス、住所、電話番号が漏えいしたと公表した。10月16日に最初の異常を確認した。予約サイトを入口に顧客管理システムへ侵入されたとしている。クレジットカード番号の全桁とセキュリティコードは保持していない。通販サイトの注文履歴などの漏えいの有無は調査中。
