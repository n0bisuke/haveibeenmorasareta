summary: デジタル社債の業務委託先Securitize Japanのサーバーが不正アクセスを受け、応募者最大9,086人の氏名・住所・電話番号・メールアドレス・生年月日・性別などが漏えいした可能性があると公表した。うち54人分は銀行口座番号を含む可能性がある。自社システムからの漏えいと二次被害は確認されていない。
