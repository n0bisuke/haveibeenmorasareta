summary: 保育施設向けサービス「icuco book」「icuco touch&care」で、個人情報を含む一部のファイルが外部から閲覧可能な状態になっており、第三者のアクセスを確認したと公表した。11月7日に両サービスを緊急停止した。パスワードはハッシュ化して保存しており、利用者に変更の検討を依頼した。銀行口座情報の漏えいは確認されておらず、影響範囲は調査中。
