summary: 観光サイトの制作・運用を委託するトラベルジップが不正アクセスを受け、「TAITOおでかけナビ」の約5,500件の氏名・メールアドレス・電話番号・住所などと、大河ドラマ活用推進協議会のサイトの問い合わせ情報約120件が流出したと公表した。トラベルジップによると、飛騨高山や熱海市観光協会の観光サイトも影響を受け、全体で7,050件（重複を除き6,782件）にのぼる。
