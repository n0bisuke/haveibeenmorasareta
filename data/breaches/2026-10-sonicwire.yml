summary: 音源販売サイト「SONICWIRE」と関連サービス「D2R」が不正アクセスを受け、SONICWIRE会員最大約42万件の氏名、メールアドレス、ハッシュ化されたパスワード、住所（請求書などの発行時に入力した場合）が閲覧・取得された可能性があると公表した。10月17日に確認し、サーバーを停止した。クレジットカード情報は保存していない。全会員のパスワードを無効化した。
