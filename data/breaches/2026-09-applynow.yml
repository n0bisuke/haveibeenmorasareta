summary: 採用管理サービス「ApplyNow」への不正アクセスを9月に公表し、11月4日の調査結果で、社内のデータ分析ツールの公表済み脆弱性への修正が遅れ、接続元を制限していなかったことが原因と公表した。応募者・契約者・企業ユーザーの計396,920人の情報が漏えいし、一部にマイナンバー、口座情報、基礎年金番号などを含む。利用を終えた企業のデータも削除していなかった。富士市・吉野家HDなど利用企業も影響を公表している。
