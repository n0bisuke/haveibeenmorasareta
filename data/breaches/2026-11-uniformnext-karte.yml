summary: Web接客やメール配信に利用している株式会社プレイドの「KARTE」が第三者による不正アクセスを受け、連携していた顧客の登録情報の一部が外部に漏えいしたと公表した。対象はユニフォームネクストや同社運営のECサイト（フードユニフォーム、ワークユニフォーム、クリニックユニフォーム、オフィスユニフォーム）、ユニネクの利用者最大1,701,006件。漏えいしたのは会社名、氏名、メールアドレス、電話番号、郵便番号、職種、業種で、ログインパスワード、クレジットカード情報、金融機関口座情報、住所は含まれない。自社の基幹システムへの不正アクセスではないとした。
sources:
  - title: ユニフォームネクスト 【重要なお知らせとお詫び】外部委託先（KARTE）への不正アクセスに伴う個人情報漏えいについて
    url: https://www.uniformnext.com/info/20261118/
checklist:
  - text: 対象者には11月18日から info@uniform-next.net から個別にメールで連絡がある
  - text: 漏えいしたメールアドレス等を悪用したフィッシングや不審なSMSに注意する
