summary: 学術大会向けシステム「Confit」のオプション機能「発表データ収集公開機能」が11月12日に第三者の不正アクセスを受け、一部学術大会の演題名、発表者の氏名・所属・メールアドレス約1万件が外部に取得されたと公表した。影響を受けた学会は62。パスワード等の認証情報や身分証、クレジットカード情報は含まれない。
