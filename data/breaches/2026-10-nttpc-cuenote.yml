summary: 各種サービスのメール配信に使っていたユミルリンクの「Cuenote FC」が不正アクセスを受けた件で、10月20日にメールアドレス等の漏えいの可能性を、27日に続報を公表した。11月2日の第三報で、ユミルリンクから60,929件のメールアドレス等が漏えいしたと報告を受けたと公表した。対象はサービス利用者の連絡先メールアドレスと、メール本文への差し込み情報の一部（会社名・氏名・同社サービスに係る情報など）。クレジットカード情報とパスワードは含まれない。
