summary: 2020年8月に「統合型GIS導入事業」を委託した株式会社GIS北海道から、協力会社の有限会社リムゲートの開発端末が11月2日夜〜3日に情報窃取型マルウェア「K2F」に感染し、契約終了後も同端末に保存されていた個人情報が漏えいしたおそれがあると報告を受けたと公表した。対象は住民基本台帳データ最大71,002件（氏名・住所・性別・生年月日など）と、障害の区分や要介護度を含む要支援者データ最大4,503件。マイナンバーは含まれない。漏えいや不正利用の事実は確認されていないとしている。
