summary: 退職した元教員が2026年7月、海外出張で滞在していたドイツでノートパソコンを盗まれ、学生1,364人分の個人情報が流出した可能性があると公表した。元教員は理学部の講義を担当しており、2014〜2020年度に開講した「新入生セミナー」「代数学」などの受講者の氏名、所属、学年、性別、成績が対象。パソコンではクラウドサービスのDropboxを利用しており、データが保存されていたとしている。
