summary: 電子書籍ストア「コミックシーモア」と海外向け「MangaPlaza」で使っていた株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、連携していた顧客情報の一部が流出したと公表した。11月17日にプレイドの調査で確定した。コミックシーモアは最大約13万件で、ハッシュ化された会員番号、メールアドレス、ニックネーム、性別、生年月日、年齢層。MangaPlazaは最大約117万件で、ハッシュ化された会員番号、性別、Zipコード（米国のみ）、国名、生年月日、年齢。氏名、住所、クレジットカード情報、パスワードの流出はない。
sources:
  - title: NTTソルマーレ 業務委託先への不正アクセスによるお客様情報の流出に関するお詫びとお知らせ
    url: https://www.nttsolmare.com/press/2026/1118.html
checklist:
  - text: 流出が確認された顧客には対象のメールアドレスに個別に連絡するとしている
  - text: 本件に便乗した不審なメールやSMSのURL・添付ファイルを開かず、パスワードやカード情報を入力しない
