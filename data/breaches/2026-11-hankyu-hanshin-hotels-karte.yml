summary: 「阪急阪神第一ホテルグループメンバーズクラブ」の会員向けメール配信に使っていたプレイドのサービス「KARTE」が不正アクセスを受け、主に会員に関する情報が最大331,586件漏えいしたと公表した。11月15日にプレイドから報告を受けた。漏えいした項目は氏名、年齢、住所、電話番号、メールアドレスなどで、クレジットカード情報とパスポートデータは含まれていないとしている。退会済み会員の情報やホテルの利用実績が含まれている可能性があり、確認中としている。具体的な被害の報告は受けていない。
