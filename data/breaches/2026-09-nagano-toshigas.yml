root_cause: 委託先の両毛システムズがVPN機器のアカウントを悪用されて社内ネットワークに侵入され、ランサムウェア攻撃を受けた
vendor:
  name: 株式会社両毛システムズ
data_types:
  - 氏名
  - 住所
  - 電話番号
  - 契約情報
summary: 顧客情報の管理を委託している両毛システムズから、同社のネットワークへの不正アクセスによりサーバーに保管されていた顧客情報が流出した可能性があるとの報告を9月24日に受け、9月28日に公表した。10月5日の第二報で、対象は2026年4月1日〜5月16日に実施した保安調査の結果約3,600件で、項目は氏名・住所・電話番号・契約番号だと公表した。金融機関の口座番号やクレジットカード情報は含まれず、現時点で二次被害は確認されていない。両毛システムズは、8月12日にVPN機器のアカウントを悪用されて社内ネットワークに侵入され、外部専門機関の調査でランサムウェア攻撃だったと確認したと公表している。
