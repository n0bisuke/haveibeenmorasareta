summary: 配送業務を委託するオープンロジのシステムが外部から不正アクセスを受け、出荷データが持ち出されたとの報告を11月10日に受けたと公表した。2026年4月8日から11月8日に依頼した出荷データの届け先の氏名、住所、電話番号、メールアドレスが漏えいした可能性がある。クレジットカード情報は含まれない。同じ告知で、チケット販売の委託先アソビューのアララ経由の事案の影響も知らせた。
