organization: 株式会社永和システムマネジメント
industry: IT・通信
country: JP
date_occurred: 2026-09-30
date_announced: 2026-10-16
affected_count: 4480
count_note: 延べ4,480件（送信件数で人数とは一致しない場合がある）。10月23日の第二報で公表
cause: third_party
root_cause: Webサイト制作に使うStudioのクラウド環境の一部機能の脆弱性を悪用され、フォームに送信された内容などが外部から取得できる状態になった
vendor:
  name: Studio株式会社
data_types:
  - 氏名
  - メールアドレス
  - 電話番号
  - 問い合わせ内容
summary: Webサイトの作成に使っていたStudioが不正アクセスを受け、esm.co.jpなど5つのWebサイトの問い合わせフォームなどの情報が流出した可能性があると10月16日に公表し、23日の第二報で対象を延べ4,480件とした。対象は氏名、会社名、メールアドレス、電話番号、問い合わせ内容などで、添付ファイルはファイル名のみ。実際の取得や二次被害は確認されていない。個人情報保護委員会への報告はStudioと連携して進めている。
sources:
  - title: 永和システムマネジメント 弊社利用のWebサイト作成サービス「Studio」における不正アクセスおよびお客様情報流出の可能性に関するお詫びとお知らせ（第二報）
    url: https://esm.co.jp/news/security-notice-studio-202610
