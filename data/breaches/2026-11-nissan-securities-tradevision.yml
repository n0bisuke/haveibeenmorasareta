summary: 親会社の日産証券グループ株式会社が、連結子会社の日産証券株式会社の外部委託先である株式会社トレードビジョンの商品デリバティブ取引システムで、一部のスマートフォン向けアプリと管理者用プログラムに第三者の不正アクセスがあったと公表した。対面取引の顧客93名について、部支店コード、お客様コード、お客様名、注文情報（商品、売買区分、枚数、指値等の値段）計172件の漏えいが判明した。データベースサーバーへの不正アクセスは防いでおり、住所や電話番号、取引銀行などを取得された痕跡は確認されていないとしている。
