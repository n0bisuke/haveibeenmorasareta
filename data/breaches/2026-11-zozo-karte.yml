count_note: 延べ約2,918万人分（同社説明）。ZOZOTOWN 会員（退会者含む）約1,518万人（会員ID・年齢・性別・郵便番号。うち約4.7万人はログイン名・メールアドレス・電話番号も）、WEAR by ZOZO 会員約1,393万人（会員ID・年齢・性別）、ZOZOTOWN 出店ブランド担当者約2.4万人（会員ID・企業名・氏名）
