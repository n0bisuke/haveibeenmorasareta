summary: サイト・アプリ上での情報発信やキャンペーンに使っていたプレイドの「KARTE」が不正アクセスを受け、同サービス上で管理していた顧客情報などの一部が漏えいしたと公表した。対象はZOZOTOWN会員（退会者含む）約1,518万人の会員ID・年齢・性別・郵便番号（うち約4.7万人はログイン名・メールアドレス・電話番号も）、WEAR by ZOZO会員約1,393万人の会員ID・年齢・性別、出店ブランド担当者約2.4万人の会員ID・企業名・氏名で、延べ約2,918万人分。パスワードはKARTE上で管理しておらず、クレジットカード情報の漏えいは確認されていない。
