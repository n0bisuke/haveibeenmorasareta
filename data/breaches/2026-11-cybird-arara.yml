summary: 株式会社サイバードは、利用するアララ株式会社のメール配信サービスで第三者による不正アクセスが発生し、同社が提供する一部サービスに関連するメールアドレス98,738件が外部に流出したと公表した。アララから報告を受けている流出情報はメールアドレスのみで、流出対象のサービスと顧客は特定できていないとしている。流出したメールアドレスが不審なメールに悪用される可能性があるとして注意を呼びかけた。
