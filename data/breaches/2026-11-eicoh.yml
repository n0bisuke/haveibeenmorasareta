summary: 11月9日、一部のシステムが第三者による不正アクセスを受け、ランサムウェアによる被害が発生したことを確認したと公表した。関係機関や専門家と連携して被害状況の調査と復旧を進めており、情報の外部流出の有無や影響範囲は調査中としている。同社を装ったメールなどが送られる可能性があるとして、メールで振込先の変更を依頼することはないと顧客・取引先に注意を呼びかけた。
