summary: 「北上市オンライン申請システム」と「北上市マイナンバーカード交付予約」が利用するアララの外部メール送信サービスが第三者の不正アクセスを受け、メールアドレスが漏えいした可能性があると11月5日に公表し、20日に107件の漏えいを確認したと公表した。対象は7月1日から10月31日に利用者登録、パスワード変更、ログイン、申請などに伴うメールを受信したアドレスで、氏名、住所、マイナンバーなどは漏えいしていない。交付予約は11月10日に別のメール送信サービスに切り替えて再開した。
