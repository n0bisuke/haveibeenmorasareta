summary: Web接客やメール配信に使っていた株式会社プレイドの「KARTE」で第三者による不正アクセスが発生し、顧客情報が漏えいしたとプレイドから報告を受けたと公表した。報告を受けている漏えい情報は、一部の顧客の顧客ID、メールアドレス、電話番号。件数は公表していない。クレジットカード情報や銀行口座情報などの決済情報と、本人確認書類に関する情報はプレイドに提供していないとしている。
