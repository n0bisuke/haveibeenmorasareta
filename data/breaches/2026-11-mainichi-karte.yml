summary: 「毎日新聞デジタル」のニュースアプリで利用している株式会社プレイドの「KARTE」が不正アクセスを受け、会員約14万人分の姓（名字）のほか、会員によっては年齢、契約プラン名、まいにちポイントくらぶのID、メールアドレスが漏えいしたと公表した。ログインパスワード、クレジットカードなどの決済情報、生年月日、住所、電話番号はKARTEに連携していない。11月13日にKARTEへのデータ連携とアプリの通知機能の一部を停止した。
