summary: 生産者とバイヤーをつなぐオンライン商談サイト「とやま食材マッチング」で使っていたメール配信システム「ブラストメール」が不正アクセスを受け、登録者290件の情報が漏えいしたおそれがあると公表した。 11月12日、運営会社と外部専門機関の調査が完了し、情報漏洩や個人情報等の不正閲覧を示す事実は確認されなかったと公表した。
