summary: 10月13日朝から夜にかけて「ミズノ公式オンライン」など公式サイトが停止した。当初はサーバー障害として、サイバー攻撃の可能性を含めて調査するとしていたが、原因は外部からの不正アクセスだったと明らかにした。13日夜に復旧し、個人情報の流出がないことと、サイトの安全性を確認したとしている。
