summary: 経済動画配信サービス「テレ東BIZ」のメール配信業務等を委託している株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、同サービスに登録されていた会員らの個人情報の一部が外部に漏えいした可能性があると公表した。対象は「テレビ東京ID」の登録者（現会員、解約者、メルマガ会員等）の氏名、メールアドレス、ユーザーID、視聴履歴などで、ほかに氏名等と結びつかない形で生年月日と性別も含まれる。ログインパスワード、クレジットカード情報、銀行口座情報は含まれない。件数はプレイドが精査中。
