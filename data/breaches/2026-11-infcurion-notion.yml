summary: 社内で利用するNotionのAI機能の処理委託先である米Fireworks AIのシステムが不正アクセスを受け、2026年10月5日〜24日にNotion AIへ入力した内容と回答の一部が流出し、取引先担当者・採用応募者・従業員の氏名、電話番号、メールアドレスなど個人情報232件が漏えいしたと公表した。11月18日に適時開示した。公表時点で情報の悪用は確認されていない。
