organization: クリエイト株式会社
services:
  - WEBダウンロードシステム
industry: 建設
country: JP
date_occurred: 2026-11-08
date_announced: 2026-11-25
affected_count: 2764
count_note: 取引先と同社従業員の合計
cause: unauthorized_access
root_cause: 納品書・請求書ダウンロードサイトの環境設定ファイルに不正アクセスされ本番DBに接続された
data_types:
  - 取引先情報
  - 従業員情報
  - メールアドレス
  - パスワード（ハッシュ化・暗号化済み）
  - 会員ID
summary: 納品書・請求書のダウンロードサイト「WEBダウンロードシステム」が不正アクセスを受け、取引先と従業員計2,764名の会社名、メールアドレス、パスワード、システムIDが漏えいしたと公表した。11月8日に第三者が環境設定ファイルを通じて本番データベースに接続した痕跡があり、20日に開発会社からの連絡で把握した。パスワードは暗号化されていたが解読された可能性が高い。請求書・納品書のPDF本体の抜き出しは確認されていない。旧環境を破棄し、22日から新環境で運用を再開した。
sources:
  - title: クリエイトの請求書ダウンロードサイトに不正アクセス 2,764名分漏えい（株式会社アクト）
    url: https://act1.co.jp/2026-11-26-09/
checklist:
  - text: 次回ログイン時にパスワードを再設定する
  - text: 同じID・パスワードを他のサービスで使っていれば変更する
  - text: クリエイトを装った請求書や振込先変更の連絡に注意する
