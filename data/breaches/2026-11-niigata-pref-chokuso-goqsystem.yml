summary: 県が株式会社クーネルワークに管理運営を委託する楽天市場内の「新潟県公式ショップ 新潟直送計画」で、同社が使う受注管理システム「GoQSystem」が不正アクセスを受け、注文情報が外部に持ち出されたと公表した。注文者とお届け先の氏名、住所、電話番号、注文内容が漏えいした可能性があり、対象者は現時点で3,457人。クレジットカード情報は含まれていない。GoQSystem社が侵入経路を遮断し、影響範囲を調査している。
