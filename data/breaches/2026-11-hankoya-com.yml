organization: 株式会社ハンコヤドットコム
services:
  - ハンコヤドットコム
industry: 小売・EC
country: JP
date_announced: 2026-11-16
affected_count: 8220
count_note: クレジットカード情報8,220件（2026年10月13日〜11月12日にパソコンからカード決済した顧客）。会員・注文者の個人情報の件数は確認中
cause: unauthorized_access
root_cause: 不正アクセスで決済画面が改ざんされ、入力されたカード情報が外部へ送信される状態になっていた
attack_methods:
  - web_skimming
data_types:
  - クレジットカード番号
  - クレジットカードのセキュリティコード
  - クレジットカード情報（番号の一部・有効期限等）
  - 氏名
  - 住所
  - 電話番号
  - メールアドレス
  - 生年月日
  - 性別
  - 会員ID
  - 購入履歴
  - パスワード（ハッシュ化・暗号化済み）
summary: 印鑑通販サイト「ハンコヤドットコム」が第三者の不正アクセスを受けたと11月16日に公表し、19日の第2報でクレジットカード情報8,220件を含む個人情報が漏えいした可能性があると公表した。決済画面が改ざんされ、10月13日から11月12日にパソコンからカード決済した顧客のカード名義人・番号・有効期限・セキュリティコードが外部へ送信される状態になっていた。会員登録者や注文者の氏名、住所、電話番号、メールアドレス、生年月日、会社名、ログインID、注文内容、ハッシュ化されたパスワード、性別も対象で、件数は確認中。11月12日に不正アクセスを確認して全サービスを停止した。印影データの漏えいは確認されていない。
