summary: 子会社のDCMがグループ共通会員サービス「マイボ」のメール配信に使っていたユミルリンクの「Cuenote FC」が不正アクセスを受け、会員の個人情報が漏えいしたと公表した。10月26日にユミルリンクから漏えいの可能性の報告を受けて27日に第1報を出し、29日に利用環境のデータが外部に持ち出されたとの報告を受けた。対象はメールアドレスを登録した会員753,272人で、メールアドレス・会員ID・氏名・性別・生年月・居住都道府県が含まれる。パスワード、クレジットカード情報、ポイント残高や利用履歴は含まれない。10月13日に公表したマイボの会員情報管理システムへの不正アクセスとは別の事案としている。個人情報保護委員会に報告した。
