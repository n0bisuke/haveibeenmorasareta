summary: お客さま専用マイページ「MyAXA」で11月9日に不審なアクセスを確認し、第三者が本来アクセス権限のない顧客情報にアクセスしたと公表した。対象は約59万7千件で、氏名・住所・生年月日・メールアドレス・電話番号が漏洩した可能性がある。クレジットカード情報は含まれない。ロードサービス業務の委託先プレステージ・コアソリューションへの不正アクセスでも顧客情報の一部が持ち出されたとの報告を受けており、範囲は調査中。
