summary: 県立高校の修学旅行中に、担任教員がJR新横浜駅で生徒の名簿や写真を撮ったタブレットなどが入ったリュックサックを紛失し、2年生226人全員の氏名や保護者の連絡先などの個人情報が流出した可能性があると広島県教育委員会が発表した。一部の生徒の病気・受診歴の資料も入っていたと報じられている。警察に届け出たが見つかっておらず、被害は確認されていない。
