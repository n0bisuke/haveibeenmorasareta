summary: マツダは2026年10月14日、コミュニティーサイト「クラブマツダコミュニティ」の会員情報が流出した可能性を公表した。4103人の氏名とメールアドレスが第三者に閲覧・取得された恐れがあるとし、サイト運営を委託しているコミューンが不正アクセスを受けたことが原因とされている。
