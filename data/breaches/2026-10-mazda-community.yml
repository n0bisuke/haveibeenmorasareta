summary: 会員向けコミュニティサイト「CLUB MAZDA COMMUNITY」で、運営を委託するコミューン株式会社の「Commune」が不正アクセスを受け、会員と運営を担当する従業員の最大4,103名分の情報が閲覧・取得された可能性があると公表した。対象はメールアドレス、会員ID、居住地（都道府県）、購買・利用状況の履歴、趣味・嗜好、アンケートの回答などで、クレジットカード情報は含まない。
