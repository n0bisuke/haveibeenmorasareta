summary: メール配信業務を委託したギフトパッドが利用するアララのメール配信サービスが第三者の不正アクセスを受け、個人株主のメールアドレス1,741件が外部に漏えいしたと公表した。対象は2026年6月の定時株主総会でインターネットにより議決権を行使し、電子ギフトに当選した個人株主。氏名・住所・株主番号等の漏えいはない。
