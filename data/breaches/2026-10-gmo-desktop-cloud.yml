count_note: 影響の可能性があるのは最大26,739サーバー（被害を確認した件数ではない）。外部への持ち出しは確認されたが、情報の種類と件数は調査中
cause: unauthorized_access
summary: FX自動売買向けのVPS「お名前.com デスクトップクラウド」で、10月20日に一部の利用者のサーバー環境に不正なプログラムが置かれているのを確認し、サーバー内に保管された情報が閲覧された可能性があると公表した。影響の可能性があるのは最大2万6,739サーバーで、全プランを停止した。10月24日の第4報で、システムにセキュリティ上の問題があり、顧客の情報が外部に持ち出されたことを確認したと公表した。サーバー内に保存されたFXなどの取引口座のログイン情報が不正に使われた可能性があり、一部の顧客から身に覚えのない取引の報告を受けている。全利用者に見舞金5,000円を支払い、不正アクセスに起因すると認めた取引の損失を補償する。
