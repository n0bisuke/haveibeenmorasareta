summary: FX自動売買向けのVPS「お名前.com デスクトップクラウド」で、10月20日に一部の利用者のサーバー環境に不正なプログラムが置かれているのを確認し、サーバー内に保管された情報が閲覧された可能性があると公表した。影響の可能性があるのは最大2万6,739サーバーで、全プランを停止した。預かっている個人情報の漏えいは確認されていない。
