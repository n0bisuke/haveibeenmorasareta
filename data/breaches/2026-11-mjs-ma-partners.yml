count_note: 最大数千社（クライアント）分の取引先情報（一部に個人情報を含む）。可能性の上限で詳細は調査中。役職員の認証情報の一部は取得されたことを確認
cause: unauthorized_access
root_cause: ファイアウォール機器に第三者が作成したとみられる管理者アカウントが設定され、役職員の認証情報の一部が取得された
attack_methods:
  - network_device
data_types:
  - 取引先情報
  - 従業員情報
summary: ミロク情報サービス（MJS）は、子会社の株式会社MJS M&Aパートナーズの社内ネットワークが第三者による不正アクセスを受けたと公表した。11月6日に従業員がファイアウォール機器に不審な管理者アカウントなどを見つけ、役職員が外部からアクセスする際の認証情報の一部が取得されたことを確認した。M&Aの検討・支援のために預かった最大数千社分の取引先情報（一部に個人情報を含む）について、一部期間の記録が残っておらず漏えいの可能性を否定できないとしている。要配慮個人情報、カード情報、口座のパスワードは保有していない。11月12日に個人情報保護委員会へ速報した。
