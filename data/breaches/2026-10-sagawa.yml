organization: 佐川急便株式会社
services:
  - お荷物問い合わせサービス
industry: 物流
country: JP
date_announced: 2026-10-01
affected_count: 53230000
count_note: 最大約5,323万件（重複を含む。実人数や外部流出を確認した件数ではない。名寄せ中で今後変わる可能性あり）
cause: unauthorized_access
data_types:
  - 氏名
  - 住所
  - 電話番号
  - 契約情報
summary: Webサイトの「お荷物問い合わせサービス」への不正アクセスにより、荷物の送り主と宛先の氏名・住所・電話番号が流出した可能性があると公表し、サービスの一部を停止した。10月23日の第5報で、流出の可能性があるのは2026年6月21日〜9月30日の送り状データ、運賃契約者の顧客リスト、「スマートクラブ」の会員情報の計最大約5,323万件（重複を含む）と公表した。クレジットカード情報とパスワードは含まれず、二次被害は確認されていない。同日にお荷物問い合わせサービスを再開した。
