organization: 株式会社WOW WORLD
industry: IT・通信
country: JP
date_occurred: 2026-11-07
date_announced: 2026-11-20
affected_count: 49000
count_note: 延べ約49,000件（クライアント企業4社分、重複を含む可能性あり）。11月20日15時時点。今後変わる可能性あり
cause: unauthorized_access
root_cause: サービス運用に使う一部サーバーが外部の第三者に不正アクセスされ、保存されていたクライアント企業の情報が持ち出された
data_types:
  - メールアドレス
summary: メール配信システムなどを提供する同社は、サービスの運用に使う一部サーバーが外部の第三者から不正アクセスを受け、保存されていたクライアント企業の情報の一部が外部に持ち出されたと公表した。漏えいが確認されたクライアント企業は4社、件数は延べ約49,000件で、対象はメールアドレス等（項目は企業ごとに異なる）。クレジットカード情報とマイナンバーは含まれていない。侵入経路と影響範囲は調査中で、関係機関に報告したとしている。
sources:
