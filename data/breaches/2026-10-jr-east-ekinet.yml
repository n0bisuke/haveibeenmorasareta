summary: 会員にメールを送るために使っていた外部サービスが、IDCフロンティアのクラウドサービスへの不正アクセスの影響を受け、保存していた会員情報が第三者に閲覧・取得された可能性があると公表した。えきねっとはメールアドレスのみ、大人の休日倶楽部はメールアドレス・会員番号・クレジットカードの有効期限・生年月日が対象。氏名・住所・電話番号・クレジットカード番号は含まれない。対象の利用者には個別にメールで連絡する。10月15日、委託先からの報告として、個人情報の漏えいの事実は確認されなかったと発表した。
