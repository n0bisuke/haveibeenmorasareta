summary: SPWNの商品の出荷・配送を委託するオープンロジが11月8日〜9日に第三者の不正アクセスを受け、お届け先情報が外部に流出した可能性があると公表した。対象は2026年4月8日〜11月8日に同社がオープンロジへ出荷を依頼した注文の購入者と届け先で、氏名、住所、電話番号、登録されている場合のメールアドレス、商品名・数量。チケットやデジタルコンテンツのみの購入者は対象外。SPWNのシステムへの侵入はなく、ログインパスワードとクレジットカード情報は含まない。
