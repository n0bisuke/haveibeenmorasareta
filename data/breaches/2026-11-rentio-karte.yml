summary: サイト上のおすすめ表示やメールマガジンの配信に使っていた株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、KARTEに連携していた顧客情報の一部が漏えいしたと公表した。対象はレンティオ会員の一部で件数は精査中、漏えいした項目は会員識別用のIDと同社からのおすすめ商品。氏名、メールアドレス、住所、電話番号、クレジットカード情報、パスワードは含まれず、IDだけでは個人を特定できないため二次被害のおそれは低いとしている。サイトと同社システムへの不正アクセスは確認されていない。
sources:
