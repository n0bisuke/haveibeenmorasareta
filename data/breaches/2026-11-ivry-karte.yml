summary: Webサイトとサービスでマーケティング・顧客管理ツールとして使っていた株式会社プレイドの「KARTE」が不正アクセスを受け、KARTEに連携していた顧客の情報の一部が外部に漏えいした可能性があると公表した。漏えいの可能性があるのは、契約企業の担当者の氏名、メールアドレス、電話番号などと、Webサイト・管理画面・アプリの利用状況などに関する情報。件数は公表していない。同社のシステムと対話AIサービス「アイブリー」への不正アクセスは確認されていないとしている。
sources:
