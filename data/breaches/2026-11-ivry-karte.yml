    url: https://ivry.jp/corporate/news/ple8g1uck/
checklist:
  - text: 連絡が必要な顧客には情報が確定次第、順次連絡するとしている
  - text: 同社はパスワードなどの認証情報やカード情報をメールや電話で尋ねることはないとしている。同社を装った不審な連絡に注意する
