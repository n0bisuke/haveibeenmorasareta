count_note: 防犯情報メールマガジンのメールアドレス約26,000件（漏えいの可能性）。市営住宅の募集情報メールは件数確認中
cause: third_party
root_cause: メール配信サービス「ブラストメール」を運営するラクスライトクラウドが不正アクセスを受け、登録していた配信先情報が持ち出された
vendor:
  name: 株式会社ラクスライトクラウド
data_types:
  - メールアドレス
summary: 市が使う情報配信システムの提供元ラクスライトクラウドのシステムが不正アクセスを受け、登録されている情報が漏えいした可能性があると10月22日に公表した。対象は岡崎市防犯情報メールマガジンのメールアドレス約26,000件と、市営住宅の募集情報メール配信サービスのメールアドレス（件数確認中）。提供元は契約者の情報が漏えいし、一部の契約者では配信に関する情報も漏えいしたと報告している。対象者には提供元から順次連絡する予定。
