summary: スターツ出版が運営する「オズモール」で海外からの大量の不正アクセスを検知した。会員と一部の退会者の最大44万2,779名分のメールアドレスと、一部会員の氏名・住所（都道府県まで）が閲覧された可能性がある。原因となった脆弱性への対策を実施した。クレジットカード情報は外部の決済システムで扱っており含まれない。
