summary: JR九州は、ソフトバンク子会社IDCフロンティアが提供するクラウドサービスへの不正アクセスにより、最大約130万件のウェブ会員メールアドレスが漏えいした可能性があると発表した。氏名や住所、電話番号、クレジットカード番号などの他の個人情報は漏えいしていないとされている。
