summary: 旅行予約サイト「小田急トラベル」は、アララ株式会社で発生した不正アクセスにより、会員のメールアドレス63,006件が漏えいしたと公表した。対象は10月8日から29日に「小田急トラベル」または「小田急旅のサポートセンター」から、箱根フリーパスやロマンスカーの案内、キャンペーンなど特定の件名のメールを受信したアドレス。報道によると、メールアドレス以外の情報は含まれず、予約完了などのメールは別の配信サービスを使っているため対象外という。
