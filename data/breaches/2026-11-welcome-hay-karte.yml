organization: 株式会社ウェルカム
services:
  - HAYオンラインストア
industry: 小売・EC
country: JP
date_announced: 2026-11-18
affected_count: 9890
count_note: 2023年3月10日〜2025年6月30日にHAYオンラインストアを利用した顧客の一部で最大9,890件。実際の漏洩件数は調査中
cause: third_party
root_cause: 2025年6月に契約を終えた「KARTE」に残っていたデータが、プレイドへの不正アクセスで漏洩した
vendor:
  name: 株式会社プレイド
data_types:
  - 氏名
  - メールアドレス
  - 会員ID
summary: 過去に利用していた株式会社プレイドの外部サービス「KARTE」が第三者の不正アクセスを受け、HAYオンラインストアの顧客の個人情報の一部が外部に漏洩したと公表した。11月15日にプレイドから報告を受けた。同社は2025年6月末に契約を終えて連携を停止していたが、解約後90日以内に削除するとの規約に反して一部データが残っていた。対象は2023年3月10日〜2025年6月30日にストアを利用した顧客の一部で最大9,890件、情報は氏名、メールアドレス、会員ID。クレジットカード情報、パスワード、住所、電話番号、注文情報は含まれない。
sources:
  - title: HAYオンラインストア 【重要】お客さまサービス（KARTE）における個人情報漏洩に関するお詫びとお知らせ
    url: https://www.hay-japan.com/topics_detail.html?info_id=8782
checklist:
  - text: 漏洩の対象となった顧客には順次案内するとしている
  - text: ウェルカムや関係事業者を装った不審なメール・SMSのURLを開かず、個人情報や決済情報を入力しない
