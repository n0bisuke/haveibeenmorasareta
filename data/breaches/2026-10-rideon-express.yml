summary: 宅配の「銀のさら」「釜寅」「すし上等」の公式サイト・公式アプリの登録者情報が、最大約650万件漏えいした可能性があると公表した。10月5日以降に不審なアクセスを検知し、7日早朝にサーバー障害が発生、サーバー運営会社からランサムウェア攻撃を受けたと報告を受けた。対象は氏名、住所、電話番号、メールアドレス、生年月日、性別、パスワードのハッシュ値、注文履歴などで、クレジットカード情報は保有していない。同社は委託先の社名を公表していないが、時事通信などはIDCフロンティアへの不正アクセスが原因と報じている。
