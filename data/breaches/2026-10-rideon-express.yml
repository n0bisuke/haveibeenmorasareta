summary: ライドオンエクスプレスホールディングスは、同社が提供する『銀のさら』『釜寅』『すし上等』の公式アプリに登録された利用者情報が最大約650万件漏えいした可能性があると発表した。漏えいしたとされる情報は氏名、住所、電話番号、メールアドレス、性別、生年月日、注文履歴、デリポイント会員ID、パスワードのハッシュ値で、クレジットカード情報は含まれない。二次被害は確認されておらず、同社は不審なメールへの対応を控えるよう呼びかけている。
