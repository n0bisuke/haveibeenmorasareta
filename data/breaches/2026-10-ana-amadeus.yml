  name: Amadeus IT Group
summary: 旅客サービスシステムの委託先アマデウスのシステムが不正アクセスを受け、ANA便の予約情報の一部が外部から参照された形跡があると公表した。件数と範囲は精査中で、判明次第公表し対象者に通知するとしている。同じ委託先の件はJAL・JTAも公表している。10月30日の続報で、約37,800人の予約情報が参照された形跡があり、約36,100人は氏名・予約番号・搭乗日・区間・クラス、約1,700人はこれに加えてパスポート番号・国籍・メールアドレス・電話番号・マイレージ番号も対象だと公表した。クレジットカード情報とパスワードは含まれない。
