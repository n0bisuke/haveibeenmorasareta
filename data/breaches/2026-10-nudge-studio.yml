summary: コーポレートサイトの運営に使っていたStudioが不正アクセスを受け、提携・事業・メディア取材の問い合わせフォームと採用応募フォームに送信された最大5,695件の情報が流出した可能性があると公表した。対象は氏名、会社名、メールアドレス、電話番号、所在地、問い合わせ内容で、採用応募フォームは参考URLや履歴書などの添付ファイルも含む。実際の取得や不正利用などの二次被害は確認されていない。
