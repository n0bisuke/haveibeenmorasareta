summary: 職員採用試験で利用した株式会社ApplyNowの録画面接システムが第三者の不正アクセスを受け、令和4年2月から令和8年6月の応募者672件の氏名、メールアドレス、電話番号、生年月日、性別、受験番号と、市のユーザー登録情報（ユーザー名・パスワード・メールアドレス・権限情報）が漏えいしたと公表した。二次被害は確認されていない。
