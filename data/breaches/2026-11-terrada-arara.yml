summary: 寺田倉庫は、委託先のアララ株式会社のメール配信サービスが不正アクセスを受けた件で、11月10日の第2報で、アララから報告を受けたメールアドレス1,086,662件（重複を除く）のうち自社の顧客のものが最大99,296件と判明したと公表した。対象はTERRADA ID、TERRADA ART STORAGE、TERRADA WINE、TERRADAトランクルーム、minikura、WHAT CAFEなどのサービスで、流出したのはメールアドレス。自社のメール配信サービス利用期間は2025年6月25日から2026年10月31日。漏えいしたアドレスに不審メールが届く可能性があるとして注意を呼びかけた。
