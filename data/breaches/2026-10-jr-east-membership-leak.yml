summary: JR東日本は、10月9日に「えきねっと」と「大人の休日倶楽部」の会員情報が漏えいした可能性があると発表した。IDCフロンティアでの不正アクセスにより、約206万件の会員のメールアドレスや会員番号、クレジットカード有効期限、生年月日が閲覧・取得された可能性がある。氏名・住所・電話番号・クレジットカード番号などは漏えいしていないとされている。
