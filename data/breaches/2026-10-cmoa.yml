summary: 電子書籍サービス「コミックシーモア」の会員情報を管理するシステムが第三者による不正アクセスを受けたとして、10月15日にサービスを緊急停止し、16日に会員情報の流出を発表した。流出したのはメールアドレス、ハッシュ化したパスワード、生年月日、性別、ニックネームで、クレジットカード情報と購入履歴の流出は確認されていない。再開時に会員全員にパスワードの再設定を求めるとしている。
