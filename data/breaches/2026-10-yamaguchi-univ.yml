summary: 教職員1名のメールアカウントがフィッシングで乗っ取られ、連絡先に登録されていた学内外のメールアドレス967件（うち631件は氏名付き）が第三者に取得されたと公表した。教職員が偽サイトにIDとパスワードを入力したことが原因で、8月26日にそのアカウントから463件の宛先へ不審メールが送られた。ほかの不審な操作は確認されていないとした。
