summary: 事業者向けデスクリサーチツール「DS.INSIGHT」のコミュニティ機能「DS.LAB」で、委託先のコミューン株式会社が提供する「Commune」のシステムの不備を第三者に悪用されたと公表した。利用者1,750名の氏名、メールアドレス、ニックネーム、アカウント名、自己紹介、所属グループ、ポイント、最終アクティブ日時などが閲覧・取得された可能性がある。自社システムへの不正アクセスや二次被害は確認されていない。
