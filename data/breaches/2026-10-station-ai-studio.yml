summary: Webサイトで利用する「Studio」の提供元Studio社から10月16日に、不正アクセスによりフォームの送信内容と外部サービスの認証情報が流出した可能性があると通知を受けたと公表した。対象は「SKIP Focus」「Physical AI」と2024年12月に閉鎖した開業前のお問い合わせフォームに送信された氏名、会社名、メールアドレス、電話番号、問い合わせ内容など。実際の流出の有無は確認できていない。該当フォームの受付を停止し、外部サービスとの連携を解除した。
