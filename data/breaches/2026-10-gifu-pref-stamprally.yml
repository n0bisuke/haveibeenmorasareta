summary: 県が岐阜新聞社に委託したデジタルスタンプラリーで、データ管理を再委託された株式会社palanのデータ分析ツールが8月9日から10月21日にかけて不正アクセスを受け、参加者1,135人のメールアドレス・年齢層・性別・居住市町村が漏えいしたと公表した。氏名・住所・電話番号は含まれない。県は委託終了時に破棄証明書を受け取っていたが、palanにデータが残っていた。
