summary: 求人情報サイト「バイトル」「バイトルNEXT」が第三者から不正アクセスを受け、会員のメールアドレスが最大388万5,771件漏えいしたおそれがあると公表した。原因はシステムの一部機能における仕様の不備を突いた海外からの不正アクセスで、10月6日に確認した。海外からのアクセスをすべて遮断してプログラムを改修し、監視体制を強化した。漏えいのおそれがあるのはメールアドレスのみで、氏名・電話番号・パスワード・クレジットカード情報などは含まれないとしている。対象の会員には順次メールなどで案内している。
