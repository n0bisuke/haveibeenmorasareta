organization: 株式会社良品計画
services:
  - MUJIアプリ
industry: 小売・EC
country: JP
date_announced: 2026-10-30
affected_count: 27260000
count_note: 最大約2,726万件（退会済みの利用者を含む）。11月4日の追加調査で、MUJI Card会員情報約109万件（カード番号全桁・生年月日など、有効なカードは約34.5万件）と、アプリ・ネットストアのカード情報約120件も対象と判明
cause: unauthorized_access
root_cause: 公式アプリのシステムが不正アクセスを受けた（侵入経路は未公表）
data_types:
  - メールアドレス
  - 生年月日
  - 性別
  - クレジットカード番号
  - 氏名
  - 住所
  - 電話番号
summary: 無印良品の公式アプリのシステムが不正アクセスを受け、退会済みの利用者を含む最大約2,726万件のメールアドレス・生年月日・性別が流出した可能性があると公表した。氏名・住所・電話番号・クレジットカード情報は含まれない。該当箇所への接続を遮断して修正を適用した。悪用は確認されていない。11月4日の追加調査で、2021年7月以前に独自特典のために取得したMUJI Cardの会員情報約109万件（カード番号全桁・MUJI Card ID・生年月日、一部は氏名・住所・電話番号など）もアクセスされた可能性があるとクレディセゾンとともに公表した。有効なカードは約34.5万件で、カード名義・有効期限・セキュリティコードは含まれない。
