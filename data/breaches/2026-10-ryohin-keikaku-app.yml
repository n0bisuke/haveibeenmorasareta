organization: 株式会社良品計画
services:
  - MUJIアプリ
industry: 小売・EC
country: JP
date_announced: 2026-10-30
affected_count: 27260000
count_note: 最大約2,726万件（退会済みの利用者を含む）。11月4日の追加調査で、MUJI Card会員情報約109万件（カード番号全桁・生年月日など、有効なカードは約34.5万件）と、アプリ・ネットストアのカード情報約120件も対象と判明。11月9日の第4報で、ネットストアへのリスト型攻撃で約27万件の氏名・住所・電話番号・購入履歴・ポイントなどが漏えいした可能性、氏名・住所・電話番号を含む件数を約75万件に修正
cause: unauthorized_access
root_cause: 公式アプリのシステムが不正アクセスを受けた（侵入経路は未公表）
attack_methods:
  - credential_stuffing
data_types:
  - メールアドレス
  - 生年月日
  - 性別
  - クレジットカード番号
  - 氏名
  - 住所
  - 電話番号
  - 購入履歴
  - ポイント情報
summary: 無印良品の公式アプリのシステムが不正アクセスを受け、退会済みの利用者を含む最大約2,726万件のメールアドレス・生年月日・性別などが流出した可能性があると公表した。11月4日の追加調査で、2021年7月以前に独自特典のために取得したMUJI Cardの会員情報約109万件（カード番号全桁・生年月日など。有効なカードは約34.5万件）もアクセスされた可能性があるとクレディセゾンとともに公表した。11月9日の第4報では、ネットストアがリスト型攻撃を受けて約27万件の氏名・住所・電話番号・購入履歴・ポイントなどが漏えいした可能性があるとし、氏名・住所・電話番号を含む件数を約75万件に修正した。11月12日の社長会見で、カード番号をマスキングも暗号化もせずに保管し、システム変更後も削除していなかったことを認め、カード再発行の手数料を全額負担するとした。
