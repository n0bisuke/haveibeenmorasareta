summary: 不正に入手された社内業務用アカウントのIDとパスワードでクラウド環境や業務ツールにログインされ、取引先担当者25名の氏名・メールアドレス・署名欄の会社名や連絡先とメール本文の一部、役員・従業員・退職者など107名の業務ツールの利用者情報が流出したと公表した。10月21日に監視システムで検知した。「グノシー」などのサービス利用者の情報の流出は確認されていない。
