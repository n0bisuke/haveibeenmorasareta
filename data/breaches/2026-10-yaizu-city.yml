summary: 焼津市立図書館のホームページを収容するシステムの一部が第三者から不正アクセスを受け、ホームページが10月7日午前3時40分ごろから閲覧できなくなったと市が同日発表した。過去に問い合わせフォームに入力された約50件の個人情報（氏名・住所・電話番号・メールアドレス・ファクス番号・問い合わせ内容）が漏えいした恐れがある。年齢・生年月日・性別は含まれない。これまでに漏えいは確認されておらず、市が詳しい被害状況を調べている。報道によると、図書館のホームページはIDCフロンティアのクラウドサービスを利用しており、同社のサーバーがランサムウェア攻撃を受けたことが原因とみられる。
