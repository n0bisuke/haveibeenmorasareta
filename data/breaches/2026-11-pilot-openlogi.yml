summary: 物流・発送業務を委託するオープンロジから、同社システムへの第三者の不正アクセスにより顧客情報の一部が漏えいした可能性があると報告を受けたと公表した。対象は2026年4月8日〜11月8日に未来創造実験室「PILABOT」の商品を購入した一部の顧客で、氏名、住所、電話番号、登録がある場合のメールアドレス。クレジットカード情報は含まれない。対象範囲や件数は確認中で、判明次第対象者に連絡するとしている。
