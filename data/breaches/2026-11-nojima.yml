summary: 「ノジマオンライン」の会員管理システムへの不正アクセスを11月1日に検知し、通販サイトと中古スマホ買取サイトの会員約700万件の氏名・生年月日・性別・住所・電話番号・ログインID・暗号化されたパスワード・メールアドレスが外部に流出したと公表した。クレジットカード情報は保持していない。2サイトを休止した。
