summary: カードローン等の保証業務を委託するSMBCコンシューマーファイナンスの保証業務システムが第三者による不正アクセスを受け、外部へ送信されたデータに当社顧客の氏名・性別・生年月日・住所・電話番号・メールアドレス・運転免許証番号・勤務先情報（年収等）・契約情報が含まれていたと公表した。対象者と件数は同社と確認中で、本人確認書類の画像は含まれない。同社を保証会社とするローンの新規申込受付を停止した。
