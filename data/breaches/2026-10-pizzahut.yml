summary: オンライン注文サービスの決済APIが第三者による不正アクセスを受け、データベースの一部を取得されたと公表した。対象は顧客ID、メールアドレス、電話番号、削除済みの顧客情報に関する記録、ログイン用のセッショントークン、取引記録。クレジットカード情報は含まれない。10月19日に不正アクセスがあった。
