summary: 2024年度に実施したARスタンプラリーの委託先TOPPANから再委託されたpalanのシステムが8月9日〜10月21日に不正アクセスを受け、参加者1,084人のメールアドレス・ユーザー名（一部は本名）・年代などが漏えいしたと公表した。palanはシステムを停止し、個人情報を削除した。二次被害は確認されていない。同じpalanの事案は岐阜県も公表している。
