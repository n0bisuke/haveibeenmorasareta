  - メールアドレス
summary: 新潟市は、オンライン申請システム「e-NIIGATA」の受託事業者である株式会社TKCが通知メールの送信に使う外部サービスの運営会社、アララ株式会社が不正アクセスを受けた影響について公表した。11月13日のお詫びで、2026年7月1日から10月31日にe-NIIGATAから通知メールが送られた利用者のメールアドレス37,931件の漏えいを確認したとした。報道によると、漏えいしたのはメールアドレスのみで、氏名や申請情報は含まれない。
