summary: プリペイド電子マネー「PLANT Pay」に関連する委託先のサーバーが2026年11月19日深夜から20日早朝にかけて第三者の不正アクセスを受け、PLANT Payのカード番号やPIN番号など42,107件の顧客情報が漏えいしたと公表した。うち17,516件にはメールアドレスも含まれる。11月20日に委託先が異常を検知し、同日中に公式サイトで告知、24日に適時開示した。公表時点で本件による不正利用は確認されていない。
