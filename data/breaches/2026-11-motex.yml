summary: エムオーテックスのWebサイトを運用するサーバーが不正アクセスを受け、会社名・氏名・メールアドレス・電話番号などの顧客情報が漏えいした可能性があると、親会社の京セラコミュニケーションシステムが公表した。11月2日に不正アクセスを確認し、サーバーの外部通信を遮断して、LANSCOPE製品サイトやサポートサイト「LANSCOPE PORTAL」などを停止した。LANSCOPE等の製品は別の環境で運用しており、主要機能への影響はない。二次被害は確認されていない。
