summary: 大興印刷が運営する写真グッズ作成サービス「PhotoGoods」が不正アクセスを受け、決済画面に入力されたカード情報を盗むプログラムを設置された。2026年8月6日から9月11日までに決済画面でカード情報を入力した利用者のカード情報と個人情報が漏えいした可能性がある。
