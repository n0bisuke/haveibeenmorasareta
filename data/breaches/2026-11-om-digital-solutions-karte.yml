summary: ブランド「OM SYSTEM」のウェブサイトで案内などに利用している株式会社プレイドの「KARTE」が第三者による不正アクセスを受け、連携していた顧客情報の一部が漏えいしたと公表した。漏えいの可能性がある項目は生年月日・誕生月、郵便番号・都道府県、会員識別ID、ページ閲覧履歴などの行動情報で、顧客ごとに異なる。氏名、電話番号、詳細な住所、クレジットカード情報、ログインパスワードはKARTEに保持していないとした。対象の範囲と人数は確認中で、氏名・メールアドレスなど個人を特定できる情報の漏えいは確認されていない。
sources:
