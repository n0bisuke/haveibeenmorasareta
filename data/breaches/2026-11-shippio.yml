summary: 社内業務ツールに保存されていた認証情報を悪用され、貿易DXサービス「Shippio Platform」に11月1日〜2日に複数回侵入されたと公表した。輸送関連の書類ファイル約1,300件が不正にダウンロードされ、全顧客の会社名・チーム名・電話番号・住所や、ほぼ全顧客のシップメント情報が閲覧された。サービスを停止した。
