organization: 楽天グループ株式会社
group: 楽天グループ
services:
  - 楽天トラベル 海外ホテル予約サイトの一部ページ
  - 楽天トラベル 多言語予約サイト
industry: 旅行
country: JP
date_occurred: 2026-09-10
date_announced: 2026-10-26
affected_count: 3540000
count_note: 2つのサイトの最大件数の合計（重複の可能性あり、人数ではない）。海外ホテル予約サイトはログイン利用者約260万件と予約者約4万件（うちカード情報の一部約3万6千件）、多言語予約サイトはログイン利用者約86万件と宿泊施設従業員約4万件
cause: unauthorized_access
root_cause: 海外ホテル予約サイトの一部ページと多言語予約サイトが第三者の不正アクセスを受けた（原因は未公表）
data_types:
  - 氏名
  - メールアドレス
  - 電話番号
  - 会員ID
  - 購入履歴
  - クレジットカード情報（番号の一部・有効期限等）
  - アカウント名
summary: 「楽天トラベル」の2つのサイトが不正アクセスを受け、個人情報が漏えいした可能性があると公表した。子会社が運営する海外ホテル予約サイトの一部ページでは、9月10日に異常を検知し、ログインした利用者最大約260万件の氏名・メールアドレス・電話番号と、予約者最大約4万件の予約情報が対象となり、うち最大約3万6千件はクレジットカードの番号の一部（先頭6桁と下4桁）・名義・有効期限を含む。多言語予約サイトでは10月20日に検知し、ログインした利用者最大約86万件のメールアドレスと、宿泊施設の従業員最大約4万件のアカウント名・メールアドレスが対象となった。カード番号の全桁、セキュリティコード、パスワード、住所は含まれない。
