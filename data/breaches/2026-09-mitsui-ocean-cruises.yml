summary: 「にっぽん丸」の船内PCのデータを移すために使った外部記憶媒体の一部が見当たらず、顧客と乗組員の個人情報が含まれていた可能性があると公表した。2026年7月に「MITSUI OCEAN SAKURA」の船内で確認した。顧客・乗組員の氏名、住所、旅券番号、医療・アレルギー情報など、乗組員の銀行口座や給与関係の情報が含まれる可能性がある。流出や不正利用は確認されておらず、個人情報保護委員会と警察に届け出た。
