root_cause: 利用している委託先のデータセンターが第三者による不正アクセスを受けた
summary: 日水物流で委託先データセンターへの第三者による不正アクセスとみられるシステム障害が発生し、全国の物流拠点で商品の入出荷ができなくなった。親会社のニッスイが公表し、グループが管理する個人情報や顧客データの外部への流出の有無を確認している。委託先は報道ではIDCフロンティアのクラウドサービス「IDCFクラウド」とされているが、公式発表では社名を明らかにしていない。
