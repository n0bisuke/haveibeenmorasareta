summary: 契約者専用サイトなどのシステムが不正アクセスを受け、保険代理店として販売したメディケア生命保険の契約者・被保険者の約38.5万件の氏名・生年月日・性別・住所・電話番号・証券番号・契約内容が漏えいしたと公表した。マイナンバー、クレジットカード情報、保険料振替口座の情報は含まれない。外部からのアクセスを遮断し、Webサービスやアプリなど6サービスを停止した。不正利用は確認されていない。
