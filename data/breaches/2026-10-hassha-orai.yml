summary: 高速バス予約サイト「発車オーライネット」の、外部の取引先と連携するためのAPIサーバーに9月16日から19日にかけて不審なアクセスがあり、最大8,341件・5,614人分の予約情報が流出した可能性があると公表した。10月13日に検知した。対象は予約名（カタカナ）、電話番号、乗車日・路線・予約番号などで、クレジットカード、口座、住所、メールアドレス、パスワードはサーバーに保存されていない。北陸鉄道（660人）や防長交通など連携するバス事業者も影響を公表した。
