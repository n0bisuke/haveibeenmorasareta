summary: 経済産業省・環境省と連携して実施した「住宅省エネ2024キャンペーン」の事務局システムが外部から不正に操作され、登録事業者1万6,950事業者の代表者氏名、担当社員らの氏名・電話番号・メールアドレスなど2万3,918名分が漏えいしたおそれがあると発表した。事務局とシステムの運営は博報堂が担い、システムの全機能を停止した。一般消費者の情報の漏えいはない。
