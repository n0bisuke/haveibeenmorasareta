summary: 会員データベースが不正アクセスを受け、So-net会員2,141,986件の氏名・電話番号・メールアドレス・ユーザーID・生年月日・性別・接続用IDなどが漏えいしたと公表した。ドコモから運営を受託するplala（Sコース）の443,495件と合わせて計2,585,481件。メールサービス4種の54,401アドレスではメールアドレスとパスワードも漏えいし、パスワードを初期化した。銀行口座情報16件も含まれる。会員情報のパスワードとクレジットカード情報は含まれない。10月19日に不正アクセスが発生し、23日に確認した。
