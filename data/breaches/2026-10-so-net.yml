count_note: So-net会員情報2,141,986件（2026年3月以降の退会者を含む）。別にメールアドレスとパスワード54,401アドレス、銀行口座情報16件、パスワード再設定用の通知書情報7件。ドコモから委託されたplala（Sコース）の443,495件は別ファイル
