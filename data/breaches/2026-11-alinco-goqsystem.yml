summary: オンラインショップの運営に使う受注管理システム「GoQSystem」が11月10〜11日に問い合わせフォームからの不正アクセスを受け、注文データの一部が外部に持ち出されたと公表した。GoQSystemから共有された件数は、ALINCO FITNESS Yahoo!店が172件、ALINCO DiAL SHOP（楽天市場）が470件。注文者と届け先の氏名、住所、電話番号、メールアドレス、注文内容などが対象で、クレジットカード情報は含まれない。個別の情報は精査中としている。
