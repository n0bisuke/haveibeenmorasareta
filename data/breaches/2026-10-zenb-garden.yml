summary: オンラインコミュニティ「ZENB GARDEN」で利用する外部サービスの提供会社コミューンのシステムが不正アクセスを受け、会員897人のメールアドレス、性別、ニックネーム、アカウント名、自己紹介などが漏えいしたと公表した。最大で全会員949人に及ぶ可能性がある。氏名・住所・電話番号・決済情報は取得しておらず、公式通販サイトへの不正アクセスは確認されていない。
