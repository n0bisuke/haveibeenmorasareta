summary: メールマガジン配信等のマーケティング業務の一部を委託する株式会社プレイドのサービス「KARTE」が11月13日未明に外部から不正アクセスを受け、同システム上で扱っていた顧客の個人情報が外部に漏えいしたと公表した。対象は「Alpen Online」にログインしたことがある顧客86,494件の氏名とメールアドレス。クレジットカード番号等をプレイドに提供した事実はないとしている。二次被害は確認されておらず、対象者が特定でき次第、個別にメールで案内するとした。
sources:
  - title: 業務委託先システムへの不正アクセスによる個人情報漏えいに関するお知らせ（株式会社アルペン）
    url: https://store.alpen-group.jp/corporate/news/files/pdf/6e42f9dfe660cb08b2c43664b1e512c6_1.pdf
checklist:
  - text: アルペンを装った不審なメールのURL・添付を開かず、個人情報を入力しない
  - text: アルペンからの個別メールを確認する
