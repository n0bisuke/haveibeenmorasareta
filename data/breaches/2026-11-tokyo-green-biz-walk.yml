summary: イベント「東京グリーンビズウォーク」の参加登録に使われた連携事業者の専用アプリについて、事業者が利用するシステムが不正アクセスを受け、登録者約3万8千人のうち475人分の氏名、生年月日、電話番号、メールアドレス、アプリの会員番号が漏えいしたと公表した。事業者が対象者に通知メールを送り、都は原因と再発防止策の詳細な報告を求めている。
