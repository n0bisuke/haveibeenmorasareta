summary: 医療用医薬品の供給状況を集約・公表する「医薬品安定供給・流通確認システム」が第三者の不正アクセスを受けたと、運用保守の委託先NTTデータから報告があり、11月17日から運用を停止したと公表した。保管データの一部を閲覧した形跡と書き換えを試みた形跡が確認され、一部企業の担当者の氏名と連絡先が漏えいした可能性がある。製造販売業者が報告する「報告システム」には不審なファイルがアップロードされており、削除した。影響範囲と不正アクセスの方法は調査中。
