summary: 高知県が運営委託している観光ファンサイト「高知の知」のシステムが不正アクセスを受け、全会員358人のメールアドレス、アカウント名、性別などが漏えいした。漏えいは2026年10月6日に発生し、同日サイトを停止、翌日情報漏えいが判明した。県は会員へメールで報告し、委託先に再発防止策を指示した。
