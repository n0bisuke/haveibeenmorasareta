summary: 電子申請サービス「にしのみやスマート申請」が使うアララのメール配信サービスが第三者の不正アクセスを受け、利用者のメールアドレス25,115件が漏えいしたと公表した。対象は7月1日から10月31日に、利用者登録、メールアドレス・パスワードの変更、申請完了、処理状況のお知らせなどのメールを受信したアドレス。メールの件名・本文、氏名、住所、申請内容は含まれない。システムはTKCが提供している。メール送信は委託事業者が新たな送信基盤を構築して順次再開しており、対象者には個別にメールで連絡する。
