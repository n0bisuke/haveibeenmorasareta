summary: 健康アプリ「Comado」で利用していた株式会社プレイドの「KARTE」が11月13日に第三者の不正アクセスを受け、連携していた最大947,667件の情報が漏えいしたと公表した。漏えいしたのはComadoのニックネーム、性別、年齢、購入した商品名、Comado ID、支払い方法の区分情報。氏名、メールアドレス、クレジットカード番号、パスワード、生年月日、住所、電話番号は漏えいの可能性がないとしている。KARTEの停止でComadoの一部機能が止まっている。
