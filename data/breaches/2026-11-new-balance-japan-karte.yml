summary: 利用している株式会社プレイドの「KARTE」が不正アクセスを受け、公式オンラインストア会員の顧客番号、性別、生年月日、最終購入商品名など最大約374万件が漏えいしたと公表した。メールアドレス約12万件も含まれるが、ハッシュ化して元に戻せない文字列に変換していたとしている。氏名、電話番号、クレジットカード情報、ログインパスワードは含まれない。対象の顧客には順次メールで連絡し、不審な電話やメールに注意するよう呼びかけた。
