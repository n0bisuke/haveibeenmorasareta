summary: ドコモオンラインショップとMy docomoのサーバーが外部から不正アクセスを受け、最大約30万件の氏名・住所・生年月日・携帯電話番号・連絡先電話番号などが流出したと公表した。11月4日に検知し、5日未明から両サービスの手続きを停止した。決済情報が含まれるかは調査中。10月公表のぷらら（Sコース）の件とは別の事案。11月6日の第三報で、最大294,839回線の氏名・生年月日・住所・連絡先・料金プランなどの契約情報と本人確認書類の番号が流出し、一部は金融機関名・口座番号・口座名義も含むと公表した。カード番号はマスキングされていた。11月4日に大量アクセスのアラートで検知した。
