summary: 株式会社コンフィデンス・インターワークスは、グループ会社の株式会社インターワークスが運営する「工場ワークス」がメールやLINEの配信に使っていた株式会社プレイドの「KARTE」が不正アクセスを受け、会員の登録情報の一部が漏えいした可能性があると公表した。含まれる可能性があるのは会員の氏名、メールアドレス、電話番号、生年月日、住所情報など。件数と項目は精査中。ログインパスワードはKARTEに連携しておらず漏えいはない。工場ワークス本体と企業向け管理画面は連携対象外としている。
