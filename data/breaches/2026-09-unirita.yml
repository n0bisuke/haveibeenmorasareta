organization: 株式会社ユニリタ
services:
  - 社内のSaaS型文書管理システム
industry: IT・通信
country: JP
date_announced: 2026-09-29
affected_count: 51000
count_note: 11月11日の続報で、顧客企業の従業員・社外関係者の個人情報約51,000件。ほかに契約情報約6,100件、認証情報約370件、見積・提案情報約2,500件、従業員情報約910件
cause: unauthorized_access
root_cause: 社内のSaaS型文書管理システムが不正アクセスを受け情報が窃取された。侵入経路は公表されていない
data_types:
  - 氏名
  - メールアドレス
  - 契約情報
  - 従業員情報
  - 取引先情報
  - アカウント名
summary: 社内で使うSaaS型文書管理システムが第三者の不正アクセスを受け情報が窃取されたと9月29日に公表した。11月11日の続報で、顧客企業の従業員や社外関係者の個人情報約5万1,000件（氏名・所属組織・メールアドレス）のほか、契約情報約6,100件、システムIDなどの認証情報約370件、見積書・提案書の情報約2,500件、従業員情報約910件の漏えいを確認したと公表した。11月24日から対象者への通知を始める。
