summary: 公式サイトとオンラインショップが10月29日夜に攻撃を受け、2019年10月以降の利用者9,502人の氏名・住所・電話番号・メールアドレス・ログインID・パスワードのハッシュ値と注文履歴13,922件が漏えいしたと公表した。クレジットカード情報は対象外。サーバーを停止し、別環境で再構築する。
