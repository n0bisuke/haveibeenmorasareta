organization: 文部科学省
services:
  - 政府調達情報システム
industry: 行政
country: JP
org_type: national_gov
prefecture: 東京都
date_announced: 2026-11-25
affected_count: 163953
count_note: 事業者の会社名・代表者氏名など最大16万3,953件と、同省職員らのメールアドレス最大1,778件（いずれも最大値で、漏えいの可能性がある件数）。10月1日に不正アクセスを検知
cause: unauthorized_access
root_cause: 政府調達情報システムを構成するサーバーが第三者の不正アクセスを受けた。原因・侵入経路は未公表
data_types:
  - 取引先情報
  - 氏名
  - メールアドレス
summary: 入札・契約に関する情報を扱う政府調達情報システムを構成するサーバーが第三者による不正アクセスを受け、データベースに保存されていた入札参加資格のある事業者の会社名や代表者氏名など最大16万3,953件と、同省職員らのメールアドレス最大1,778件が外部に漏えいした可能性があると公表した。不正アクセスの検知は10月1日で、公表まで55日を要した。対象システムの内外の通信を遮断し、外部専門機関と調査を進め、個人情報保護委員会に報告した。不正利用は確認されていないとしている。原因や侵入経路は明らかにしていない。
