summary: 公式ショップ「hololive production OFFICIAL SHOP」の出荷業務を2025年6月まで委託していた株式会社オープンロジのシステムが2026年11月8日から9日に不正アクセスを受け、2022年9月1日から2024年11月25日に出荷を依頼した一部の出荷データ約300件が漏えいしたと公表した。お届け先の氏名、住所、電話番号、メールアドレス、注文番号、購入金額、配送伝票番号などが含まれる。クレジットカード情報は含まれない。取引終了後も委託先にデータが残っていた。
