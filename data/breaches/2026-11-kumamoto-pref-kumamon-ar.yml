summary: 2025年1〜3月に実施したARスタンプラリーで、委託先JTBパブリッシングから再委託されたpalanが契約で消去すべきデータを保持したままにしており、そこへの不正アクセスで参加者478人のメールアドレス・年代・居住地などが漏えいしたと公表した。二次被害は確認されていない。同じpalanの事案は熊本市や岐阜県も公表している。
