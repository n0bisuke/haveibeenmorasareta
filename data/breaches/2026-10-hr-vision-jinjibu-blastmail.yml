summary: 人事向け情報サイト『日本の人事部』のメールマガジン配信に使っていたブラストメールが不正アクセスを受け、配信先のメールアドレスが漏えいしたと10月23日に公表した。外部の第三者がラクスライトクラウドのサーバーに侵入し、販売管理システムとサービスのデータベースからデータを持ち出した。27日の第二報で、漏えいしたメールアドレスは213,294件と公表した。氏名、勤務先、部署・役職、電話番号、ログイン用パスワードなどの会員情報は含まれない。27日時点で不正利用や二次被害は確認されていない。
