organization: 佐川急便株式会社
services:
  - SAGAWA手ぶらサービス（手荷物一時預かりのWeb事前予約）
industry: 物流
country: JP
date_occurred: 2026-11-14
date_announced: 2026-11-20
affected_count: 13059
count_note: 予約13,059件（実人数ではない）。2026年4月1日〜11月14日の予約が対象で、うち36件はクレジットカード番号の下4桁を含む。流出の「可能性」の段階
cause: unauthorized_access
root_cause: 手荷物一時預かりのWeb事前予約システムが不正アクセスを受けた（手法は未公表）
data_types:
  - 氏名
  - 電話番号
  - メールアドレス
  - クレジットカード情報（番号の一部・有効期限等）
summary: 「SAGAWA手ぶらサービス」の手荷物一時預かりのWeb事前予約システムが11月14日に第三者から不正アクセスを受け、個人情報が外部に流出した可能性があると公表した。9月に判明した「お荷物問い合わせサービス」への不正アクセスを受けて全システムを点検する中で、11月16日に判明した。対象は2026年4月1日〜11月14日の予約13,059件で、予約番号、予約者の氏名、電話番号、メールアドレスが含まれ、うち36件はクレジットカード番号の下4桁も含む。住所は含まれない。お荷物問い合わせサービスとは異なるシステムで、侵入手法も異なるとしている。当該システムは停止し、外部専門機関と調査している。
