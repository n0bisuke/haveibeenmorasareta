summary: 職員採用試験で利用した株式会社ApplyNowの録画面接システムが第三者の不正アクセスを受け、令和4〜6年度の応募者567件の氏名、フリガナ、メールアドレス、電話番号、生年月日、郵便番号、住所が漏えいしたと公表した。事業者からのメールを迷惑メールと勘違いして処理が漏れ、公表まで約1か月半かかったと説明した。二次被害は確認されていない。
