summary: ファッション媒体のブロガー向けシステム「HAPPY PLUS COMMUNITY」が不正アクセスを受け、登録ブロガー2,835名の個人情報が漏えいした。システムから送ったメール11,237件や取引先リスト10,780件なども見られた。
