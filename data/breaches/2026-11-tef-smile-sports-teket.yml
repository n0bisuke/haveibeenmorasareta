summary: スマイルスポーツ事業の申込みに使う外部申込サイト「teket」が第三者の不正アクセスを受け、登録されている個人情報の漏えいが判明したと株式会社teketから報告があったと公表した。東京体育館、駒沢オリンピック公園総合運動場、東京武道館、東京アクアティクスセンターで開く教室の申込みに使っていた。漏えいした情報の詳細はteketの発表を参照するよう案内しており、件数は示していない。
