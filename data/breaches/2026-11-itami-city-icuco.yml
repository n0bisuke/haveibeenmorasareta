summary: 公立就学前施設の運営管理システムを提供するicuco株式会社から、「icuco book」で個人情報を含む一部のファイルが外部から閲覧可能な状態になり、第三者の不正アクセスを確認したとの報告を受けたと公表した。児童の氏名・性別・生年月日、保護者の氏名・住所・電話番号・メールアドレス、施設と保護者の連絡事項などが漏えいした可能性があり、影響範囲は調査中。
