root_cause: 委託先プレイドの「KARTE」が不正アクセスを受け、連携していた顧客の個人情報が流出した可能性がある
vendor:
  name: 株式会社プレイド
summary: コメ兵ホールディングスは、子会社の株式会社コメ兵が利用する株式会社プレイドのCXプラットフォーム「KARTE」が第三者の不正アクセスを受け、コメ兵を利用した顧客の個人情報が外部に流出した可能性があると公表した。11月13日に不正アクセスの報告を受けてデータ連携とアクセスを遮断し、11月15日にプレイドの調査で流出の可能性が判明した。対象の顧客と情報の項目・件数は特定中で、判明しだい個別に連絡するとしている。クレジットカード情報は決済代行会社などで管理しており、流出の対象に含まれない。コメ兵の社内システムへの不正アクセスや影響はないとしている。
sources:
