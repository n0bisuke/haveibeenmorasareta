summary: 両社が共通で使うシステムが11月2日に不正アクセスを受け、契約者向けサイトなどを停止したと公表した。個人情報の流出は現時点で確認されておらず、調査中としている。11月6日に、あいおいニッセイ同和約44万4,000件、三井住友海上約3万7,000件の保険証券番号・氏名・住所・電話番号・メールアドレス・専用ページIDなどの漏えいを確認したと公表した。あいおいの一部ではカード名義と番号下4桁（3件）、口座番号の一部（19件）も含む。
