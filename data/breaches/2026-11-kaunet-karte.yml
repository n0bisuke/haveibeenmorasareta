summary: Webサイト上の告知やメールでの案内に利用している株式会社プレイドの「KARTE」が11月13日に第三者による不正アクセスを受け、11月15日にプレイド社から、KARTEに登録していた顧客の個人情報の漏えいが確認されたとの報告を受けたと公表した。対象はオフィス用品通販「カウネット」と個人向け通販「おうちカウネット」の利用者とカウネットエージェントで、漏えいした情報はメールアドレス、顧客番号、電話番号、顧客名称。件数はプレイド社で確認中としている。クレジットカード番号・有効期限とログインパスワードは漏えいの可能性はないとした。自社システムからの漏えいは確認されていない。
