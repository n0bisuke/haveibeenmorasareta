summary: カードローンなどの保証業務を委託するSMBCコンシューマーファイナンスのシステムが不正アクセスを受け、同行の顧客情報の一部が外部に漏えいしたと公表した。漏えいの可能性がある情報は氏名、住所、電話番号、年収を含む勤務先情報など。対象の顧客数は調査中。二次被害は確認されていない。ふくおかフィナンシャルグループの熊本銀行と十八親和銀行も同様に公表した。
