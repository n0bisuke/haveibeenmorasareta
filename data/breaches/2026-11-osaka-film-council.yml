summary: 映画やドラマ撮影のエキストラを募集する「大阪フィルム・カウンシル」が運営するサイトが第三者による不正アクセスを受け、ボランティアエキストラやロケ協力施設として登録している人の氏名、住所、メールアドレスなど約3万件が漏えいしたと公表した。11月24日に登録者から、同カウンシルのメールアドレスで宅配業者を装った不審なメールが届いたとの問い合わせがあり、調査して判明した。サイトは閉鎖している。
