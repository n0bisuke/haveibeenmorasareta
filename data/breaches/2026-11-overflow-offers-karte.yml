affected_count: 29950
count_note: 最大29,950件。重複があり得るため人数は確認中。ほかに利用状況の情報（職種、スキル、副業・転職の意向、オファー・応募の記録など）も漏えいの可能性があり調査中
cause: third_party
root_cause: 過去に利用したプレイドの「KARTE」が不正アクセスを受け、契約終了後も残っていた会員情報が読み出された
vendor:
  name: 株式会社プレイド
data_types:
  - 氏名
