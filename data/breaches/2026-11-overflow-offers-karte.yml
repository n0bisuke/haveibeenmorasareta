  - 会員ID
summary: 副業・転職サービス「Offers」の会員情報を過去に連携していたプレイドのサービス「KARTE」が不正アクセスを受け、最大29,950件の個人情報が漏えいしたと公表した。漏えいしたのはワーカーの氏名、メールアドレス、生年月日、会員番号と、企業担当者の氏名、メールアドレス、会員番号。2023年11月末に契約を終え12月に連携を止めていたが、プレイドのサーバーにデータが残っていた。職種やスキル、副業・転職の意向、オファーや応募の記録なども漏えいした可能性があり調査中。パスワード、クレジットカード情報、メッセージ本文はKARTEに送っていないとしている。
sources:
