summary: タイムズカーWebシステムへの外部からの不正アクセスを2026年9月25日に検知し、翌26日までに経路を遮断。会員・退会者・入会未完了者の約660万アカウントの情報が漏えいした。クレジットカード情報は漏えいしていない。9月29日の第3報で、本人確認書類の画像（運転免許証、公共料金の請求書などの現住所確認書類、学生証、家族確認書類）が漏えいしたアカウントは約160万件と確認し、対象の会員へのメールでの個別案内を始めた。10月16日の第4報では、本人確認書類の画像の保有ルールを見直し、現会員の画像は登録確認後すぐに削除し、退会者の画像は保有しないこととして、保有中の画像を2026年10月末までに削除するとした。会員ごとの漏えい情報の詳しい案内は10月23日に延期した。侵入経路と補償の方針は外部専門機関の調査結果を踏まえて公表するとしている。
