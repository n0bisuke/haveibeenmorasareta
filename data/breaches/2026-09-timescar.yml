organization: パーク24株式会社・タイムズモビリティ株式会社
services:
  - タイムズカー
  - タイムズビジネスサービス
industry: 交通・モビリティ
country: JP
date_occurred: 2026-09-25
date_announced: 2026-09-25
affected_count: 6782998
count_note: タイムズカー6,628,007件とタイムズクラブ154,991件の合計（10月23日の第5報。退会者・入会未完了の申込者を含む）。本人確認書類の画像は外部送信を確認した1,464,800件
cause: vulnerability
root_cause: タイムズカーのWebシステムに存在した脆弱性を悪用され、データベースやファイル領域にアクセスされた
vuln_target: web_app
data_types:
  - 氏名
  - 住所
  - 生年月日
  - 電話番号
  - メールアドレス
  - 運転免許情報
  - 本人確認書類画像
  - パスワード（ハッシュ化・暗号化済み）
  - 連携サービスID
summary: タイムズカーWebシステムへの外部からの不正アクセスを2026年9月25日に検知し、翌26日までに経路を遮断。会員・退会者・入会未完了者の約660万アカウントの情報が漏えいした。クレジットカード情報は漏えいしていない。9月29日の第3報で、本人確認書類の画像（運転免許証、公共料金の請求書などの現住所確認書類、学生証、家族確認書類）が漏えいしたアカウントは約160万件と確認し、対象の会員へのメールでの個別案内を始めた。10月16日の第4報では、本人確認書類の画像の保有ルールを見直し、現会員の画像は登録確認後すぐに削除し、退会者の画像は保有しないこととして、保有中の画像を2026年10月末までに削除するとした。会員ごとの漏えい情報の詳しい案内は10月23日に延期した。10月23日の第5報でフォレンジック調査の結果を公表し、Webシステムに存在した脆弱性が悪用されたと判断した。漏えいを確認したのはタイムズカーで6,628,007件、本人確認書類の画像は外部送信を確認した1,464,800件で、新たにタイムズクラブでも154,991件の漏えいを確認した。画像が送信された人に1人3,000円相当の見舞金を支払い、特別損失55億円を計上する。
