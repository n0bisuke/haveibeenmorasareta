summary: 働きやすい介護職場認証制度の申請受付を委託した事業者が、ホームページ上の申請用ファイルの設定を誤ったため、8月21日から9月17日まで介護事業者24法人の役員183人分の氏名・生年月日・性別・役職が第三者に閲覧できる状態だった。申請予定者からの問い合わせで判明した。
