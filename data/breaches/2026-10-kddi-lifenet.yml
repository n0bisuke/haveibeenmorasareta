summary: 「auの生命ほけん」を提供するライフネット生命のKDDI連携システムが脆弱性を悪用した不正アクセスを受け、KDDIの顧客最大22,541件の氏名・郵便番号・電話番号・メールアドレス・会員識別子、一部の性別・生年月日が漏えいした可能性があると両社が公表した。パスワード、クレジットカード、口座、本人確認書類、保険契約の情報は含まれない。10月23日に検知し、連携経路を遮断した。
