summary: 旅客サービスシステムの委託先であるアマデウスのシステムが不正アクセスを受け、JALとJTAの顧客延べ約9万2,000人分の予約情報が外部から参照された可能性があると公表した。約9万人は予約番号・氏名・搭乗日・搭乗区間・搭乗クラス、約2,000人はこれに加えてメールアドレス・電話番号・パスポート番号・国籍・マイレージ番号・航空券番号・座席番号なども対象。10月23日にアマデウスから報告を受けた。クレジットカード番号とパスワードは含まれず、不正利用は確認されていない。
