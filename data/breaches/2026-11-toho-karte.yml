summary: 「TOHO-ONE」で利用している株式会社プレイドの「KARTE」が第三者による不正アクセスを受け、同サービスに連携していたデータの一部が外部に流出した疑いがあると報告を受けたと公表した。流出の可能性がある情報はTOHO-ONE会員の会員番号、年代、都道府県、性別で、件数は調査中。それ以外の個人を特定できる情報の流出は確認されておらず、ログインパスワードとクレジットカード情報は流出の可能性がないとしている。グループのチケット販売サービス等への不正アクセスは確認されていない。
