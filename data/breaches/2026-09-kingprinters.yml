root_cause: システム基盤への不正アクセス。同社の認証情報を使った生成AIサービスの不正利用が目的とみられる
summary: 9月10日に同社が管理するシステム基盤への不正アクセスを検知し、9月14日までサービスを停止した。同社が持つ認証情報を使った生成AIサービスの不正利用が目的とみられる。顧客情報への不正アクセスや外部送信の痕跡はなく、個人情報の漏えいは確認されていないとしている。クレジットカード情報は保有しておらず、パスワードはハッシュ化して保管している。
