summary: UIターン者向けの就職支援サイト「291JOBS」で、保守委託業者の設定誤りにより、登録者368人分の職務経歴書・履歴書（氏名・住所・電話番号・生年月日・顔写真など）が外部から閲覧できる状態になっており、うち10人分は実際に閲覧されていたと公表した。10月29日に過去の登録者からの連絡で発覚し、公開を停止した。
