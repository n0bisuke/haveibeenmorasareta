summary: ECサイト「JR東海MARKET」「いいもの探訪」で、メール配信を担う事業者が使っていたIDCフロンティアのクラウドが不正アクセスを受け、最大約1万5000件の情報が漏えいした可能性があると公表した。対象は配信先のメールアドレスと、配信メールの本文に含まれていた氏名・住所・電話番号・注文内容・配送先・アンケートの回答などで、クレジットカード情報とログインパスワードは含まれない。外部への流出は確認されておらず、別のクラウドでのメール配信に切り替えた。
