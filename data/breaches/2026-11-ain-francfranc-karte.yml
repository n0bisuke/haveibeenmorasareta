summary: 傘下の「アインズ&トルペ」「アユーラ」「Francfranc」が利用する株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、会員情報が流出した可能性があると公表した。アインズ&トルペとアユーラの会員は合計最大約260万件（氏名、生年月日、性別、メールアドレス、電話番号）、Francfrancの会員は最大約598万件（氏名、生年月日、ユーザーID、都道府県・市区町村）。Francfranc公式ECサイトの購入履歴に関するデータ最大約400万件（性別、生年月日、郵便番号、年代）も対象となる。11月15日にプレイドから連絡を受けた。クレジットカード情報とログインパスワードの流出はないとしている。
