count_note: 会員情報は最大約858万件（アインズ&トルペ・アユーラ合計最大約260万件、Francfranc最大約598万件）。別にFrancfranc公式ECサイトの購入履歴に関するデータ最大約400万件。いずれも現時点の調査に基づく最大値
