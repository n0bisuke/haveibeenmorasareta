summary: e-Taxマイページのシステム改修に伴う不具合により、9月24日から25日にかけて79人分の贈与税申告書等が本人以外から閲覧できる状態になった。贈与者や関与税理士を含む計203人分の個人情報が対象で、本人以外の19人が閲覧した可能性がある。不具合は解消済み。
