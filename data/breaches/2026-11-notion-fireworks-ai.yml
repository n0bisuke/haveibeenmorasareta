organization: Notion Labs, Inc.
services:
  - Notion AI
industry: IT・通信
country: US
date_announced: 2026-11-10
affected_count: null
count_note: Notion のワークスペース全体の1%未満が影響を受けた可能性。チャットの件数は公表されていない。日本の利用者の件数も不明
cause: third_party
root_cause: Notion AI の一部モデルの処理を委託していた Fireworks AI が不正アクセスを受け、委託先にあったデータが取得された
vendor:
  name: Fireworks AI, Inc.
data_types:
  - メッセージ・チャット履歴
summary: Notion AI の一部のモデル（オープンウェイトモデル）の処理を委託していた Fireworks AI が不正アクセスを受け、Notion の「Insights」機能に使われた Notion AI のチャット内容が流出した可能性があると公表した。11月2日に Fireworks から連絡を受けた当初は合成テストデータのみとしていたが、11月8日に Fireworks が確認した新たなデータセットを分析した結果、チャット内容が含まれていた。チャットの大半は作成者やワークスペースを特定できない形で、影響はワークスペース全体の1%未満としている。Insights 機能を停止し、Fireworks の利用をやめた。影響を受けた利用者には個別に連絡している。日本では Notion Japan が11月11日に日本語で告知した。
