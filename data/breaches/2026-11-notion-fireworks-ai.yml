checklist:
  - text: Notion からの個別の連絡（メール）が届いていないか確認する
  - text: 対象期間中に Notion AI のチャットへ貼り付けたパスワード・API キー・認証情報があれば変更する
  - text: 不明な点は Notion のサポート（team@makenotion.com）に問い合わせる
    url: https://www.notion.com/security/advisories/security-incident-involving-a-third-party-ai-vendor
