summary: 区の委託事業で実施した「江戸川区の農の風景コンテスト（絵画部門）」の応募フォームを運営するStudio株式会社が不正アクセスを受け、応募者6人の氏名、生年月日、住所、メールアドレス、電話番号が漏えいした可能性があると公表した。応募フォームは7月27日〜9月30日に公開していた。区は6人に連絡して注意喚起を行い、実際に第三者が情報を取得した事実は確認されていない。
