count_note: お届け先情報3,358件（4月8日〜11月8日のくじ購入分、未出荷を含む）。アカツキの「Slash Gift」経由でオープンロジに再委託
cause: third_party
root_cause: 商品の保管・出荷を担うオープンロジ（アカツキの委託先）のシステムが不正アクセスを受け、出荷データが持ち出された
vendor:
  name: 株式会社オープンロジ
data_types:
  - 氏名
  - 住所
  - 電話番号
  - 購入履歴
summary: 運営する「東映アニメーションオンラインくじ」の商品の保管・出荷を担う物流事業者オープンロジのシステムが11月8日〜9日に不正アクセスを受け、くじ購入者が引き換えた商品のお届け先情報3,358件が外部に持ち出されたと公表した。出荷業務はアカツキのオンラインくじサービス「Slash Gift」を通じてオープンロジが担っていた。対象は氏名、住所、電話番号、購入元ストア名、数量、追跡番号、注文番号などで、メールアドレスとクレジットカード情報は含まない。個人情報保護委員会に報告した。
sources:
