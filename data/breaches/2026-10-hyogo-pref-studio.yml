summary: 県主催の「トライアル起業プログラム」を受託する株式会社ガイアックスが使うクラウドサービス「Studio」が第三者の不正アクセスを受け、申込者の情報最大82件が漏えいした可能性があると公表した。氏名、生年月日、性別、電話番号、メールアドレス、所属（学校名等）が含まれる。実際に第三者に取得された事実は確認されていないが、取得された可能性を前提に対応している。対象者にはメールで経過とお詫びを伝え、受託事業者はプラットフォーム上の個人情報を削除した。
sources:
