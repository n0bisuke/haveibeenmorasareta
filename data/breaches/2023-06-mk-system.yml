industry: IT・通信
country: JP
date_occurred: 2023-06-05
leaked: false
date_announced: 2023-06-06
affected_count: 22420000
count_note: 最大約2,242万人（社労夢などのシステムで管理していた本人数。2023年6月5日時点で、同社からの情報として個人情報保護委員会が公表）。同委員会が受けた漏えい等報告は3,067件・本人数計7,496,080人（同社の報告を除く。本人数は社労士事務所と顧問先事業者とで重複している可能性あり）。同委員会は事案を「漏えい等のおそれ」としており、同社の調査では情報流出は確認されていない
cause: ransomware
attack_methods:
  - stolen_credentials
root_cause: サーバーへのアクセス制限の不備、パスワードが脆弱なアカウントの悪用、セキュリティ更新の不備
data_types:
  - 氏名
  - 生年月日
  - 性別
  - 住所
  - 電話番号
  - 従業員情報
summary: 社会保険労務士事務所などに提供する社会保険・人事労務業務支援システム「社労夢」のデータセンター上のサーバーが2023年6月5日未明にランサムウェアによる不正アクセスを受けて暗号化され、社労夢やDirectHRなど9サービスに影響が出て、約3,400ユーザーの大半にサービスを提供できなくなった。システムには社労士の顧問先企業などの従業員の氏名・生年月日・性別・住所・基礎年金番号・雇用保険被保険者番号などが取り扱われていた。同社は7月19日、外部専門機関のフォレンジック調査の結果、窃取の可能性は完全には否定できないものの、情報窃取やデータの外部転送の痕跡は確認されず、情報漏えいの事実は確認されていないと報告した。マイナンバーは高度な暗号化処理を施しており、流出のおそれのある範囲に含まれないとしている。個人情報保護委員会は2024年3月25日、パスワードの脆弱さやセキュリティ更新・ログ監視の不備など安全管理措置の不備を認め、同社を指導した。
