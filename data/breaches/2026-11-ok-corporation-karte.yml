summary: 情報案内やサービス改善に使っていたプレイドのサービス「KARTE」が不正アクセスを受け、「オーケーネットスーパー」と「オーケークラブ会員カードアプリ」を利用する一部の顧客の個人情報が漏えいした可能性があると公表した。見込みの対象件数は23,332件で、項目は会員番号、メールアドレス、氏名、生年月日。クレジットカード情報、住所、電話番号、パスワードはKARTEに保存しておらず、含まれないとしている。KARTEとのデータ連携を遮断した。二次被害は確認されていない。
sources:
  - title: 外部システム（委託先）への不正アクセスによる会員情報漏えいの可能性に関するお詫びとお知らせ（オーケー）
    url: https://ok-corporation.jp/news/entry-3359.html
checklist:
  - text: 対象の顧客にはオーケーから順次個別に連絡がある
  - text: 身に覚えのないメールの添付ファイルやURLは開かずに破棄する
