summary: LPガス・石油製品を販売するエネサンスグループがランサムウェア攻撃を受け、一部のサーバーと端末のデータが暗号化された。窃取されたとみられる情報が攻撃者のリークサイトで公開され、2026年5月の第4報で顧客の氏名・住所・電話番号・メールアドレスなど約36.5万件と従業員等約2,000件が流出またはそのおそれがあると公表した。同社に業務を委託していたガス会社各社も個別に公表している。
