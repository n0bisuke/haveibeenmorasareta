summary: 商品の保管・配送を委託するオープンロジのシステムが第三者の不正アクセスを受け、同社が提供した顧客のお届け先情報が漏えいした可能性があると公表した。対象は2026年4月8日〜11月8日に購入・交換手続きをした顧客の最大1,144件で、届け先の氏名、住所、電話番号、出荷通知を希望した顧客のメールアドレス、商品名・数量が含まれる。Amazonや楽天などで購入が完結した顧客とクレジットカード情報は対象外。自社システムへの影響はないとしている。
