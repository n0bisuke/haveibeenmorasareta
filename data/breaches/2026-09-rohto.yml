count_note: 2,797,545件（11月6日公表）。うち9,715人分の通話音声にクレジットカード番号と有効期限が含まれていた（セキュリティコードは含まない）
cause: unauthorized_access
root_cause: 電話システムのサービス事業者のアカウントが不正利用され、電話システム経由で顧客管理システムの情報も取得された
