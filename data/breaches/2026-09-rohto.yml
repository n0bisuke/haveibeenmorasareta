summary: 通信販売で利用しているシステムに第三者による不正アクセスの可能性がある事象を9月10日に確認し、11日に公表した。15日の続報で、通販の顧客対応システムに保存されていた顧客との通話音声データと付随情報が不正に取得された可能性があると明らかにし、顧客管理システムの情報も取得された可能性があるとした。取得された可能性がある情報の範囲や件数、対象の顧客は調査中としている。個人情報保護委員会に報告し、警察と連携して対応している。
