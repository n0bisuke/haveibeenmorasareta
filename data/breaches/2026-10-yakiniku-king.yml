summary: 公式アプリの会員管理システムが第三者から不正アクセスを受け、会員情報1,078万8,963件が漏えいした。パスワード・生年月日・性別・保有ポイント・利用履歴、クレジットカード決済情報は含まれない。漏えいしなかった約2万件はメールアドレスが未登録の会員と説明している。公表後、アプリのソフトウェアテストを手がけたSHIFT ASIAの導入事例ページが注目されたが、同社によると、SHIFT ASIAは今回の会員管理システムには関与していない。
