summary: 京都の菓子メーカー株式会社美十は、「おたべ・京ばあむオンラインショップ」が利用するGMOメイクショップ株式会社のサービスと連携したアララ株式会社のメール配信サービスが不正アクセスを受け、配信先のメールアドレス最大約11万4千件（累計）が漏えいしたと公表した。漏えいしたのはメールアドレスのみで、現時点で本件に起因する不正利用などは確認されていないとしている。
