summary: キリンビールとキリンビバレッジがSNSキャンペーンで使っていた外部ツール「OWNLY」が第三者の不正アクセスを受け、キャンペーン参加者のLINE表示名やXのユーザー名1,825件（うち個人情報329件）が漏えいしたと公表した。OWNLYでの不正アクセスは10月18日に確認され、28日に参加者情報へのアクセス形跡が見つかり、11月6日に漏えいを確認した。メールアドレスや電話番号、カード情報の漏えいは確認されていない。
