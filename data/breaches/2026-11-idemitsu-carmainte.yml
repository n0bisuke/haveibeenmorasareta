summary: カーメンテナンス予約サービス「idemitsuカーメンテ予約」（旧称PIT in plus）が第三者の不正アクセスを受け、利用者の個人情報の一部が外部に漏えいした可能性があると公表した。11月7日に通常と異なるアクセスを検知し、9日の調査で不正アクセスと、顧客情報が外部から取得できる状態にあったことを確認した。10日からサービスを停止し、漏えいの有無や対象者を調べている。停止中は予約の変更・取消を予約店舗で受け付ける。
