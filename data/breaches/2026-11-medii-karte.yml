summary: 医師向けプラットフォームで使っていた株式会社プレイドの「KARTE」が不正アクセスを受けた影響で、会員の情報が流出したと公表した。流出が確認されたのは、会員が登録した勤務先医療機関名と都道府県、同社が付番した会員番号。アプリ会員については氏名、メールアドレス、生年月日などの登録情報の一部がKARTEに送られていた時期があり、プレイドが引き続き調査している。件数は公表していない。
sources:
  - title: Medii 当社が利用する外部サービス「KARTE」（株式会社プレイド）への不正アクセスに関するお知らせ
    url: https://medii.jp/news/20261117
checklist:
  - text: 対象の会員には電子メールで順次、個別に連絡するとしている
  - text: 本件に便乗した不審なメールやSMSのURL・添付ファイルを開かず、パスワードやカード情報を入力しない
