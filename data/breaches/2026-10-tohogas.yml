summary: 新規事業のシャインマスカット生産と住宅メーカーのマッチングサービス「イエラボ」で使っていたStudioのクラウドが不正アクセスを受け、問い合わせ者の氏名・メールアドレスと住宅メーカー担当者の会社名・氏名・メールアドレスの計100件が漏えいした可能性があると公表した。同社のシステムとは接続しておらず、ガス・電気の供給への影響はない。
