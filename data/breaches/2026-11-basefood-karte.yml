summary: 株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、同サービスに連携していた顧客の個人情報の一部が外部に漏えいしたと公表した。漏えいしたのはメールアドレスのみが約1.5万件、メールアドレスと氏名が約71万件、氏名と電話番号が含まれる形式の情報が約2.6万件。クレジットカード情報、住所、公式オンラインショップのログインパスワード、購入履歴などは含まれていない。現時点で二次被害は確認されていないとしている。
sources:
  - title: ベースフード 【お詫び】外部サービス「KARTE」への不正アクセスに伴う個人情報漏えいに関するお知らせ
    url: https://basefood.co.jp/news/4718
checklist:
  - text: 漏えいの対象となった可能性のある顧客には順次、個別に連絡しているとしている
  - text: 本件に便乗した不審なメールやSMSのURL・添付ファイルを開かず、パスワードやカード情報を入力しない
