root_cause: 同社と連結子会社の富士興産が運用するサーバーの一部が第三者の不正アクセスを受けた
summary: 同社と連結子会社の富士興産が運用するサーバーの一部が第三者の不正アクセスを受け、個人情報を含むデータの一部が外部に漏えいしたと公表した。11月5日に不正アクセスを確認して侵入経路を遮断し、11月10日に漏えいが判明した。同じサーバーに保管されていたほかの個人情報にも漏えいのおそれがあるとしている。予防措置として富士興産のWeb受注システムの利用を一時停止した。漏えいした情報の項目や件数は公表しておらず、外部専門家と調査を続け、対象者に個別に通知するとしている。
