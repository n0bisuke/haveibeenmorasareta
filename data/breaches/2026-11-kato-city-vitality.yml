summary: 住友生命との連携協定事業「Vitalityかとうウォーク」について、住友生命の「Vitality健康プログラム」システムの業務委託先NTTデータの管理システムが不正アクセスを受け、参加者の一部3件の氏名と生年月日が外部に流出したと公表した。該当する3人には住友生命から個別にメールでお詫びと案内が送られ、不正利用などの二次被害は確認されていない。
