summary: 会員制Webサービス「よんでんコンシェルジュ」のお知らせ配信に使っていたプレイドのサービス「KARTE」が不正アクセスを受け、会員約60万件の情報が外部に流出したと公表した。11月15日にプレイドから報告を受けた。流出したのは個人会員の氏名、メールアドレス（ログインID）、住所、お知らせメール希望の有無、性別、誕生日と、法人会員の名称、メールアドレス、住所、お知らせメール希望の有無。電気料金の支払いに使うクレジットカードや金融機関口座の情報、パスワードは同サービスで扱っておらず、流出していないとしている。二次被害は確認されていない。
