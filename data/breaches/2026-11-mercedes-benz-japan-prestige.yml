  - 24時間ツーリングサポート
industry: 交通・モビリティ
country: JP
date_occurred: 2026-10-29
date_announced: 2026-11-20
affected_count: 18000
count_note: 約18,000人（2026年11月17日時点）。2025年12月10日〜2026年10月30日に24時間ツーリングサポートを利用した人
cause: third_party
root_cause: 委託先の業務システムのWebアプリにアクセス制御と認証情報管理の不備があり悪用された
attack_methods:
  - broken_access_control
vendor:
  name: 株式会社プレステージ・コアソリューション
data_types:
  - 氏名
  - 住所
  - 車両情報
summary: ロードサービス「24時間ツーリングサポート」の業務委託先である株式会社プレステージ・コアソリューションの業務システムが第三者から不正アクセスを受け、委託に伴い提供していた顧客の個人情報が外部に流出したと公表した。対象は2025年12月10日〜2026年10月30日に同サービスを利用した約18,000人で、氏名、住所、車台番号、自動車登録番号と委託先の管理用受付番号が含まれる。クレジットカード情報や銀行口座情報は含まれない。委託先は10月29日に不正アクセスを検知し、30日にシステムを停止した。委託先の調査では、業務システムのWebアプリケーションにアクセス制御と認証情報の管理の不備があり、これが悪用されたとみられる。
sources:
