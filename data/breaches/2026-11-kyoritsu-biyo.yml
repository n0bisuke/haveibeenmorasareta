summary: 公式ホームページのサーバーが第三者による不正アクセスを受け、問い合わせ・予約フォームを利用した2,736名分の個人情報が外部に持ち出されたと公表した。11月16日以降にサーバーへの不正侵入があり、20日に異常を検知してサーバーを遮断し、ホームページを停止した。対象は2024年8月16日から11月20日までのフォーム利用者で、氏名、連絡先、生年月日、希望施術、来院日時、相談内容など。住所、決済情報、写真を含む診療記録は含まれないとしている。個人情報保護委員会と厚生労働省に報告し、警察に相談した。
sources:
  - title: 共立美容外科、2,736名の個人情報漏えい サイバー攻撃で希望施術や相談内容も流出（セキュリティ対策Lab／moe zine）
    url: https://www.moezine.com/2615794/
checklist:
  - text: 施術や相談内容を引き合いに金銭を要求する連絡には応じない
  - text: 共立美容外科を装った不審なメール・電話に注意する
