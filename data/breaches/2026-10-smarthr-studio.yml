summary: SmartHRとグループ会社のSmart相談室、AIRVISA、BYARD、Looperが、Webサイトの制作・運用に使っていたStudioが不正アクセスを受け、企業情報サイトやサービス紹介サイトの問い合わせフォームを利用した計2,012人の氏名、会社名、電話番号、メールアドレス、問い合わせ内容などが流出した可能性があると公表した。グループが提供するクラウドサービスのデータは含まれず、二次被害は確認されていない。
