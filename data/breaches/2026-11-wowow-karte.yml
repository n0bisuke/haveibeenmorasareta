summary: 番組やサービスの案内（メール送信、アプリ・Webサイトでの通知）に利用しているマーケティングツール「KARTE」の提供元、株式会社プレイドが第三者の不正アクセスを受け、同システムに連携していた顧客の個人情報の一部が外部に漏えいした可能性があると公表した。対象は生年月日、性別、郵便番号、メールアドレス、内部管理用IDで、クレジットカード情報、金融機関口座情報、ログインパスワードは含まれない。二次被害は確認されていない。件数は調査中。
