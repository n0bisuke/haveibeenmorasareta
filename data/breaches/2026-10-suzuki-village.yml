summary: スズキの四輪公式コミュニティサイト「スズキヴィレッジ」のサービス提供事業者であるコミューン株式会社のサービスが、2026年10月5日から6日にかけて第三者による不正アクセスを受け、約3,000名分の会員情報が閲覧・取得された可能性がある。対象はメールアドレス・ニックネーム・参加日・性別・年代・居住地（都道府県）・所有車名で、クレジットカード情報や決済情報は含まれない。コミューンは6日に全コミュニティのサービスを停止し、スズキは7日に調査報告を受けた。コミューンによると、第三者が同社システムの不備を突き、管理者になりすますなどして会員情報を閲覧・取得した。不正アクセスを受けたのはコミューンのサーバーで、スズキのシステムとは直接接続しておらず、スズキのシステムへの侵入は確認されていない。スズキはサイトを停止したまま影響範囲の確認を進めている。現時点で悪用や二次被害は確認されていない。コミューンは同社サービス全体で約30.7万人（推計）の会員情報が漏えいしたと公表している。
