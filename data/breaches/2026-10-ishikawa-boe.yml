summary: 県立盲学校など県立7校のWebサイトで、教職員の設定ミスなどにより個人情報を含むファイルが外部から閲覧できる状態になっていたと公表した。盲学校では2026年1月のシステム改修以降、児童生徒110人の氏名、成績、出欠状況、保護者の氏名などが閲覧可能で、一部は検索エンジンからも見られた。ほかの6校では消し忘れたファイルで計28人の氏名や生年月日などが閲覧可能だった。8月に匿名の情報提供で判明した。不正アクセスではなく、二次被害は確認されていない。
