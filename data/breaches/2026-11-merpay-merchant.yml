summary: 加盟店向けの「メルペイ加盟店サービス」に11月5日、リスト型攻撃とみられる不正ログインがあり、加盟店10店のアカウントに不正にログインされ、加盟店情報11名分と利用者の取引情報2名分の計13名分が第三者に閲覧・取得された可能性があると公表した。11月6日までに対象アカウントのログイン状態の無効化とパスワードのリセットを行い、11月13日以降はワンタイムパスワードによる追加認証を導入した。11月20日から対象者に個別に連絡している。
