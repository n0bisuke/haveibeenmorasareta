summary: 予約システムのアマデウスへの不正アクセスにより乗客の情報が漏洩したと公表した。データ保護機関への書面によると、Norwegian と Widerøe の乗客14万4,249人分が対象で、氏名、旅程、パスポート番号、国籍、連絡先、航空券番号、便名、座席などが含まれる。支払い情報は含まれない。不正アクセスは2023年から続いていた。
