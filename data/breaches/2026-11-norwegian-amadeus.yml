count_note: Norwegian と Widerøe の乗客の合計（ノルウェーのデータ保護機関への書面）。日本の利用者への影響は未確認
cause: third_party
root_cause: 予約システムの委託先アマデウスのシステムが長期間不正アクセスを受けた
