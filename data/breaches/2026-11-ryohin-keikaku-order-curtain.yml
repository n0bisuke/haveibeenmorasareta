summary: オーダーカーテン業務の委託先MNインターファッションのシステム関連業務の委託先ナノテックが管理するサーバーが10月19日に不正アクセスを受け、2018年4月から2022年1月までに無印良品でオーダーカーテンを注文した顧客1万9,933件の氏名、住所、電話番号、注文情報、配送先住所が流出した可能性があると公表した。現在の受注業務は別のサーバーで運用している。対象者には郵送で連絡する。
