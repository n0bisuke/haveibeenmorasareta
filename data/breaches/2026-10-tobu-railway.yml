summary: お客さまセンターの問い合わせフォームで利用していたスカラコミュニケーションズのFAQシステム「i-ask」が不正アクセスを受けたと公表した。スカラからの報告では、東武鉄道に関する情報が閲覧・取得された形跡は確認されていないとしている。i-ask全体では利用企業最大5社・延べ最大713,126件が対象とされる。
