summary: 「リビングWeb」などを運営する同社のサーバーが10月16日に第三者の不正アクセスを受けた疑いがあり、会員、退会済みの利用者、アンケートシステムの利用者の氏名・連絡先などが漏えいした可能性があると公表し、サービスを停止した。クレジットカード情報は預かっていない。件数は調査中で、グループ会社に業務を委託していた三重県・島根県・広島県・宮城県登米市などが影響を公表している。
