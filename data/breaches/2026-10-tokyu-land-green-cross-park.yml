summary: 管理する「GREEN CROSS PARK 公式サイト」と「GREENUP Cooldown Project 公式サイト」のAWS共同サーバー環境が不正アクセスを受け、合計4,082件の個人情報が流出した可能性があると公表した。WordPress等の脆弱性とサーバー内のアクセス権限設定の不備を突かれた。対象は会社名、氏名、メールアドレス、電話番号、問い合わせ内容など。10月19日に発覚してサイトを遮断し、個人情報保護委員会に報告した。二次被害は確認されていない。
