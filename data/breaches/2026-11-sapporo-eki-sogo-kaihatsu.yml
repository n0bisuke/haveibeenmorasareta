summary: 札幌駅ビル「JRタワー」の商業施設アピアと札幌ステラプレイスで11月20日から予定していたクリスマス抽選会「JR TOWER WISH XMAS 2026」を中止すると発表した。外部業者のデジタル抽選システムが10月18日〜21日のテスト時に不正アクセスを受け、テスト用に登録していた社員4人のメールアドレスが第三者に閲覧された可能性があるとしている。顧客やテナントへの被害は確認されていない。
