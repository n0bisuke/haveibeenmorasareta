summary: 2024年以降に宮城県や山形県などで開いた男女のマッチングイベントのホームページの問い合わせフォームについて、ホームページの運営に関わる東京都内の企業が9月30日から10月1日にかけて不正アクセスを受け、延べ182人分の氏名や電話番号などが漏えいした可能性があると公表した。10月14日まで外部から取得できる状態だった。
