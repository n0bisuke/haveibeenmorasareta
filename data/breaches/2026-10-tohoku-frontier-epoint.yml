summary: ポイントサイト「eポイントモール」のメールマガジン配信に使っていたメール配信サービス「ブラストメール」の運営会社ラクスライトクラウドが不正アクセスを受け、最大約10万件のメールアドレスと会員の内部管理IDが漏えいした可能性があると公表した。氏名・住所・電話番号・パスワード・クレジットカード情報・口座情報は含まれないとしている。会社はメールマガジンの配信を停止し、サイトを一時閉鎖した。
