summary: インドアゴルフスクール「STEPGOLF」の業務システムと予約システムが不正アクセスを受け、個人情報を含むデータベースのバックアップファイルなどが外部に流出した可能性が極めて高いと公表した。11月5日にシステムの異常を検知し、10月23日と25日にも不正アクセスがあったことが分かった。対象は無料体験の申込者と現在・過去の会員で、第二報では登録件数を個人情報114,605件、顔写真107,781件、銀行口座情報12,707件とした。銀行口座情報は暗号化されずに保管されていた。
