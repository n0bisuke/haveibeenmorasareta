summary: 生活雑貨店「ケユカ」を運営する河淳株式会社は、メールマガジンとお知らせメールの配信に使っていたアララ株式会社の「アララメッセージ」が不正アクセスを受け、会員のメールアドレス1,214,183件が外部に流出したと公表した。10月28日にアララから連絡を受けて利用を停止し、29日には自社分は含まれないと説明されていたが、11月7日に流出があったと報告を受けた。対象は7月1日から10月28日に配信先となったメールアドレスで、それ以外の情報は流出していない。オンラインショップや会員管理システムは影響を受けていない。
