summary: 包括連携協定を結ぶ住友生命の業務委託先が管理するシステムが不正アクセスを受け、市が令和6年度に実施した「Vitality富岡ウォーク」の参加者のうち2人の氏名、生年月日、Vitality会員番号などが漏えいしたと公表した。参加者の個人情報は住友生命とその受託者が管理しており、市は保有していない。
