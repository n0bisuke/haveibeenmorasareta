summary: 生命保険契約照会システムで、未ログインの利用者に他の利用者の個人情報を参照できる権限を誤って付与しており、2021年7月のシステム開始から2026年7月まで外部から閲覧できる状態だった。外部のセキュリティ専門機関の指摘で判明し、重複を除く27,407人分の氏名・生年月日・住所・電話番号・メールアドレスなどが対象となった。契約内容や口座情報は含まれない。
