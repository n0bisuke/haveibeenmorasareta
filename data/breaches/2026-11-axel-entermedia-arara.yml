summary: ファンクラブや会員サイトを運営する株式会社アクセルエンターメディアは、メール配信に利用していたアララ株式会社のサービスが不正アクセスを受けたと11月4日に公表した。11月9日の第2報で、預託していた顧客情報のうちメールアドレス1,086,098件（重複を除く）の流出を確認し、一部のサイトでは配信のために登録していた氏名や会員番号なども流出したとした。パスワードとクレジットカード情報は預託しておらず対象外で、現時点で悪用による被害は確認されていない。同社がファンクラブ運営を受託する秋田ノーザンハピネッツも影響を公表している。
