summary: メールマガジンの配信を委託したアララのメール配信サービス「アララ メッセージ」が不正アクセスを受け、14誌の利用者のメールアドレス62,863件（重複を除くと61,751件）が漏えいしたと公表した。一部のメールマガジンでは氏名などの登録情報も漏えいした可能性がある。対象のメールマガジンの配信は停止した。具体的な二次被害は確認されていない。
