summary: 市のローカル人材育成事業の委託先である一般社団法人Feelが事業の運用に使っていたクラウドサービス「Studio」で不正アクセスが発生し、事業サイトのイベント申し込み・問い合わせフォームから2024年2月〜2025年11月に送信された208人の氏名、メールアドレス、電話番号、申し込み内容、問い合わせ内容が流出した可能性があると公表した。10月29日時点で流出は確認されていない。対象者にはメールで個別に知らせる。
