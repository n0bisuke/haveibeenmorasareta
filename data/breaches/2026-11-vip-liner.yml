summary: 高速バス予約サイト「VIPライナー」の予約入力フォームが9月12日〜13日に改ざんされ、9月13日〜28日に入力された約1万5,000件の氏名・住所などと、うち6,949件のクレジットカードの名義・番号・有効期限・セキュリティコードが漏えいした可能性があると報じられた。9月27日に利用者の問い合わせで発覚したが、対象者への通知は10月27日だった。カードの不正利用の相談も寄せられている。
