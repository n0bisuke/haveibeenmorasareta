summary: 「カスピ海ヨーグルト」と「フジッコ大感謝祭」のキャンペーンの非会員向け応募フォームで、応募受付の委託先サーバーが不正アクセスを受け、延べ約15,500件の氏名・年齢・性別・職業・婚姻状況・家族構成・電話番号・メールアドレス・住所・アンケート回答が漏えいした可能性があると公表した。
