summary: 市の移住定住サイト「ハピネスみつけ」で使う外部サービス「Studio」の運営事業者が不正アクセスを受け、2025年7月16日〜2026年10月5日に問い合わせフォームに寄せられた個人13件、企業57件の氏名、会社名、メールアドレス、電話番号、住所、問い合わせ内容が漏えいした可能性があると公表した。第三者が実際に取得した事実は確認されていない。対象者にはメールで連絡した。
