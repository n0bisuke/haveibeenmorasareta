organization: ロングランプランニング株式会社
services:
  - カンフェティ
industry: エンタメ・スポーツ
country: JP
date_occurred: 2026-11-26
date_announced: 2026-11-27
affected_count: null
count_note: 対象範囲・件数は調査中（第一報時点）。退会者を含む全会員が対象
cause: unauthorized_access
root_cause: チケット販売サービス「カンフェティ」のサーバーが第三者の不正アクセスを受けた
data_types:
  - メールアドレス
  - 会員ID
  - 氏名
  - 電話番号
  - 郵便番号
  - 生年月日
  - 住所
  - 性別
  - クレジットカード情報（番号の一部・有効期限等）
  - パスワード（保管形式不明）
summary: チケット販売サービス「カンフェティ」のサーバーが第三者による不正アクセスを受け、会員情報が外部に流出したことを確認したと公表した。11月26日に不審なアクセスを確認して緊急メンテナンスを行い、調査を開始した。退会者を含む全会員のメールアドレス、ログインID、氏名、電話番号、郵便番号、生年月日が対象で、一部会員は住所、性別、クレジットカード番号の一部、有効期限、名義なども、カンフェティカード会員の一部はパスワードも対象としている。件数は調査中で、不正利用の被害は確認されていない。
sources:
  - title: ロングランプランニング 不正アクセスによるカンフェティ会員情報漏洩に関するお詫びとご報告（第一報）
    url: https://longrun.biz/important/1122/
  - title: セキュリティ対策Lab
    url: https://rocket-boys.co.jp/security-measures-lab/longrun-confetti-member-data-breach-202611/
checklist:
  - text: カンフェティと同じパスワードを他サービスで使っていれば変更する
  - text: カンフェティを装ったメールや電話（カード番号・暗証番号を聞くもの）に注意する
