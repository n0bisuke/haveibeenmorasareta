summary: 会員情報を取得するAPIが第三者に不正利用され、最大2,251万9,960件の会員情報が流出した可能性があると公表した。不正アクセスは10月9日午前10時ごろに始まり、13日に検知して封じ込めた。対象はメールアドレス、パスワード、氏名、住所、電話番号・FAX番号、生年月日、会社名・役職などで、登録内容により異なる。クレジットカード情報は対象システムに保存していない。利用者にパスワードの再設定を求めている。
