count_note: 鯉に恋する郡山プロジェクト23件・55件、若者による地域資源リノベーション促進事業55件・5件、起業家教育事業2件の延べ140件（実人数ではない）
cause: third_party
root_cause: Webサイト制作に使うStudioのクラウド環境の一部機能の脆弱性を悪用され、フォームに送信された内容などが外部から取得できる状態になった
