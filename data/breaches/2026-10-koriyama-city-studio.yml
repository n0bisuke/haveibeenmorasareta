summary: 市の委託事業で使うクラウドサービス「Studio」が第三者の不正アクセスを受け、3事業5フォームの延べ140件の情報が漏えいした可能性があると公表した。「鯉に恋する郡山プロジェクト」の問い合わせ23件と鯉食キャンペーン申し込み55件、若者による地域資源リノベーション促進事業のイベント申し込み55件と問い合わせ5件、起業家教育事業の参加申し込み2件が対象で、氏名、メールアドレス、年齢、性別、住所、電話番号、所属、学校名、学年などが含まれる。二次被害は確認されていない。
sources:
  - title: 郡山市 委託事業で利用しているクラウドサービスに対する不正アクセスによる個人情報等の漏えいの可能性について（報道資料）
    url: https://www.city.koriyama.lg.jp/uploaded/attachment/132275.pdf
