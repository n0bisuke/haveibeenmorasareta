summary: 市のホームページと内閣府のサイトで公開していたNPO法人の役員・社員名簿で、住所のマスキング処理が外せる状態のまま掲載され、61法人計434人の住所が閲覧できる状態だったと公表した。マスキング処理後のデータをそのまま公開したことが原因で、市は対象者に謝罪文を送り、編集ソフトの導入などの再発防止策をとるとしている。
