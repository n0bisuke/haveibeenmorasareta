organization: 株式会社スノーピーク
services:
  - リユース買取サービス
  - イベント予約システム
  - コミュニティアプリ
  - 公式オンラインストア・会員アプリ
industry: 小売・EC
country: JP
date_occurred: 2026-10-29
date_announced: 2026-11-13
affected_count: 24948
count_note: 計4件の事案のうち最大のリユース買取サービスの人数（調査中）。ほかにイベント予約5,923名、コミュニティアプリ21,553名、公式オンラインストア・会員アプリへの不正ログイン最大445アカウント。重複の有無は不明
cause: vulnerability
root_cause: 買取・予約・コミュニティの各サービスの脆弱性を突かれ、別途外部取得の認証情報で不正ログインされた
attack_methods:
  - credential_stuffing
data_types:
  - 氏名
  - 生年月日
  - 性別
  - メールアドレス
  - 電話番号
  - 住所
  - 会員ID
  - 口座番号
  - 購入履歴
  - 利用履歴
  - アカウント名
  - ポイント情報
  - クレジットカード情報（番号の一部・有効期限等）
summary: リユース買取サービス、イベント予約システム、コミュニティアプリへの不正アクセスと、公式オンラインストア・会員アプリへの不正ログインの計4件を公表した。買取サービスでは脆弱性を突かれ、24,948名の氏名・住所・生年月日・振込先口座情報などが流出した可能性がある。イベント予約では5,923名、コミュニティアプリでは21,553名の情報が流出した。外部で取得されたとみられる認証情報で最大445アカウントに不正ログインされ、購入履歴や保有ポイント、カード番号の一部が閲覧された可能性がある。パスワードとカード番号の全桁は含まれない。
sources:
  - title: スノーピーク 不正アクセスによる個人情報流出に関するお詫びとお知らせ
    url: https://www.snowpeak.co.jp/news/p20261113-0/
