summary: 利用している株式会社プレイドの「KARTE」が11月13日に第三者の不正アクセスを受け、連携していた「タイミー」の求人事業者の担当者最大226,662人分のメールアドレス、姓もしくは名、電話番号、サービス上の顧客管理IDが漏えいしたと公表した。ログイン用のIDやパスワードなどの認証情報、求職者（ワーカー）の情報は含まれず、自社システムへの不正アクセスではないとしている。二次被害は確認されていない。
