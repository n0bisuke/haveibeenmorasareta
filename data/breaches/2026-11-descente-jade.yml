summary: 公式通販サイト「DESCENTE STORE オンライン」の運営を委託しているジェイドグループの管理システムがサイバー攻撃（不正アクセス）を受け、会員サービス「CLUB DESCENTE」の会員の個人情報の一部が外部に漏えいした可能性があると公表した。対象は11月23日時点の会員で、氏名、住所、電話番号、生年月日などが含まれる可能性がある。件数は公表していない。
