summary: 通販向けの「クロネコ代金後払いサービス」への第三者からの不正アクセスを9月28日に確認し、同日中にサービスを停止。10月16日の第4報で、2018年10月から2026年9月の一部利用者の氏名、住所、電話番号、商品明細など約531万件が漏えいしたと公表した。クレジットカード情報とパスワードは含まれず、請求金額・債権残高は持ち出しが確認されなかった。10月9日にサービスを再開した。
