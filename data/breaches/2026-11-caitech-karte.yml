summary: 介護・医療のスポットワークサービス「カイテク」で過去に利用していた株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、登録ワーカーの個人情報が流出したと公表した。KARTEの契約は2025年1月末に終了していたが、プレイドのシステム上に情報が残っていた。11月18日の続報で、流出した個人情報はメールアドレス27,530件と確定した。ユーザーID、性別、年齢・生年月日、居住地の都道府県も流出したが、メールアドレスとは紐づかない状態で、姓名は流出していないとした。
sources:
  - title: カイテク (続報)過去の委託先における不正アクセスに関する調査結果のお知らせ
    url: https://corp.caitech.co.jp/news/notice261118/
  - title: Yahoo!ニュース（Impress Watch）「KARTE」情報漏えい、JINS・三菱UFJなど多数の企業に影響
    url: https://news.yahoo.co.jp/articles/73dc334fce8b98800001ebfe01bb9eda361f6448
checklist:
  - text: メールアドレスが流出した対象のワーカーにはメールで順次連絡するとしている
  - text: 同社はメールでパスワードや口座情報を尋ねることはないとしている。同社やプレイドを名乗る不審なメールに注意する
