summary: Webベースのファイルマネージャーに使っていた他社製ソフトウェアの脆弱性を突かれ、2026年8月から10月23日まで不正アクセスを受けていたと公表した。期間中にログインした利用者のFTP/SFTPのユーザー名・パスワードが盗まれ、サーバー上のファイルやメールの内容が閲覧された可能性がある。一部のWebメール利用者はセッション情報も対象。請求・決済情報へのアクセスは確認されていない。対象者のパスワードを無効化した。
