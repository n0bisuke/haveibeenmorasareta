count_note: 件数は非公表（有料顧客の10%を大きく下回るとの報道）。日本の利用者への影響は未確認
cause: vulnerability
root_cause: ファイルマネージャーに使っていた他社製ソフトの脆弱性を突かれ、FTP/SFTPの認証情報やWebメールのセッションが盗まれた
