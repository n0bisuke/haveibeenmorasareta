summary: ISP事業者向けに提供するメールシステムで使っていた第三者製ソフトウェアの脆弱性を悪用され、2026年5月中旬から不正アクセスを受けた。続報で、メールアドレス12,231,954件と、そのうち7,616,173件のパスワードの漏えいを確認した。対象サービスの利用者にパスワード変更が呼びかけられた。
