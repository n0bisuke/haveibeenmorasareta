summary: 犯罪的なサイバー攻撃を受け、限られた範囲の個人情報と事業情報に不正アクセスされたと公表し、法執行機関と連携しているとした。影響を受けた人数や組織数、発生時期、事業情報の内容は明らかにしていない。報道によると、ハッカー集団が12GBの内部ファイルを盗んだと主張しているが、FIFAはこの主張を確認していない。
