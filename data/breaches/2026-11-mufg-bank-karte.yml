summary: Webサイト・アプリでの顧客への案内業務を委託している株式会社プレイドのサービス「KARTE」が第三者による不正アクセスを受け、委託契約に基づき提供していた顧客の性別・年齢・居住地域（都道府県または政令指定都市）約650万件が外部に漏えいしたと公表した。氏名、住所、電話番号、メールアドレスなど第三者が顧客を特定・連絡できる情報は含まれておらず、同行のシステムへの不正アクセスではないとしている。不正利用等の被害は確認されておらず、対象の顧客にはメール等で個別に連絡するとした。
sources:
  - title: 当行委託先が提供するサービスへの不正アクセスについて（三菱UFJ銀行）
    url: https://www.bk.mufg.jp/news/news2026/pdf/news1118.pdf
checklist:
  - text: 三菱UFJ銀行からのメール等による個別連絡を確認する
  - text: 同行や関係会社を装った身に覚えのないメール・SMS・電話には応答や操作をしない
