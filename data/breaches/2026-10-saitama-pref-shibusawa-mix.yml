count_note: 約2,200人（渋沢MIXが会員申請を受け付けた会員等。氏名やメールアドレスなどが記載された一覧を閲覧された人数）。うち3人はさらに詳細な情報（産経新聞によると住所など）も閲覧された。県は被害等の詳細な状況の調査を継続中
