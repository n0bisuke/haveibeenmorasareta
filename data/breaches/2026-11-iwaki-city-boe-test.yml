  - 氏名
summary: 公立学校の教員が7月ごろにテスト結果を印刷して印刷機に置き忘れ、それが再利用紙の箱に入れられた結果、授業で配ったプリントの裏面に印刷されていたため、子ども2人の氏名や点数などが別の学年の子ども1人に漏えいしたと公表した。11月6日に別の教員が気付いた。個人情報が載った文書は原則として再利用せず廃棄するとした。
