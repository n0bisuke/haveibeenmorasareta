summary: 10月28日に公式アプリの管理システムへの不正アクセスを検知し、アプリやWebサービスを停止したと29日に公表した。30日の第2報で、松弁ネット・モバイルオーダー・松弁デリバリーの利用者2,377,127件の会員ID・届け先の氏名・住所・電話番号・松屋ポイントと、アプリ会員約2,000件の生年月日・メールアドレス・暗号化済みパスワードなどが漏えいしたと公表した。クレジットカード情報は保持していない。アプリ会員には停止期間中の補償を予定している。
