summary: 大阪のIT企業アルカディアが不正アクセスを受け、松山市や今治市など複数の自治体で登録されたメールアドレスや氏名、住所、職員番号などの個人情報が漏洩した可能性があると報告された。影響を受けた自治体の配信サービスは停止され、現在までに不正利用は確認されていない。全国の自治体で最大310万件以上が対象になる可能性があるとされている。
