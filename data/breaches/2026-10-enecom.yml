organization: 株式会社エネコム
group: 中国電力グループ
industry: IT・通信
country: JP
date_occurred: 2026-10-06
date_announced: 2026-10-09
affected_count: 2940
count_note: 2,940件（うち同社社員情報1,838件）。11月16日の調査完了報告の値
cause: unauthorized_access
root_cause: 不正取得された保守用アカウントでシンクライアント環境から社内ネットワークに侵入され、社員アカウントも悪用された
attack_methods:
  - stolen_credentials
data_types:
  - 氏名
  - メールアドレス
  - 電話番号
  - 従業員情報
  - 取引先情報
  - 保存データ（写真・文書等）
summary: 10月6日に社内ネットワークへの第三者の不正アクセスを確認し、10月9日に第一報を公表した。11月16日に調査完了を公表し、不正取得された保守用アカウントでシンクライアント環境を経由して侵入され、複数の社員アカウント情報も取得・悪用されたと説明した。社内ファイルサーバーの業務資料などが流出し、顧客や社員の氏名・勤務先・役職・メールアドレス・電話番号など個人情報2,940件（うち社員1,838件）が流出したとしている。口座・カード情報や「メガ・エッグ」等の顧客情報の流出は確認されていない。
