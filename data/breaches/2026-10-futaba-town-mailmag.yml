summary: 町のメールマガジンに使う配信サービス「ワイメール」が10月24日未明に不正アクセスを受け、登録者にクレジットカード会社を装った不審メールが届いた。10月27日の調査で、最大60件の登録名とメールアドレスが流出した可能性があると判明した。メールマガジンの配信を停止した。
