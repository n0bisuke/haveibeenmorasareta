summary: 企業型確定拠出年金の顧客への通知メールの配信に使っていた外部のメール配信サービスが不正アクセスを受け、2022年9月以降に通知メールを受け取った顧客のメールアドレスなど最大約25万件（うち約1万件は氏名を含む）が漏えいした可能性があると公表した。漏えいは確認されていない。企業型DCを共同運営する名古屋銀行なども顧客への影響を公表している。
