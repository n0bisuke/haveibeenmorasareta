summary: カードローン等の保証提携先SMBCコンシューマーファイナンスの保証業務システムが不正アクセスを受け、当社カードローンを利用する最大122,635人の氏名・性別・生年月日・住所・電話番号・メールアドレス・運転免許証番号・勤務先情報（年収等）・契約情報（保証額等）が漏えいしたと公表した。本人確認書類の画像は含まれず、銀行システムへの不正アクセスは確認されていない。11月13日には保証会社が対象者へSMSと郵送で案内を始めたと追記し、二次被害は確認されていないとした。
