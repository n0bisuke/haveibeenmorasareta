summary: 「田中電気マーケット 楽天市場店」は、利用する外部システム「GoQSystem」が11月10〜11日に第三者の不正アクセスを受け、同システムで管理する注文データの一部が外部に持ち出されたと公表した。11月20日の更新で、同店の対象は注文347件と公表した。漏えいした可能性があるのは注文者の氏名、住所、電話番号、メールアドレス、届け先の氏名、住所、電話番号、注文内容、注文日時など。クレジットカード情報は対象外。対象者には個別に連絡するとしている。
