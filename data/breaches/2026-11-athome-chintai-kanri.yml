summary: 不動産会社向け業務管理サービス「賃貸管理システム」の管理サイトが11月9日に第三者による不正アクセス・ログインを受け、利用する一部の加盟不動産会社が登録した入居者・オーナー・取引先などの個人情報6,901件が漏えいした可能性があると公表した。氏名、生年月日、電話番号、住所、建物名・部屋番号・契約状況などが含まれる。口座情報の漏えいは確認されておらず、クレジットカード情報は保有していない。
