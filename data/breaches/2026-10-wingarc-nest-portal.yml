summary: ユーザー向け交流サイト「nest Portal」で利用するコミューン株式会社のクラウドサービスが第三者による不正アクセスを受け、サイトの管理者アカウントが不正に利用されて一部の会員情報が取得・閲覧された可能性がある。対象は約1,200名（現時点の推定）で、企業名・役職・氏名・フリガナ・メールアドレス・住所などの登録情報が含まれる可能性があり、対象者・人数・情報の範囲は調査中。ウイングアーク１ｓｔは2026年10月6日にコミューンから不正アクセスの報告を受け、同日コミューンがnest Portalのサービスを停止した。7日に調査結果の速報を受け、8日に個人情報保護委員会へ報告して全会員に不正アクセスの発生をメールで通知した。コミューンによると、同社サービスは10月5日18時ごろから不正アクセスを受け、第三者が同社システムの不備を突き、管理者になりすますなどして会員情報を閲覧・取得した。コミューンは同社サービス全体で約30.7万人（推計）の会員情報が漏えいしたと公表しており、現時点で悪用や二次被害は確認されていないとしている。
