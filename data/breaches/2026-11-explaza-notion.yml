summary: 業務で使うNotionのAI機能について、Notionの提供元から、同社のベンダーFireworks AIで起きたセキュリティインシデントにより、利用者がNotion AIに入力した内容と回答の記録の一部が影響を受けた可能性があるとの通知を11月10日に受けたと公表した。記録には個人情報や業務情報が含まれる可能性があり、内容と範囲を調査中。個人情報保護委員会に報告し、連絡が必要な人には個別に連絡するとした。
