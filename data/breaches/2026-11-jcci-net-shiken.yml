summary: ネット試験に使う外部サーバー上の試験管理システムが不正アクセスを受け、簿記など8試験の受験者最大約98万人分（約197万件）の情報が漏えいした可能性があると公表した。11月1日に不正なプログラムが設置され、4日にシステム管理会社の報告で発覚した。対象は2022年4月以降の受験者の氏名、性別、生年月日、合否結果、試験得点などで、メールアドレス・電話番号・住所は入力した人のみ。決済情報は含まない。
