summary: バンダイナムコグループの物流子会社で、10月21日に物流システム内のサーバーで不正アクセスが疑われる痕跡を見つけ、サーバーを停止した。その後「一番くじ ONLINE」の配送情報を格納するサーバーにも痕跡が見つかり、氏名・住所・電話番号が漏えいした可能性があるとバンダイナムコホールディングスが公表した。クレジットカード情報は含まれない。件数は調査中。
