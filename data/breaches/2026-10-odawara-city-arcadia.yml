summary: 小田原市は、災害情報配信システムの提供事業者である株式会社アルカディアの配信サービス「SpeeCAN RAIDEN」が不正アクセスを受け、登録情報が漏えいした可能性があると公表した。対象は防災メール約21,600件（メールアドレス）のほか、電話配信サービス、FAXサービス、熱中症警戒アラート通知サービス、職員参集用メールの計約1,630件（メールアドレス、電話・FAX番号、施設名・職員氏名）。
