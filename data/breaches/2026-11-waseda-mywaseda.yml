count_note: 延べ件数。教職員（退職者を含む）・学生・卒業生などの個別情報81件と、職員などのユーザー情報3,261件。暗号化されたパスワードを含むのは3,281件
cause: unauthorized_access
root_cause: MyWasedaのユーザー情報を管理するシステムに第三者が侵入した。侵入経路は調査中
