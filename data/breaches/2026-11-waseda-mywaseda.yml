  - パスワード（ハッシュ化・暗号化済み）
summary: MyWasedaへのログインに使うユーザー情報を管理するシステムに第三者が侵入し、教職員・学生・卒業生などの個別情報81件と職員などのユーザー情報3,261件、延べ3,342件の情報が取得されたと公表した。PHPの脆弱性への対応で点検した際に、8月31日の不正アクセスの痕跡を見つけた。対象は教職員番号、氏名、Wasedaメールアドレス、所属部署名、資格名、暗号化されたパスワードなど。関係システムの停止や学外との通信制限を行い、パスワードの変更を案内した。
