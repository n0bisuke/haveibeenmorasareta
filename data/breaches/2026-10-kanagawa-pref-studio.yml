summary: 2021年度の成長期ベンチャー交流拠点事業の委託で、受託事業者（パーソルイノベーション、現在は事業を継承したeiicon）が企業の提案受付に使ったStudioのフォームのデータが、不正アクセスで第三者に取得された可能性があると公表した。企業名、担当者名・役職、電話番号、メールアドレス、提案内容の概要などが対象。第1報では約85件としていたが、11月6日の最終報で88件と確定し、対象者全員への連絡と注意喚起を完了した。
