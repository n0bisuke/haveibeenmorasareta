summary: 人事関連システム導入業務の委託先である株式会社T4Cの従業員が、9月16日に同社の委託業務に関する資料を他社宛てのメールに誤って添付して送信したと公表した。資料には2005年10月31日から2025年7月31日までに退職した2,092名全員と現従業員1名の氏名・社員番号が含まれていた。送信先からの連絡で同日に判明し、ファイルは開封されずに削除されたことを確認した。10月15日に個人情報保護委員会へ報告した。退職者への個別連絡が難しいため、お知らせで報告に代えるとしている。
