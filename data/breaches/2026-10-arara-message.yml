summary: メール配信サービス「アララ メッセージ」の1つの環境のWebサーバーが脆弱性を悪用した不正アクセスを受け、エンドユーザーのメールアドレス約301万件が流出したと公表した。10月22日から緊急メンテナンスで停止していた。メールアドレス以外の流出は確認されていない。鹿児島の決済アプリ「Payどん」なども利用企業として影響を公表している。11月2日の第2報で、契約企業向けのサーバー97台への侵入が新たに判明し、最大約380社のメールアドレス約7,700万件と、契約企業が登録した氏名・性別・生年月日・電話番号・会員番号・住所などの持ち出しを確認したと公表した。10月28日〜30日には攻撃者がアララのサーバーからカード会社を装う不審メールを最大約713万通送信し、10月31日に全サービスを停止した。
