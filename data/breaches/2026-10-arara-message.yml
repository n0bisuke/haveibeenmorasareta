summary: メール配信サービス「アララ メッセージ」の1つの環境のWebサーバーが脆弱性を悪用した不正アクセスを受け、エンドユーザーのメールアドレス約301万件が流出したと公表した。10月22日から緊急メンテナンスで停止していた。メールアドレス以外の流出は確認されていない。鹿児島の決済アプリ「Payどん」なども利用企業として影響を公表している。
