summary: 過去にメール配信業務を委託していた株式会社WOW WORLDのサーバーが第三者の不正アクセスを受け、同社の作業用サーバーに残っていたデータファイルから、顧客のメールアドレス9,313件が外部に漏えいしたと公表した。2020年の「【Tポイント】Q＆Aメール」配信に使ったデータで、契約終了時に削除されるべきものが残っていた。不正アクセスは11月7日に発生し、11月16日に報告を受けた。氏名、住所、パスワード、ポイント数、クレジットカード情報などは含まれず、同社システムやVポイントのサービスへの不正アクセスは確認されていない。
