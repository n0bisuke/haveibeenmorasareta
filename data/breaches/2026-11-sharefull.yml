  - title: ITmedia NEWS
    url: https://www.itmedia.co.jp/news/article/2611/10/2000003072/
checklist:
  - text: シェアフルからのお知らせで対象かどうかを確認する
    url: https://sharefull.com/information/9487/
    link_title: ユーザー向けのお知らせ
  - text: 給与振込口座の入出金を確認し、身に覚えのない取引があれば銀行に連絡する
  - text: シェアフルや求人企業を名乗るSMS・電話・メールのリンクは開かない
