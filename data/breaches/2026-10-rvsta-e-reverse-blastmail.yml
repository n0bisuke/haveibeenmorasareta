summary: 建設業向け電子マニフェストサービス「e-reverse.com」のメール配信に使っていたブラストメールが不正アクセスを受け、配信先として登録していたメールアドレス12万件が漏えいしたと公表した。10月23日に第1報、28日に第2報、11月5日に第3報を出した。氏名、社名、e-reverse.comのユーザーID・パスワード、支店名などの所属情報は含まれない。11月5日までに別のメール配信サービスで対象のアドレスにお詫びと注意喚起のメールを送った。
