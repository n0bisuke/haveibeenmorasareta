summary: Webサイトの制作・運用に使っていたStudioが不正アクセスを受け、コーポレートサイトと一部サービスサイト、過去のキャンペーンサイトの問い合わせフォームに送信された9,132件の情報が漏えいした可能性があると公表した。全フォームに共通する項目はメールアドレスで、フォームにより氏名、会社名、部署名、電話番号、問い合わせ内容などが含まれる。実際の取得は確認されていないが取得されたものとみなして対応しており、二次被害は確認されていない。
