summary: 一部のメール配信に使っていたユミルリンクの「Cuenote FC」が不正アクセスを受け、メールアドレスなどが漏えいしたと公表した。10月23日に第一報を出し、ユミルリンクから11月2日に不正取得されたリスト、6日に詳細な調査結果を受け取り、11月9日の第二報で影響を公表した。データベースへの不正アクセスで約280万人（取引先を含む）の配信先メールアドレスが、アドレス帳への不正アクセスで約8,000人のメールアドレスと、一部の人の氏名（取引先は氏名・所属会社・部署名など）が漏えいした。クレジットカード情報は保持・送信しておらず対象外。
