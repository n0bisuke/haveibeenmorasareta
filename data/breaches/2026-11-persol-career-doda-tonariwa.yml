  - 電話番号
summary: 転職サービス「doda」のLINE公式アカウントの運用に使っている株式会社電通デジタルの「TONARIWA」が不正アクセスを受け、利用者の情報が漏えいした可能性があると11月12日に公表した。11月26日の第二報で、氏名、生年月日、性別、電話番号、勤務先、在職区分などの個人のお客様情報61万6,329件の漏えいを確認したと発表した。11月10日に不正アクセスのログが確認され、電通デジタルは同日深夜にサービスを停止した。
