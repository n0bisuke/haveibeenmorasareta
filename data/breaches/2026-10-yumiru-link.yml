date_announced: 2026-10-19
affected_count: 51628280
count_note: 延べ51,628,280件（49システム。うち16システムは件数を調査中で今後増える可能性。重複を含む）。第一報は5システム・延べ約900万件
cause: vulnerability
attack_methods:
  - stolen_credentials
root_cause: プログラムの脆弱性を突いてサポート担当者の認証情報を取得され、不正なプログラムを置かれてデータベースから出力された
data_types:
  - メールアドレス
summary: メール配信サービス「Cuenote FC」の専用ASPプランの5システムが不正アクセスを受け、メールアドレスを含む情報が延べ約900万件出力されたとみられると公表した。10月16日未明に検知した。攻撃者はプログラムの脆弱性を突いてサポート・品質管理担当者の認証情報を取得し、不正なプログラムを置いてデータベースから情報を出力した。同サービスは企業や自治体が利用しており、影響の範囲は調査中としている。10月26日の第二報で、侵入は10月2日〜7日で、漏えいは49システム・延べ5,162万8,280件に拡大したと公表した。新幹線予約のエクスプレス予約・スマートEXや野村證券など、利用企業が相次いで影響を公表している。
