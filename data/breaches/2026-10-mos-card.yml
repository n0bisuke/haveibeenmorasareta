summary: プリペイドカード「モスカード」の運用・保守を委託しているバリューデザインのシステムが不正アクセスを受け、カード113万3,070件の16桁のカード番号、6桁のPIN、残高情報が流出したと公表した。流通済みのカードは約57万件。委託先が10月14日〜18日に不審なアクセスと不正ログインの試行を検知した。氏名・住所・電話番号・クレジットカード情報は含まれない。PINは強制的に変更した。
