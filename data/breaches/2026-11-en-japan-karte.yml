organization: エン株式会社
services:
  - エン転職
  - ミドルの転職
industry: 人材・教育
country: JP
date_announced: 2026-11-18
affected_count: 13019
count_note: エン転職の求職者情報545件、ミドルの転職の企業アカウントのメールアドレス12,474件の合計（11月18日時点）
cause: third_party
root_cause: 委託先プレイドの「KARTE」が不正アクセスを受け、登録していた求職者・企業の会員情報の一部が漏えいした
vendor:
  name: 株式会社プレイド
data_types:
  - 会員ID
  - 性別
  - メールアドレス
summary: 株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、同サービスに登録していた会員情報の一部が外部に漏えいしたと公表した。11月18日時点で判明したのは、「エン転職」の求職者545件のユーザーID、性別、年齢、都道府県と、「ミドルの転職」の企業アカウントに登録されたメールアドレス12,474件。エン転職の求職者の氏名やメールアドレスの漏えいは確認されていない。同社のシステムへの不正アクセスは確認されておらず、KARTEとの連携停止と認証情報の無効化、個人情報保護委員会への報告を行い、対象者に個別に連絡している。
sources:
  - title: エン 当社が利用する外部サービス「KARTE」への不正アクセスによるお客様情報の漏えいに関するお詫びとお知らせ
    url: https://corp.en-japan.com/newsrelease/2026/46717.html
checklist:
  - text: 対象者にはメールなどで個別に連絡しているとしている
  - text: エンや関係企業を装った不審なメールのURL・添付ファイルを開かず、個人情報やパスワードを入力しない
