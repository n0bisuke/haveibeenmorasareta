date_occurred: 2026-11-17
date_announced: 2026-11-18
affected_count: 30002
count_note: メールアドレス30,002件と暗号化されたパスワード26,614件の漏えいを確認（利用者登録数は30,139件）。88アカウントで不正ログインを確認。居住区・生年月日・子どもの生年月日などの属性情報、変更履歴、ログイン履歴は漏えいの可能性があり範囲を調査中
cause: third_party
root_cause: 委託事業者インクレイブが運用するメール配信サービスが脆弱性を悪用され不正アクセスを受けた
vendor:
  name: インクレイブ株式会社
data_types:
  - メールアドレス
  - パスワード（ハッシュ化・暗号化済み）
  - 生年月日
  - 保存データ（写真・文書等）
summary: イベントや子育て、ごみ収集などの市政情報を配信する「仙台市メール配信サービス」が第三者の不正アクセスを受け、登録者のメールアドレス30,002件、暗号化されたパスワード26,614件、市からの配信メールの件名・本文・添付ファイルが漏えいしたと公表した。パスワードの一部は解析され、88件の利用者アカウントへの不正ログインを確認した。居住区や生年月日、子どもの生年月日などの属性情報も漏えいした可能性があり調査中。11月17日、職員が業務用アドレスに届いたパスワード再設定メールを不審に思い、委託事業者のインクレイブに調査を依頼して発覚した。悪用された脆弱性は同日修正し、全利用者のパスワードを初期化した。
