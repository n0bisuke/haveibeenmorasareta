cause: unauthorized_access
root_cause: 運営するECサイトが外部の第三者から不正アクセスを受けた
data_types:
  - 氏名
  - 住所
  - 電話番号
summary: 運営するECサイトが外部の第三者から不正アクセスを受け、会員情報を含む顧客データの一部が外部に流出したと公表した。11月15日に不審なアクセスを確認して調査を始めた。流出した情報には氏名、住所、電話番号などが含まれる可能性がある。不正なプログラムを除去し、クレジットカード情報は流出していないとしている。
sources:
