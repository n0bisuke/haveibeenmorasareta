  - title: アウトレットプラザ、ECサイトへの不正アクセスで個人情報漏えい 不正プログラムを除去、クレジットカード情報の流出はなし（セキュリティ対策Lab）
    url: https://rocket-boys.co.jp/security-measures-lab/outletplaza_ec_data_breach_20261126/
checklist:
  - text: アウトレットプラザを装った不審なメールや電話に注意する
  - text: 同じパスワードを他のサービスで使っていれば変更する
