date_announced: 2026-11-12
affected_count: null
count_note: 漏えいのおそれがある範囲と対象者は調査中
cause: unauthorized_access
root_cause: 従業員の業務用GitHub認証情報1件が流出し、第三者に社の管理領域へアクセスされた
attack_methods:
  - stolen_credentials
data_types:
  - 氏名
  - メールアドレス
  - 取引先情報
summary: ソフトウェア開発に使うGitHub上の同社管理領域に不審なアクセスがあり、個人情報が漏えいしたおそれがあると公表した。外部機関からの情報で従業員の業務用GitHub認証情報1件の流出が分かり、アクセスログで11月5日にこの認証情報を使った第三者によるとみられるアクセスを確認した。保存されていた一部顧客の企業名・氏名・メールアドレスなどと、サービス利用に伴う通信関連情報が閲覧・取得されたおそれがあり、範囲は調査中。
