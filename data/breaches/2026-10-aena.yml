summary: 公式ECアプリの会員マイページが第三者による不正アクセスを受け、最大81万7,215人分の会員情報が閲覧された可能性があると公表した。10月13日にシステムログの解析で判明した。対象は氏名、住所、電話番号、生年月日などと、登録したクレジットカードの下4桁・有効期限・名義で、カード番号の全桁とセキュリティコードは保持していない。ログインパスワードの流出は確認されていない。
