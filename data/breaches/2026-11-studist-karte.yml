summary: 主に顧客への案内（メール配信など）に使っていた株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、プレイドの調査でKARTEに連携していた情報の一部が漏えいの対象に含まれると報告を受けたと公表した。漏えいした情報にはメールアドレスや氏名など個人情報が含まれる可能性があり、範囲、項目、対象者は調査中としている。KARTEとの連携に使っていた認証情報は無効化した。KARTEはTeachmeシリーズとは別のシステムで、Teachmeシリーズへの影響はないとしている。
