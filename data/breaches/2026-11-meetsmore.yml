organization: 株式会社ミツモア
services:
  - ミツモア
industry: 生活サービス
country: JP
date_occurred: 2026-11-11
date_announced: 2026-11-16
affected_count: 366850
count_note: システムの脆弱性による漏えいの可能性がある件数（最大）。別に不正ログインされたアカウントが201件
cause: vulnerability
root_cause: 外部で入手されたとみられるIDとパスワードで不正ログインされ、空き状況表示機能の脆弱性を悪用された
attack_methods:
  - credential_stuffing
data_types:
  - 住所
  - 電話番号
  - 会員ID
  - 氏名
  - メールアドレス
  - メッセージ・チャット履歴
  - 問い合わせ内容
summary: 見積もりサービス「ミツモア」が第三者の不正アクセスを受け、事業者の予定に登録された依頼者の住所・電話番号、識別番号、オンライン会議URLなど最大36万6,850件が漏えいしたと公表した。外部で入手されたとみられるIDとパスワードで812回のログイン試行があり201件のアカウントに不正ログインされ、そのアカウントから事業者の空き状況を表示する機能の脆弱性を悪用して情報が取得された。不正ログインされたアカウントでは氏名・メールアドレス・依頼内容・メッセージなどが閲覧された可能性がある。脆弱性は11月12日に修正した。「プロワン」は影響を受けておらず、KARTE経由の漏えいとは別の事案。
sources:
  - title: ミツモア 不正アクセスによる個人情報漏えいに関するお詫びとお知らせ
    url: https://company.meetsmore.com/page/notice-20261116
  - title: Yahoo!ニュース
    url: https://news.yahoo.co.jp/articles/a77bdf7b31a74f59b64e5506c83357ec5e93043d
checklist:
  - text: ミツモアと同じパスワードを使っている他のサービスはパスワードを変更する
  - text: 事業者はミツモア内で登録したオンライン会議URLを再発行する
  - text: ミツモアや事業者を名乗る不審な電話・訪問・SMS・メールに注意する
