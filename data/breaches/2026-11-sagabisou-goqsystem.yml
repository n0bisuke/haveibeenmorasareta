summary: 楽天市場の「くらしのポトフ」は、利用する受注管理システム「GoQSystem」が11月10〜11日に第三者の不正アクセスを受け、個人情報を含む注文データの一部が外部へ流出したと公表した。対象は注文者・届け先の氏名、住所、電話番号、メールアドレス、注文内容などで、期間より前の注文も含む。対象範囲と件数は調査中。クレジットカード情報は非保持のため対象外で、二次被害は確認されていないとしている。
