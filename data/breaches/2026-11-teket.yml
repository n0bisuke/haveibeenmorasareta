organization: 株式会社teket
services:
  - 電子チケット販売・管理サービス「teket」
industry: エンタメ・スポーツ
country: JP
date_occurred: 2026-11-05
date_announced: 2026-11-08
affected_count: null
count_note: 全会員の氏名とメールアドレスの流出を確認。件数は精査中。横浜DeNAベイスターズ・京都市・大阪市・神奈川県・石川県立音楽堂など、チケット販売に利用していた主催者も影響を公表している
cause: unauthorized_access
root_cause: 会員情報などを管理するシステムが外部から不正アクセスを受けた。手口は公表されていない
data_types:
  - 氏名
  - メールアドレス
  - 生年月日
  - 性別
  - 住所
  - 電話番号
  - 購入履歴
summary: 電子チケット販売・管理サービス「teket」が第三者の不正アクセスを受け、会員情報が流出したと公表した。11月5日に不正アクセスの可能性が高いと判断して全サービスを停止し、6日に会員情報などを管理するシステムから情報が流出したことを確認した。全会員の氏名とメールアドレスが流出し、登録・購入した会員は生年月日、性別、住所、電話番号、チケットの発券用コード、主催者発行のシリアルコードも対象。件数は精査中。チケット販売に利用していた横浜DeNAベイスターズや自治体なども影響を公表した。
