    url: https://r-up.jp/news/2026-11-18-karte/
checklist:
  - text: 対象の顧客には詳細が判明しだい個別にメールで知らせるとしている
  - text: モアコンタクトがメール・SMS・電話でパスワードやクレジットカード情報を尋ねることはないとしている
