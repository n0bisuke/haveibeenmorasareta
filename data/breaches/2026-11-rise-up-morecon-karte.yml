  name: 株式会社プレイド
summary: コンタクトレンズ通販「モアコンタクト」がサイトやアプリの改善、顧客への案内に使っていた株式会社プレイドのマーケティングツール「KARTE」が第三者の不正アクセスを受け、モアコンタクトがKARTEに登録していた顧客情報の一部が流出したと公表した。11月15日にプレイドから報告を受けた。流出した情報の項目と件数は確認中で、対象の顧客には判明しだいメールで個別に知らせるとしている。同社は10月28日にもメール配信サービス「Cuenote FC」への不正アクセスによる情報流出を公表している。
sources:
