summary: インターネット取引システムの運用・保守を委託するトレードワークスのシステムが不正アクセスを受け、顧客4,611人の氏名やメールアドレスなどが漏えいしたと公表した。システムの一部の管理機能の設定不備が悪用された。10月14日に検知した。パスワードが取得された事実は確認されておらず、漏えいした情報だけでは口座へのログインや売買はできないとしている。
