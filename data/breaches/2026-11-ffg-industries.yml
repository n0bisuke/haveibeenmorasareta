services:
  - 受発注システム等のデータ分析ツール
industry: 製造
country: JP
date_announced: 2026-11-19
affected_count: 1221
count_note: 1,221先（顧客・取引先の企業単位。人数は未公表）
cause: third_party
root_cause: 外部事業者が設置・運用していたデータ分析ツールが不正アクセスを受け、接続先DBの情報が漏えいした可能性
data_types:
  - 取引先情報
  - 氏名
  - メールアドレス
  - 電話番号
  - 会員ID
  - パスワード（ハッシュ化・暗号化済み）
  - 保存データ（写真・文書等）
summary: 受発注システム等のデータ集計に利用していたデータ分析ツールが第三者の不正アクセスを受け、同ツールの接続先データベースに保存されていた情報の一部が漏えいした可能性があると公表した。ツールは外部事業者が設置・運用していた。対象は顧客・取引先1,221先で、会社名・所在地、担当者の氏名・メールアドレス・電話番号、ログインIDとパスワードのハッシュ値、面談記録など。福岡銀行の勘定系システムや口座情報への影響は確認されていない。原因・侵入経路は調査中。
