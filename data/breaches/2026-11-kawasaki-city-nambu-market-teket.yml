summary: 南部市場の指定管理者である川崎市場管理株式会社がイベントの募集に使っていた電子チケットサービス「teket」が不正アクセスを受け、指定管理者主催の魚のさばき方教室や夏休み市場体験など5イベントの申込者の氏名やメールアドレスなどが流出したと公表した。申込人数は計193人で、流出範囲は調査中。指定管理者は11月8日にteketから連絡を受けたが、市への報告は14日だった。不正ログインや悪用は確認されていない。
