summary: ハッカーフォーラムで売りに出された現職・元従業員のデータが、利用するクラウドサービス事業者のシステムに保管されていたデータと一致したと公表した。同社のシステムは侵害されておらず、事業や顧客のデータとは関係がない。データには連絡先、身分証明の情報、銀行口座の情報が含まれるとされる。
