summary: システム業務を委託するNTTデータのシステムが不正アクセスを受け、約8万人の個人情報が漏えいしたと公表した。うち約1,000人は一部を伏せたクレジットカード番号も対象。NTTデータは11月2日に侵入を発見し、3日に遮断した。山口県や岡山県などと連携して実施するVitalityウォークの応募者も含まれる。
