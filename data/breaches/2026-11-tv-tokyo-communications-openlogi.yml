summary: EC事業の物流業務を委託するオープンロジが11月8日〜9日に不正アクセスを受け、同社が出荷を委託した配送先情報の一部が外部に持ち出された可能性があると、テレビ東京のサイトで公表した。対象は「エンしゃべストア」「東京パソコンクラブ公式オンラインストア」「お互いさまっす公式オンラインショップ」で2026年4月8日〜11月8日に購入・出荷手配された注文の、届け先の氏名、住所、電話番号、メールアドレス、商品名など。決済情報は含まない。件数は調査中。
