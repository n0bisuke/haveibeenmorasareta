summary: 吉野家とはなまるのアルバイト採用業務を過去に委託していたApplyNowの採用管理プラットフォームが不正アクセスを受け、応募者5,366件と従業員アカウント418件の情報が漏えいした。データ分析ツールの脆弱性が悪用され、契約終了後に削除されるべきだった応募者情報が残っていた。
