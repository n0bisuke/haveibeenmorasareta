summary: 利用している外部クラウドツール「Notion」の提供元Notion Labsの委託先Fireworks AIが11月2日に第三者の不正アクセスを受け、従業員と「Notion AI」の対話内容の一部が外部に漏えいしたと公表した。対象は10月5日から24日までに記録された情報で、グループ従業員230名の氏名・社用電話番号・社用メールアドレス、新卒採用応募者22名と取引先従業員8名の氏名の計260名分。11月13日にNotion社から連絡を受けた。パスワードやクレジットカード情報は含まれない。Notion AIの利用は停止している。
