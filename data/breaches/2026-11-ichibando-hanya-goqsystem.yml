summary: 受注・配送管理に使う外部システム「GoQSystem」が11月10〜11日に第三者の不正アクセスを受け、同店が扱った注文情報の一部が外部に漏えいしたと公表した。現時点の対象は注文939件、注文者と届け先を合わせて963名で、氏名、住所、電話番号、メールアドレス、注文内容などが含まれる。クレジットカード情報は対象外。11月18〜19日ごろに詳細データを受け取り、対象者に個別に連絡するとしている。
