summary: 予約確認や航空券送付に使うメール配信サービスを提供するアララが不正アクセスを受け、顧客のメールアドレス最大約49万件が外部に流出したと公表した。氏名・住所・電話番号・カード番号は含まれない。10月31日からメールでの航空券送付を停止した。
