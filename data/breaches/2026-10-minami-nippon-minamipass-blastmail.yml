summary: デジタルサービス「みなみパス」のメール配信を委託していたブラストメールが不正アクセスを受け、会員情報が流出したと10月22日に公表した。対象は最大約6万6,500人で、氏名・メールアドレス・生年月日・居住市町村（郡）など。電話番号、詳細な住所、パスワード、クレジットカード情報は含まれない。会員には同社やみなみパスを名乗る不審なメールに注意するよう呼びかけている。
