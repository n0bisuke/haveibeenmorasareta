summary: 東邦ホールディングスの子会社エンタッチが運営する、MR（医薬情報担当者）のリモート活動支援サービスが、ランサムウェア攻撃を行う第三者の不正アクセスを受け、サービスを利用した医療従事者の氏名、所属医療機関、所在地の都道府県、メールアドレスと、担当MRの氏名・メールアドレスが流出したと公表した。10月13日に判明した。件数は調査中。
