summary: 福岡国際会議場やマリンメッセ福岡などを運営する福岡コンベンションセンターは、Webサイトの制作に使っていたStudioが不正アクセスを受け、施設利用の問い合わせや落とし物の確認などでフォームに入力された2,239件の会社名、氏名、メールアドレス、電話番号、記載内容が漏えいした可能性があると公表した。
