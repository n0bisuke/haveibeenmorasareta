summary: 長崎市公式観光サイト「travel nagasaki」で使っていたプレイドのWeb接客ツール「KARTE」が11月13日未明に第三者の不正アクセスを受け、「travel nagasaki fans」の登録者情報48件と運用前のテスト用登録者情報47件（重複を含む）が漏えいしたと公表した。項目は氏名、メールアドレス、生年月日、性別。同仕組みは10月29日に廃止し協会は保有していた個人情報を処分していたが、KARTE上にデータが残っていた。経緯はプレイドに確認中としている。協会のシステムやサイトそのものへの不正アクセスではない。
