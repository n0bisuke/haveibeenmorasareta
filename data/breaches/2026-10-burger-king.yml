summary: バーガーキング公式アプリの会員情報を管理するシステムが第三者による不正アクセスを受け、約1,118万件の会員情報が漏えいしたと公表した。不正アクセスは10月2日から7日にかけて行われ、10月13日に判明した。漏えいしたのは会員ID、メールアドレス、都道府県、性別、生年月日、氏名（漢字・カナ）、電話番号、モバイルオーダーの利用履歴の有無で、クレジットカード番号は保有しておらず、ログインパスワードの漏えいは確認されていない。経緯と詳しい原因は調査中としている。
