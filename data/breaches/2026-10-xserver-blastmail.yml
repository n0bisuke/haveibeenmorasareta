summary: メール配信に使っていたブラストメールが不正アクセスを受け、同サービスに登録していた顧客の個人情報が外部に漏えいしたと公表した。10月21日に第一報を出し、29日の更新で、メールアドレス459,679件と、付随する氏名・フリガナ380,384件、会社名115,702件、利用サービス名316,453件、アカウント登録日と個人・法人の区分各431,076件、配信希望状況429,382件、XServerアカウントID692件が漏えいしたと公表した。ログインパスワード、住所、電話番号、クレジットカードなどの決済情報は含まれない。
sources:
  - title: XServer VPS クラウド お詫びとお知らせ（10月29日更新）
