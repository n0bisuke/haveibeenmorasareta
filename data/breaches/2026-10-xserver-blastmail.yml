date_announced: 2026-10-21
affected_count: 459679
count_note: メールアドレス459,679件（10月29日更新）。付随して氏名・フリガナ380,384件、会社名115,702件、利用サービス名316,453件、XServerアカウントID692件など（重複するため合算しない）
cause: third_party
root_cause: メール配信サービス「ブラストメール」を運営するラクスライトクラウドが不正アクセスを受け、登録していた配信先情報が持ち出された
vendor:
