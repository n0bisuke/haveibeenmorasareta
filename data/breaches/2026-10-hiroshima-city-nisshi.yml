summary: 市が運営する放課後児童クラブ3施設と児童館1施設で、2023年度または2024年度の日誌を紛失し、在籍児童最大437人分の姓・学年・欠席の状況などが漏えいしたおそれがあると公表した。8月に安佐北区の施設から報告があり、点検で計4施設の紛失が判明した。ほかに2施設で保存期間内の日誌を誤って廃棄していた。悪用は確認されていない。
