organization: 1Password（AgileBits Inc.）
services:
  - 1Password
industry: IT・通信
country: CA
date_occurred: 2026-11-19
date_announced: 2026-11-25
affected_count: null
count_note: 影響を受けた顧客数は公表されていない（一部の顧客と説明）
cause: unauthorized_access
root_cause: 従業員の業務用GitHubアカウントを不正利用され、バックエンドに悪意あるコードを仕込まれて顧客の管理データを取得された
attack_methods:
  - stolen_credentials
data_types:
  - 氏名
  - メールアドレス
  - 会員ID
summary: パスワード管理サービス「1Password」のバックエンドシステムで不正アクセスがあり、一部顧客のアカウント情報が外部にコピーされたと公表した。従業員の業務用GitHubアカウントを使われてソースコードにアクセスされ、バックエンドに仕込まれた悪意あるコードで、1Passwordへのサインインに使う氏名・メールアドレスや秘密でない内部のアカウント管理データが取得された。報道では、招待やアカウント復旧のメールに含まれるトークンも対象だったとされる。保管庫（Vault）とそれを守る暗号鍵は影響を受けていないとしている。11月19日から調査を始め、該当アカウントの停止、認証情報の失効・入れ替え、招待・復旧コードの長文化を行った。顧客アカウントの乗っ取りは確認されていない。
sources:
  - title: 1Password Blog（Update on a security incident involving 1Password’s backend systems）
    url: https://1password.com/blog/update-on-nov-2026-security-incident
  - title: BleepingComputer
    url: https://www.bleepingcomputer.com/news/security/1password-customer-data-stolen-after-employee-github-account-breach/
  - title: 9to5Mac
    url: https://9to5mac.com/2026/11/25/1password-confirms-security-incident-heres-what-you-need-to-know/
  - title: AppleInsider
    url: https://appleinsider.com/articles/26/11/25/what-to-watch-for-after-the-new-1password-data-breach
checklist:
  - text: 1Password をかたるメールのリンクを開かず、アプリや公式サイトから確認する（流出したのは利用者のメールアドレスで、フィッシングの標的になりやすい）
  - text: 心当たりのない招待やアカウント復旧のメールが届いたら、公式サイトから確認する
  - text: マスターパスワード・Secret Key は漏れていないとされているが、他サービスと同じパスワードを使っていないか見直す
