summary: XリーグのLINE公式アカウントで利用する外部サービス「COMSBI（SaaS版）」が不正アクセスを受け、登録者の個人情報が漏えいしたと公表した。提供元ソニックムーブの運用・サポート用アカウントの認証情報が不正取得され、11月9日から10日にかけて情報が取得された。対象は最大でLINE表示名やLINEユーザーIDなど13,126件、生年月日・性別4,587件、住所1,532件、氏名・メールアドレス55件。
