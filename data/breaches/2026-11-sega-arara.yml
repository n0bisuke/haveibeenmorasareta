summary: 株式会社セガは、メールマガジンの配信を委託していたアララ株式会社のメール配信サービスが第三者の不正アクセスを受け、セガとグループ会社セガ フェイブの製品・サービスに関する一部メールマガジンの配信先メールアドレス2,196,044件が外部に流出したと公表した。このうち92,273件は配信に付随する情報を含む。対象には『CHUNITHM』『オンゲキ』『maimai でらっくす』、セガ ラッキーくじ、東京ゲームショウ2026関連の配信などが含まれる。現時点で流出情報の悪用は確認されていないとしている。
