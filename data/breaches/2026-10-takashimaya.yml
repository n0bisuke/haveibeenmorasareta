summary: メールマガジン配信の業務委託先が利用するIDCFクラウドがランサムウェア攻撃を受けて障害が発生したため、「高島屋オンラインストア」「TBEAUT」「タカシマヤファッションスクエア」のメールマガジン配信を停止したと公表した。対象のクラウドには、オンライン会員のメールアドレス、氏名、生年月日、郵便番号、市区郡までの住所が保存されていた。クレジットカード番号、電話番号、ログインパスワードは含まれない。10月9日時点で流出は確認されておらず、影響を調査している。（まとめ記事の記載に基づく。公式発表の本文での確認待ち）
