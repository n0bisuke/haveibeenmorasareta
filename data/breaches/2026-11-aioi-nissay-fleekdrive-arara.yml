summary: ドライブレコーダー映像の共有に使うオンラインストレージ「Fleekdrive」の提供元から、同社のメール配信委託先アララがWebサーバーの脆弱性を突かれて不正アクセスを受け、2026年7月1日から10月30日にFleekdriveの配信メールを受け取った顧客のメールアドレス約1.6万件が漏えいしたとの報告を受けたと公表した。氏名や住所、契約情報、映像は含まれない。11月4日に公表した契約者専用ページの件とは別件。
