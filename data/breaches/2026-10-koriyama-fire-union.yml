summary: 郡山地方広域消防組合は、委託先のプロシーズが提供するクラウドシステムが不正アクセスを受け、7月9日から10月7日までに講習を申し込んだ利用者のメールアドレス83件が漏えいした疑いがあると発表した。二次被害は確認されておらず、組合は対象者へ注意喚起のメールを送付した。
