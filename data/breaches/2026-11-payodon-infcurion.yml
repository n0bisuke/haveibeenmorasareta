summary: 決済アプリ「Payどん」の決済システムを委託するインフキュリオンの「Wallet Station」が第三者の不正アクセスを受け、個人情報が漏えいしたと公表し、11月20日午前6時20分に全サービスを停止した。11月19日に報告を受けた。漏えいは25万1,172件で、会員の氏名・生年月日・電話番号・性別・メールアドレス・パスワード、口座情報・ポイント残高・地域振興券ポイント残高、取引日時・店舗名・金額、加盟店の店舗名・電話番号が含まれる可能性がある。11月4日公表のアララ経由の漏えいとは別事案。
