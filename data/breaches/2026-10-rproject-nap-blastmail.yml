summary: キャンプ場検索・予約サイト「なっぷ」で使っていたブラストメールが不正アクセスを受け、個人情報が漏えいしたと10月23日に公表した。27日の第2報で初報の説明を更新し、なっぷ会員のニックネーム・メールアドレス・居住地域・会員IDと、入会日・直近の予約完了日・最終チェックアウト日・累計利用回数・累計利用金額・月次ポイント情報が対象と公表した。予約システム本体からの漏えいではなく、決済情報、ログインパスワード、詳細な住所、電話番号、具体的な予約内容は含まれない。契約施設の情報の漏えいは確認されていない。
