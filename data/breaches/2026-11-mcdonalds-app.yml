organization: 日本マクドナルド株式会社
services:
  - マクドナルド公式アプリ
industry: 飲食
country: JP
date_announced: 2026-11-20
affected_count: null
count_note: 件数は未公表。対象は商品購入履歴、システム上の顧客管理用ID（会員IDやメールアドレスとは別のID）、IPアドレス、サービス提供時に利用した携帯端末の位置情報（IPアドレスと位置情報は data_types の一覧に該当する値が無い）
cause: unauthorized_access
root_cause: 公式アプリのデータベースに第三者が不正アクセスした（侵入経路は未公表）
data_types:
  - 購入履歴
  - 会員ID
summary: マクドナルド公式アプリのデータベースで、顧客に関連する情報の一部に第三者による不正アクセスが確認されたと公表した。対象となったのは、商品購入履歴、単体では顧客を識別できないシステム上の顧客管理用ID、IPアドレス、サービス提供時に利用した携帯端末の位置情報で、アプリに登録された氏名・メールアドレス・電話番号・住所・クレジットカード情報は含まれないとしている。アプリやサービスの不正利用は確認されていない。不正アクセスに使われた認証情報の無効化、関連システムの調査、個人情報保護委員会への報告などを進めている。件数は公表していない。
