affected_count: null
count_note: 件数は調査中。2026年4月8日〜11月8日に出荷依頼された注文の配送先データが対象。HUMAN MADE（CURRY UP）・SKIYAKI（Bitfan）・マイネットなどの荷主も公表
cause: unauthorized_access
root_cause: 同社システムが11月8日〜9日に第三者の不正アクセスを受けた。侵入の手口は公表されていない
