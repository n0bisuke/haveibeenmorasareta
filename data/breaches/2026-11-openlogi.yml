summary: 同社システムが11月8日から9日にかけて第三者の不正アクセスを受け、2026年4月8日から11月8日に出荷依頼された注文の配送先データ（氏名、住所、電話番号、メールアドレス、商品名と数量）が漏えいしたと公表した。件数は調査中。9日に判明している経路を遮断し、個人情報保護委員会への報告と警察への相談を行う。物流を委託していたHUMAN MADEやSKIYAKI、マイネットなども影響を公表した。
