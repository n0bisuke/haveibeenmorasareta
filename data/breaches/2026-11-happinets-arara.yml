summary: ファンクラブ運営の委託先アクセルエンターメディアが使うアララのメール配信サービスが不正アクセスを受け、2021-22シーズン以降の元会員を含む最大9,530人のメールアドレスが漏えいした可能性があると公表した。その後の調査で、漏洩は41件（メールアドレスのみ39名、メールアドレスと氏名2名）と確定した。電話番号・住所・パスワード・カード情報は含まれず、悪用による被害は確認されていない。
