summary: チャットボットサービス「ChatPlus」「AI AgentPlus」「FAQPlus」で使う一部のWebサーバーが11月13日に第三者の不正アクセスを受け、利用企業から預かる個人データが閲覧・取得された可能性があると公表した。17日に検知し、該当サーバーをネットワークから遮断・隔離した。対象の件数や情報の種類は外部専門機関と調査中としている。利用企業からも、問い合わせ対応などで使うChatPlus経由の漏えいの可能性を知らせる発表が出ている。
