summary: 神奈川県綾瀬市が運営する「あやせ安全・安心メールサービス」に対し、2026年10月11日に不正アクセスが発生し、利用者約1万1053人の居住地区名やメールアドレスが漏えいした可能性があると市が発表した。市職員数百人分のメールアドレス、氏名、居住地区名も同様に漏えいした可能性がある。サービスは大阪府内の委託会社が運営していた。
