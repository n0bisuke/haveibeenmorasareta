summary: 神奈川県横須賀市は、防災情報メールや防犯あんしんメールの配信システムを提供する会社が第三者による不正アクセスを受け、最大約5万9000件のメールアドレスが漏洩した可能性があると発表した。漏洩は不審なメールが配信されたことから判明し、市はサービスを停止し原因究明に努めている。
