summary: 会員制サイト「ぐっとずっと。クラブ」のポイント交換で商品を受け取った人の届け先情報について、配送を委託した佐川急便の「お荷物問い合わせサービス」への不正アクセスにより、延べ約17,600件の氏名・住所・電話番号が流出した可能性があると公表した。クレジットカード情報やパスワードは含まれない。二次被害は確認されていない。
