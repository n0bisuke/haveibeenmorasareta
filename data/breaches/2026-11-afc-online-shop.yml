summary: 健康食品と化粧品の公式オンラインショップで、第三者が11月22日に管理用アカウントを使って不正にログインし、顧客情報を閲覧してデータをダウンロードしていたと公表した。11月23日にECプラットフォーム運営会社の監視で不審なアクセスが確認され、該当アカウントを停止した。漏えいの可能性があるのは302,580名で、氏名、メールアドレス、住所、電話番号、生年月日、会員情報、注文・購入明細などが含まれる。クレジットカード番号、セキュリティコード、ログインパスワードは含まれていないとしている。
