root_cause: 委託先プレイドの「KARTE」が不正アクセスを受け、オンライントレード利用者の性別・年代区分が漏えいした
vendor:
  name: 株式会社プレイド
data_types:
  - 性別
summary: 外部委託先の株式会社プレイドが提供する「KARTE」が11月13日に不正アクセスを受け、オンライントレードを利用する顧客の情報約28万件が外部に漏えいしたと公表した。漏えいしたのは顧客の性別と年代の区分情報で、「1」「2」などの数字で表記されたもの。氏名、住所、生年月日など個人を特定できる情報は含まれていないとしている。プレイドとのデータ連携は停止しており、対象の顧客には個別に連絡する。三菱UFJフィナンシャル・グループは同日、傘下5社で計約800万件の漏えいがあったと発表した。
sources:
  - title: 読売新聞オンライン（Yahoo!ニュース） 三菱ＵＦＪモルガン・スタンレー証券、オンライントレード利用者の情報２８万件が漏えい
    url: https://news.yahoo.co.jp/articles/444e3fcfdf78f5466598380991e2a2acdad8132a
  - title: 共同通信（Infoseekニュース） MUFGで漏えい相次ぐ 傘下の5社で計800万件
    url: https://news.infoseek.co.jp/amp/article/kyodo_1495710671802630804/
checklist:
  - text: 漏えいの対象となった顧客には個別に連絡するとしている
  - text: 証券会社を装った不審なメールやSMSのリンクからログインせず、公式サイトやアプリから確認する
