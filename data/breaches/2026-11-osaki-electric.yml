affected_count: null
count_note: データが外部に流出した可能性も含めて調査中。個人情報についての言及はない
cause: ransomware
root_cause: ランサムウェア攻撃でサーバー内のデータが暗号化された。侵入経路は公表されていない
summary: 11月17日10時35分ごろ、サーバー内のデータがランサムウェアで暗号化されていることを確認し、同日正午以降に外部ネットワークとの接続を遮断したと公表した。埼玉事業所と関連生産拠点（岩手大崎電気、大崎プラテック）の生産関連システムを停止しており、スマートメーターなどの生産・出荷ができず、再開時期は未定。データが外部に流出した可能性も含め、外部の専門機関と調査している。緊急対策本部を設置し、警察・関係当局に相談・報告した。
