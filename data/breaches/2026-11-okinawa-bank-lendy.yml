summary: 個人ローン「チェキット」の延滞債権の督促業務を委託しているLENDY債権回収の「交渉記録チェックシステム」が10月30日に第三者の不正アクセスを受け、交渉記録などが登録されていた顧客211名の氏名、メールアドレス、電話番号、代理人名、返済相談額などの金額、交渉内容が閲覧され、外部に流出した可能性があると公表した。第三者が不正にアカウントを作成してログインしており、アカウント作成を防ぐ仕組みや利用者ごとの閲覧制限が不十分だったことが原因という。
