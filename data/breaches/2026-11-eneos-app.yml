root_cause: 給油などに使う公式アプリのシステムで第三者による不正アクセスを検知した。詳細は調査中
summary: 給油などに使うENEOS公式アプリのシステムで第三者による不正アクセスを検知し、被害拡大の防止と顧客情報の漏えいの有無を確認するため、11月25日16時ごろからアプリのサービスを停止したと公表した。事実関係と、顧客情報の漏えいの有無および影響範囲を調査している。不正アクセスに便乗した不審なメール、SMS、電話に注意するよう呼びかけている。
