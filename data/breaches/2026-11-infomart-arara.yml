summary: 株式会社インフォマートは、マーケティング目的のメール配信に利用していたアララ株式会社の「アララメッセージ」が不正アクセスを受け、「BtoBプラットフォーム 請求書」の無料ユーザー向けメール配信に登録していたメールアドレス3,577件が流出したと公表した。当初は利用環境が流出対象外と報告を受けていたが、11月3日に対象に含まれていたと連絡を受けた。最終配信日は2025年12月16日。流出したのはメールアドレスのみ。
