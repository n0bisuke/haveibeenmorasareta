summary: 見積もりプラットフォーム「ミツモア」でメールマガジンやLINEの配信に利用している株式会社プレイドの「KARTE」が不正アクセスを受け、連携していた顧客情報の一部が外部に漏えいしたと公表した。対象は氏名・メールアドレス・電話番号・生年月日のいずれかを含む60,000人と、会員ごとの識別番号と都道府県のみの3,398,469人。パスワード、クレジットカード情報、都道府県より詳細な住所、LINE IDは含まれない。11月16日に公表した自社システムへの不正アクセスとは別の事案で、「プロワン」は影響を受けていないとした。
sources:
  - title: ミツモア 業務委託先のクラウドサービス「KARTE」への不正アクセスによる個人情報漏えいに関するお詫びとお知らせ
    url: https://company.meetsmore.com/page/notice-20261118-karte
checklist:
  - text: 対象者には登録メールアドレス宛に連絡がある（送信元 no-reply@meetsmore.com）
  - text: ミツモアや事業者を名乗る不審なメール・SMS・電話に注意する
  - text: 本件を理由とするパスワード変更は不要とされている
