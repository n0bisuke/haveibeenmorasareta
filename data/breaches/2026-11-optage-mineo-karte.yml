summary: メール配信等のマーケティング業務を委託する株式会社プレイドの「KARTE」で第三者による不正アクセスが発生し、携帯電話サービス「mineo」利用者のメールアドレスが外部に漏えいした可能性があると公表した。11月15日にプレイドから報告を受けた。クレジットカード情報や銀行口座情報などの決済情報と本人確認書類の情報はプレイドに提供していない。KARTEの利用を停止し、対象者にはメールなどで個別に連絡するとしている。11月18日には、対象が最大142万件で、メールアドレスのほか性別・年代・郵便番号・都道府県・誕生日または記念日・一部オプションの契約開始日が含まれると公表した。
