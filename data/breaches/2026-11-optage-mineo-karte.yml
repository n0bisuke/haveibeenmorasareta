summary: メール配信等のマーケティング業務を委託する株式会社プレイドの「KARTE」で第三者による不正アクセスが発生し、携帯電話サービス「mineo」利用者のメールアドレスが外部に漏えいした可能性があると公表した。11月15日にプレイドから報告を受けた。クレジットカード情報や銀行口座情報などの決済情報と本人確認書類の情報はプレイドに提供していない。KARTEの利用を停止し、対象者にはメールなどで個別に連絡するとしている。件数は調査中。
