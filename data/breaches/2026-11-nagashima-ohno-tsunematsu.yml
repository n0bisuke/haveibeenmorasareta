  - パスワード（ハッシュ化・暗号化済み）
summary: 外部ベンダーが提供するシステムを共通基盤とする4つのWebアプリケーションシステムが、脆弱性を突かれて外部から不正アクセスを受け、個人情報が漏えいしたと公表した。不正アクセスは11月9日深夜〜10日未明にあり、10日午前に検知して4システムを停止した。対象は会員制サイト「Legal Lounge」、OB・OG向け「NO&T ALUMNI」、弁護士採用サイト「NO&T Careers Site」、一斉メール配信システムで、氏名、所属先、メールアドレス、住所、電話番号、生年月日、パスワードのハッシュ値、採用応募者の学歴・資格・試験の受験や合格の情報などが含まれる。一部の案件6件の送付先情報も含まれるが、通常の案件処理に使うシステムへの不正アクセスは確認されていない。件数は調査中。
