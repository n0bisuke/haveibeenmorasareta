summary: 「YYSystem」のWebサイトに設置していた問い合わせフォームに使っていたStudioが不正アクセスを受け、3,396件（1,937人）の氏名、メールアドレス、問い合わせ内容が漏えいした可能性があると公表した。Webサイトの制作・運用に使う外部サービスの提供元であるStudio株式会社のクラウド環境が第三者の不正アクセスを受けたもので、現時点で不正利用や二次被害は確認されていない。
