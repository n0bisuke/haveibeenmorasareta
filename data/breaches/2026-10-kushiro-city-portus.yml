summary: 学習用端末の管理運用を委託する株式会社ポータスの社内サーバーがランサムウェア被害を受け、児童生徒・教職員らのアカウント情報3万1,233件（氏名、学校名、アカウント名、パスワード）と市立小中学校39校の管理用パスワードが漏えいした可能性があると市教育委員会が公表した。ポータスは8月29日に被害を確認し、10月13日に市へ影響の可能性を報告した。住所や生年月日などは含まれず、外部への流出や不正利用は確認されていない。
