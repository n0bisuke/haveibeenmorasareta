summary: 一部サービスの利用分析やお知らせ配信に使っていた株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、KARTEに連携していたデータが第三者に流出したと公表した。11月13日に不正アクセスの報告を受け、11月15日に流出の報告を受けた。対象は進研ゼミ入会申込サイト、進研ゼミ保護者サポートアプリ、まいにちのたまひよ、進研ゼミ小学講座〈チャレンジタッチ〉、Benesse High School Online、グロースナビ、キャリアナビでKARTEと連携した情報（高校向けサービスでは生徒に紐づくデータ連携はない）。情報の項目と件数は精査中。同社のシステムへの不正アクセスはないとしている。
sources:
  - title: ベネッセコーポレーション 弊社の利用するWEBサービス「KARTE」への不正アクセスによる情報漏洩のお詫びとお知らせ
    url: https://company.benesse.co.jp/notice/005.html
checklist:
  - text: 詳細が判明しだい、連絡の必要な顧客にメールなどで個別に連絡するとしている
