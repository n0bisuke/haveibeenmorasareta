summary: 「焼肉きんぐ」などを運営する同社は、委託先が運用管理する同社システムが第三者の不正アクセスを受け、各ブランドサイトの問い合わせフォームなどに寄せられた顧客の氏名、電話番号、利用店舗、会員番号などと、社内コンテスト応募フォームの従業員らの情報、合わせて約8万人分が漏えいしたと公表した。不正アクセスは11月11日に確認した。10月に公表した「焼肉きんぐ」公式アプリの会員情報の漏えいとは別の事案である。
