summary: 佐賀市は、登録制の防災・防犯情報メール「さがんメール」の運用会社である株式会社アルカディアが不正アクセスを受け、登録者の氏名とメールアドレスが漏えいした可能性があると明らかにした。KBC九州朝日放送によると、9月末時点の登録者は39,657人。市は10月13日17時に配信を停止した。同日時点で被害の報告はないとしている。
