summary: 契約者向けサイト「アフラック よりそうネット」などのシステムに第三者が不正アクセス。6月15日から25日にかけて複数回アクセスされ、契約者・被保険者・受取人の情報や証券番号、保障内容、保険料振替口座情報が漏えいした。マイナンバー、クレジットカード情報、メールアドレスは含まれない。
