summary: 旅行予約サイト「skyticket」で、経路の異なる3件の不正アクセスがあったと10月9日に公表した（会員には8日にメールで通知していた）。10月2日〜4日に管理機能が不正に操作され、氏名・生年月日・メールアドレスなど約1,464万件が流出し、うち約413万件にはハッシュ化されたパスワードが含まれていた。9月20日には業務管理システムの脆弱性を突かれ返金先の口座情報など17,780件が対象となり、バス予約完了ページの約1.2万件の予約情報も機械的に閲覧されていた。当初はクレジットカード番号は流出していないとしていたが、10月16日の第2報で、2018年の決済移行の際に削除されず会費支払いのログに残っていたカード番号・名義・有効期限が、最大6,140人分流出したと訂正した。セキュリティコードは含まれない。
