count_note: 管理機能への不正操作で約1,464万件（うち約413万件はハッシュ化されたパスワードを含む）。このほか業務管理システムの脆弱性で返金先の口座情報など17,780件、バス予約完了ページの閲覧で約1.2万件。10月16日の第2報で、2017年2月〜2018年6月にskyticketプレミアムの会費支払いでカードを登録・利用した最大6,140人のクレジットカード情報の流出を追加
cause: unauthorized_access
root_cause: 管理機能の不正操作、業務管理システムの脆弱性、ログインなしで開けたバス予約完了ページの3つの経路による不正アクセス
