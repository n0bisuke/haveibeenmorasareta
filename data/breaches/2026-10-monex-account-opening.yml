checklist:
  - text: マネックス証券からの個別の連絡（メール）が届いていないか確認する
  - text: マネックス証券や警察を名乗るメール・SMS・電話で本人確認書類や口座情報を求められても応じない
  - text: 運転免許証やマイナンバーカードの画像を提出した人は、身に覚えのない口座開設や契約の連絡に注意する
