date_occurred: 2026-10-18
date_announced: 2026-10-20
affected_count: 1130000
count_note: メールアドレス最大113万件（重複・未完了の申込を含む）と、本人確認書類の画像1,592件（運転免許証の表裏、マイナンバーカードの表面、自撮り画像）。11月13日のフォレンジック調査の中間報告による
cause: third_party
root_cause: 外部委託先が運営・管理する口座開設システムが不正アクセスを受けた。原因は調査中
data_types:
  - メールアドレス
  - 本人確認書類画像
  - 運転免許情報
summary: 外部委託先が運営・管理する一部の口座開設システムへの不審なアクセスを10月に公表し、11月13日に、2019年10月16日以降にオンライン口座開設の最初の手続きで登録されたメールアドレス最大113万件と、撮影が必要な方式で提出された本人確認書類の画像1,592件（運転免許証の表裏、マイナンバーカードの表面、自撮り画像）が漏えいしたおそれがあると公表した。マイナンバーや口座番号、各種パスワードの漏えいは確認されていない。システムは基幹システムとは別系統で、10月19日に遮断した。
