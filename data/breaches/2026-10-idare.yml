summary: キャッシュレスサービス「IDARE」で、カスタマーサポートなどに使っていた外部ソフトウェアの脆弱性を悪用され、8月10日から9月27日にかけて複数回データベースから情報を取得されたと公表した。対象は退会者を含む12万9,659人で、全員分の電話番号・メールアドレス・生年月日・残高・取引履歴など、一部の人の氏名・住所・クレジットカード番号の一部が含まれる。ログインパスワード、本人確認書類の画像、カード番号の全桁、セキュリティコードは含まれない。
