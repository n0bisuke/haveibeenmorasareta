summary: メール配信に利用している株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、イベント情報の配信に使っていた機能に設定されていた顧客情報を含む配信先リストが外部に持ち出されたと公表した。対象はイトキンオンラインストアの登録者のメールアドレス、会員番号、生年月日。氏名、住所、電話番号、クレジットカード情報、パスワードの漏えいは確認されていない。該当機能の利用を停止し、対象者には個別に案内する。件数は確認中。
