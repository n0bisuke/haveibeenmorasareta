root_cause: 委託先プレイドの「KARTE」が不正アクセスを受け、ポイントアプリ利用者の内部IDと性別が漏えいした
vendor:
  name: 株式会社プレイド
data_types:
  - 会員ID
  - 性別
summary: 「小田急ポイントアプリ」の情報配信などに使っていた株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、アプリ利用者に関する情報の一部が外部に漏えいしたと公表した。11月15日に漏えいが判明した。確認しているのは単体では個人を特定できない内部IDと性別で、対象の範囲と件数、氏名・住所・生年月日・小田急お客さま番号などへの影響は調査中。クレジットカード情報やセキュリティコードはKARTEに連携しておらず対象外。アプリとKARTEの連携を無効化し、一部の機能と情報配信を停止している。
sources:
  - title: 小田急電鉄 当社業務委託先システムである「KARTE」への不正アクセスによる小田急ポイントアプリにおけるお客さま情報の漏えいについて（お詫び）
    url: https://www.odakyu.jp/notice/makhce0000003vpt-att/makhce0000003vq0.pdf
  - title: 小田急ポイントカード 【重要】当社業務委託先システムである「KARTE」への不正アクセスによる小田急ポイントアプリにおけるお客さま情報の漏えいについて（お詫び）
    url: https://www.odakyu-card.jp/news/important/2026/11/18/69878/
checklist:
  - text: 本件でパスワード変更などの対応を求めることはないとしている
  - text: 小田急や小田急ポイントを装ったメール・SMS・電話に、口座情報やカード情報、暗証番号、認証コードを伝えない
