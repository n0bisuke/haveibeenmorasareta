summary: 地域情報サービス「くふう まちトークβ版」で10月2日に不審なアクセスを確認し、5日にサービスを停止して公表した。13日の調査結果で、システムの脆弱性を突かれ、308人分の生年月日と性別が外部から閲覧できる状態だったと公表した。うち1人はメールアドレスも取得され、生年月日・性別と結びつけられる状態だった。
