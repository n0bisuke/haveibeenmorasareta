summary: 「eセールスマネージャーRemixCLOUD ユーザーコミュニティサイト」で利用する外部クラウドサービスが第三者の不正アクセスを受けたと、10月6日に提供事業者のコミューン株式会社から報告を受けた。サイトの管理者アカウントが不正に利用され、会員1,164名の会社名、氏名、フリガナ、アカウント名、メールアドレス、プロフィール情報が閲覧・取得された可能性がある。製品本体は影響を受けていない。
