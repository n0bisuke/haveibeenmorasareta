summary: 第48回一宮市消防音楽隊定期演奏会の電子チケット販売・管理を委託する株式会社teketのシステムが11月5日に第三者の不正アクセスを受け、個人情報漏洩の事案が発生したと消防本部が公表した。漏洩の可能性があるのは電子チケット購入時に登録した氏名、年齢、性別、住所、電話番号、メールアドレス、チケット情報。件数は示していない。teketのサービス停止中は紙チケットのみで販売するとしている。
