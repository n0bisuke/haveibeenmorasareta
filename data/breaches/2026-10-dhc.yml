summary: 公式オンラインショップが脆弱性を悪用した不正アクセスを受け、5,096件の会員情報が書き換えられ、不審な注文27件と不正な新規会員登録71件が見つかったと公表した。会員番号・お届け先の氏名・住所・電話番号・購入履歴・カード番号の下4桁などが閲覧された可能性がある。会員情報を復元し、不審な注文と不正登録を取り消した。外部への持ち出しは確認されていない。
