affected_count: 5096
count_note: 会員情報が書き換えられたアカウント5,096件。ほかに不審な注文27件、不正な新規会員登録71件
cause: vulnerability
vuln_target: ec_payment
root_cause: オンラインショップの脆弱性を悪用され、会員情報が書き換えられた
