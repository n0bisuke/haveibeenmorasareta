summary: 化粧品ブランド「akyrise（あきゅらいず）」のECサイトへの不正アクセスを11月4日に確認してサイトを閉鎖し、顧客ID・メールアドレス・ハッシュ化パスワードの最大約49万件と、退会者や過去の購入者を含む登録・購入情報（氏名・住所など）の最大約90万件が漏えいしたと公表した。あわせて、メール配信の委託先アララ経由でメールアドレス177,063件、佐川急便経由で配送情報約5,000件の漏えいの可能性も公表した。
