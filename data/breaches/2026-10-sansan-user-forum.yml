summary: オンラインコミュニティ「Sansan User Forum」で利用するクラウドサービス「Commune」が第三者の不正アクセスを受け、会員情報が漏えいしたと公表した。10月6日にコミューンから報告を受けた。1,325名分のメールアドレス、アカウント名、自己紹介、プロフィール画像、グループ所属情報の漏えいを確認し、ほかに8,687名分のメールアドレスを除く情報が漏えいした可能性がある。パスワードは含まれず、Sansan・Bill One・Contract One・Eightへの影響はないとした。
