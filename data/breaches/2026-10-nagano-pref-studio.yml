summary: 県の委託事業の受託事業者が使うクラウドサービス「Studio」が第三者の不正アクセスを受け、3事業のフォームに入力された個人情報が漏えいした可能性があると公表した。デジタル化一貫支援サイトの相談・登録依頼フォーム152件、賃上げ・業務改善支援センター（Bizサポ）の問い合わせフォーム177件、NAGANOスカウトマッチ！の説明会申込フォーム12件が対象で、企業名、氏名、会社住所、電話番号、メールアドレス、問い合わせ内容、学校名などが含まれる。対象者にはメールでお詫びを送った。
