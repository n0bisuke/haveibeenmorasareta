summary: 兵庫県加古川市は、同市職員約2000人が登録している一斉メール配信サービスがサイバー攻撃を受け、氏名や個人メールアドレスなどの個人情報が漏洩した恐れがあると発表した。サービスは大阪府箕面市の事業者アルカディアが運用しており、10月11日に不正アクセスが確認され、同社は応急措置を経て13日に配信サービスを停止した。市は職員に対し不審なメールへの注意喚起を行っている。
sources:
