summary: カードローン等の一部商品の保証会社SMBCコンシューマーファイナンスの保証業務システムが第三者による不正アクセスを受け、当行顧客の情報も漏えいの対象に含まれていることを確認したと公表した。同社が公表した項目は氏名・性別・生年月日・住所・電話番号・運転免許証番号・勤務先情報・契約情報で、当行顧客の実際の項目は確認中とした。本人確認書類の画像は含まれない。同社への保証委託申込を停止した。
