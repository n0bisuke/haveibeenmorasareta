count_note: "まとめサイトの記載: 15万4,650件（一次情報で未確認）"
cause: misconfiguration
summary: 労務管理サービス「WelcomeHR」において、ユーザーがストレージサーバーに保存した16万2,830人の個人情報が外部閲覧可能にあり、うち15万4,650人について第三者によるダウンロードが判明。原因は、「WelcomeHR」ストレージサーバーのアクセス権限設定ミスによるもので、本来外部アクセスを制限すべき部分について誤設定があり、特定の条件下において外部アクセス可能な状態にあったことが、調査により判明した。（まとめサイトの記載に基づく。公式発表・報道での確認待ち）
