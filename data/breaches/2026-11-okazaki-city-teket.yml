summary: 令和5年度家康行列の観覧席チケット販売を委託した株式会社teketの電子チケット販売・管理サービス「teket」が不正アクセスを受け、登録情報が漏えいした可能性があると公表した。11月8日にteketから会員情報などを管理するシステムの情報の一部が流出したと報告を受けた。漏えいした可能性があるのは氏名、メールアドレス、生年月日、年齢、性別、住所、電話番号、チケットの発券用コードなど。件数や市の分が含まれるかは調査中としている。
