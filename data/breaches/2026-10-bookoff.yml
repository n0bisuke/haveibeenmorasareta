organization: ブックオフグループホールディングス株式会社
group: ブックオフグループ
services:
  - ブックオフ会員サービス
industry: 小売・EC
country: JP
date_announced: 2026-10-09
affected_count: 6383279
count_note: 6,383,279人（10月13日の第2報。うち退会済みの会員212,371人）。外部への送信が確認された会員データは6,427,735件（会員番号ベース。初報では最大約643万件）
cause: unauthorized_access
root_cause: 中古品を扱う子会社の会員管理システムへの第三者による不正アクセス（侵入経路は非公表）
data_types:
  - 氏名
  - 生年月日
  - 性別
  - メールアドレス
  - 電話番号
  - 郵便番号
  - 住所
  - パスワード（ハッシュ化・暗号化済み）
  - 会員ID
  - ポイント情報
summary: 中古品を扱う子会社の会員管理システムが第三者による不正アクセスを受け、会員情報が外部に取得されたと公表した。10月6日に不正アクセスを確認した。対象は最大約643万件で、氏名・生年月日・性別・メールアドレス・電話番号・住所・パスワードのハッシュ値・ポイントカード番号・会員番号が含まれる。決済情報はこのシステムに保有していない。攻撃元からの通信を遮断し、脆弱性を是正した。10月13日の第2報で、対象者を退会済みの会員21万2,371人を含む638万3,279人と公表した。
