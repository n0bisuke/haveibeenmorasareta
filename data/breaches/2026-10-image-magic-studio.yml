summary: Webサイトのお問い合わせフォームに使う「Studio」が不正アクセスを受け、フォームの情報が漏えいした可能性があると公表した。2026年5月8日〜7月15日の企業サイトのお問い合わせ379件と、2025年5月19日〜2026年10月15日の3DMEのお問い合わせ1,131件の計1,510件が対象で、氏名、メールアドレス、電話番号、会社名、お問い合わせ内容、添付ファイルのファイル名が含まれる。添付ファイルの中身は対象外。二次被害は確認されていない。
