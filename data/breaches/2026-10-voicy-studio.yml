summary: Webサイトの制作・運用に使っていたStudioのクラウド環境が不正アクセスを受け、パーソナリティ応募フォーム1万5,129件と法人向けサービスの問い合わせフォーム289件の送信情報が流出した可能性があると公表した。応募フォームは氏名、パーソナリティ名、メールアドレス、SNSアカウントのURL、配信内容などの回答、問い合わせフォームは氏名、会社名、メールアドレス、電話番号、問い合わせ内容が対象。リスナーの登録情報は対象外で、実際の取得や不正利用は確認されていない。個人情報保護委員会への報告を進めている。
sources:
