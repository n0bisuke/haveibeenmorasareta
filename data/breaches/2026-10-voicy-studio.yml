count_note: パーソナリティ応募フォーム15,129件、法人向け問い合わせフォーム289件の計15,418件（送信件数で人数ではない）。リスナーの登録情報は対象外
cause: third_party
root_cause: Webサイト制作に使うStudioのクラウド環境の一部機能の脆弱性を悪用され、フォームに送信された内容などが外部から取得できる状態になった
