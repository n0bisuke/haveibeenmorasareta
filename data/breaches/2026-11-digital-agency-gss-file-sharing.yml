root_cause: GSSのファイル共有サービスで、正規の共有相手以外の者から7月30日〜11月12日にファイルへのアクセスがあった。原因は調査中
summary: 政府機関向けの業務基盤「ガバメントソリューションサービス（GSS）」で提供するファイル共有サービスで、扱っていたファイルの一部が外部に漏えいした可能性があると公表した。利用者同士や事業者など組織外の関係者と会議資料などの大容量ファイルをやり取りするサービスで、11月12日に正規の共有相手以外からのアクセスを検知し、7月30日から11月12日までの約3カ月半にわたりアクセスがあったことを確認した。同日にサービスを停止し外部との通信を遮断した。ファイルには個人情報が含まれることも想定されるとして個人情報保護委員会に報告し、警察などと連携して調べている。二次被害は確認されていない。同庁のGSSでは9月にもVPN機器の脆弱性を突かれた不正アクセス（約24.6万件）を公表している。
