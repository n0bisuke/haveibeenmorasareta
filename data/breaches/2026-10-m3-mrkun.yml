summary: 製薬企業向けサービス「MR君」が不正アクセスを受け、医師会員の一部（会員全体の1割未満）と製薬企業の担当者数百名の氏名、勤務先、一部の人のメールアドレスが漏えいしたと公表した。10月14日に検知し、侵入経路を遮断した。ログインパスワードとm3ポイントは対象外で、クレジットカード番号は保有していない。
