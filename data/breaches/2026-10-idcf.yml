cause: ransomware
summary: クラウドサービス「IDCFクラウド」の一部システムが福島県白河市のデータセンターでランサムウェア攻撃を受け、茨城県庁など約495の企業・自治体でホームページが閲覧できないなどの障害が発生した。10月8日の第3報で、対象を東日本リージョン1の4ゾーンと特定し、そこに置かれた一部の顧客データは取り出しや復元が困難な見通しだとした。利用者が預けたデータを含め、個人情報が漏えいしたかどうかは公表されていない。利用企業側では、JR東日本・ビューカードがメール配信用に預けていた会員のメールアドレスなどが漏えいした可能性があると公表している。
