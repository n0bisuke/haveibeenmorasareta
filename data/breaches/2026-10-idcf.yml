count_note: 個人情報の漏えいの有無は調査中（約495の企業・自治体に障害の影響）
cause: ransomware
summary: クラウドサービス「IDCFクラウド」の一部システムが福島県白河市のデータセンターでランサムウェア攻撃を受け、茨城県庁など約495の企業・自治体でホームページが閲覧できないなどの障害が発生した。10月8日の第3報で、対象を東日本リージョン1の4ゾーンと特定し、そこに置かれた一部の顧客データは取り出しや復元が困難な見通しだとした。管理画面には攻撃者のものとみられる英語のメッセージが表示されたと報じられている。10月14日の第5報では、東日本リージョン1の4ゾーンで利用者の仮想サーバー内のデータが照会・持ち出しされた痕跡は確認されなかったとした。また、管理用のIDCFクラウドポータルで48社の登録情報に不正な照会があったが、外部へ持ち出された痕跡は確認されなかったとしている。東日本リージョン2・3と西日本リージョン1は調査を続けている。利用企業側では、JR東日本・ビューカードがメール配信用に預けていた会員のメールアドレスなどが漏えいした可能性があると公表している。
