summary: JR九州Web会員向けメールマガジンの配信を委託している会社が使っていた、IDCフロンティアのクラウドサービス「IDCFクラウド」がランサムウェア攻撃を受け、Web会員のメールアドレスが最大約130万件漏えいした可能性があると公表した。対象はメールアドレスとメールのログデータで、第三者に閲覧・取得された可能性を否定できないとしている。氏名・住所・電話番号・クレジットカード番号、メールマガジンの件名・本文は含まれない。被害は確認されておらず、メールマガジンは配信できない状態となっている。
