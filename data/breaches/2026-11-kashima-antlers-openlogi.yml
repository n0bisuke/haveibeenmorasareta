summary: 配送業務の一部を委託する株式会社オープンロジで第三者による不正アクセスがあり、顧客情報40,844名分が外部に流出したと公表した。オンラインストアで注文された商品の配送と、会員限定の「KASHIMA ANTLERS SEASON BOOK」の発送に使った情報で、お届け先の氏名・住所・電話番号・メールアドレス、商品名や数量などの配送情報、注文IDが含まれる。対象期間は2017年10月27日〜2024年11月25日と2026年4月8日〜11月9日。クレジットカード情報は含まれない。原因はオープンロジが調査している。
