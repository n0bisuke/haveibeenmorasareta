summary: インソールや講座テキストの保管・発送を委託するオープンロジが不正アクセスを受け、届け先情報が漏えいした可能性があると日本足病学協会と連名で公表した。第一報では2026年4月8日〜11月8日分で最大1,489件としていたが、11月18日の第二報でオープンロジから対象期間の拡大（2017年10月27日〜2024年11月25日と11月9日の一部）の報告を受け、件数は精査中とした。対象は届け先の氏名、住所、電話番号、メールアドレス、商品名・金額、注文番号・追跡番号など。クレジットカード情報は含まない。
