summary: メール配信サービス「ブラストメール」で10月21日未明に不審なアクセスを検知し、管理画面とAPI、メール配信を停止した。外部の第三者がAPI用サーバー2台に侵入して販売管理システムとサービスのデータベースからデータを持ち出しており、全契約者の会社名・担当者名・電話番号・メールアドレス・契約と支払いの履歴と、一部の契約者のメルマガなどの配信先リストが漏えいした。配信先リストの漏えいを確認した契約は344件と報じられている。侵入経路は調査中で、サービスの再開は未定。利用していた企業・自治体が相次いで影響を公表している。
