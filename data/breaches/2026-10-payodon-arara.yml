summary: 鹿児島の決済アプリ「Payどん」のメール通知を委託していたアララのサービスが不正アクセスを受け、利用者と加盟店のメールアドレス、決済日時・店舗名・支払金額が漏えいした可能性があると公表した。メール通知と新規登録を停止し、プレミアム付商品券の発売を延期した。決済への影響はない。
