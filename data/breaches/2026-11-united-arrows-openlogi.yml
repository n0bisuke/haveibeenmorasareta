summary: 海外向けECサイト「ユナイテッドアローズ グローバル オンライン」と「TABAYA United Arrows」の物流を委託するオープンロジが11月8日〜9日に不正アクセスを受け、出荷データに含まれるお届け先の個人情報などが外部に持ち出されたと公表した。対象は2026年4月8日〜11月8日の出荷データで、届け先の氏名、住所、電話番号、登録されている場合のメールアドレス、商品名・数量。クレジットカード番号は含まない。国内向けの「ユナイテッドアローズ オンライン」は影響がないとしている。
