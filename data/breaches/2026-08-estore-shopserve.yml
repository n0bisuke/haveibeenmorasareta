count_note: 約2,335万6,000人（10月16日の最終報。購入者・会員、店舗運営者、アフィリエイターを名寄せした概数。対象店舗7,858店）。うち約209万6,900人はクレジットカード情報の一部。8月2日の第2報では延べ最大8,853,839件としていた
cause: unauthorized_access
root_cause: サーバー上のアプリケーションの脆弱性を悪用され、不正なプログラムを実行された
