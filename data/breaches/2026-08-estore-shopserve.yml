  - メールアドレス
  - 会員ID
summary: ECサイト構築サービス「ショップサーブ」のサーバー上で第三者が不正なプログラムを実行し、2026年5月21日から8月1日にかけて購入者情報を外部へ送信していた。クレジットカードはカード名義・有効期限・番号の先頭6桁と下4桁が対象。店舗の管理画面・FTPの認証情報や振込先口座情報も流出した。
