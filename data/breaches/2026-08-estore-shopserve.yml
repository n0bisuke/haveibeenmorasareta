summary: ECサイト構築サービス「ショップサーブ」のサーバー上で第三者が不正なプログラムを実行し、2026年5月21日から8月1日にかけて購入者情報を外部へ送信していた。クレジットカードはカード名義・有効期限・番号の先頭6桁と下4桁が対象。10月16日の最終報で、漏えい対象は約2,335万6,000人（対象店舗7,858店）、うち約209万6,900人分がカード情報の一部と確定した。購入者・会員の氏名、住所、電話番号、メールアドレス、勤務先、会員ID、暗号化されたパスワードと、店舗の管理画面のログインIDとパスワードなどが含まれる。第2報で対象としていた店舗のメールシステム・FTPの認証情報と振込先口座情報は、調査の結果、対象から外れた。
