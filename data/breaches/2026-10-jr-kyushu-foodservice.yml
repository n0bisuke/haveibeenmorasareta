summary: JR九州フードサービスは、和食店「うまや」などで提供しているトイポアプリに登録された約2万6900人分の個人情報が流出した可能性があると発表した。原因はトイポ社への不正アクセスで、漏洩したとされる情報はユーザーIDや電話番号で、パスワードやクレジットカード情報は含まれていない。現在、新規会員登録は停止している。
