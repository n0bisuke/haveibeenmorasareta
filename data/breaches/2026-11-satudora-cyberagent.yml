root_cause: アプリ開発・運用の委託先が移行作業中に個人情報を含むファイルを開発環境の公開設定の保管領域に誤って置いた
vendor:
  name: 株式会社サイバーエージェント
data_types:
  - メールアドレス
  - 性別
  - 生年月日
  - 氏名
  - ポイント情報
  - 購入履歴
  - 連携サービスID
summary: アプリの開発・運用を委託するサイバーエージェントが、システム移行作業中に個人情報を含むファイルを開発環境のクラウド上の公開設定の保管領域に誤って置き、LINE公式アカウントの友だち登録者22万9,026アカウント分が外部に流出したと公表した。ファイルは2025年7月16日から2026年11月18日まで公開状態で、第三者による計9回の取得が確認された。対象はメールアドレス、性別、生年月日、名、EZOCA番号、購入金額の合計、LINEユーザー識別子などで、姓・住所・電話番号・カード情報・パスワードは含まれない。11月18日の外部通報で判明した。
