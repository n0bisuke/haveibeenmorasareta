summary: Webサイトの運営に使っていたクラウドサービス「Studio」で不正アクセスが発生し、各種サービスの案内用Webサイトに設置した申し込みなどのフォームの送信情報5,877件が漏えいした可能性があると公表した。対象は氏名、電話番号、メールアドレス、住所、生年月日、その他フォームに入力された内容。第三者が実際にデータを取得した事実や二次被害は確認されていない。
