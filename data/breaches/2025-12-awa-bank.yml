summary: 藍住支店の元職員が2025年7月から11月にかけて顧客の預け金から87,410円を着服し、取引先顧客666件の顧客情報（氏名・口座番号など）を持ち出していた。顧客情報は回収済みで、第三者への漏えいは確認されていない。元職員は懲戒解雇となった。発生日は月のみ判明のため1日としている。
