summary: 都市公園「草津川跡地公園」の指定管理者が使うホームページ作成ツール「Studio」のクラウド環境が第三者の不正アクセスを受け、公園ホームページの「お問い合わせ」で取得した計108件の氏名、住所、電話番号、メールアドレスが漏えいした可能性があると公表した。現時点で不正利用は確認されていない。令和5年度以降に入力した人には指定管理者からメールで連絡する。
