industry: 医療
country: JP
date_occurred: 2026-09-30
date_announced: 2026-10-19
affected_count: 16005
count_note: 最大16,005件（コーポレートサイトへの問い合わせ最大15,243件、サービスに関する問い合わせ最大762件）。送信件数で人数ではない。精査中
cause: third_party
root_cause: Webサイト制作に使うStudioのクラウド環境の一部機能の脆弱性を悪用され、フォームに送信された内容などが外部から取得できる状態になった
vendor:
  name: Studio株式会社
data_types:
  - 氏名
  - メールアドレス
  - 電話番号
  - 問い合わせ内容
summary: Webサイトのフォームに使っていたStudioのクラウド環境が9月30日〜10月1日に不正アクセスを受け、コーポレートサイトとサービスに関する問い合わせフォームの送信情報最大1万6,005件（精査中）が流出した可能性があると公表した。対象は氏名、メールアドレス、電話番号、所属、問い合わせ内容などで、添付ファイルはファイル名のみが対象。第三者に実際に取得された事実は確認されていないが、取得されたものとみなして対応している。
sources:
