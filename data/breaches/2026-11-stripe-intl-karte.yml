industry: 小売・EC
country: JP
date_announced: 2026-11-17
affected_count: 180748
count_note: 第二報のレコード数の合計（メチャカリの会員ID 30,678件、STRIPE CLUBのメールアドレス・会員IDを含むデータ150,069件、氏名・フリガナを含むデータ1件）。人数や実際に持ち出された件数とは一致しない。ほかにテスト用アカウントの検証用データ586件
cause: third_party
root_cause: プレイドの「KARTE」が不正アクセスを受け、連携していた会員データが読み取られた。STRIPE CLUBは利用終了後もデータが残存
vendor:
  name: 株式会社プレイド
data_types:
  - 会員ID
  - メールアドレス
  - 氏名
summary: 利用していたプレイドのサービス「KARTE」が不正アクセスを受け、連携していた会員データが漏えいしたと公表した。対象はファッションレンタル「メチャカリ」と会員サービス「STRIPE CLUB」。第二報では、メチャカリは会員ID 30,678件（うちメールアドレスを含むもの190件、氏名は0件）、STRIPE CLUBはメールアドレス・会員IDを含むデータ150,069件と氏名・フリガナを含むデータ1件を確認した。STRIPE CLUBは2026年6月にKARTEの利用を終えていたが、データがプレイドに残っていた。クレジットカード情報、ログインパスワード、住所、電話番号は含まれていないとしている。
sources:
