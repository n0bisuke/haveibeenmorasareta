date_occurred: 2026-11-09
date_announced: 2026-11-11
affected_count: 56487
count_note: 最大56,487人。漏えいした項目は持株会ごとに異なる。電話番号・メールアドレスはシステムに登録がない
cause: unauthorized_access
root_cause: 持株会事務の受託で使う持株会管理システムに第三者が侵入した。原因は調査中
data_types:
  - 氏名
  - 住所
