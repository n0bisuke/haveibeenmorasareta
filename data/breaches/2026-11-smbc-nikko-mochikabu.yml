  - 資産・取引情報
  - 会員ID
summary: 持株会から受託する会員持分の計算などの事務で使う「持株会管理システム」が第三者の不正アクセスを受け、最大56,487人の個人情報が漏えいした、または漏えいした可能性があると公表した。対象は持株会名、投資銘柄、会員識別番号、氏名、住所、配当金および諸税、持分残高、振替先口座情報などで、項目は持株会ごとに異なる。11月9日に不正アクセスを確認し、同日中に遮断してサービスを停止した。
