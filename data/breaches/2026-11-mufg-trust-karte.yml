summary: 三菱UFJ信託ダイレクト（インターネットバンキング）利用者への通知等の機能を委託している株式会社プレイドの「KARTE」が不正アクセスを受け、一部の顧客情報が外部に漏えいしたと公表した。会員番号を基に生成した識別子、性別、メールアドレス登録の有無と、LINE公式アカウント併用者については利用者識別番号とアンケート回答（性別、年齢、都道府県）で、合計約23万件。氏名、住所、生年月日、電話番号、メールアドレス、口座番号、暗証番号、パスワードは含まれず、資産や取引への影響は確認されていないとしている。
sources:
  - title: 当社委託先が提供するサービスへの不正アクセスについて（三菱UFJ信託銀行）
    url: https://www.tr.mufg.jp/ippan/release/pdf_mutb/261118_2.pdf
checklist:
  - text: 三菱UFJ信託銀行からのメール等による個別連絡を確認する
  - text: 同行を装って暗証番号やパスワードを尋ねるメール・SMS・電話に応じない
