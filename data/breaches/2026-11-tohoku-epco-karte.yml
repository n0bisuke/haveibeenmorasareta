summary: ホームページの問合せチャットやお知らせ配信に利用している株式会社プレイドの「KARTE」への不正アクセスにより、顧客情報が外部に漏えいしたと公表した。問合せチャットのメッセージ（内部管理IDを含む）最大4件と、会員制Webサービス「よりそうeねっと」会員の内部管理ID最大50件が漏えいした。チャットのメッセージは問い合わせ時の入力内容のため個人情報が含まれる可能性がある。どの情報が漏えいしたか特定できず、対象となる可能性があるのはチャット8,527件、会員2,533件。11月24日にプレイドから調査完了の連絡を受けて判明した。
