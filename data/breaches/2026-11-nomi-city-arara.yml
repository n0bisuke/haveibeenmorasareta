summary: マイナンバーカード交付予約システムと「ネットdeスマート申請」のメール配信を担う外部サービスが第三者の不正アクセスを受け、利用者のメールアドレス758件が漏えいしたと公表した。2つのシステムには氏名や住所、電話番号も登録されているが、漏えいしたのはメールアドレスだけとしている。ネットdeスマート申請は一時停止した。
