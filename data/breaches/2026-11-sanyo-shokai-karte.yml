summary: 委託先の株式会社プレイドの「KARTE」が第三者による不正アクセスを受け、同社が管理する顧客データのうち個人情報を含む一部の情報が外部に漏えいしたと公表した。KARTEに取り込んでいた居住地の都道府県コード、性別、生年月日（年齢）、購入ブランド・店舗名の漏えいを確認し、SANYO MEMBERSHIP会員IDが一部含まれる可能性がある。別に、過去に運営していたECサイト「ECOALF」「Paul Stuart」「LOVELESS」の利用者の氏名、メールアドレス、電話番号も漏えいした可能性があり、プレイドが保有していた経緯を確認中としている。クレジットカード情報は含まれない。件数は精査中。
sources:
