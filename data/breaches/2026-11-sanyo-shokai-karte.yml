    url: https://www.sanyo-shokai.co.jp/important/2026/11/17-1301.html
checklist:
  - text: 三陽商会やプレイドをかたる不審なメール・SMS・電話のURLや添付を開かない
  - text: 件数確定後に届く個別の案内を確認する
