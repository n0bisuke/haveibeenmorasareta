summary: 過去にWebサイトの制作・運営に使っていた「STUDIO」で第三者の不正アクセスが発生し、旧コーポレートサイト（株式会社OneMile Partners時代）のフォームから送信された計994件（737人）の情報が流出したおそれがあると公表した。2021〜2022年の問い合わせ839件、採用説明会申込118件、カジュアル面談申込37件が対象で、氏名、会社名、電話番号、メールアドレス、勤務先、職種、年齢層、性別などが含まれる。保険募集・金融商品仲介で扱う契約・取引情報は含まれない。二次被害は確認されていない。
sources:
