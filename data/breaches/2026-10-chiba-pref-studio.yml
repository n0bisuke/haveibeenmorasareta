count_note: ちば部の登録法人78事業者と問い合わせ15人（18件）、在宅医療スタートアップ支援事業29事業者、DX人材育成事業の研修参加者11人、外国人観光客向け体験観光プログラム事業4事業者（5件）。単位が異なるため合計は示されていない
