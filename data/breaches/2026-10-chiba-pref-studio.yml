summary: 県の4つの委託事業で使うクラウドサービス「Studio」が第三者の不正アクセスを受け、個人情報等が漏えいした可能性があると公表した。若者の仲間づくり支援事業「ちば部」の登録法人78事業者と問い合わせ15人（18件）、在宅医療スタートアップ支援事業の医療機関29事業者、企業課題解決型DX人材育成事業の研修参加者11人、外国人観光客向け体験観光プログラム事業の4事業者（5件）が対象で、氏名、メールアドレス、電話番号、性別、問い合わせ内容などが含まれる。対象者には注意喚起を行った。
