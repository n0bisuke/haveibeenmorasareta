summary: ホワイトニング・審美歯科チェーンの予約サイトと基幹システムが不正アクセスを受け、8月にシステムを停止して公表した。10月の続報で、予約サイトの脆弱性を悪用して基幹システムに侵入され、約105万アカウント分の氏名・住所・電話番号・生年月日などが外部に持ち出されたと発表した。
