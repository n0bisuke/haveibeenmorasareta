organization: 京成電鉄株式会社
group: 京成グループ
services:
  - スカイライナー座席予約システム（チケットレスサービス）
industry: 交通・モビリティ
country: JP
date_occurred: 2026-11-11
date_announced: 2026-11-13
affected_count: 3370000
count_note: 最大約337万件（取得された可能性）
cause: unauthorized_access
root_cause: スカイライナー座席予約システムが第三者の不正アクセスを受けた。手口は公表されていない
data_types:
  - 会員ID
  - パスワード（ハッシュ化・暗号化済み）
  - 氏名
  - 電話番号
  - メールアドレス
summary: 11月11日深夜、スカイライナー座席予約システムが第三者の不正アクセスを受け、スカイライナーチケットレスサービスの利用者情報が最大約337万件取得された可能性があると公表した。対象はユーザーID、パスワード、カナ氏名、電話番号、メールアドレスで、パスワードは暗号化されており復元されることはないとしている。座席予約システム全般の利用を停止し、駅窓口と券売機での販売は続けている。対象者には個別に連絡する。
