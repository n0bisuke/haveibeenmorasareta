summary: メールマガジンや各種通知メールの配信に利用するユミルリンクの「Cuenote FC」への不正アクセスにより、顧客の氏名、生年月日、性別、住所、電話番号、メールアドレス、旅程の8,997,106件が漏えいしたと公表した。委託先での発生は10月18日で、11月6日に影響範囲が確定した。クレジットカード情報とパスポート情報は含まれず、予約や運航への影響はない。メールマガジン、自動配信メール、返金払い戻しフォームを停止した。10月に公表したIDCFクラウドのランサムウェア被害とは別の事案。
