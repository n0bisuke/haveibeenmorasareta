checklist:
  - text: 便の変更・返金・ポイント失効を装うメールやSMSのリンクを開かず、公式サイトやアプリで予約を確認する
  - text: 対象者には登録メールアドレスに順次連絡するとしている。Peachからの連絡を確認する
