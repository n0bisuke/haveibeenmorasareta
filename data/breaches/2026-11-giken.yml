affected_count: 3200
count_note: 約3,200名。ユーザー・指定工場の担当者（海外企業を含む）とグループ従業員。外部送信の痕跡は現時点で確認されていない
cause: ransomware
root_cause: 業務用サーバー1台がランサムウェアを含む外部からの不正アクセスを受けた
data_types:
  - 氏名
  - メールアドレス
  - 電話番号
  - 取引先情報
  - 従業員情報
  - 会員ID
  - パスワード（ハッシュ化・暗号化済み）
summary: 業務用サーバー1台がランサムウェアを含む外部からの不正アクセスを受け、ユーザーと指定工場の担当者（海外企業を含む）、グループ従業員の約3,200名分の個人情報が漏えいしたおそれがあると公表した。対象は氏名、会社名、部署・役職、メールアドレス、電話番号、社員番号、顧客支援システムのログインIDと暗号化済みパスワードなど。11月5日に異常を確認し、翌6日に外部からの接続を遮断した。外部送信の痕跡は現時点で確認されていない。
