summary: 「進研ゼミ」「こどもちゃれんじ」などの顧客情報が、システム開発・運用を担うグループ会社シンフォームの業務委託先の元社員により不正に持ち出され、名簿業者3社に売却された。元社員はデータベースから抽出した顧客情報を業務用PCに保存し、USBケーブルで私物のスマートフォンへ転送していた。PCの書き出し制御は一部の新機種のスマートフォンに機能しない状態で、通信量のアラートもこのデータベースとの通信を対象にしていなかった。2014年6月27日に顧客からの問い合わせで漏えいの可能性を認識し、7月9日に公表した。売却された情報は約3,504万件で、会社は実際に被害を受けた顧客を約2,895万件と推計した。クレジットカード情報が名簿業者へ売却された事実は確認されていない。元社員は7月17日に不正競争防止法違反の容疑で逮捕され、9月26日に経済産業省が同社に個人情報保護法に基づく勧告を行った。
