count_note: 約3,504万件（名簿業者3社に売却された件数。重複と名寄せで整理した後の件数）。会社は実際に被害を受けた顧客を約2,895万件と推計。調査委員会の人単位の集計では約4,858万人。当初発表は約760万件（最大約2,070万件の可能性）
cause: third_party
root_cause: システム開発・運用を担うグループ会社シンフォームの業務委託先の元社員が、顧客情報を業務用PCから私物のスマートフォンに書き出して持ち出した
