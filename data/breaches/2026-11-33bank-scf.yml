summary: 「三十三銀行フリーローン」の保証業務を行うSMBCコンシューマーファイナンスの保証システムが不正アクセスを受けて外部にデータが送信され、顧客914人の氏名・性別・生年月日・住所・電話番号・メールアドレス・運転免許証番号・勤務先情報（年収等）・契約情報が漏えいしたと公表した。本人確認書類の画像は含まれず、銀行のシステムへの不正アクセスではない。保証会社のシステムの安全性が確認されるまで同ローンの新規申込を停止した。
