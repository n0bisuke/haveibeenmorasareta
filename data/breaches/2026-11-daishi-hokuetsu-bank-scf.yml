summary: 個人向けローン「べんリーナ365」「生活百科」の保証会社SMBCコンシューマーファイナンスのシステムが第三者による不正アクセスを受け、2020年9月30日以前に申し込んだ一部の顧客1,227人の氏名・性別・生年月日・住所・電話番号・メールアドレス・運転免許証番号・年収・契約情報が外部へ漏えいしたと公表した。本人確認書類の画像は含まれない。対象者には保証会社がメールやSMSで個別に案内し、二次被害は確認されていない。
