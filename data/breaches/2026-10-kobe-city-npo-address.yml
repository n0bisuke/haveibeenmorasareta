summary: 神戸市は、市ホームページと内閣府サイトで公開したNPO法人の役員・社員名簿において、住所のマスキング処理が解除可能な状態で掲載され、61法人計434人の住所が閲覧できたことを発表した。2024年4月以降、処理後データをそのまま公開したことが原因で、同年9月10日に発覚した。市は対象者へ謝罪文を送付し、編集ソフトの導入で再発防止策を講じた。
