summary: メール配信を委託していたアララの「アララメッセージ」が不正アクセスを受け、「アソビュー！」の会員情報延べ15,821,184件の会員ID・氏名・メールアドレス・生年月日・電話番号・居住地域・最終ログイン日・チケットの購入や利用の履歴が流出したと公表した。パスワードとクレジットカード情報は含まれない。11月2日に報告を受け、メール配信を停止した。
