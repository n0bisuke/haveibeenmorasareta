organization: 株式会社ヒューマンアジャスト
services:
  - LINE公式アカウント（COMSBI SaaS版）
country: JP
date_occurred: 2026-11-09
date_announced: 2026-11-13
affected_count: 116518
count_note: LINE友だち情報最大116,518人と、利用者情報最大58,510人。いずれも確認中の最大値
cause: third_party
root_cause: LINE連携サービス「COMSBI（SaaS版）」の提供元ソニックムーブの社内用アカウントの認証情報が不正に取得された
attack_methods:
  - stolen_credentials
vendor:
  name: 株式会社ソニックムーブ
data_types:
  - 氏名
  - 電話番号
  - メールアドレス
  - 住所
  - 生年月日
  - 性別
  - アカウント名
  - 連携サービスID
summary: 利用するソニックムーブのLINE連携クラウドサービス「COMSBI（SaaS版）」が不正アクセスを受け、保有する個人情報が漏えいした可能性があると公表した。ソニックムーブの社内用アカウントの認証情報が第三者に取得され、11月9日深夜から10日朝にかけて不正にアクセスされた。最大58,510人の氏名・電話番号・住所・生年月日などの利用者情報と、最大116,518人のLINE友だちの表示名・プロフィール画像URL・LINEユーザーIDが対象。
sources:
  - title: ヒューマンアジャスト 適時開示
    url: https://www.nikkei.com/nkd/disclosure/tdnr/20261113579962/
  - title: セキュリティ対策Lab
    url: https://rocket-boys.co.jp/security-measures-lab/human-adjust-comsbi-saas-line-data-leak-risk-2026/
