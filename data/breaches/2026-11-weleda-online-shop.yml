checklist:
  - text: クレジットカードの利用明細に身に覚えのない請求がないか確認する
  - text: 必要ならカード会社にカードの再発行を依頼する（手数料は同社が負担するよう依頼済み）
  - text: ヴェレダや配送事業者・カード会社を装った不審なメールや SMS で URL を開いたりカード情報を入力したりしない
