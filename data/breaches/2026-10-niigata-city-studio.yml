summary: 市の委託事業の受託事業者が利用者募集に使うWeb制作プラットフォーム「Studio」が第三者の不正アクセスを受け、個人情報等が漏えいした可能性があると公表した。業務効率専門家派遣事業の問い合わせ8件（会社・団体名、担当者氏名、電話番号、メールアドレス、相談内容）と在宅テレワーカー育成・就労支援事業の問い合わせ59件が対象。10月20日には南区の「みなみく妖怪大図鑑ホームページ」の問い合わせ6件も追加で発表した。該当者には連絡済み。
