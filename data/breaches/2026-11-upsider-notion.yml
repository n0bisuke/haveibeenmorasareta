summary: 業務で使うNotionの提供元から、AI機能の処理委託先Fireworks AIへの不正アクセスにより、従業員が2026年10月5日〜24日にNotion AIへ入力した内容と回答の一部が漏えいしたおそれがあるとの連絡を11月10日に受けたと公表した。取引先担当者の氏名・メールアドレス・電話番号・住所、採用候補者、従業員らの情報を含み、137人分の漏えいが疑われる。法人カード等のサービスの会員・カード情報の流出はない。
