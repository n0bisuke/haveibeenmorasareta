date_announced: 2026-11-05
affected_count: null
count_note: 件数は非公表（アーカイブされた顧客データのごく一部）。日本の顧客への影響は未確認
cause: misconfiguration
root_cause: 2025年2月のネットワーク移行で社内のアーカイブシステムが誤ってインターネットに公開され、顧客記録を閲覧された
data_types:
  - 氏名
  - メールアドレス
  - 電話番号
  - 住所
  - 保存データ（写真・文書等）
summary: 2025年2月のネットワーク移行で顧客情報のアーカイブシステムが誤ってインターネットから接続できる状態になり、2026年6月27日〜7月2日に不正なアカウントがアーカイブされた顧客記録を閲覧したと公表した。対象は氏名・業務用メールアドレス・電話番号・事業所の住所で、一部の顧客は運転免許証やパスポートなどの本人確認書類も含まれる。認証局のサービス、ログイン情報、発行済みの証明書は影響を受けていない。
