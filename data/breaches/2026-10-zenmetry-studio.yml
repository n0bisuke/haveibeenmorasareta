summary: 以前コーポレートサイトの制作・運用に使っていた「Studio」のクラウド環境が第三者の不正アクセスを受け、2022年8月25日〜2026年5月22日に問い合わせフォームから送信された1,168件の氏名、会社名・団体名、メールアドレス、電話番号、問い合わせ内容が流出した可能性があると公表した。Studioの利用は停止していたが、過去の送信情報が同社の環境に保存されていた。二次被害は確認されていない。個人情報保護委員会に報告した。
