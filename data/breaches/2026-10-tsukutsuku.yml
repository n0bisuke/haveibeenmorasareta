summary: 通販・ウェブチケットサービス「ツクツク!!!」で、システムの脆弱性を突かれてカード情報の入力ページが改ざんされ、2025年5月10日〜9月9日にカードを新規登録した19,115件のクレジットカード情報（セキュリティコードを含む）が漏えいした可能性が極めて高いと公表した。氏名・住所・ログイン情報など362,750件の個人情報も漏えいの可能性を否定できないとしている。2025年9月にカード会社からの連絡で発覚した。
