summary: 住友生命と連携協定を結んで実施する健康づくり事業「やまぐちVitalityウォーク」で、住友生命がシステム業務を委託するNTTデータのシステムが不正アクセスを受け、応募者3,065人のうち42人の氏名と生年月日が漏えいしたと公表した。住友生命が対象者にメールで連絡し、問い合わせ窓口を設けた。二次被害は確認されておらず、事業は継続する。
