summary: 後払い決済「NP後払い」の請求書再発行システムに第三者が想定外の機械的で連続したリクエストを送り、一部の取引28,884件の氏名・住所（法人は会社名・部署名も）が閲覧されたと公表した。10月14日に不審なリクエストを把握し、同システムを停止した。決済サービスは通常どおり提供しており、不正利用は確認されていない。
