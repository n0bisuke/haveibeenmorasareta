summary: デジタル地域通貨アプリ「トチツーカ」の登録者291人分のIDが外部に漏えいした可能性があると公表した。同行の委託先への不正アクセスが原因とみられ、情報流出の範囲や影響を調べている。トチツーカは石川県内で使われる同行のデジタル地域通貨サービスで、2026年3月にも障害が起きたが、その際は不正アクセスではないと説明していた。今回の委託先の名称や、ID以外の情報が含まれるかどうかは確認できていない。
