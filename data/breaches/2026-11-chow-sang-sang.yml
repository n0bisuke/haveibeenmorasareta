summary: 香港の宝飾品大手の周生生集團國際は、グループのシステムが第三者の不正アクセスを受け、顧客と従業員の個人情報が抜き取られた可能性があると香港取引所で公表した。11月9日に検知し、会員システムと公式ECが対象。顧客の氏名、電話番号、メールアドレス、注文情報の一部、カード番号の下4桁と、従業員の氏名、職位などが含まれる可能性がある。
