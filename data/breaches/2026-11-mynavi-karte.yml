summary: 株式会社プレイドのCXプラットフォーム「KARTE」で11月13日に発生した不正アクセスに関連し、5サービスで取り扱う個人情報が漏えいした可能性があると公表した。最大件数はマイナビウエディング147,185件（氏名・メールアドレス・電話番号）、MATCHBOX122,685件（氏名・年齢・都道府県）、マイナビ学生の窓口6,871件（氏名・メールアドレス）、マイナビ看護学生4,643件（氏名・メールアドレス・学校名）、マイナビバイト66件（企業名・企業担当者名・メールアドレス）で、合計281,450件。クレジットカード情報とマイナンバーは含まれず、自社サービスへの不正アクセスは確認されていないとしている。
sources:
  - title: 株式会社プレイドで発生した不正アクセスに伴う情報漏洩の可能性について（株式会社マイナビ）
    url: https://www.mynavi.jp/topics/post_55321.html
  - title: 「マイナビ看護学生」で利用している外部サービスへの不正アクセスに関するお詫びとお知らせ
    url: https://nurse.mynavi.jp/student/pages/20261124
checklist:
  - text: マイナビからの個別連絡を確認する
  - text: マイナビを装った不審なメール・SMSのリンクや添付を開かず、個人情報やパスワードを入力しない
