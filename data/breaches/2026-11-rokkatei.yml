organization: 株式会社六花亭
services:
  - 六花亭オンラインショップ
industry: 食品
country: JP
date_occurred: 2026-10-21
date_announced: 2026-11-18
affected_count: 8000
count_note: 約8,000件（現時点で確認された件数。調査により変動の可能性）。2026年10月21日21時〜11月18日11時に決済画面でカード情報を入力した利用者
cause: unauthorized_access
root_cause: 不正アクセスでオンラインショップの決済画面のプログラムが改ざんされ、入力情報が外部送信される状態になった
attack_methods:
  - web_skimming
data_types:
  - クレジットカード番号
  - クレジットカードのセキュリティコード
  - クレジットカード情報（番号の一部・有効期限等）
  - 氏名
summary: 運営する「六花亭オンラインショップ」が第三者の不正アクセスを受けて決済画面のプログラムが改ざんされ、2026年10月21日から11月18日までに入力されたクレジットカード番号（全桁）、カード名義人、有効期限、セキュリティコード約8,000件が流出した可能性があると公表した。カード情報はサーバーに保存していなかったが、入力時に抜き取られた可能性がある。11月18日に判明後、サイトを停止し、個人情報保護委員会に報告した。ほかの情報への影響は調査中。
sources:
