organization: 株式会社GFS Education
services:
  - GFS会員サイト
industry: 人材・教育
country: JP
date_occurred: 2026-11-09
date_announced: 2026-11-13
affected_count: 110000
count_note: 約11万人（退会者・申込者・問い合わせ者を含む）。うち84人はマイナンバーカード裏面の画像。影響範囲は調査中
cause: vulnerability
root_cause: 画像アップロード機能の不具合を突かれて不正プログラムを設置・実行され、権限設定にも不備があった
attack_methods:
  - remote_code_execution
data_types:
  - 氏名
  - メールアドレス
  - 生年月日
  - パスワード（ハッシュ化・暗号化済み）
  - 電話番号
  - 住所
  - 利用履歴
  - 購入履歴
  - 問い合わせ内容
  - 保存データ（写真・文書等）
  - 本人確認書類画像
  - マイナンバー
summary: 「GFS会員サイト」で11月9日にサーバーの異常な負荷を検知し、第三者の不正アクセスが判明したと公表した。画像アップロード機能の脆弱性を悪用されて不正なプログラムを設置・実行され、データベースの情報や画像ファイルが持ち出された。会員（退会者含む）・申込者・問い合わせ者約11万人分の氏名、メールアドレス、生年月日、保護処理済みパスワード、電話番号、住所、視聴・購入履歴、本人確認書類の画像などが対象で、うち84人分はマイナンバーカード裏面の画像も含む。
sources:
  - title: GFS Education お知らせ（GFS会員サイト）
