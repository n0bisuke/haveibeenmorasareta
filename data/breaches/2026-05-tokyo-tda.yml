count_note: 最大件数。主に行政職員（一般都民2人を含む）
cause: misconfiguration
root_cause: 個人情報を格納した領域に適切なアクセス制限が設定されておらず、CSVファイルをダウンロードされた
data_types:
  - 氏名
  - メールアドレス
  - パスワード（ハッシュ化・暗号化済み）
summary: 東京都デジタルサービス局が運営する東京デジタルアカデミーのポータルサイトで、個人情報を格納した領域に適切なアクセス制限が設定されていなかった。アクセスログの調査で過去に不正アクセスがありCSVファイルがダウンロードされていたことを確認し、主に行政職員最大2,438人分の氏名・業務用メールアドレス・ハッシュ化パスワードが漏えいした。
