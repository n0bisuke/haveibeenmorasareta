summary: 一部のメール配信に使っていた株式会社プレイドの「KARTE」が11月13日に不正アクセスを受け、対象となる顧客のメールアドレスと、顧客を識別するための社内IDが外部に漏えいした可能性があると公表した。件数は公表していない。同社はクレジットカード情報を保持しておらず、パスワードなどの機密情報もKARTEに連携していないため、漏えいの対象にはならないとしている。
