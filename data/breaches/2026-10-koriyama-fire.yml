summary: 防火管理オンライン講習を委託している株式会社プロシーズのクラウドシステムが不正アクセスを受け、講習申込者のメールアドレス83件が漏えいした疑いがあると発表した。10月7日に委託先から「システム障害」の連絡があり、調べたところ不正アクセスによるものと分かった。対象は7月9日から10月7日までの申込者。二次被害は確認されておらず、組合は申込者に注意喚起のメールを送り、委託先に原因究明と再発防止策の徹底を求めた。
