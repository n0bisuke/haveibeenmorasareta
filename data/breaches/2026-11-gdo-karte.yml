summary: Webサイトとアプリで利用する株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、同サービスに登録していた会員情報の一部が外部に漏えいしたと公表した。対象は会員最大6,974,506件（重複を含む）で、項目は識別子ID、誕生日または誕生月、年代、郵便番号、メール配信の可否を管理する情報。氏名、郵便番号以外の住所、電話番号、メールアドレス、パスワード、決済情報は含まれない。自社システムへの不正アクセスは確認されていない。11月13日からアプリのプッシュ通知など一部機能を停止した。
sources:
  - title: GDO 当社が利用する外部サービス「KARTE」への不正アクセスによるお客様情報の漏えいに関するお詫びとお知らせ
    url: https://company.golfdigest.co.jp/corp/pr/2026111701.html
checklist:
  - text: プレイドをかたる不審なメール・SMS・電話に注意する。GDOがパスワードや決済情報を尋ねることはないとしている
