summary: メール会員情報の管理を委託していたラクスライトクラウドのブラストメールが不正アクセスを受け、10月21日に委託先から報告を受けたとして、最大75,140件の顧客情報が外部に流出した可能性があると10月23日に公表した。対象は千本松牧場オンラインショップ会員とメールマガジン会員の氏名・メールアドレス、ゴルフポイントカード会員の氏名・メールアドレス・生年月日・都道府県。クレジットカード情報は含まれない。ブラストメールの利用を停止した。
