count_note: 対象人数は調査中
cause: unauthorized_access
root_cause: 学内の情報基盤への第三者による不正アクセス（侵入経路は調査中）
data_types:
  - 氏名
  - 住所
  - メールアドレス
summary: 学内の情報基盤が第三者の不正アクセスを受け、個人情報が漏えいした疑いがあると公表した。対象は統合当時に在籍していた旧東京工業大学・旧東京医科歯科大学の学生・教職員などで、氏名・住所・メールアドレスが含まれる。8月28日に情報セキュリティインシデント対策本部を設置した。病院の患者情報の漏えいは確認されていない。対象人数と侵入経路は調査中とした。
