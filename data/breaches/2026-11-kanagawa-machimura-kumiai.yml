summary: 県内10町が共同で使う「スマート申請システム」と「マイナンバーカード交付予約管理システム」のメール送信部分で、外部のメール送信サービスを運営するアララが不正アクセスを受け、利用者のメールアドレスが漏えいした可能性があると公表した。マイナンバーは含まれず、町のシステムへの不正アクセスは確認されていない。
