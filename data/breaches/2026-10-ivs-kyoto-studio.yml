summary: 京都府、京都市、Headline Japan株式会社でつくるIVS KYOTO実行委員会が、IVS2025公式サイトの制作に使っていたStudioが不正アクセスを受け、サイトの回答フォームに入力された約4,200件の氏名、メールアドレス、会社名、役職などが流出した可能性があると京都府が公表した。不正利用や二次被害は確認されておらず、対象者にはHeadline Japanから連絡する。
