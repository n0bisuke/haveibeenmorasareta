  - メールアドレス
summary: オンライン会員サービス「CAPCOM ID」が第三者による不正アクセスを受け、全世界で1,177万4,247件のメールアドレスとシステム固有の識別情報が漏えいした可能性があると公表した。うち43件は生年月日・性別・国地域・ニックネームも含み、196件はログインパスワードが不正に変更されていた（該当アカウントはリセット済み）。10月19日に不正アクセスの痕跡を発見。クレジットカード情報は対象外で、CAPCOM IDを使うサービスは引き続き利用できるとしている。
