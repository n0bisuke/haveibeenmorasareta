affected_count: 155280
count_note: 顧客ID155,280件、受注ID231,998件。うちクレジットカード情報は1,305アカウント分（4件はセキュリティコードを含む）。台湾・香港・マカオ・シンガポールの通販利用者
cause: unauthorized_access
root_cause: 取引先1社に提供していたBIツールを起点とした不正アクセス
