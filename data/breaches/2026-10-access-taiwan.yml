summary: 台湾の連結子会社ACCESS AP TAIWANが提供するEC事業者向け支援サービス「CROS」が不正アクセスを受け、台湾・香港・マカオ・シンガポールの通販利用者の顧客ID15万5,280件分の氏名、住所、電話番号、メールアドレス、受注情報などが流出したと公表した。うち1,305アカウント分はクレジットカード番号・有効期限などを含み、4件はセキュリティコードも含む。9月11日に不正アクセスの兆候を検知した。取引先1社に提供していたBIツールが起点で、窃取されたメール送信サービスの鍵を使った不正メール1万1,441件が送られた。
