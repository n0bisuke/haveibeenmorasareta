summary: 物価高騰対策賃上げ支援事業の事務局を受託したテレビ岩手が、10月6日に申請事業者1社の情報を含むファイルを誤った宛先にメール送信したと発表した。担当者が宛先のアドレスを手入力で誤ったことが原因で、従業員47人分の氏名と時給、担当者名、事業者の口座情報などが含まれていた。送信先は判明しておらず、二次被害は確認されていない。県は複数人での確認を徹底させるとした。
