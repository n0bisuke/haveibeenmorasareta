summary: アンケート結果のダウンロード機能で、本来アクセスできない他の企業・団体の従業員情報がデータに含まれる不具合があった。2025年6月のシステム改修で生じた条件設定の不備が原因で、同年10月に不具合を把握しながら解消が適切に行われていなかった。二次被害は確認されていない。
