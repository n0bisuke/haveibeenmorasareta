summary: マイページへの不審なアクセスを11月4日に検知し、契約者などの氏名・住所・生年月日・電話番号・メールアドレス・証券番号・車両情報や補償内容・保険金支払いの履歴など74件が漏えいした可能性があると公表した。対応内容によっては事故の相手方の情報や銀行口座番号も含まれる可能性がある。Webでの手続きを停止した。
