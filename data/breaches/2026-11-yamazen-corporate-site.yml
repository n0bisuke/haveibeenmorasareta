summary: コーポレートサイトと関連サイトが利用する外部サーバーで不審なファイルが見つかり、ソフトウェアの脆弱性を悪用した不正アクセスで、問い合わせフォームの登録データ延べ10,508件（氏名・住所・電話番号・メールアドレス・所属・問い合わせ内容など）が漏えいした可能性があると公表した。クレジットカード情報は含まれない。
