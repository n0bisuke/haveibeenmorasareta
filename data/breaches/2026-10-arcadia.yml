  - 健康・医療情報
summary: 大阪府箕面市のアルカディアは、自治体向けの防災情報配信サービス「SpeeCAN RAIDEN」などが第三者による不正アクセスを受けたと公表した。10月11日16時30分に不審な挙動を確認し、13日にSpeeCAN RAIDENの一部環境と「ライデン・スクール」を緊急停止した。SpeeCAN RAIDENのメールアドレス約313万6,000件、電話番号約10万5,000件、FAX番号約1万5,000件が漏えいした可能性がある。14日には、聴覚・言語に障害のある人向けの「NET119緊急通報システム」約1万3,000件（利用者名・生年月日・住所など）と、消防の一斉連絡システム「119RAIDEN」にも影響があると公表した。総務省によると、情報漏えいのおそれを報告した自治体は14日時点で111にのぼる。サービスは15日に復旧した。
