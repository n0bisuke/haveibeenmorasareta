count_note: SpeeCAN RAIDENでメールアドレス約313万6,000件、電話番号約10万5,000件、FAX番号約1万5,000件（いずれも漏えいの可能性がある最大値）。ほかにNET119約1万3,000件、119RAIDENでメールアドレス最大約9万7,000件など
cause: unauthorized_access
root_cause: 自治体向け配信サービスへの第三者による不正アクセス（侵入経路は非公表）
