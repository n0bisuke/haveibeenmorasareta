summary: 9月24日に事務部門のNASでランサムウェアの被害を確認し、28日に公表した。10月30日に、学生・教職員ら約8万人分の氏名・住所・メールアドレス・パスワードなどと、附属病院の患者の診療科・傷病名・受診日などが流出した可能性があると公表した。脅迫文があり、県警に相談した。
