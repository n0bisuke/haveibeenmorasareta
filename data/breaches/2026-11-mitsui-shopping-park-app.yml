summary: 運営する三井ショッピングパークアプリが第三者の不正アクセスを受け、三井ショッピングパークポイント会員のポイント会員番号、氏名、生年月日、住所、メールアドレスの一部が漏えいしたと公表した。クレジットカード情報やパスワードは含まない。11月18日に不正アクセスを確認し、同日アプリの提供を一時停止した。対象範囲、件数、侵入経路は調査中で、個人情報保護委員会に速報した。各施設や通販サイトは通常どおり営業している。11月26日の第2報で、漏えいした会員は約311万9千人分と確定し、電話番号と性別も対象に含まれると公表した。侵入経路と手段は特定済みで、周辺システムへの影響や二次被害は確認されていない。
