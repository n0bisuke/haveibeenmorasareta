summary: 運営する三井ショッピングパークアプリが第三者の不正アクセスを受け、三井ショッピングパークポイント会員のポイント会員番号、氏名、生年月日、住所、メールアドレスの一部が漏えいしたと公表した。クレジットカード情報やパスワードは含まない。11月18日に不正アクセスを確認し、同日アプリの提供を一時停止した。対象範囲、件数、侵入経路は調査中で、個人情報保護委員会に速報した。各施設や通販サイトは通常どおり営業している。
