summary: 美容医療予約サービス「トリビュー」を運営する同社は、湘南美容クリニック55院とリッツ美容外科東京院に提供する管理アプリケーションで11月16日に不正ログインを確認し、予約者12,641人の氏名（カナ）、電話番号、年齢、希望施術、予約メニュー名などが取得されたと公表した。施術を受けた6,804人は施術名・施術日・施術金額も対象となった。国内外の多数の接続元から攻撃を受け、SBCメディカルグループのアカウントに不正ログインされたもので、同グループの全アカウントのパスワードを無効化した。
