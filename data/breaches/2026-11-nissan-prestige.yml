summary: ロードサービスなどの業務を委託するプレステージ・コアソリューションの業務システム「PremierNet2」が10月29日に不正アクセスを受け、顧客の個人情報が外部に漏えいしたと公表した。対象はCIMA・FUGA・SKYLINEサポートプログラム専用窓口の利用者68件と、エクストレイル リコール専用窓口の利用者6件の計74件。氏名、電話番号、登録番号・車台番号などの車両情報、事故・故障の受付情報が含まれる。クレジットカードや口座の情報は含まれない。
