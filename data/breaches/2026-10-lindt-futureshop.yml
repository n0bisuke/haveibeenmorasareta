  - パスワード（ハッシュ化・暗号化済み）
summary: オンラインショップのシステム提供と会員情報の管理を委託するフューチャーショップのサーバーが、10月17日夜から18日未明にソフトウェアの脆弱性を悪用した不正アクセスを受け、オンラインショップと公式アプリで共通の会員アカウントの情報が取得されたと公表した。対象は会員ID、氏名、メールアドレス、住所、電話番号、生年月日、性別、ハッシュ化したパスワードなどで、件数は精査後3,147,377件。クレジットカード情報は含まれない。10月26日にパスワードを強制リセットした。
sources:
