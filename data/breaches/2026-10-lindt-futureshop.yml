affected_count: 3147377
count_note: 重複を精査して10月30日に更新（当初は3,147,469件）。退会済み会員・ゲスト購入者・送り先は含まない
cause: third_party
root_cause: ECシステムの委託先フューチャーショップのサーバーで使うソフトウェアの脆弱性を悪用された
vendor:
  name: 株式会社フューチャーショップ
data_types:
  - 会員ID
  - 氏名
  - メールアドレス
  - 住所
  - 電話番号
