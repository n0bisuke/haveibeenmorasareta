  - title: セキュリティ対策Lab
    url: https://rocket-boys.co.jp/?p=45040
checklist:
  - text: リンツのオンラインショップで使っていたパスワードを他のサービスで使っていれば変更する
  - text: リンツを名乗るメールのリンクは開かず、公式サイトで確認する
