summary: 8月10日にサーバー内のファイルの一部が暗号化されるランサムウェア被害を受けたと公表した。攻撃者が何らかの方法で管理者権限を取得し、ランサムウェアを配布したとみられる。10月13日の最終報で、従業員125件（氏名・住所・生年月日・性別・電話番号・メールアドレス・暗号化して保管していたマイナンバー）と取引先担当者11,587件（氏名・電話番号・メールアドレス）の計11,712件に漏えいのおそれがあるとした。外部送信の明確な痕跡はないが、窃取の可能性を否定できないとしている。
