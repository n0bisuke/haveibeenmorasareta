    url: https://www.livepass.jp/news-list/2026-11-20
  - title: livepass 「livepass Catch」一部サービス緊急停止のお知らせ
    url: https://www.livepass.jp/news-list/2026-11-17
  - title: セキュリティ対策Lab
    url: https://rocket-boys.co.jp/security-measures-lab/livepass-catch-graphy-13313-data-breach-20261120-b2b-seo/
checklist:
  - text: 管理画面と同じパスワードを他のサービスで使っていたら変更する
  - text: Graphy連携用の認証情報を無効化する（利用企業）
