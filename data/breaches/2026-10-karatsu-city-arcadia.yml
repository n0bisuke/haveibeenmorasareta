summary: 唐津市は10月13日、唐津市情報メール配信サービスを業務委託している株式会社アルカディアが第三者の不正アクセスを受け、登録者のメールアドレスなどの個人情報が漏えいしたおそれがあると発表した。アルカディアの一斉配信サービス「SpeeCAN RAIDEN」をめぐる一連の事案の一つ。報道によると、約1万8,000件の登録情報が対象で、市は新規登録を停止した。
