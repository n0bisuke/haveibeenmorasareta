summary: Webサイトの制作に使っていたStudioのクラウド環境が9月30日〜10月1日に不正アクセスを受け、「クラウドタウン」の申し込みフォーム1万1,462件と問い合わせフォーム299件、「クラウドワークス アカデミー」354件、「クラウドリンクス」16件の計1万2,131件の送信情報が漏えいした可能性があると公表した。氏名、メールアドレス、電話番号、問い合わせ内容のほか、フォームにより職種、経験年数、年齢、所属企業名、役職などが含まれる。実際の取得や二次被害は確認されていない。
sources:
