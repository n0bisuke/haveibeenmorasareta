summary: 元職員が顧客の個人情報を含む業務ファイルを私物のUSBメモリに保存して自宅へ持ち帰っており、最大18,316名分が外部に漏えいした可能性がある。勤務先・年収・取引残高なども含まれる。業務用PCのダウンロード状況の確認で発覚した。暗証番号やネットバンキングのID・パスワード、マイナンバーは含まれない。
