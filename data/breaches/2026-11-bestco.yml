count_note: 最大146,133件（2026年11月20日までの在籍者情報最大50,196件と、過去の問い合わせ情報最大95,937件の合計。重複の有無は未公表）。漏えいの「可能性」の段階
cause: unauthorized_access
root_cause: 利用するシステムに第三者が不正アクセスした（原因は外部専門機関と調査中）
