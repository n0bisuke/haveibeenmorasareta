  - 氏名
  - 住所
  - 電話番号
  - メールアドレス
  - 口座番号
  - 資産・取引情報
  - アカウント名
  - パスワード（保管形式不明）
  - 問い合わせ内容
summary: 利用するシステムが11月20日に第三者から不正アクセスを受け、学習塾の顧客の個人情報が外部に漏えいした可能性があると公表した。対象は11月20日までに在籍していた顧客の情報最大50,196件と、過去の問い合わせ情報最大95,937件。在籍者情報には保護者と子どもの氏名、兄弟姉妹の情報、住所、電話番号、メールアドレス、成績、入塾状況のほか、口座番号・口座名義・月謝金額・入金や引き落としの履歴、教育情報アプリに設定されたIDとパスワードが含まれる。クレジットカード情報は含まれず、二次被害は確認されていない。教育情報アプリのパスワード変更と、口座取引の確認を呼びかけている。
