summary: 公立園で使う午睡チェック支援システム「icuco touch&care」の提供元icuco株式会社から、個人情報を含む一部のファイルが外部から閲覧可能な状態になり、第三者のアクセスを確認したとの報告を受けたと公表した。岡部保育所と忍ヶ丘あおぞらこども園の0歳児18人の氏名・生年月日・性別・園名・クラス名と、職員26人の氏名が漏えいした可能性がある。
