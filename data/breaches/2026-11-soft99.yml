organization: 株式会社ソフト９９コーポレーション
services:
  - ソフト99公式オンラインショップ
industry: 製造
country: JP
date_announced: 2026-11-10
affected_count: 136968
count_note: 最大136,968人。11月5日までに会員登録または購入した顧客で、流出が確定した人数ではない
cause: unauthorized_access
root_cause: 問い合わせフォームの画像添付機能から不正なプログラムファイルがアップロードされた
data_types:
  - 氏名
  - 住所
  - メールアドレス
  - 電話番号
  - 購入履歴
  - クレジットカード情報（番号の一部・有効期限等）
summary: 公式オンラインショップが第三者の不正アクセスを受け、最大13万6,968人の個人情報が漏えいした可能性があると公表した。問い合わせフォームの画像添付機能から不正なプログラムファイルがアップロードされた。11月5日に委託先から不審な動きの連絡を受けて発覚した。対象は5日までに会員登録や購入をした顧客で、氏名、メールアドレス、電話番号、購入履歴、届け先、カード番号の下4桁・有効期限・名義人などを含む。ショップを停止し、個人情報保護委員会に報告した。
