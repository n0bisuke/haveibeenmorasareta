summary: 利用している株式会社プレイドの「KARTE」が第三者による不正アクセスを受け、同サービス上で管理していた顧客の個人情報等が外部に漏えいした可能性があることが判明したと公表した。影響範囲の確認と安全性の確保が完了するまで、11月17日15時45分からWebサイト経由の会員サイトへのログインを一時停止し（公式アプリからはログイン可能）、自動音声応答のガイダンスと一部サービスをオペレーター対応に切り替えた。漏えいの有無と影響範囲はプレイドと連携して調査中で、項目や件数は公表されていない。
