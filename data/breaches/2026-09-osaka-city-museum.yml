summary: 大阪市立美術館で、講座の受講者1人に返信する際に同じ講座の受講者のグループメールを宛先に設定したまま送信し、受講者30人の氏名とメールアドレスが漏えいしたと大阪市が公表した。9月10日に送信し、9月16日に受信者からの問い合わせで判明した。担当者は当日に気づいて謝罪と削除依頼をしたが、上司に報告していなかった。
