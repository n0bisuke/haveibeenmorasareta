count_note: 約2,362万件（うちメールアドレス登録のない匿名ユーザー約1,801万件）。別に画像メタデータ約4.9億件、第二報で削除済み画像のメタデータ約1.74億件の流出も判明。第三報で133人の画像ファイル432件の閲覧・取得も判明
cause: vulnerability
root_cause: 画像アップロードサーバーの脆弱性で任意のコマンドを実行された
vuln_target: web_app
attack_methods:
  - remote_code_execution
data_types:
  - メールアドレス
  - アカウント名
  - 画像メタデータ
  - 保存データ（写真・文書等）
summary: 画像アップロードサーバーの脆弱性を悪用され、システム上で任意のコマンドを実行された。ユーザーに関するデータ約2,362万件と画像のメタデータ約4.9億件が外部に流出した。9月25日の第二報で、過去に削除された画像のメタデータ約1.74億件の流出も判明した。9月27日にサービスを再開し、不正アクセス以前の画像は所有者本人だけが見られる状態にした。10月21日の第三報で外部専門機関のフォレンジック調査の結果を公表し、133人のユーザーが持つ画像ファイル432件が第三者に閲覧・取得されていたことが判明した。
