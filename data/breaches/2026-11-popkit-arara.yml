summary: POPKITは、メールマガジンの配信を委託しているアララ株式会社の「アララメッセージ」が第三者の不正アクセスを受け、個人版POPKITでメールマガジンの受信を許可していた利用者のメールアドレス約20万件が外部に流出した可能性があると公表した。流出の可能性があるのはメールアドレスのみで、法人版への影響はないとしている。悪用の確定的な報告は受けていないが、アララの送信元などを悪用したフィッシングメールが届くおそれがあるとして注意を呼びかけた。
