summary: 越境EC購入代行サービス「WorldShopping」が10月15日から16日にかけて第三者による不正アクセスを受け、台湾・香港・米国などの海外の顧客301人のメールアドレス、氏名、住所、電話番号、注文情報が漏えいしたと公表した。クレジットカード情報とパスワードは含まれない。メール配信システムと入力フォームの不備を修正し、攻撃者が使った認証情報を無効化した。
