date_announced: 2026-11-26
affected_count: 9440000
count_note: 最大で延べ約944万件（延べ件数で、実人数ではない）。2019〜2023年頃にウェブサービスを利用した顧客の情報
cause: third_party
root_cause: 2025年8月の契約終了後も、削除されるべき顧客情報がプレイドの「KARTE」に残っており、不正アクセスを受けた
attack_methods:
  - stolen_credentials
vendor:
  name: 株式会社プレイド
data_types:
  - 氏名
  - 生年月日
  - 郵便番号
  - 住所
  - 電話番号
  - メールアドレス
summary: 過去に公式サイトで利用していた株式会社プレイドの顧客情報分析サービス「KARTE」が不正アクセスを受けた影響で、2019〜2023年頃にウェブサービスを利用した顧客の氏名、生年月日、郵便番号、住所、電話番号、メールアドレスが最大で延べ約944万件漏えいしたと公表した。プレイドとの契約は2025年8月に終了していたが、利用規約に基づき削除されるべき情報が、プレイドの人的オペレーションと管理の不備で残っていた。クレジットカード情報とパスポート情報は含まれない。不正利用は確認されていない。11月20日に公表したユミルリンク「Cuenote FC」経由の漏えいとは別の事案。
