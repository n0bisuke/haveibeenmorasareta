summary: 銀行カードローンなどの保証業務システムが11月2日に不正アクセスを受け、外部に送信されたデータに最大320,118人の氏名・住所・生年月日・電話番号・メールアドレス・運転免許証番号・勤務先・年収・保証額などの契約情報が含まれていたと公表した。本人確認書類の画像は含まれない。北洋銀行や愛媛銀行など保証提携先の銀行も影響を公表している。
