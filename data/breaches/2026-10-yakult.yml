organization: 株式会社ヤクルト本社
services:
  - 公式ホームページ
  - 給食サイト「たのしい給食」
  - 問い合わせフォーム
industry: 食品
country: JP
date_announced: 2026-10-26
affected_count: 40000
count_note: 約4万件（暫定。最終件数と対象期間は精査中）
cause: unauthorized_access
summary: 公式ホームページへの不正アクセスを確認し、10月26日夜から公式サイトを緊急メンテナンスとして停止した。顧客情報への影響は調査中としている。10月30日の第2報で、問い合わせフォームの利用者、給食サイト「たのしい給食」の会員、報道関係者向けフォームの利用者、対応した社員の約4万件の氏名・住所・電話番号・メールアドレス・問い合わせ内容などが漏えいしたと公表した。会員は暗号化された登録パスワードも含む。クレジットカード・口座情報は預かっていない。
