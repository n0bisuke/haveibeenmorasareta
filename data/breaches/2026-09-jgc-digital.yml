summary: 日揮ホールディングスの子会社JGC Digitalは、データの集計・分析に使っていたBIツール「Metabase」の脆弱性を悪用した不正アクセスを受け、顧客情報が取得されたと公表した。9月16日に異常を検知し、同日中に侵入経路を遮断した。建設現場向けサービス「アザス」の約4万件（氏名・生年月日・性別・メールアドレス・所属など）と衣類回収サービス「するーぷ」の約2万件（メールアドレス・生年月・性別・郵便番号・職業など）の計約6万アカウント分が対象で、パスワードは同社が管理しておらず漏えいしていない。
