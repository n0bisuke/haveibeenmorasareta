summary: ID管理・シングルサインオンの「GMOトラスト・ログイン」で、ロゴ画像の配信用に公開していたストレージに顧客情報を含む一時ファイルなどが保存され、2017年11月〜2026年9月に外部から取得できる状態だったと9月16日に公表した。10月30日の第3報で、対象を2,492社の45,030人のメールアドレス・氏名・連携サービス名・企業が設定した項目（社員番号・所属など）に広げた。2021年6月以降に第三者が取得したことを確認している。パスワードと決済情報は含まれない。
