summary: 「ゆめタウン」を展開するイズミは、通販「ゆめオンライン」と配送サービス「ゆめデリバリー」の会員の氏名とメールアドレスが、最大約40万件漏えいした可能性があると公表した。メールマガジンの配信を委託する事業者が使うIDCフロンティアのクラウドが不正アクセスを受けた。住所・電話番号・クレジットカード番号は含まれない。外部への漏えいや不正利用は確認されておらず、メールマガジンの配信を停止している。
