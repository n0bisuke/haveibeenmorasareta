summary: 市立吉原小学校が保護者連絡システムで体操服の希望サイズ調査票を送った際、添付したExcelファイルに、2019年度と2021〜26年度に入学した高野小・由良川小・吉原小の児童154人分の名前、体操服のサイズ、保護者の携帯電話番号などが含まれていたと公表した。ファイルは体操服取扱業者から提供されたもので、本来削除すべきデータがそのまま学校に提出されていた。11月6日に吉原小の16世帯に送信し、16日に保護者からの連絡で発覚した。市はファイルをダウンロードした2世帯を訪問し、削除を確認した。
