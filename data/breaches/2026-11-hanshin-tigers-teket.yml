summary: NTTドコモと共催する野球教室イベント「トライアルベースボール in 京都」の応募フォームとして利用していた電子チケットサービス「teket」が第三者の不正アクセスを受け、流出した情報にイベントへの申込者の情報が含まれている可能性があると公表した。対象は最大155件で、teketの会員情報である氏名、メールアドレス、生年月日、性別、住所、電話番号の全部または一部。二次被害は確認されていない。
