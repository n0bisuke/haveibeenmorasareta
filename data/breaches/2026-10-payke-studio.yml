summary: コーポレートサイトの運営に使うクラウドサービス「Studio」が第三者の不正アクセスを受け、問い合わせ、無料デモ申し込み、資料ダウンロードなどのフォームから2025年12月8日〜2026年10月14日に送信された延べ1,331件の情報が漏えいした可能性があると公表した。氏名、会社名、部署名、役職、メールアドレス、電話番号、問い合わせ内容などが含まれる。添付ファイルはファイル名のみが対象。同社のサービス・システムへの不正アクセスは確認されていない。
