summary: アルカディアが提供する自治体向け防災情報配信サービス『SpeeCAN RAIDEN』が2026年10月11日に不正アクセスを受け、メールアドレス約313万6千件と電話番号約10万5千件が漏洩した可能性があると発表した。影響を受けた自治体はサービスを停止し、調査を進めている。
