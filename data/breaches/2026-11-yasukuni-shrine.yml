summary: お守りなどを申し込む「オンライン授与品・頒布品サイト」が不正アクセスを受け、会員約1万4500件の氏名、メールアドレス、アカウント登録日時、パスワードのハッシュ値と生成補助情報が流出したと公表した。ハッシュ値から元のパスワードを特定されるおそれがあるとして、同じパスワードを使い回している人には変更を呼びかけた。10月28日に把握し、同日サイトを停止した。住所・電話番号・クレジットカード情報の漏えいは確認されていない。
