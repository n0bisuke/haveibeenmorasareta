summary: 県立学校6校で計621人分の生徒指導要録を紛失した。沼津工業高校定時制で卒業生からの証明書申請をきっかけに55人分の所在不明が分かり、全県立学校を調べた結果、ほかの5校で566人分の紛失も判明した。外部への流出は確認されていない。
