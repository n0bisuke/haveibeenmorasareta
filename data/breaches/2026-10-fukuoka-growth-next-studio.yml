summary: ウェブサイトの制作・運用に使う「Studio」が第三者の不正アクセスを受け、サイトの6つのフォームから送信された計629件の情報が漏えいした可能性があると公表した。お問い合わせ（日本語185件・英語87件）、スタートアップカフェの問い合わせ190件、入居申し込み3件、STARTUP ELITE Bootcampの応募89件・75件が対象で、氏名、会社名、電話番号、メールアドレス、所在地、事業構想、SNSアカウント情報などが含まれる。送信情報は暗号化して保存されていたが、復号鍵も読み出されたという。
