count_note: 問い合わせフォーム（日本語）185件・（英語）87件、スタートアップカフェ問い合わせ190件、入居申し込み3件、STARTUP ELITE Bootcamp応募89件・75件の計629件
cause: third_party
root_cause: Webサイト制作に使うStudioのクラウド環境の一部機能の脆弱性を悪用され、フォームに送信された内容などが外部から取得できる状態になった
