summary: 産婦人科向けの医療機関向けサービス「@link（アットリンク）」と患者向けの「アットリンクアプリ」などが第三者による不正アクセスを受け、登録された患者の個人情報が漏えいした可能性があると公表した。10月11日に外部の専門機関から情報提供を受けて調査を始め、不正アクセスを確認した。10月14日深夜にサービスを一時停止した。対象となり得るのはサービスを利用する最大787の医療機関で、漏えいした可能性がある情報の項目や人数は調査中としている。
