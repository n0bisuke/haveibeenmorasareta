summary: マーケティングプラットフォーム「ferret One」で内部管理機能の不備を悪用され、10月14日に不正なアカウントを作られたと10月27日に公表した。11月の続報で、複数の脆弱性を悪用され、ログイン用メールアドレスなど4,317件と、利用企業3社の問い合わせなどの個人情報16,970件、4社の非公開ページの情報が閲覧・取得されたと公表した。パスワードと決済情報は含まれない。
