summary: 政府共通の業務基盤GSSに、5月下旬からVPN機器の既知の脆弱性を突いて第三者が侵入していた。6月25日に検知し、7月9日に侵入を確認して保守運用担当者のアカウントを停止した。保守運用担当者のアカウントでサーバ上の大量のファイルにアクセスされ、職員等の個人情報約24.6万件（職員・公務員等約18.9万件、業務に携わった事業者・個人約5.7万件）が漏えいした可能性がある。
