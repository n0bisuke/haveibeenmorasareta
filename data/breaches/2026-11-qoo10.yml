summary: ECモール「Qoo10」のシステムが11月6日に外部の第三者から不正アクセスを受け、一部の顧客の個人情報が閲覧されたと公表した。対象となる可能性があるのは氏名、ニックネーム、メールアドレス、電話番号、生年月日、性別、住所・配送先住所、住所の地理座標、任意入力の身体的特徴、IPアドレス、個人メモ、ポイント残高など。決済情報やパスワードの漏えいを示す証拠はない。認証トークンをすべて無効化し、対象アカウントを強制ログアウトさせた。
