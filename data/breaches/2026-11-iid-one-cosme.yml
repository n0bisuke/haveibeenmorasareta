organization: 株式会社イード
services:
  - ONE cosme
industry: メディア・出版
country: JP
date_announced: 2026-11-18
affected_count: 1154
count_note: 最大1,154名。うち生年月日登録者634名、性別登録者578名
cause: unauthorized_access
root_cause: 第三者が海外のサーバーを経由して不正にアクセスし、会員データを機械的に取得した可能性がある
data_types:
  - メールアドレス
  - 生年月日
  - 性別
  - パスワード（ハッシュ化・暗号化済み）
summary: 11月10日、第三者が海外のサーバーを経由して「ONE cosme」に不正にアクセスし、会員データを機械的に取得した可能性が判明したと公表した。対象は最大1,154名のメールアドレス・生年月日・性別・暗号化されたパスワードで、生年月日の登録者は634名、性別の登録者は578名。取得された可能性のあるメールアドレス宛てに約1,150件のパスワード再設定メールが一斉送信されたことも確認している。アイスタイルの「@cosme」とは別のサービス。
sources:
  - title: ScanNetSecurity
    url: https://scan.netsecurity.ne.jp/article/2026/11/20/56864.html
  - title: ScanNetSecurity（エキサイトニュース）
    url: https://www.excite.co.jp/news/article/Scannetsecurity_56864/
checklist:
  - text: ONE cosmeと同じパスワードを他のサービスで使っていれば変更する
  - text: 身に覚えのないパスワード再設定メールのリンクは開かない
