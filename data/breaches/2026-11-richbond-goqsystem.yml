summary: 楽天市場の「東京道具商会」を運営する同社は、注文の確認や出荷手配に使う受注管理システム「GoQSystem」が第三者の不正アクセスを受け、個人情報を含む注文データの一部が外部に持ち出されたと公表した。発生期間は11月10〜11日で、それより前の注文も対象に含まれる。対象は注文者・届け先の氏名、住所、電話番号、メールアドレス、注文内容など。クレジットカード情報は同システムで保有していない。同店の対象件数は確認中としている。
