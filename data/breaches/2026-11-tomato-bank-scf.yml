summary: カードローン等の一部商品で保証提携するSMBCコンシューマーファイナンスの保証業務システムが第三者による不正アクセスを受け、当行顧客の情報も漏えいの対象となっていることを確認したと公表した。同社が公表した項目は氏名・性別・生年月日・住所・電話番号・メールアドレス・運転免許証番号・勤務先情報・契約情報で、本人確認書類の画像は含まれない。対象者は同社が特定して個別に案内し、該当ローンの申込手続を停止した。
