date_announced: 2026-11-26
affected_count: 5134
count_note: 申請5,134件分。情報項目は区の公式発表本文で未確認（報道・解説記事による）
cause: third_party
root_cause: 子育て支援事業の再委託先リンベルのシステムが不正アクセスを受けた
vendor:
  name: リンベル株式会社
data_types:
  - 氏名
