  - ポイント情報
summary: 1歳を迎える子どもの家庭に電子ギフトなどを贈る子育て支援「ファーストバースデーサポート事業」で、受託事業者からの再委託先であるリンベル株式会社のシステムが不正アクセスを受け、申請5,134件分の個人情報が漏えいしたおそれがあると公表した。電子ギフトの交換コードも流出したおそれがあるとされる。区のページでは、リンベルによるシステムメンテナンスのため申請フォームを一時停止していると案内している。リンベルは自社オンラインストアや東京都「赤ちゃんファースト」の交換サイトでも不正アクセス被害を公表している。
