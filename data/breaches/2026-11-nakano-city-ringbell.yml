    url: https://rocket-boys.co.jp/security-measures-lab/nakano-ringbell-first-birthday-data-leak/
checklist:
  - text: 受け取った電子ギフトの残高や利用状況を確認し、不審な点があれば区に問い合わせる
  - text: 区やリンベルを装った不審なメール・SMSのリンクを開かない
