summary: 過去に使っていたWebサイト制作サービス「Studio」が不正アクセスを受け、株式会社ナビゲータープラットフォーム時代の旧コーポレートサイトの問い合わせフォームに2021年2月〜2024年9月に送信された1,487件（807人）の氏名、フリガナ、会社名、電話番号、メールアドレス、問い合わせ内容が漏えいしたおそれがあると公表した。二次被害は確認されておらず、個人情報保護委員会へはStudioがまとめる連名で報告する。
