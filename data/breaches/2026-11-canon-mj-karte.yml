organization: キヤノンマーケティングジャパン株式会社
group: キヤノンMJグループ
services:
  - 個人顧客向けウェブサイト等での情報提供
industry: 製造
country: JP
date_announced: 2026-11-20
affected_count: 3660000
count_note: 約366万件（プレイドの報告に基づく）
cause: third_party
root_cause: 委託先プレイドの「KARTE」が不正アクセスを受け、保管されていた顧客情報が漏えいした
vendor:
  name: 株式会社プレイド
data_types:
  - 会員ID
  - 住所
