  - 生年月日
  - 性別
  - 利用履歴
summary: ウェブサイトなどでの個人顧客への情報提供を委託するプレイドの「KARTE」が11月13日に不正アクセスを受け、同サービスに保管されていた個人顧客の会員識別ID、都道府県名、市区町村名、郵便番号、年齢、生年月日、性別、メールマガジンの購読情報の約366万件が漏えいしたと公表した。氏名、電話番号、メールアドレス、クレジットカード番号、パスワードは含まれない。自社システムへの不正アクセスではなく、不正利用などの被害は確認されていない。KARTEとの連携は停止した。
