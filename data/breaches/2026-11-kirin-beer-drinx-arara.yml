summary: キリンビールは、オンラインショップ「DRINX」の会員のメールアドレス58,613件が漏えいしたと公表した。DRINXのEC関連サービスの委託先であるGMOメイクショップ株式会社が使うアララ株式会社のメール配信サービスが10月28日に第三者の不正アクセスを受け、11月13日にGMOメイクショップから連絡を受けて確認した。氏名、住所、電話番号、パスワード、クレジットカード情報は含まれず、現時点で不正利用などの二次被害は確認されていない。
