organization: paiza株式会社
services:
  - paiza（開発用ステージング環境）
industry: 人材・教育
country: JP
date_announced: 2026-11-13
affected_count: 902576
count_note: 外部からアクセスされ得る状態だった最大件数。本番データの氏名・住所などは一部マスク済み。具体的な流出は確認されていない
cause: misconfiguration
root_cause: 検証環境のベーシック認証のパスワードを固定のまま長期運用し、退職者等がアクセスできる状態だった
data_types:
  - 会員ID
  - アカウント名
  - 連携サービスID
  - 生年月日
  - 性別
  - メールアドレス
  - 利用履歴
  - 取引先情報
  - 氏名
  - 電話番号
summary: 開発用ステージング環境（動作検証環境）の認証情報を長期間変更せずに運用していたため、2013年の環境構築から2026年8月13日まで、以前アクセス権限を持っていた退職者等が外部からアクセスできる状態だったと公表した。行政機関からの照会で発覚した。環境には本番データを一部マスク処理して複製しており、最大90万2,576件の個人データ（ニックネーム、GitHub ID、生年月日、スキルチェックや応募の履歴など）が対象。具体的な流出は確認されていない。
