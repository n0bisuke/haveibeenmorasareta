summary: メルカリ・メルペイ・メルコインが社内業務で利用するNotion AIの処理委託先である米Fireworks AIが不正アクセスを受け、10月5日〜24日に従業員がNotion AIへ入力した内容とAIの回答の一部が流出した可能性があると公表した。顧客1,522名、取引先担当者等571名、採用応募者169名、派遣社員・退職者等1,534名の計3,796名分の個人情報が含まれる。業務システムの認証情報の一部も含まれ、無効化・再発行した。マイナンバー、クレジットカード番号、顧客のログインパスワードは確認されていない。
