affected_count: 3796
count_note: 顧客1,522名、取引先担当者等571名、採用応募者169名、派遣社員・業務委託先・退職者1,534名の合計（重複の有無は未公表）。メルカリ・メルペイ・メルコインの3社分
cause: third_party
root_cause: 利用するNotionのAI機能の委託先Fireworks AIが不正アクセスを受け、AIへの入力内容などが流出した
