summary: メール配信に利用するアララの「アララメッセージ」が第三者の不正アクセスを受け、2026年7月1日から10月31日に同サービス経由でメールを送った客のメールアドレス5,192件が外部に漏えいしたと公表した。対象はサンフレッチェ広島と共同運営する公式モバイルサイト、「はじめてばこ」、花の定期購入サービス「ロハスフラワー」、各種イベントの応募者など。氏名や住所、クレジットカード情報はアララに提供していない。
