summary: 回線申込・受付管理システムが不正アクセスを受け、最大54万2,513件の個人情報が漏えいした可能性があると公表した。対象は2019年以降に「@nifty光」「@nifty MAX光」「@nifty auひかりプラス」を同社Webサイト以外から申し込んだ人の会員ID、氏名、性別、生年月日、住所、電話番号、メールアドレス。10月19日に検知し、通信元を遮断した。口座情報とクレジットカード情報は対象外。
