summary: 観光・お出かけ情報アプリ「Prism Japan」の運営委託先KINTOテクノロジーズが使うメールマガジン配信システム「ブラストメール」が不正アクセスを受け、会員49,131名の情報が漏えいした可能性があると10月30日に公表した。対象はユーザーID・メールアドレス・性別・年齢・郵便番号・都道府県・市区町村・車の利用・おでかけ手段。生年月日、住所情報、Prismと連携先アカウントのログインパスワードは含まれない。原因はラクスライトクラウドで確認中。
