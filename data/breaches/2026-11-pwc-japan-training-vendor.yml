summary: PwCがグローバルで利用する社内研修・人材育成プログラムの運営委託先である外部ベンダーのホスト環境が第三者の不正アクセスを受け、PwC Japanグループの従業員・退職者・業務委託先の方々の個人情報が閲覧され外部へ流出したことを確認したと公表した。対象は従業員番号、氏名（アルファベット）、業務用のメールアドレス・電話番号、所属法人など。クライアントの情報は含まれない。
