summary: ウェブサイトの分析と顧客への案内配信に使っていた株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、同サービスに連携していた顧客の情報が外部に漏洩したおそれがあると公表した。11月15日にプレイドから連絡を受けた。対象は最大576,742件で、項目はメールアドレス、氏名、電話番号、住所、年齢、誕生日、性別。クレジットカード情報とログインパスワードは連携しておらず対象外。KARTEへの送信を止めて連携用の認証情報を無効化し、プレイドと連名で個人情報保護委員会への報告を進めている。
sources:
