    url: https://jp.bonaventura.shop/blogs/news/security-notice-1
checklist:
  - text: 対象と範囲が判明しだい、対象の顧客にメールなどで個別に連絡するとしている
  - text: BONAVENTURAを装った不審なメール・SMS・電話に、個人情報やパスワード、認証コードを伝えない
