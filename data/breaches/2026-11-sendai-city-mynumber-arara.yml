  - メールアドレス
summary: マイナンバーカード特設センターの来庁予約に使うTKCの「マイナンバーカード交付予約・管理システム」が、受付完了メールの送信に利用するアララのメール配信サービス「アララメッセージ」が第三者の不正アクセスを受け、予約時に登録したメールアドレスが漏えいした可能性があると公表した。11月2日にTKCから報告を受けた。メールアドレス以外の情報が漏えいした可能性はないとしている。漏えいの有無や件数は調査中。予約システム自体は不正アクセスを受けておらず利用を続けるが、アララメッセージによるメール送信は停止した。
