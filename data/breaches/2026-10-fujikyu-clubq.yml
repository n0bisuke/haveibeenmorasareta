summary: 公式アプリと会員サイト「CLUB フジQ」で、9月4日から7日にかけてパスワードリスト型攻撃による不正ログインがあり、159アカウントの氏名、メールアドレス、生年月日、電話番号、会員番号などと、一部はチケット購入履歴やクレジットカードの下4桁・有効期限・名義が閲覧された可能性があると公表した。カード番号の全桁とセキュリティコードは含まれない。
