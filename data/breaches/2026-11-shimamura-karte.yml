organization: 株式会社しまむら
services:
  - しまむらグループ公式アプリ
  - しまむらグループオンラインストア
industry: 小売・EC
country: JP
date_announced: 2026-11-17
affected_count: 7000000
count_note: 会員情報約700万件。別に会員が登録した家族（子ども）の生年月約5万件。11月17日15時時点で、氏名・メールアドレス・会員番号・LINE IDの漏えいは判明していない
cause: third_party
root_cause: 委託先プレイドの「KARTE」が不正アクセスを受け、お知らせ配信用に連携していた会員情報の一部が漏えいした
vendor:
  name: 株式会社プレイド
data_types:
  - 生年月日
  - 性別
  - 郵便番号
summary: メールやLINEでのお知らせに利用する株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、しまむらグループの公式アプリまたはオンラインストアの会員約700万件の生年月日、性別、都道府県、郵便番号と、会員が登録した家族の情報約5万件（子どもの生年月）が外部へ漏えいしたと公表した。11月17日15時時点で氏名・メールアドレス等の個人を特定できる情報、会員番号、LINE IDの漏えいは判明していない。氏名、電話番号、詳細な住所、クレジットカード情報、ログインパスワードはKARTEで保持していない。
sources:
  - title: しまむら 【重要】当社が利用する外部サービス「KARTE」への不正アクセスに伴う一部会員情報漏えいに関するお知らせ（第一報）
    url: https://www.shimamura.gr.jp/assets-c/uploads/release20261117_Informationleak.pdf
  - title: Yahoo!ニュース 「KARTE」不正アクセス、しまむらやアルペンの顧客情報が漏えい
    url: https://news.yahoo.co.jp/articles/79691d8b275682c79c6ae06bac2d55c3019045f5
checklist:
  - text: 特別な手続きは不要としている。個別の漏えい有無は問い合わせても確認できない
  - text: 本件に便乗した不審なメール・SMS・電話のURLにアクセスせず、パスワードや認証コードを入力しない
