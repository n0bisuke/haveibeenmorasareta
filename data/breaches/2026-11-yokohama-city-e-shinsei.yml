summary: 住民票やマイナンバー関連の手続きなどをオンラインで受け付ける「電子申請・届出システム」で、メール送信サービスを提供するアララへの不正アクセスにより、登録された利用者名やメールアドレスなど約82万件が漏えいした可能性があると公表した。市は総務省の手引書に基づき適切に業務委託していたとしている。
