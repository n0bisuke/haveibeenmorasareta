summary: 通販サイト「TBSショッピング」で、業務委託先のメール配信システムが不正アクセスを受け、延べ最大49,995人分のメールアドレスなどが外部に流出したと公表した。氏名・住所・電話番号・クレジットカード情報は含まれず、TBS側のシステムに被害はない。不正利用は確認されていない。
