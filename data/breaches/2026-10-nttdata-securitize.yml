summary: 社債購入者への特典付与を支援する「STdirectServices」の委託先Securitize JapanのSaaSが不正アクセスを受けたとしてサービスを停止し、11月2日の第2報で社債購入者計2,789人の情報の漏えいを確認したと公表した。近鉄グループホールディングス、JR西日本、丸井グループなどの社債発行体や、楽天証券・野村證券などの販売会社が影響を公表している。
