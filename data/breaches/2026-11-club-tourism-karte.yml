summary: サイトのサービス向上のため利用していた株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、2026年11月12日時点のインターネット会員約406万件の情報が外部に漏えいした可能性があると公表した。対象は会員番号（暗号化して変換した文字列）、予約システムの顧客番号、性別、年齢、生年月日。氏名、住所、電話番号、メールアドレス、ログインパスワード、旅券情報、クレジットカード情報、口座番号は含まれない。10月31日に公表した自社サーバーへの不正アクセスとは別の事案で、関連はないとしている。
