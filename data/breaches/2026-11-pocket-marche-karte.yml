summary: 「ポケットマルシェ」が顧客情報の管理・案内に利用している株式会社プレイドの「KARTE」が第三者による不正アクセスを受け、連携していた個人情報の一部が外部に漏えいしたと公表した。対象は消費者944,885人と生産者・生産者サブアカウント10,164人（退会者を含む）で、メールアドレスは重複を含め959,452件。漏えいしたのは会員ID、メールアドレス、メール配信可否の設定、一部のニックネーム、一部の生産者の氏名。ログインパスワードやクレジットカード情報はKARTEに連携しておらず、漏えいは確認されていない。個人情報保護委員会に報告した。
sources:
  - title: ポケットマルシェ 【重要なお知らせ】外部サービス「KARTE」への不正アクセスに伴う個人情報漏えいに関するお知らせとお詫び
    url: https://poke-m.com/announcements/905
checklist:
  - text: 対象者にはメールで個別に連絡がある
  - text: 同社やプレイド社をかたる不審なメール・SMSに注意し、URLや添付ファイルを開かない
