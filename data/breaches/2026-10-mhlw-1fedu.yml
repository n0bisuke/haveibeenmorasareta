summary: 委託事業「東電福島第一原発廃炉等作業における被ばく低減対策普及啓発事業」の受託先テクノヒルが運営する教育サイト「1FEdu」がサイバー攻撃を受け、受講者最大595人の氏名・年代・性別・所属組織・役職・メールアドレス・パスワード・電話番号などが漏えいした可能性があると公表した。うち6人はメールアドレスとパスワードの漏えいと、それを使った不正ログインを確認した。発電所の設備への影響は公表されていない。
