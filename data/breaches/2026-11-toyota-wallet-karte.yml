summary: TOYOTA Walletで使用している株式会社プレイドの「KARTE」が第三者による不正アクセスを受け、TOYOTA Walletの顧客に関する情報の一部が漏えいした可能性があると公表した。対象は社内管理に使う「お客様番号」約120,000件で、ログインIDではなく、この番号だけでは個人の特定やログイン、決済はできないとした。TOYOTA Walletのシステムへの不正アクセスは確認されていない。本件の影響でアプリの一部機能を停止している。個人情報保護委員会に報告した。
