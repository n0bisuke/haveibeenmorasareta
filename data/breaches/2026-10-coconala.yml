summary: スキル売買サービス「ココナラスキルマーケット」が第三者の不正アクセスを受け、会員が登録した履歴書449件と職務経歴書関連書類1,845件の計2,294件が外部に持ち出されたと公表した。10月8日未明に不正アクセスを検知して遮断したが、同日午後に再び検知し、持ち出しの形跡を確認した。攻撃経路を遮断し、同日中に脆弱性を修正した。クレジットカード情報やパスワードは対象外で、公開や不正利用は確認されていない。対象者には個別に連絡するとした。
