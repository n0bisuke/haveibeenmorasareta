summary: マーケティングに利用している株式会社プレイドの「KARTE」が不正アクセスを受け、同社に取り扱いを委託していた日経電子版利用者の個人情報の一部が外部に漏えいした可能性があると公表した。11月15日にプレイドから報告を受けた。漏えいした可能性があるのはメールアドレス、電話番号、性別、生年月で、元データに戻せない処理をしていたとしている。クレジットカード情報などは含まれず、悪用などの二次被害は確認されていない。件数は公表されていない。
sources:
  - title: 日本経済新聞社 委託先外部サービスへの不正アクセスに伴う個人情報漏洩の可能性について
    url: https://www.nikkei.co.jp/nikkeiinfo/news/information/1574.html
checklist:
  - text: 日経電子版に登録したメールアドレス・電話番号あての不審なメールやSMSに注意する
  - text: 新たな事実の公表がないか日本経済新聞社のお知らせを確認する
