summary: 観光列車「一万三千尺物語」の座席管理システムが9月2日から8日にかけて複数回の不正アクセスを受け、利用客や予約客1,409人分の氏名・住所・電話番号・メールアドレスが漏えいしたおそれがある。身に覚えのない予約の取り消しなどから発覚した。クレジットカード情報は別会社のシステムで処理しており対象外。
