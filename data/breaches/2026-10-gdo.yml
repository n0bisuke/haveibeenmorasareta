summary: 10月13日朝に外部からの不正アクセスの兆候を検知して通信を遮断し、システム障害としてクーポンや配送などのサービスに影響が出たと公表した。16日、操作ログの調査で従業員・退職者・委託先・パートナー企業の個人情報を含むファイルが攻撃者にダウンロードされたことを確認し、別のサーバーでは会員情報55件が照会されたと発表した。
