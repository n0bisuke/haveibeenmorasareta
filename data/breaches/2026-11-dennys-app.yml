summary: 旧「デニーズアプリ」から新アプリへの移行処理を悪用して第三者に認証情報を不正に作成され、旧アプリ利用者の会員コード・メールアドレス・生年月日・性別・居住都道府県・お気に入り店舗・子どもの誕生日（キッズバースデー）が漏えいした可能性があると公表した。10月30日に確認し、不正な認証情報を無効化した。氏名・住所・電話番号・パスワード・カード情報は保持していない。
