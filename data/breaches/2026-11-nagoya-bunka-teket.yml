summary: チケット販売に使う電子チケット販売サービス「teket」の運営会社が、第三者の不正アクセスにより顧客情報の一部が外部に流出したと公表したことを受け、利用者に注意を呼びかけた。流出が確認された情報は会員の氏名とメールアドレスのほか、登録・購入内容に応じて住所、電話番号、生年月日、チケットの発券用コードなど。対象件数は調査中としている。
