summary: ホームページの問い合わせフォームを構築していたWeb制作サービス「Studio」が不正アクセスを受け、2021年5月〜2023年3月にフォームに入力された最大1万3,323件の氏名・メールアドレス・電話番号・問い合わせ内容が漏えいした可能性があると公表した。内訳は意見・要望8,833件、接種証明書アプリ3,661件など。二次被害は確認されていない。9月公表のガバメントソリューションサービス（GSS）への不正アクセスとは別の事案。
