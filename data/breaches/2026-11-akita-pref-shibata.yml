summary: 測量などを委託していた建設コンサルタント会社の社内サーバーが9月20日未明に不正アクセスを受け、県の農林部や建設部などが発注した53契約に関する956件の個人情報が漏えいした恐れがあると公表した。委託先から県への報告は約1か月後の10月23日だった。侵入経路は分かっていない。委託先はランサムウェア攻撃を受けており、横手市・湯沢市も同じ委託先の件を公表している。
