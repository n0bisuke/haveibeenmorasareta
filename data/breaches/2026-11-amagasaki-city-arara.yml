summary: 「尼崎市オンライン申請ポータルサイト」で、委託先のTKCが利用するアララのメール配信サービス「アララメッセージ」が第三者の不正アクセスを受け、利用者のメールアドレス17,064件が外部に漏えいしたと公表した。対象は7月1日から10月31日に各種手続きに伴ってシステムからのメールを受信したアドレスで、氏名・住所・電話番号・申請内容は含まれない。緊急メンテナンスで止めていた利用者登録やパスワード再設定などの機能は11月11日に再開した。
