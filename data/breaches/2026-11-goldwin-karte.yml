summary: 業務委託先システムである株式会社プレイドの「KARTE」が第三者の不正アクセスを受け、同サービスに連携していた顧客情報の一部が漏えいしたと公表した。11月15日に判明した。漏えいの可能性がある情報は氏名、住所、生年月日、メールアドレス、性別、メールマガジンの受信設定、イベント参加情報、最終利用店舗情報など。クレジットカード情報、銀行口座情報、ログインパスワードは含まれない。連携用の認証情報を無効化した。対象範囲と件数は調査中。
sources:
