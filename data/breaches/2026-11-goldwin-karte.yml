    url: https://about.goldwin.co.jp/news/page-41040
checklist:
  - text: ゴールドウインを装った不審なメール・SMS・電話に注意する（口座情報やパスワード等を尋ねることはないとしている）
  - text: 心当たりのないメールやSMSのリンク・添付ファイルを開かない
