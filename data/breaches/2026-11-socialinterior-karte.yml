summary: ECサービス「subsclife by TOKYOROOMS」で利用していたプレイドのサービス「KARTE」が不正アクセスを受け、連携していた会員情報29,194件が外部に漏えいしたと公表した。11月15日にプレイドから報告を受けた。漏えいしたのは氏名、メールアドレス、LINEユーザーID。ほかのデータへの影響はプレイドが調査を続けている。関係当局への報告を進め、当社や本サービスを装った不審なメールへの注意を呼びかけている。
