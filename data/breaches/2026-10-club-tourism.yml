summary: ネット予約システムのサーバーが10月30日早朝に不正アクセスを受け、登録会員最大約432万件の氏名・国籍・性別・生年月日・住所・電話番号・メールアドレス・会員ID・緊急連絡先が流出した可能性があると公表した。パスポート情報、ログインパスワード、クレジットカード情報、口座番号は含まれない。サーバーを隔離し、サイトを停止した。
