summary: LOWYA事業の各ECモール店で商品管理のためにAPI連携していたブランジスタソリューションのサービス「まとまるEC店長」が第三者から不正アクセスを受け、保有する個人情報が漏えいした可能性があると公表した。11月10日に同社から一部の注文情報が流出した可能性があると連絡を受けた。楽天市場・Yahoo!ショッピング・Amazonの6店舗の注文者とお届け先の氏名・電話番号・住所など最大392件が対象で、決済情報は含まれない。
