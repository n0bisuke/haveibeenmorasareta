summary: 職員採用試験で使った録画動画面接サービスの提供会社、株式会社ApplyNowが第三者の不正アクセスを受け、2021・2022・2024・2026年度の受験者1,464件の氏名、生年月日、電話番号、メールアドレスが漏えいしたと公表した。ApplyNowは9月7日に不正アクセスを検知し、11月9日に対象者へお詫びと注意喚起のメールを送った。二次被害は確認されていない。
