summary: 職員採用試験で使った録画動画面接サービスの提供会社、株式会社ApplyNowが第三者の不正アクセスを受け、2021・2022・2024・2026年度の受験者1,464件の氏名、生年月日、電話番号、メールアドレスが漏えいしたと公表した。ApplyNowは9月7日に不正アクセスを検知し、11月9日に対象者へお詫びと注意喚起のメールを送った。二次被害は確認されていない。市は9月10日に連絡を受けていたが公表は11月11日で、11月27日の定例会見で市長が受験者への通知や公表の遅れを含めて陳謝した。
