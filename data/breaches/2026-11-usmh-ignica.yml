summary: マルエツなどで使うお買い物アプリ「Scan＆Go ignica」のシステムが第三者の不正アクセスを受け、新規登録時に入力された氏名とメールアドレスを含むファイルが外部に流出した可能性があると公表した。対象は約240万アカウントのうち64,003アカウントで、クレジットカード情報、住所、電話番号、生年月日は含まれない。二次被害は確認されていない。
