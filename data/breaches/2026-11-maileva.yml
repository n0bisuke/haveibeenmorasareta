  - 氏名
  - 住所
summary: フランス郵政公社ラポスト傘下のDocaposteの子会社で、企業向けに文書の発送を請け負うMailevaが9月中旬に大規模なサイバー攻撃を受け、顧客企業・団体が送った文書の受取人2,200万人分の氏名・住所などが流出したと公表した。データの改ざんや破壊は確認されておらず、銀行口座情報などは含まれないと報じられている。仏データ保護機関CNILに届け出て、司法当局が捜査している。
