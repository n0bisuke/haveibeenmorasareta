date_announced: 2026-11-14
affected_count: 22000000
count_note: 顧客企業・団体が送った文書の受取人2,200万人。日本への影響は報じられていない
cause: unauthorized_access
root_cause: 文書発送サービスの基盤がサイバー攻撃を受け、受取人のデータが盗まれた
