organization: 株式会社エディオン
services:
  - エディオン公式通販サイト
industry: 小売・EC
country: JP
date_occurred: 2026-11-04
date_announced: 2026-11-06
affected_count: 13685
count_note: 個人情報最大13,685名（重複を含む。第1報は最大4,131名）。PCから新規入力されたクレジットカード情報最大556回分とエラーログ記録の最大5件、ギフトカード5,360枚、ログインID・パスワード最大1,141名
cause: unauthorized_access
root_cause: ログ保存領域の脆弱性を突かれ、決済入力処理に不正プログラムを組み込まれた
attack_methods:
  - web_skimming
data_types:
  - 氏名
  - 住所
  - 生年月日
  - 電話番号
  - メールアドレス
  - 郵便番号
  - クレジットカード番号
  - クレジットカードのセキュリティコード
  - クレジットカード情報（番号の一部・有効期限等）
  - 会員ID
  - パスワード（保管形式不明）
summary: ECサイトのサーバーが不正アクセスを受けたと11月6日に公表した。9日・10日の続報で、決済入力処理に不正プログラムが組み込まれ、11月4日夜から7日22時の停止までにPCから入力されたクレジットカード番号・有効期限・名義・セキュリティコード最大556回分が漏えいした可能性があると訂正した。エラーログにもカード情報最大5件が記録されていた。氏名・住所などの個人情報は最大1万3,685人分、ほかにギフトカード5,360枚、ログインIDとパスワード最大1,141人分が対象。
sources:
  - title: エディオン 当社ECサイトへの不正アクセスによる個人情報漏洩の可能性に関するお詫びとお知らせ
    url: https://www.edion.co.jp/system/files/news-release/pdf/ja/2026-11/20261106_pr_1.pdf
  - title: エディオン 第2報
    url: https://www.edion.co.jp/system/files/news-release/pdf/ja/2026-11/20261109_pr_1_1.pdf
  - title: 日本経済新聞
    url: https://www.nikkei.com/article/DGXZQOUF105GL0Q6A111C2000000/
checklist:
  - text: 11月4日〜7日にエディオンの通販サイトでカード決済した場合は、カード会社に連絡して利用明細を確認する
  - text: エディオンの通販サイトと同じパスワードを他のサービスで使っていれば変更する
