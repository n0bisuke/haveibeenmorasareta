summary: 防災メールなどを運営するアルカディアが不正アクセスを受け、市民と職員の約4万3,000人分のメールアドレスなどが漏えいした可能性があると公表した。10月14日には別の2つのサービスで700件以上が追加で判明した。10月27日には、ふるさと納税サイト「ふるさとチョイス」、体験施設「まある」と産学交流センターのメール配信、静岡マラソンの問い合わせフォームの利用者について、複数の委託先への不正アクセスでさらに1万件以上の氏名・メールアドレスなどが漏えいした可能性があると公表した。
