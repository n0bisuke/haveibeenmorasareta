organization: 株式会社UPSIDER
services:
  - Breakthrough GRID
industry: 金融・保険
country: JP
date_announced: 2026-10-27
affected_count: 544
count_note: 187社の544人（報道。退会者を含む。会社の発表時点では人数を公表していない）
cause: unauthorized_access
root_cause: 経営者向けの会員制交流サイトが不正アクセスを受けた（侵入方法は未公表）
data_types:
  - 氏名
  - メールアドレス
  - 取引先情報
  - 保存データ（写真・文書等）
summary: 経営者向けの会員制交流サービス「Breakthrough GRID」が不正アクセスを受け、現会員と退会者の氏名・メールアドレス・所属企業・部署やイベント情報、議事録が外部に持ち出されたと公表した。報道によると対象は187社の544人。サイトの全機能を停止した。法人カード「UPSIDER」「PRESIDENT CARD」などのシステムへの不正アクセスと情報流出はないことを確認したとしている。
