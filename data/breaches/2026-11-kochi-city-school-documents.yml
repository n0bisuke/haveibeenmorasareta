summary: 高知市教育委員会は、市立小学校2校で個人情報を含む公文書の紛失と誤廃棄が発覚したと公表した。布師田小学校では2023年度卒業生7人分の保健調査票（氏名・性別・予防接種歴など）の紛失が判明した。一宮小学校では2021〜2024年度の児童の氏名や学校検診の結果などを記した保健関係文書と、給食のアレルギー情報を記した文書を誤って廃棄しており、あわせて約1,320人分の情報が記されていた。
