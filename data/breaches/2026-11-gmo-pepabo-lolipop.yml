affected_count: 516564
count_note: 顧客情報51万6,564件（退会済み利用者の残存データを含む）。うち平文保存のFTP・WebDAV仮設定パスワード8,322件、初期ログインパスワード4,170件、Basic認証のID・パスワード105,608件（重複の可能性あり）。住所は都道府県まで
cause: unauthorized_access
root_cause: 内部のデータ分析基盤に不正に使われた認証情報でアクセスされ、データがダウンロードされた。初期侵入の経路は未公表
