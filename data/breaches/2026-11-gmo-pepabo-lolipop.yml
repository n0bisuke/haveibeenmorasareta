  - パスワード（平文）
  - アカウント名
summary: 「ロリポップ！レンタルサーバー」など4サービスの内部システムが第三者の不正アクセスを受け、顧客情報51万6,564件が漏えいしたと公表した。11月24日にデータ分析基盤の監査ログで不審なデータダウンロードを検知し、同日に不正に使われた認証情報を無効化して経路を遮断した。漏えいしたのは氏名、郵便番号、都道府県、メールアドレス、生年月日などで、一部の顧客は平文で保存していたFTP・WebDAVの仮設定パスワード、初期ログインパスワード、Basic認証のIDとパスワードも含まれる。退会済み利用者のデータも一部残っていた。クレジットカード情報と銀行口座情報は含まれない。11月25日に該当パスワードを強制リセットし、総務省に報告した。
