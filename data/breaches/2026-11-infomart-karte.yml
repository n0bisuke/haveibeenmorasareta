summary: 利用している株式会社プレイドのクラウドサービス「KARTE」が第三者による不正アクセスを受け、同サービスに連携していた顧客と従業員の情報の一部が外部に流出したと公表した。顧客の情報は社内システム上のユーザー識別子（内部ID）、企業所在地とユーザーの勤務地の都道府県で、最大2,735,267件（連携データの総数）。従業員のメールアドレス31件も含まれる。ログインパスワード、銀行口座情報、請求書等の取引明細データは連携データに含まれていないとしている。同社プラットフォームへの影響はなく、対象の顧客には個別にメールで連絡する。
sources:
