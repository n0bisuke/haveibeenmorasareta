count_note: 漏えいしたのは社内検証用環境のテストデータに含まれていた従業員の情報。件数は非公表。顧客の個人情報の漏えいは11月17日時点で確認されていない
cause: third_party
root_cause: 委託先プレイドの「KARTE」が不正アクセスを受け、検証用環境のテストデータに含まれていた従業員情報が漏えいした
vendor:
  name: 株式会社プレイド
data_types:
  - 従業員情報
summary: 賃貸スタイルなどの不動産情報サイトで使っていた株式会社プレイドの「KARTE」が11月13日未明に不正アクセスを受けた件で、当社の検証用環境に登録していた一部のテストデータに含まれていた従業員の情報が漏えいしたと公表した。サイト利用者の個人情報の漏えいは11月17日時点で確認されていないが、プレイドがイベント・キャッシュ情報などの調査を続けている。プレイドと連名で個人情報保護委員会に報告する予定。KARTEとの連携に使っていたAPIキーなどの認証情報は無効化した。
sources:
  - title: KG情報 外部サービス「KARTE」への不正アクセスに伴う当社への影響と調査状況について（第一報）
    url: https://www.kg-net.co.jp/upload/Ir/2026_11/ZBGZieF2x98Mr6cm4Wv7EwI58qzAAHZYmZdOwWts.pdf
checklist:
  - text: KG情報やプレイドを装った不審なメールやSMSのURL・添付ファイルを開かない
  - text: 顧客情報に新たな事実が判明した場合は公表し、対象者に個別に案内するとしている
