  - title: セキュリティ対策Lab
    url: https://rocket-boys.co.jp/security-measures-lab/heiwado_comsbi_saas_line_328976_breach_2026
checklist:
  - text: 平和堂を名乗る不審なメッセージやフィッシングに注意する
  - text: LINEで知らないアカウントからの連絡に応じない
