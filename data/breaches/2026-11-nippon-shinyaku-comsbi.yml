summary: 公式LINEアカウント「WINZONE（ウィンゾーン）」の運用委託先である株式会社assistが利用するソニックムーブの「COMSBI（SaaS版）」が第三者の不正アクセスを受け、最大40,921名のLINEの表示名・プロフィール画像（URL）・LINEユーザーIDと、最大10,145名の性別が流出したと公表した。11月16日に委託先から報告を受けた。件数は最大値で、今後の調査で減る可能性があるとしている。クレジットカード情報は保持しておらず、二次被害は確認されていない。
sources:
