summary: 通販サイトが10月3日から10日にかけて第三者による不正アクセスを受け、会員36万8,184人分（39万3,785件）の氏名、住所、電話番号、メールアドレス、生年月日、顧客番号などが漏えいしたと公表した。10月15日の内部調査で発覚した。決済情報は含まれない。子会社のアテニアでも同様の被害があった。
