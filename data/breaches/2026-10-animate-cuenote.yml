summary: メール配信に使っていたユミルリンクの「Cuenote FC」が不正アクセスを受け、顧客の個人情報が漏えいしたと公表した。10月20日には影響がないと報告を受けていたが、27日に第三者に閲覧・取得されたと連絡があった。10月28日の第一報ではメールアドレス・性別・都道府県・会員コードとしていたが、30日の続報で漏えいはメールアドレスのみと訂正し、対象を10月14日〜16日にメールを配信したアニメイト通販のメールマガジン登録者と、8〜9月のポケドラのキャンペーン応募者の計140,443件と特定した。11月2日から個別にメールで連絡した。
