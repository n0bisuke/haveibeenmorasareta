checklist:
  - text: パスポートや本人確認の再提出を求める不審なメール・SMS・電話に応じない
  - text: 手元のギフト券コード・PINが使えない場合はポケットチェンジのサポートに連絡する
  - text: クレジットカードの利用明細に身に覚えのない請求がないか確認する
