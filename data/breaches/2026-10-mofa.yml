summary: 外部とやり取りできるネットワークが不正アクセスを受け、外務省員以外の約900件を含む約3,600件の氏名・メールアドレスなどが漏えいした可能性があると公表した。7月27日に検知して遮断し、外部の専門事業者と調査していた。機密性の高い情報や、旅券・たびレジを扱う領事システムの情報は含まれない。二次被害は確認されていない。
