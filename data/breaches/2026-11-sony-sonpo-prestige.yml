date_occurred: 2026-10-29
date_announced: 2026-11-02
affected_count: 950000
count_note: 漏えいの可能性がある件数は約95万件（11月24日の第二報）。対象はロードサービスの出動を要請し、プレステージ社に委託された顧客
cause: third_party
root_cause: ロードサービスの委託先プレステージ・コアソリューションの業務システムが不正アクセスを受けた
vendor:
  name: 株式会社プレステージ・コアソリューション
data_types:
  - 氏名
  - 住所
  - 電話番号
  - 車両情報
  - 口座番号
  - 利用履歴
summary: 自動車保険のロードサービスを委託するプレステージ・コアソリューションから、同社の業務システムに第三者による不正アクセスがあったと10月30日に報告を受けたと11月2日に公表した。11月24日の第二報で、ロードサービスの出動を要請し同社に委託された顧客の情報約95万件が漏えいした可能性があると明らかにした。氏名、住所、電話番号、車両情報、一部の顧客の口座情報、事故・故障の受付に関する情報などが含まれ、クレジットカード情報は含まれない。公表時点で不正使用は確認されていない。
