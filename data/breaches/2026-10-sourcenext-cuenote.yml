summary: メール配信に使っていたユミルリンクの「Cuenote FC」の環境で不正アクセスがあり、データが外部に出力されたと10月26日にユミルリンクから連絡を受け、27日に公表した。同日に利用を停止し、個人情報保護委員会に報告した。11月5日の第二報で、対象は重複を除いたメールアドレス142,669件で、注文番号・注文日時・商品名・数量・価格・返金額・ユーザーID・キャンペーン用シリアル番号・ギフト引き換え用URL・端末の種別・配信停止に関する情報などが含まれると公表した。氏名・住所・電話番号・パスワード・クレジットカード情報は含まれない。10月15日に公表した自社サイトへの不正アクセスとは別の事案。
