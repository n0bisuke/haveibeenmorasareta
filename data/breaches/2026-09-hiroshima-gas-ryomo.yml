summary: 電気関連システムの開発を委託していた両毛システムズが8月12日にランサムウェアによる不正アクセスを受けた件を9月30日に公表した。当初は漏えいなしとの報告だったが、その後の調査で電気を使う一部顧客約3,200件の使用場所の住所、月間使用量、月額料金、契約開始日、契約者番号等が含まれていたことが判明し、11月13日に漏えいの可能性があると公表した。氏名、電話番号、メールアドレス、口座情報、クレジットカード情報は含まれない。
