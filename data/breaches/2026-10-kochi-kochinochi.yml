summary: 観光公式ファンサイト「高知の知」の運営を委託しているコミューン株式会社のサービス「Commune」が不正アクセスを受け、全会員358人分の個人情報が漏えいしたと発表した。10月6日に委託先から報告があり、県はサイトの公開を停止した。7日に、管理者アカウントへのなりすましで会員情報が閲覧・取得されたことが分かった。漏えいしたのはメールアドレス、アカウント名、年齢、性別、自己紹介など11項目で、氏名や住所の流出は確認されていない。県は会員にメールで謝罪した。
