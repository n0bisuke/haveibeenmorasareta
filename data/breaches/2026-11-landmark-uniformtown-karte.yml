summary: ユニフォーム通販サイト「ユニフォームタウン」で使っていた株式会社プレイドの「KARTE」が不正アクセスを受け、KARTEに連携していた顧客情報の一部が漏えいしたとプレイドから報告を受けたと公表した。対象は4,067レコードで、メールアドレス、氏名、電話番号、住所が含まれる。クレジットカード情報とサイトのログインパスワードは含まれていない。同社のECサイトや基幹システムへの不正アクセスではないとしている。KARTEとのデータ連携に使っていたアカウントは停止した。
sources:
  - title: ユニフォームタウン 当社利用の「KARTE」への不正アクセスによる情報漏えいのお知らせ
    url: https://www.l-m.co.jp/karte_202611/
checklist:
  - text: 対象の顧客には個別にメールで案内するとしている
  - text: 同社や配送業者を装ったメール・SMS・電話に注意し、心当たりのないリンクや添付ファイルを開かない
