summary: 県が地域おこし協力隊向けの支援事業を委託する「福岡県地域おこし協力隊サポーターズConeru」のホームページで、制作に使うStudioのクラウド環境が第三者の不正アクセスを受け、メールフォームに入力された個人情報が漏えいした可能性があると公表した。氏名、メールアドレス、電話番号、地域（市町村名）、所属、相談内容が対象。漏えいの有無と範囲は調査中で、現時点で流出は確認されていない。
