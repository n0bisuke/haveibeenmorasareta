summary: システムのメール配信を委託していたアララへの不正アクセスにより、顧客のメールアドレス最大2,230,812件が漏えいの対象に含まれると公表した。自治体のマイナンバーカード交付予約・管理システムや電子申請システムなどでメール送信を停止しており、横浜市・大阪府・大阪府警など利用団体が相次いで影響を公表している。
