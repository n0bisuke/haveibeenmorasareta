root_cause: 子会社が利用するプレイドの「KARTE」が不正アクセスを受け、同サービスに保管していた会員情報の一部が漏えいした
vendor:
  name: 株式会社プレイド
summary: 連結子会社の株式会社ウィゴーと株式会社オンワード樫山が利用している株式会社プレイドの「KARTE」で、同サービスに保管していた会員に関する情報の一部が漏えいしたとの連絡を受けたと公表した。クレジットカード番号などの決済情報やパスワードの流出はない。対象となる情報の詳細と影響範囲は確認中で、対象者には個別にメールで連絡する。「WEGO オンラインストア」と「オンワード・クローゼット」は通常どおり利用できる。
