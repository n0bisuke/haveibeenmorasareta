summary: 熊・イノシシの出没情報などの防災情報や子育て情報を配信する「氷見市お知らせメール」が使うアララのメール配信システムが第三者の不正アクセスを受け、利用者のメールアドレス1,023件が漏えいしたと公表した。対象は2026年7月1日から10月31日にメールが送信された人。メールアドレス以外の情報は漏えいしておらず、不正利用も確認されていない。サービスは停止しており、再開は未定。
