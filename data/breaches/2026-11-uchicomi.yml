summary: 不動産賃貸サービス「ウチコミ！」で7月6日にサーバー障害が起き、調査でランサムウェアによる一部ファイルの暗号化と窃取が判明したと公表した。最大142,591アカウントの氏名・メールアドレス・住所・電話番号などが漏えいした可能性がある。カード情報は保有しておらず、パスワードは暗号化されていた。
