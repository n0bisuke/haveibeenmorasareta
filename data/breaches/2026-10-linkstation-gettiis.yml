summary: チケット販売サービス「GETTIIS」で、主催者向けサービス「Gettii-Lite」のプログラムの脆弱性を悪用され、会員317,971件の会員ID、ハッシュ化パスワード、メールアドレス、氏名、電話番号、生年月日などが流出したと公表した。29,515件はクレジットカード番号の先頭・末尾4桁や名義・有効期限（暗号化済み）も含む。10月18日未明に不審なアクセスを確認した。不正利用は確認されていない。
