summary: 10月14日に外部から不正アクセスを受け、企業名や担当者のメールアドレスなど743件の個人情報の漏えいを確認したと公表した。10月17日から公式サイトを停止し、臨時サイトで運用している。侵入経路や原因は調査中で、対象の企業には通知した。11月6日の続報で、イベントカレンダーの登録者142人、職員・元職員9,252人の氏名・メールアドレス、保守・ページ制作会社の19人の情報も対象だったと公表した。
