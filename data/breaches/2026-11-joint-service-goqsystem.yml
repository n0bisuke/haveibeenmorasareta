summary: 「電材ドットコム 楽天市場店」を運営する同社は、受注管理を委託する株式会社GoQSystemのサーバーが11月10〜11日に外部から不正アクセスを受け、同店で注文した顧客の個人情報の一部が外部へ流出したと報告を受けたと公表した。対象は注文577件で、注文者の氏名、住所、電話番号、メールアドレス、届け先の氏名、住所、電話番号、注文内容、注文日時など。クレジットカード情報は含まれない。対象者には個別にメールで連絡し、個人情報保護委員会へはGoQSystemとの連名で報告したとしている。
