organization: 近鉄不動産株式会社
group: 近鉄グループ
services:
  - 商業施設「パラディ学園前」のLINE公式アカウント
industry: 不動産
country: JP
date_occurred: 2026-11-09
date_announced: 2026-11-13
affected_count: 3716
count_note: LINE表示名・プロフィール画像・ユーザーIDなど最大3,716件。うち住所・性別が最大137件
cause: third_party
root_cause: LINE配信の委託先が使うソニックムーブの「COMSBI（SaaS版）」が不正アクセスを受けた
attack_methods:
  - stolen_credentials
vendor:
  name: 株式会社ソニックムーブ
data_types:
  - アカウント名
  - 連携サービスID
  - 住所
  - 性別
summary: 商業施設「パラディ学園前」（奈良市）のLINE公式アカウントで使う、配信業務の委託先が利用するソニックムーブの「COMSBI（SaaS版）」が第三者の不正アクセスを受け、登録者のLINE表示名・プロフィール画像・ユーザーIDなどが最大3,716件、住所・性別が最大137件漏えいしたと公表した。アララ経由の別件（11月公表）とは異なる。
