summary: LINE公式アカウント「ホットスタッフ【HOT犬索】」で利用するソニックムーブのLINE連携サービス「COMSBI（SaaS版）」への不正アクセスにより、登録者の個人情報が流出したと公表した。11月11日にソニックムーブから報告を受けた。対象はLINEの表示名・プロフィール画像URL・LINEユーザーIDが最大32,034名分と、氏名・住所・生年月日・性別・就業状況・希望職種などのアンケート回答内容が最大10,798名分。
