summary: 業務委託先が利用するクラウド基盤（IDCFクラウド）で10月7日にシステム障害が発生し、原因は同基盤への第三者による不正アクセスとの報告を受けたと公表した。会員へのメール配信を緊急停止して調べたところ、障害が発生したクラウド基盤に顧客のメールアドレスの一部が保管されていたことが分かった。現時点でメールアドレスの流出は確認されていないが、外部に流出した可能性もあるとして調査を続けている。障害が起きたのはメールマガジン用のサーバーだけで、オンラインストア「J'aDoRe JUN ONLINE」の注文に関するメールは別のしくみで送っており影響はないとしている。件数は公表していない。
