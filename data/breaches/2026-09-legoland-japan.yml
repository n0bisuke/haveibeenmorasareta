summary: レゴランド・ジャパン・ホテルの公式予約サイトで利用している外部のオンライン予約プラットフォームが不正アクセスを受け、予約1,557件分の氏名・メールアドレス・電話番号が影響を受けた可能性がある。運営元のAmadeusからは、決済情報・パスワード・金融情報・パスポート情報へのアクセスは確認されていないと報告を受けている。予約情報を悪用したメールやSMSなどによる詐欺への注意を呼びかけている。
