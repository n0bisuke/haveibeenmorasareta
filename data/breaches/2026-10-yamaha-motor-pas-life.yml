summary: 電動アシスト自転車のユーザーコミュニティ「YAMAHA PAS Life」で利用するコミューン株式会社のサービス「Commune」が第三者の不正アクセスを受け、約1,600名分の会員情報が漏えいしたと公表した。不正アクセスは10月6日19時18分頃から21時2分頃にかけて行われ、氏名・生年月日・性別・住所・メールアドレス・会員ID・ニックネームなどが対象となった。クレジットカードなどの決済情報は含まれない。
