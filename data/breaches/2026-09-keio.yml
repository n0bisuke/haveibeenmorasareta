summary: グループ会社のサーバーがランサムウェア攻撃を受け、京王ストアの現金以外の決済や京王プラザホテルの新規予約など、一部グループ会社の営業システムに障害が出た。鉄道の運行に影響はない。公表時点で個人情報などの漏えいは確認されていないが、事業の機密事項や顧客情報の流出を含めて外部の専門家と影響範囲を調査している。
