count_note: 証券口座番号約6万件と年齢約10.5万件の合計。両者は互いに紐づかない状態で、人数の重複は未公表
cause: third_party
root_cause: 委託先プレイドの「KARTE」が不正アクセスを受け、連携していた証券口座番号と年齢の情報が漏えいした
vendor:
  name: 株式会社プレイド
data_types:
  - 口座番号
summary: アプリ・Webサイトでの案内業務を委託している株式会社プレイドの「KARTE」が不正アクセスを受け、一部の顧客に関連する情報が外部に漏えいしたと公表した。漏えいしたのは証券口座番号約6万件と年齢約10.5万件で、互いに紐づかない状態だとした。氏名・住所・生年月日・メールアドレスなど顧客を特定する情報は含まれず、パスワードやクレジットカード情報、本人確認資料はKARTE上に保有していない。この情報だけでは口座へのログインや取引はできず、二次被害は確認されていない。自社システムへの不正アクセスではないとした。
sources:
  - title: 三菱UFJ eスマート証券 （お知らせ）当社委託先が提供するサービスへの不正アクセスについて
    url: https://kabu.com/company/pressrelease/20261118_1.html
checklist:
  - text: 対象者には11月19日中にメールが届き、ログイン後の「お客さまへのお知らせ」にも掲載される
  - text: 同社をかたる不審なメール・SMS・電話に注意し、ログインはブックマークや公式アプリから行う
  - text: パスキーの設定・利用が推奨されている
