summary: 計算科学研究センターが運用するスーパーコンピュータ「富岳」の運用系システムが外部から不正アクセスを受け、利用者のホームディレクトリ内のファイルの一部と認証システムの登録情報が持ち出された、またはその可能性があると公表した。対象には氏名・メールアドレス・IDのほか、利用者が保存していた理研外のスパコンやサービスへの接続用認証情報が含まれる。侵入者は11月10日から13日にかけ、公開されていた稼働状況のダッシュボードを足がかりに内部ネットワークへ侵入した。理研は11月13日に確認し、14日に「富岳」の運用を停止した。影響を受けた可能性があるのは「富岳」の利用者最大4,222名と「理究」の利用者最大375名。研究成果の流出を示す事実は確認されていない。11月20日の第2報で、理研外のスパコンに接続するための秘密鍵など認証情報430件の持ち出しの痕跡を確認し、一部は外部システムへの接続に使われかけた（被害は確認されていない）と公表した。外部の専門家を含む調査委員会を設置する。
