summary: カイテク株式会社は、メールマガジン配信に利用していたアララ株式会社の「アララメッセージ」が不正アクセスを受け、「カイテク薬剤師」「カイテクドクター」を中心とするサービスの登録者のメールアドレス6,842件が流出したと公表した。うち8件は氏名と管理用IDも含む。10月29日には対象外と説明を受けていたが、11月2日に影響範囲に含まれる可能性があると連絡を受け、5日に流出の確定通知を受けて個人情報保護委員会へ報告した。
