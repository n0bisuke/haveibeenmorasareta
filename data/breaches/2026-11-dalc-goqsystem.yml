summary: 楽天市場の「La.kurasu 暮らしの生活用品」は、受注管理に利用するシステム「GoQSystem」の運営会社が11月10〜11日に第三者の不正アクセスを受け、同店の注文データの一部が漏えい対象になったと公表した。対象は注文者・届け先の氏名、住所、電話番号、メールアドレス、注文内容など。クレジットカード情報は同システムに保持されていないため対象外。二次被害は確認されていない。
