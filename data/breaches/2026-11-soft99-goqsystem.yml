summary: オンラインショップの受注・発送管理を委託するGoQSystemのシステムが外部の第三者による不正アクセスを受け、同社が委託していた注文情報の一部が漏えいしたと適時開示で公表した。11月15日に連絡を受けたもので、対象は注文3,728件、3,813人分。注文者と届け先の氏名、住所、電話番号、メールアドレス、注文内容が含まれ、クレジットカード情報は含まない。運営するオンラインショップを全て一時閉店し、個人情報保護委員会への報告と警察への相談を行った。11月10日に公表した公式オンラインショップへの不正アクセスとは別の事案。
