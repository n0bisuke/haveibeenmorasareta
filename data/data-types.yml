# 漏洩した情報の種類（data_types）と重要度の対応表
# data/breaches/*.yml の data_types には、ここに載っている名前だけが使えます。
# 新しい種類が必要な場合は、適切なレベルに追加する PR を出してください。

critical:
  label: 危険
  description: なりすましや金銭被害に直結し、変更できない・変更が困難な情報
  types:
    - マイナンバー
    - パスポート番号
    - 在留カード
    - 運転免許情報
    - 本人確認書類画像
    - クレジットカード番号
    - クレジットカードのセキュリティコード
    - 口座番号
    - パスワード（平文）

high:
  label: 高
  description: 他の情報と組み合わさると個人の特定やプライバシー侵害につながる情報
  types:
    - 生年月日
    - 住所
    - 健康・医療情報
    - アレルギー情報
    - 保存データ（写真・文書等）
    - メッセージ・チャット履歴
    - クレジットカード情報（番号の一部・有効期限等）
    - 資産・取引情報
    - 購入履歴
    - 利用履歴
    - パスワード（ハッシュ化・暗号化済み）
    - パスワード（保管形式不明）

medium:
  label: 中
  description: フィッシングや迷惑電話・メールに悪用されうる情報
  types:
    - 氏名
    - 電話番号
    - メールアドレス
    - 性別
    - 郵便番号
    - 契約情報
    - 問い合わせ内容
    - 従業員情報
    - 取引先情報
    - パスポート有効期限
    - 車両情報

low:
  label: 低
  description: 単体では悪用リスクが小さい情報
  types:
    - 会員ID
    - アカウント名
    - 連携サービスID
    - 入会・退会年月日
    - 画像メタデータ
    - ポイント情報
