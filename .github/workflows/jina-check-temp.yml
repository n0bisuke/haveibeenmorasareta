name: Jina check (temporary)
on:
  push:
    branches: [claude/magical-archimedes-7lls9o]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # GITHUB_TOKEN を渡さないので Issue・PR は作らない
      - run: node scripts/news-watch.mjs --out candidates.json > body.md; grep -c "Jina 検索" body.md || true; sed -n '/## X/,$p' body.md | head -40
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      - run: node -e "const c=require('./candidates.json');console.log(c.length, c.filter(x=>x.source==='Jina 検索').map(x=>x.date+' '+x.title+' '+x.url).join('\n'))"
