name: Groq check (temporary)
on:
  push:
    branches: [claude/magical-archimedes-7lls9o]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # GITHUB_TOKEN を渡さないので Issue・PR は作らない（候補の収集と下書き・検証だけ）
      - run: node scripts/news-watch.mjs --out candidates.json | tail -3
      - run: node scripts/ai-draft.mjs --in candidates.json --out ai-out --state ai-state/seen.json
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_MAX_ITEMS: '2'
      - run: node scripts/ai-publish.mjs --in ai-out/drafts.json
      - run: git status --short data/ && for f in $(git ls-files -o data/breaches); do echo "== $f"; cat "$f"; done
