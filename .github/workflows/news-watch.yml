name: News watch

# ニュースの RSS を毎日巡回し、未収録の情報漏洩ニュースの候補を Issue にまとめる
on:
  schedule:
    - cron: '7 23 * * *' # 毎日 8:07（日本時間）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node scripts/news-watch.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
