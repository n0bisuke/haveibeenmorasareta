name: Ideas check (temporary)
on:
  push:
    branches: [claude/magical-archimedes-7lls9o]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # GITHUB_TOKEN を渡さないので Issue は作らず、提案を表示するだけ
      - run: node scripts/feature-ideas.mjs
        env:
          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID || secrets.GA_PROPERTY_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
