name: GA report

# Google アナリティクスの前日のアクセスを集計し、月ごとの Issue（ラベル「GAレポート」）にコメントで追記する
# Secrets の GA_CREDENTIALS と GA_PROPERTY_ID（Variables・Secrets のどちらでも可）が未設定なら何もしない（設定方法は README）
# 接続確認だけしたいときは node scripts/ga-report.mjs --check（直近30分と今日のアクセスを表示し、Issue には投稿しない）
on:
  schedule:
    - cron: '17 0 * * *' # 毎日 9:17（日本時間）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-26.04 # ubuntu-latest が Ubuntu 26 に移行するまで固定（2026-10-19〜）。問題がなければ ubuntu-latest に戻す
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - run: node scripts/ga-report.mjs
        env:
          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID || secrets.GA_PROPERTY_ID }}
          GITHUB_TOKEN: ${{ github.token }}
