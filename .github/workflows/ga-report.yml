name: GA report

# Google アナリティクスの前日のアクセスを集計し、月ごとの Issue（ラベル「GAレポート」）にコメントで追記する
# Secrets の GA_CREDENTIALS と Variables の GA_PROPERTY_ID が未設定なら何もしない（設定方法は README）
on:
  schedule:
    - cron: '17 0 * * *' # 毎日 9:17（日本時間）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node scripts/ga-report.mjs
        env:
          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
          GITHUB_TOKEN: ${{ github.token }}
