name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      # データ追加の PR で breaches.json を更新し忘れても、main に自動でコミットする
      - name: Commit regenerated breaches.json
        run: |
          if [ -n "$(git status --porcelain public/breaches.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/breaches.json
            git commit -m "public/breaches.json を再生成"
            git push
          fi
      # カードに表示する「データを追加した人」のアイコン用（公開物にだけ含め、コミットはしない）
      - name: Generate contributors.json
        run: node scripts/contributors.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # 更新直後に古い JS がキャッシュから読まれて壊れないよう、参照にバージョンを付ける（公開物のみ）
      - name: Stamp asset versions
        run: node scripts/stamp.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
