name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 既定は読み取りのみ。ジョブごとに必要な権限だけを渡す
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # breaches.json の再生成をコミットする
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      # データ追加の PR で breaches.json を更新し忘れても、main に自動でコミットする
      - name: Commit regenerated breaches.json
        run: |
          if [ -n "$(git status --porcelain public/breaches.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/breaches.json
            git commit -m "public/breaches.json を再生成"
            git push
          fi
      # カードに表示する「データを追加した人」のアイコン用（公開物にだけ含め、コミットはしない）
      - name: Generate contributors.json
        run: node scripts/contributors.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # 事案ごとの個別ページと sitemap.xml（公開物のみ）
      - name: Generate breach pages
        run: node scripts/pages.mjs --og
      # シェア用の画像（OGP）。調査中は速報風、重要度が危険・高はダーク、それ以外はライト
      - name: Generate share images
        run: node scripts/og-images.mjs
      # トップ・ランキング・ビジュアライズ用のシェア画像（掲載事案数・業界別 TOP5・地域別の地図を最新のデータで描く）
      - name: Generate top share image
        run: node scripts/og-top.mjs
      # 更新直後に古い JS がキャッシュから読まれて壊れないよう、参照にバージョンを付ける（公開物のみ）
      - name: Stamp asset versions
        run: node scripts/stamp.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
