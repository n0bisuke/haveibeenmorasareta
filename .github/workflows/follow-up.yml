name: Follow-up search

# 「企業側が調査中」「一次情報募集」の Issue について、Jina の検索で続報・一次情報の候補を探し、Issue にコメントする
# JINA_API_KEY（Secrets）が未設定なら何もしない
on:
  schedule:
    - cron: '37 22 * * *' # 毎日 7:37（日本時間）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  follow-up:
    runs-on: ubuntu-26.04 # ubuntu-latest が Ubuntu 26 に移行するまで固定（2026-10-19〜）。問題がなければ ubuntu-latest に戻す
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node scripts/follow-up.mjs
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
