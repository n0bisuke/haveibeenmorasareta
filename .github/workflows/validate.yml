name: Validate

on:
  pull_request:
  workflow_dispatch: # AI 下書きの PR（Actions のトークンで作成）は自動で検証が動かないため、ai-publish.mjs から起動する
  push:
    branches-ignore: [main]

# 検証だけなので読み取り権限のみ
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
