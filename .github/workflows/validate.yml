name: Validate

on:
  pull_request:
  workflow_dispatch: # AI 下書きの PR（Actions のトークンで作成）は自動で検証が動かないため、ai-publish.mjs から起動する
  push:
    branches-ignore: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
